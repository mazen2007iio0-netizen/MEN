<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة المشرف | سومها</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--cream:#faf6ef;--cream2:#f3ebdd;--sand:#e8dcc4;--line:#ecdfc7;--gold:#c9a961;--gold2:#b8934a;--maroon:#8d0b0b;--maroon2:#6d0808;--ink:#2b1a14;--ink2:#5a463c;--muted:#a08c78;--white:#fff;--sh:0 6px 18px rgba(43,26,20,.06);--sh-lg:0 14px 34px rgba(43,26,20,.12);--sidebar:#1f1410}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Tajawal',system-ui,sans-serif;background:var(--cream);color:var(--ink);line-height:1.5}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit}
img{display:block;max-width:100%}
a{text-decoration:none;color:inherit}
.layout{display:grid;grid-template-columns:1fr;min-height:100vh}
@media(min-width:992px){.layout{grid-template-columns:260px 1fr}}
.sidebar{background:var(--sidebar);color:#f7f0e6;padding:22px 18px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;max-height:100vh;overflow-y:auto}
.sidebar .brand{display:flex;align-items:center;gap:12px;padding-bottom:18px;margin-bottom:14px;border-bottom:1px solid rgba(255,255,255,.08)}
.sidebar .brand img{height:44px;object-fit:contain;max-width:150px}
.sidebar .brand .role{margin-right:auto;font-size:10px;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1f1410;padding:3px 8px;border-radius:6px;font-weight:800}
.nav-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;color:rgba(255,255,255,.7);font-weight:700;font-size:14px;cursor:pointer;transition:.15s}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-item.on{background:linear-gradient(135deg,var(--maroon),var(--maroon2));color:#fff;box-shadow:0 6px 16px rgba(141,11,11,.35)}
.nav-item .ic{width:20px;height:20px;display:flex;align-items:center;justify-content:center;font-size:16px}
.sidebar .sep{margin:14px 0;border-top:1px solid rgba(255,255,255,.08)}
.sidebar .logout{color:#ffb3b3}
.main{padding:22px;max-width:100%;overflow-x:hidden}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:22px;flex-wrap:wrap}
.topbar h1{font-size:22px;font-weight:900}
.topbar .sub{font-size:13px;color:var(--ink2);margin-top:2px}
.topbar .actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 16px;border-radius:11px;font-weight:800;font-size:13.5px;transition:.15s}
.btn-primary{background:linear-gradient(135deg,var(--maroon),var(--maroon2));color:#fff;box-shadow:0 6px 16px rgba(141,11,11,.25)}
.btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#fff}
.btn-ghost{background:var(--white);border:1.5px solid var(--line);color:var(--ink2)}
.btn-danger{background:#fdecec;color:var(--maroon);border:1.5px solid #f5c6c6}
.btn-sm{padding:7px 12px;font-size:12px;border-radius:9px}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;margin-bottom:24px}
.stat-card{background:var(--white);border:1.5px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--sh);position:relative;overflow:hidden}
.stat-card::before{content:"";position:absolute;top:0;left:0;width:4px;height:100%;background:linear-gradient(180deg,var(--maroon),var(--gold))}
.stat-card .ic{width:42px;height:42px;border-radius:12px;background:var(--cream2);display:flex;align-items:center;justify-content:center;font-size:20px;margin-bottom:12px}
.stat-card .val{font-size:26px;font-weight:900;color:var(--maroon);line-height:1.1}
.stat-card .lbl{font-size:12.5px;color:var(--ink2);font-weight:700;margin-top:4px}
.card{background:var(--white);border:1.5px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--sh);margin-bottom:20px}
.card-hdr{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.card-hdr h2{font-size:17px;font-weight:900;display:flex;align-items:center;gap:8px}
.card-hdr h2::before{content:"";width:5px;height:18px;border-radius:3px;background:linear-gradient(180deg,var(--maroon),var(--gold))}
.tbl-wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:640px}
thead{background:var(--cream2)}
th{text-align:right;padding:12px 14px;font-weight:800;color:var(--ink2);font-size:12.5px;white-space:nowrap;border-bottom:1px solid var(--line)}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--cream)}
td .thumb{width:44px;height:44px;border-radius:10px;object-fit:cover;border:1px solid var(--line)}
td .thumb-svg{width:44px;height:44px;border-radius:10px;background:var(--cream2);display:flex;align-items:center;justify-content:center;font-size:22px}
td .user-cell{display:flex;align-items:center;gap:8px}
td .user-cell .av{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--maroon),var(--maroon2));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;flex-shrink:0}
.tag{display:inline-block;padding:3px 9px;border-radius:7px;font-size:11px;font-weight:800}
.tag.live{background:#ffe5e5;color:#c00}
.tag.ended{background:#e5e5e5;color:#666}
.tag.featured{background:#fff5dd;color:#a87a20}
.tag.role-super{background:#ffe5e5;color:var(--maroon)}
.tag.role-admin{background:#e6f0ff;color:#2a5599}
.tag.st-pending{background:#fff5dd;color:#a87a20}
.tag.st-confirmed{background:#e6f5e6;color:#2a702a}
.tag.st-shipped{background:#e6f0ff;color:#2a5599}
.tag.st-delivered{background:#dff5e5;color:#1f7a3a}
.tag.st-cancelled{background:#ffe5e5;color:#c00}
.actions-cell{display:flex;gap:6px;flex-wrap:wrap}
.ov{position:fixed;inset:0;z-index:500;background:rgba(43,26,20,.55);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:20px;overflow-y:auto}
.ov.on{display:flex;animation:fade .22s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:var(--white);border-radius:22px;padding:26px;width:100%;max-width:640px;box-shadow:var(--sh-lg);position:relative;max-height:92vh;overflow-y:auto;animation:up .25s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(20px);opacity:.4}to{transform:translateY(0);opacity:1}}
.modal-close{position:absolute;top:14px;left:14px;width:34px;height:34px;border-radius:10px;background:var(--cream);display:flex;align-items:center;justify-content:center;color:var(--ink2);z-index:5}
.modal h2{font-size:19px;font-weight:900;margin-bottom:18px;padding-left:42px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{margin-bottom:13px}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--ink2);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;padding:11px 13px;border-radius:11px;border:1.5px solid var(--line);background:var(--cream);font-size:14px;outline:none;transition:.2s;font-weight:500;color:var(--ink)}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--maroon);background:var(--white);box-shadow:0 0 0 4px rgba(141,11,11,.08)}
.chk{display:flex;align-items:center;gap:8px;padding:10px;background:var(--cream);border-radius:11px;cursor:pointer;font-weight:700;font-size:13.5px}
.chk input{width:auto}
.empty{text-align:center;padding:44px 20px;color:var(--muted)}
.empty .e-ico{font-size:44px;margin-bottom:10px;opacity:.5}
.empty h3{font-size:15px;font-weight:800;color:var(--ink2);margin-bottom:6px}
.loading{text-align:center;padding:40px;color:var(--muted);font-size:13.5px}
#toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 22px;border-radius:13px;font-weight:700;font-size:13.5px;z-index:3000;opacity:0;pointer-events:none;transition:.3s;max-width:88vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.mob-bar{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px;margin-bottom:14px;border-bottom:1px solid var(--line)}
@media(min-width:992px){.mob-bar{display:none}}
.mob-bar button{white-space:nowrap;padding:9px 14px;border-radius:10px;background:var(--white);border:1.5px solid var(--line);font-weight:700;font-size:13px;color:var(--ink2)}
.mob-bar button.on{background:var(--maroon);color:#fff;border-color:var(--maroon)}
@media(max-width:600px){.main{padding:14px}.card{padding:14px}.topbar h1{font-size:19px}.stat-card{padding:14px}.stat-card .val{font-size:22px}}
</style>
</head>
<body>

<div class="layout">
  <aside class="sidebar">
    <div class="brand">
      <img id="logoImgAdmin" alt="سومها">
      <span class="role" id="roleTag">admin</span>
    </div>
    <div class="nav-item on" data-page="dashboard" onclick="ADMIN.nav('dashboard')"><span class="ic">📊</span><span>لوحة التحكم</span></div>
    <div class="nav-item" data-page="auctions" onclick="ADMIN.nav('auctions')"><span class="ic">🔨</span><span>المزادات</span></div>
    <div class="nav-item" data-page="products" onclick="ADMIN.nav('products')"><span class="ic">📦</span><span>المنتجات</span></div>
    <div class="nav-item" data-page="users" onclick="ADMIN.nav('users')"><span class="ic">👥</span><span>العملاء</span></div>
    <div class="nav-item" data-page="orders" onclick="ADMIN.nav('orders')"><span class="ic">🧾</span><span>الطلبات</span></div>
    <div class="nav-item" data-page="admins" onclick="ADMIN.nav('admins')"><span class="ic">👑</span><span>المشرفون</span></div>
    <div class="nav-item" data-page="settings" onclick="ADMIN.nav('settings')"><span class="ic">⚙️</span><span>الإعدادات</span></div>
    <div class="sep"></div>
    <div class="nav-item" onclick="location.href='index.html'"><span class="ic">🌐</span><span>الموقع الرئيسي</span></div>
    <div class="nav-item logout" onclick="ADMIN.logout()"><span class="ic">🚪</span><span>تسجيل الخروج</span></div>
  </aside>

  <div class="main">
    <div class="mob-bar">
      <button class="on" data-page="dashboard" onclick="ADMIN.nav('dashboard')">لوحة التحكم</button>
      <button data-page="auctions" onclick="ADMIN.nav('auctions')">المزادات</button>
      <button data-page="products" onclick="ADMIN.nav('products')">المنتجات</button>
      <button data-page="users" onclick="ADMIN.nav('users')">العملاء</button>
      <button data-page="orders" onclick="ADMIN.nav('orders')">الطلبات</button>
      <button data-page="admins" onclick="ADMIN.nav('admins')">المشرفون</button>
      <button data-page="settings" onclick="ADMIN.nav('settings')">الإعدادات</button>
    </div>

    <div class="topbar">
      <div><h1 id="pageTitle">لوحة التحكم</h1><p class="sub" id="pageSub">نظرة سريعة</p></div>
      <div class="actions" id="topActions"></div>
    </div>

    <div id="view"></div>
  </div>
</div>

<div class="ov" id="ovAuction" onclick="if(event.target===this)ADMIN.closeModal('ovAuction')">
  <div class="modal">
    <button class="modal-close" onclick="ADMIN.closeModal('ovAuction')">✖️</button>
    <h2 id="auctionModalTitle">إنشاء مزاد جديد</h2>
    <form id="formAuction" onsubmit="ADMIN.saveAuction(event)">
      <input type="hidden" id="aId">
      <div class="row2">
        <div class="field"><label>اسم المنتج *</label><input id="aTitle" required></div>
        <div class="field"><label>التصنيف *</label><select id="aCat" required></select></div>
      </div>
      <div class="field"><label>الوصف</label><textarea id="aDesc" rows="3"></textarea></div>
      <div class="field"><label>رابط الصورة</label><input id="aImg" placeholder="https://..."></div>
      <div class="row2">
        <div class="field"><label>السعر الابتدائي *</label><input type="number" id="aStart" min="1" required></div>
        <div class="field"><label>السعر الحالي *</label><input type="number" id="aCurrent" min="1" required></div>
      </div>
      <div class="row2">
        <div class="field"><label>أقل زيادة *</label><input type="number" id="aInc" min="1" value="50" required></div>
        <div class="field"><label>الحالة</label><select id="aStatus">
          <option value="approved">معتمد</option><option value="pending">قيد المراجعة</option><option value="rejected">مرفوض</option>
        </select></div>
      </div>
      <div class="row2">
        <div class="field"><label>نهاية المزاد *</label><input type="datetime-local" id="aEnd" required></div>
        <div class="field"><label>الموقع</label><input id="aLocation" placeholder="الرياض"></div>
      </div>
      <div class="field"><label>الحالة الفيزيائية</label><select id="aCond">
        <option>جديد</option><option>مستعمل — ممتاز</option><option>مستعمل — جيد</option>
      </select></div>
      <label class="chk"><input type="checkbox" id="aFeatured"> مزاد مميز ⭐</label>
      <div style="display:flex;gap:8px;margin-top:16px">
        <button type="submit" class="btn btn-primary" style="flex:1">حفظ</button>
        <button type="button" class="btn btn-ghost" onclick="ADMIN.closeModal('ovAuction')">إلغاء</button>
      </div>
    </form>
  </div>
</div>

<div class="ov" id="ovAdmin" onclick="if(event.target===this)ADMIN.closeModal('ovAdmin')">
  <div class="modal">
    <button class="modal-close" onclick="ADMIN.closeModal('ovAdmin')">✖️</button>
    <h2>إضافة مشرف جديد</h2>
    <form id="formAdmin" onsubmit="ADMIN.addAdmin(event)">
      <div class="field"><label>اختر مستخدم *</label><select id="adUser" required></select></div>
      <div class="field"><label>الدور</label><select id="adRole">
        <option value="admin">مشرف</option><option value="super_admin">مشرف عام</option>
      </select></div>
      <div style="display:flex;gap:8px;margin-top:16px">
        <button type="submit" class="btn btn-primary" style="flex:1">إضافة</button>
        <button type="button" class="btn btn-ghost" onclick="ADMIN.closeModal('ovAdmin')">إلغاء</button>
      </div>
    </form>
  </div>
</div>

<div class="ov" id="ovOrder" onclick="if(event.target===this)ADMIN.closeModal('ovOrder')">
  <div class="modal">
    <button class="modal-close" onclick="ADMIN.closeModal('ovOrder')">✖️</button>
    <h2>تفاصيل الطلب</h2>
    <div id="orderDetails"></div>
  </div>
</div>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="somha/supabase-config.js"></script>
<script src="somha/config.js"></script>
<script src="somha/admin.js"></script>
<script>ADMIN.boot();</script>
</body>
</html>
