<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> سومها </title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#faf6ef;--cream2:#f3ebdd;--sand:#e8dcc4;--line:#ecdfc7;
  --gold:#c9a961;--gold2:#b8934a;
  --maroon:#8d0b0b;--maroon2:#6d0808;
  --ink:#2b1a14;--ink2:#5a463c;--muted:#a08c78;--white:#fff;
  --sh:0 8px 24px rgba(43,26,20,.06);
  --sh-lg:0 18px 40px rgba(43,26,20,.14);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow-x:hidden}
body{font-family:'Tajawal',system-ui,sans-serif;background:var(--cream);color:var(--ink);line-height:1.55}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit}
img{display:block;max-width:100%}

/* ==== SVG ICON SIZING & SHADOW ==== */
.pcard-img svg{width:72%;height:72%;max-width:130px;max-height:130px;filter:drop-shadow(0 6px 14px rgba(0,0,0,.18))}
.cat .ico svg{width:34px;height:34px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.12))}
.prod-img svg{width:70%;height:70%;max-width:280px;max-height:280px;filter:drop-shadow(0 10px 24px rgba(0,0,0,.22))}
.pcard-img{
  background:radial-gradient(circle at 50% 35%,#fffdf8 0%,#f3ebdd 55%,#e8dcc4 100%);
}
.prod-img{
  background:radial-gradient(circle at 50% 35%,#fffdf8 0%,#f3ebdd 55%,#e8dcc4 100%);
}

.app{min-height:100%;display:flex;flex-direction:column}
.hdr{position:sticky;top:0;z-index:100;background:rgba(250,246,239,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:12px 16px}
.hdr-in{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:14px}
.logo img{height:44px;width:auto;cursor:pointer}
.search{flex:1;position:relative;max-width:560px}
.search input{width:100%;padding:11px 42px 11px 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--white);font-size:14px;outline:none;transition:.2s}
.search input:focus{border-color:var(--maroon);box-shadow:0 0 0 4px rgba(141,11,11,.08)}
.search svg{position:absolute;right:14px;top:50%;transform:translateY(-50%);opacity:.45;pointer-events:none}
.hdr-actions{display:flex;align-items:center;gap:8px;flex-shrink:0}
.btn-sell{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#fff;padding:10px 18px;border-radius:11px;font-weight:800;font-size:13.5px;display:flex;align-items:center;gap:6px;box-shadow:0 6px 16px rgba(201,169,97,.3);transition:.2s}
.btn-sell:hover{transform:translateY(-1px)}
.ibtn{width:40px;height:40px;border-radius:11px;background:var(--white);border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--ink2);position:relative;transition:.2s}
.ibtn:hover{border-color:var(--maroon);color:var(--maroon)}
.ibtn .dot{position:absolute;top:7px;left:7px;width:8px;height:8px;background:var(--maroon);border-radius:50%;border:2px solid var(--white)}
.btn-login{background:linear-gradient(135deg,var(--maroon),var(--maroon2));color:#fff;padding:10px 18px;border-radius:11px;font-weight:800;font-size:13.5px;display:flex;align-items:center;gap:6px;box-shadow:0 6px 16px rgba(141,11,11,.28);transition:.2s}
.btn-login:hover{transform:translateY(-1px)}
.user-chip{display:flex;align-items:center;gap:8px;background:var(--white);border:1.5px solid var(--line);padding:6px 12px 6px 6px;border-radius:14px;cursor:pointer;transition:.2s}
.user-chip:hover{border-color:var(--maroon)}
.user-chip .uav{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--maroon),var(--maroon2));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px}
.user-chip b{font-size:13px;font-weight:800}
.user-chip span{font-size:11px;color:var(--muted);display:block;line-height:1}
main{max-width:1280px;margin:0 auto;padding:20px 16px 100px;flex:1;width:100%}
.hero{background:radial-gradient(circle at 88% 15%,rgba(201,169,97,.28),transparent 45%),linear-gradient(135deg,#8d0b0b,#6d0808);border-radius:22px;padding:30px 24px;color:#fff;position:relative;overflow:hidden;margin-bottom:24px;box-shadow:var(--sh-lg)}
.hero::after{content:"سوم";position:absolute;left:-25px;bottom:-45px;font-size:160px;font-weight:900;color:rgba(255,255,255,.05);line-height:1;pointer-events:none}
.hero h1{font-size:24px;font-weight:900;margin-bottom:8px;position:relative}
.hero p{opacity:.9;font-size:14px;max-width:520px;position:relative}
.hero-cta{display:flex;gap:10px;margin-top:16px;position:relative;flex-wrap:wrap}
.hero-cta button{padding:11px 20px;border-radius:12px;font-weight:800;font-size:13.5px;display:flex;align-items:center;gap:7px}
.hero-cta .c1{background:#fff;color:var(--maroon)}
.hero-cta .c2{background:rgba(255,255,255,.15);color:#fff;border:1.5px solid rgba(255,255,255,.35);backdrop-filter:blur(8px)}
.stats{display:flex;gap:24px;margin-top:18px;position:relative;flex-wrap:wrap}
.stats>div{display:flex;flex-direction:column}
.stats b{font-size:22px;color:var(--gold);font-weight:900;line-height:1.2}
.stats span{font-size:12px;opacity:.85}
section{margin-bottom:28px}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.sec-h h2{font-size:18px;font-weight:900;display:flex;align-items:center;gap:8px}
.sec-h h2::before{content:"";width:5px;height:20px;border-radius:3px;background:linear-gradient(180deg,var(--maroon),var(--gold))}
.sec-h a{font-size:13px;color:var(--maroon);font-weight:700;cursor:pointer}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:10px}
.cat{background:var(--white);border:1.5px solid var(--line);border-radius:15px;padding:14px 6px;text-align:center;cursor:pointer;transition:.2s}
.cat:hover{border-color:var(--maroon);transform:translateY(-2px);box-shadow:var(--sh)}
.cat .ico{width:52px;height:52px;margin:0 auto 7px;border-radius:14px;background:radial-gradient(circle at 50% 40%,#fffdf8,#f3ebdd);display:flex;align-items:center;justify-content:center;border:1px solid var(--line)}
.cat span{font-size:12px;font-weight:700;color:var(--ink2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.hrow{display:flex;gap:14px;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x mandatory;margin:0 -16px;padding-left:16px;padding-right:16px}
.hrow::-webkit-scrollbar{height:5px}
.hrow::-webkit-scrollbar-thumb{background:var(--sand);border-radius:3px}
.hrow .pcard{min-width:245px;scroll-snap-align:start}
.pcard{background:var(--white);border:1.5px solid var(--line);border-radius:18px;overflow:hidden;cursor:pointer;transition:.22s;position:relative;display:flex;flex-direction:column}
.pcard:hover{transform:translateY(-3px);box-shadow:var(--sh-lg);border-color:var(--sand)}
.pcard-img{aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.badge{position:absolute;top:10px;right:10px;padding:5px 9px;border-radius:8px;font-size:11px;font-weight:800;display:flex;align-items:center;gap:4px;color:#fff;z-index:2}
.badge.live{background:#d11a1a}
.badge.live::before{content:"";width:6px;height:6px;background:#fff;border-radius:50%;animation:pulse 1.6s infinite}
.badge.feat{background:linear-gradient(135deg,var(--gold),var(--gold2))}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.fav-btn{position:absolute;top:10px;left:10px;width:34px;height:34px;background:rgba(255,255,255,.92);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;backdrop-filter:blur(6px);z-index:2}
.pcard-body{padding:13px;display:flex;flex-direction:column;gap:8px;flex:1}
.pcard-cat{font-size:11px;color:var(--gold2);font-weight:800}
.pcard-title{font-size:14px;font-weight:800;line-height:1.4;min-height:39px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pcard-price{display:flex;align-items:baseline;justify-content:space-between;margin-top:auto}
.pcard-price .pp{font-size:17px;font-weight:900;color:var(--maroon)}
.pcard-price .pp small{font-size:11px;color:var(--ink2);font-weight:600;margin-left:2px}
.pcard-price .bn{font-size:11px;color:var(--ink2);font-weight:700}
.pcard-foot{display:flex;align-items:center;justify-content:space-between;padding-top:9px;border-top:1px dashed var(--line)}
.tmr{display:flex;align-items:center;gap:4px;font-size:12px;font-weight:800;color:var(--maroon);font-variant-numeric:tabular-nums}
.tmr.warn{color:#d11a1a}
.bid-sm{padding:7px 13px;border-radius:9px;background:var(--maroon);color:#fff;font-weight:800;font-size:12px;transition:.2s}
.bid-sm:hover{background:var(--maroon2)}
.page-h{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.back-btn{width:40px;height:40px;border-radius:12px;background:var(--white);border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--ink2);flex-shrink:0}
.back-btn:hover{border-color:var(--maroon);color:var(--maroon)}
.page-h h1{font-size:20px;font-weight:900}
.prod-wrap{display:grid;grid-template-columns:1fr;gap:20px}
.prod-main{background:var(--white);border-radius:20px;padding:18px;border:1.5px solid var(--line)}
.prod-img{aspect-ratio:4/3;border-radius:16px;display:flex;align-items:center;justify-content:center;margin-bottom:14px;position:relative;border:1px solid var(--line)}
.prod-title{font-size:20px;font-weight:900;margin-bottom:6px;line-height:1.35}
.prod-meta{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--ink2);margin-bottom:14px}
.prod-meta b{color:var(--maroon)}
.prod-desc{font-size:14px;color:var(--ink2);line-height:1.85;margin-bottom:18px;padding:14px;background:var(--cream);border-radius:12px}
.price-box{background:var(--cream);border-radius:16px;padding:16px;margin-bottom:14px}
.pp-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.pp-row:last-child{margin-bottom:0}
.pp-row .lbl{font-size:12.5px;color:var(--ink2);font-weight:700}
.pp-row .val{font-size:15px;font-weight:900;color:var(--ink)}
.pp-row .val.big{font-size:23px;color:var(--maroon)}
.pp-row .val.gld{color:var(--gold2)}
.cd{background:linear-gradient(135deg,var(--maroon),var(--maroon2));color:#fff;border-radius:15px;padding:14px;text-align:center;margin-bottom:14px}
.cd small{font-size:11.5px;opacity:.9;display:block;margin-bottom:5px}
.cd .t{font-size:23px;font-weight:900;letter-spacing:1px;font-variant-numeric:tabular-nums}
.cd.done{background:#3a2218}
.bid-row{display:flex;gap:8px;margin-bottom:8px}
.bid-row input{flex:1;padding:14px;border-radius:13px;border:1.5px solid var(--line);background:var(--white);font-size:16px;font-weight:800;text-align:center;outline:none}
.bid-row input:focus{border-color:var(--maroon)}
.bid-row button{padding:0 22px;border-radius:13px;background:linear-gradient(135deg,var(--maroon),var(--maroon2));color:#fff;font-weight:800;font-size:15px;box-shadow:0 8px 20px rgba(141,11,11,.28)}
.hint{font-size:12px;color:var(--ink2);text-align:center;margin-bottom:14px}
.hint b{color:var(--maroon)}
.pactions{display:flex;gap:8px;margin-bottom:16px}
.pactions button{flex:1;padding:11px;border-radius:12px;background:var(--cream);border:1.5px solid var(--line);color:var(--ink2);font-weight:700;font-size:12.5px;display:flex;align-items:center;justify-content:center;gap:5px;transition:.2s}
.pactions button:hover{border-color:var(--maroon);color:var(--maroon)}
.pactions button.on{background:var(--maroon);color:#fff;border-color:var(--maroon)}
.box{background:var(--white);border:1.5px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}
.box h3{font-size:14px;font-weight:900;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.seller-row{display:flex;align-items:center;gap:12px}
.av{width:46px;height:46px;border-radius:13px;background:linear-gradient(135deg,var(--gold),var(--gold2));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:17px;flex-shrink:0}
.seller-row .info{flex:1;min-width:0}
.seller-row .info b{font-size:14px;display:flex;align-items:center;gap:5px}
.seller-row .info span{font-size:12px;color:var(--ink2)}
.stars{color:var(--gold);font-size:13px;letter-spacing:1px;font-weight:800}
.bids-list{max-height:280px;overflow-y:auto}
.bid-item{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px dashed var(--line)}
.bid-item:last-child{border-bottom:none}
.bid-item .u{display:flex;align-items:center;gap:10px;min-width:0}
.bid-item .u .av2{width:32px;height:32px;border-radius:9px;background:var(--cream2);display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:800;color:var(--maroon);flex-shrink:0}
.bid-item.top .u .av2{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#fff}
.bid-item .u b{font-size:13px;display:block;line-height:1.3}
.bid-item .u span{font-size:11px;color:var(--muted)}
.bid-item .amt{font-size:14px;font-weight:900;color:var(--maroon);flex-shrink:0;margin-right:8px}
.rules{font-size:12.5px;color:var(--ink2);line-height:1.9;padding-right:18px}
.acc-hdr{background:linear-gradient(135deg,var(--maroon),var(--maroon2));border-radius:20px;padding:22px;color:#fff;margin-bottom:18px;display:flex;align-items:center;gap:14px;position:relative;overflow:hidden}
.acc-hdr::after{content:"";position:absolute;top:-40px;left:-40px;width:140px;height:140px;background:radial-gradient(circle,rgba(201,169,97,.3),transparent 70%);border-radius:50%}
.acc-hdr .av{width:60px;height:60px;font-size:22px;background:rgba(255,255,255,.18);backdrop-filter:blur(10px);border:2px solid rgba(255,255,255,.25)}
.acc-hdr h2{font-size:18px;font-weight:900}
.acc-hdr p{font-size:12.5px;opacity:.85}
.acc-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.acc-stat{background:var(--white);border:1.5px solid var(--line);border-radius:14px;padding:13px;text-align:center}
.acc-stat b{font-size:19px;color:var(--maroon);font-weight:900;display:block;line-height:1.2}
.acc-stat span{font-size:11.5px;color:var(--ink2);font-weight:700}
.menu{background:var(--white);border:1.5px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:14px}
.mi{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);cursor:pointer;transition:.15s}
.mi:last-child{border-bottom:none}
.mi:hover{background:var(--cream)}
.mi .ico{width:36px;height:36px;border-radius:11px;background:var(--cream2);display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.mi .txt{flex:1;min-width:0}
.mi .txt b{font-size:14px;display:block;line-height:1.3}
.mi .txt span{font-size:11.5px;color:var(--ink2)}
.mi .arr{color:var(--muted);font-size:20px;line-height:1}
.mi.danger .ico{background:#fdecec;color:var(--maroon)}
.empty{text-align:center;padding:50px 20px;color:var(--muted)}
.empty .e-ico{font-size:50px;margin-bottom:12px;opacity:.6}
.empty h3{font-size:16px;font-weight:800;color:var(--ink2);margin-bottom:6px}
.empty p{font-size:13px;margin-bottom:16px}
.empty button{padding:11px 22px;border-radius:12px;background:var(--maroon);color:#fff;font-weight:800;font-size:13.5px}
.guest-banner{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#fff;border-radius:16px;padding:16px 18px;display:flex;align-items:center;gap:14px;margin-bottom:20px;box-shadow:0 10px 24px rgba(201,169,97,.28)}
.guest-banner .gi{width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:22px;backdrop-filter:blur(8px)}
.guest-banner .gt{flex:1}
.guest-banner .gt b{font-size:15px;display:block;font-weight:900}
.guest-banner .gt span{font-size:12.5px;opacity:.9}
.guest-banner button{padding:9px 16px;border-radius:10px;background:#fff;color:var(--gold2);font-weight:800;font-size:13px;white-space:nowrap}
.bnav{position:fixed;bottom:0;left:0;right:0;z-index:99;background:rgba(255,255,255,.97);backdrop-filter:blur(16px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 6px 12px;box-shadow:0 -8px 24px rgba(43,26,20,.06)}
.ni{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:11px;font-weight:700;padding:6px 8px;border-radius:11px;transition:.2s;flex:1}
.ni.on{color:var(--maroon)}
.ni.mid{background:linear-gradient(135deg,var(--maroon),var(--maroon2));color:#fff;border-radius:15px;margin-top:-22px;box-shadow:0 10px 22px rgba(141,11,11,.35);padding:10px 14px;flex:0 0 auto}
.ov{position:fixed;inset:0;z-index:500;background:rgba(43,26,20,.55);backdrop-filter:blur(6px);display:none;align-items:flex-end;justify-content:center}
.ov.on{display:flex;animation:fade .25s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{background:var(--cream);width:100%;max-width:720px;max-height:92vh;overflow-y:auto;border-radius:24px 24px 0 0;padding:22px 18px 40px;animation:up .3s cubic-bezier(.2,.8,.2,1);position:relative}
@keyframes up{from{transform:translateY(30px);opacity:.5}to{transform:translateY(0);opacity:1}}
.sheet-close{position:absolute;top:14px;left:14px;width:36px;height:36px;border-radius:11px;background:var(--white);border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--ink2);z-index:5}
.sheet h2{font-size:19px;font-weight:900;margin-bottom:16px;padding-left:44px}
.upload{border:2px dashed var(--sand);border-radius:15px;padding:26px 16px;text-align:center;color:var(--ink2);background:var(--white);cursor:pointer;transition:.2s;margin-bottom:14px}
.upload:hover{border-color:var(--maroon);color:var(--maroon)}
.upload .u-ico{font-size:30px;margin-bottom:6px}
.upload b{display:block;font-size:13.5px;color:var(--ink);margin-bottom:3px}
.upload span{font-size:11.5px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.auth-card{width:100%;max-width:440px;background:var(--white);border-radius:26px;padding:32px 26px 26px;box-shadow:var(--sh-lg);border:1px solid var(--line);position:relative;overflow:hidden;margin:auto}
.auth-card::before{content:"";position:absolute;top:0;left:0;right:0;height:5px;background:linear-gradient(90deg,var(--maroon),var(--gold),var(--maroon))}
.auth-logo{display:flex;justify-content:center;margin-bottom:8px}
.auth-logo img{height:76px;width:auto}
.auth-sub{text-align:center;color:var(--ink2);font-size:13.5px;margin-bottom:20px}
.auth-sub b{color:var(--maroon)}
.tabs{display:flex;background:var(--cream2);border-radius:14px;padding:5px;margin-bottom:18px}
.tabs button{flex:1;padding:11px;border-radius:10px;font-weight:700;color:var(--ink2);font-size:14.5px;transition:.2s}
.tabs button.on{background:var(--white);color:var(--maroon);box-shadow:0 4px 10px rgba(43,26,20,.08)}
.field{margin-bottom:13px}
.field label{display:block;font-size:13px;font-weight:700;color:var(--ink2);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;padding:13px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--cream);font-size:15px;color:var(--ink);outline:none;transition:.2s;font-weight:500}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--maroon);background:var(--white);box-shadow:0 0 0 4px rgba(141,11,11,.08)}
.btn{width:100%;padding:14px;border-radius:14px;font-weight:800;font-size:15.5px;transition:.2s;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-primary{background:linear-gradient(135deg,var(--maroon),var(--maroon2));color:#fff;box-shadow:0 10px 22px rgba(141,11,11,.28)}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 14px 28px rgba(141,11,11,.35)}
.btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#fff;box-shadow:0 10px 22px rgba(201,169,97,.32)}
.err{color:var(--maroon);font-size:12.5px;font-weight:700;text-align:center;margin-top:8px;min-height:16px}
.skip{text-align:center;margin-top:14px;font-size:13px;color:var(--muted);cursor:pointer;text-decoration:underline}
.skip:hover{color:var(--maroon)}
.terms{font-size:11px;color:var(--muted);text-align:center;margin-top:12px;line-height:1.7}
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 22px;border-radius:13px;font-weight:700;font-size:13.5px;z-index:3000;opacity:0;pointer-events:none;transition:.3s;box-shadow:var(--sh-lg);max-width:88vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (min-width:768px){
  .bnav{display:none}
  main{padding-bottom:40px}
  .sheet{border-radius:24px;margin:auto;max-width:600px}
  .ov{align-items:center;padding:20px}
  #ovAuth .sheet{border-radius:0;padding:0;background:transparent;max-width:440px;box-shadow:none;overflow:visible}
  .hero{padding:44px 38px}
  .hero h1{font-size:32px}
  .hero p{font-size:15px}
  .prod-wrap{grid-template-columns:1.15fr .85fr}
}
@media (max-width:600px){
  .hdr-in{flex-wrap:wrap;gap:8px}
  .logo img{height:36px}
  .search{order:3;max-width:none;flex-basis:100%}
  .hdr-actions{gap:6px;margin-right:auto}
  .btn-sell span{display:none}
  .btn-sell{padding:10px 13px}
  .ibtn{width:38px;height:38px}
  .btn-login{padding:10px 13px;font-size:13px}
  .user-chip{padding:4px 10px 4px 4px}
  .user-chip b{display:none}
  main{padding:14px 12px 100px}
  .hero{padding:24px 18px;border-radius:18px}
  .hero h1{font-size:21px}
  .hero::after{font-size:130px;bottom:-35px}
  .stats{gap:16px}
  .stats b{font-size:19px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
  .pcard-img svg{max-width:100px}
  .pcard-body{padding:11px;gap:6px}
  .pcard-title{font-size:13px;min-height:36px}
  .pcard-price .pp{font-size:15px}
  .bid-sm{padding:6px 11px;font-size:11px}
  .hrow .pcard{min-width:200px}
  .cats{grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px}
  .cat{padding:11px 5px}
  .cat .ico{width:44px;height:44px}
  .cat .ico svg{width:28px;height:28px}
  .cat span{font-size:11px}
  .guest-banner{flex-direction:column;text-align:center;gap:10px}
}
</style>
</head>
<body>

<div class="app">
  <header class="hdr">
    <div class="hdr-in">
      <div class="logo" onclick="go('home')"><img id="logoImgSm" alt="سومها"></div>
      <div class="search">
        <input type="text" id="searchInput" placeholder="ابحث عن منتج أو مزاد...">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      </div>
      <div class="hdr-actions" id="hdrActions"></div>
    </div>
  </header>
  <main id="main"></main>
  <nav class="bnav" id="bnav">
    <div class="ni on" data-nav="home" onclick="go('home')">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 10 9-7 9 7v10a2 2 0 0 1-2 2h-4v-6h-6v6H5a2 2 0 0 1-2-2z"/></svg>
      <span>الرئيسية</span>
    </div>
    <div class="ni" data-nav="live" onclick="go('live')">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/></svg>
      <span>المباشر</span>
    </div>
    <div class="ni mid" onclick="openSell()">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      <span>اعرض</span>
    </div>
    <div class="ni" data-nav="cats" onclick="go('cats')">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      <span>التصنيفات</span>
    </div>
    <div class="ni" data-nav="account" onclick="go('account')">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
      <span>حسابي</span>
    </div>
  </nav>
</div>

<div class="ov" id="ovAuth">
  <div class="auth-card">
    <button class="sheet-close" onclick="closeOv('ovAuth')" style="position:absolute;top:14px;left:14px">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
    <div class="auth-logo"><img id="logoImg" alt="سومها"></div>
    <p class="auth-sub">منصة المزادات السعودية — <b>أعلى سوم يفوز</b></p>
    <div class="tabs">
      <button class="on" data-tab="login">تسجيل الدخول</button>
      <button data-tab="signup">حساب جديد</button>
    </div>
    <form id="formLogin">
      <div class="field"><label>رقم الجوال</label><input type="tel" id="lgPhone" placeholder="05xxxxxxxx" required></div>
      <div class="field"><label>كلمة المرور</label><input type="password" id="lgPass" placeholder="••••••••" required></div>
      <button type="submit" class="btn btn-primary">دخول</button>
      <div class="err" id="lgErr"></div>
    </form>
    <form id="formSignup" hidden>
      <div class="field"><label>الاسم الكامل</label><input type="text" id="suName" placeholder="مثال: محمد العتيبي" required></div>
      <div class="field"><label>رقم الجوال</label><input type="tel" id="suPhone" placeholder="05xxxxxxxx" required></div>
      <div class="field"><label>كلمة المرور</label><input type="password" id="suPass" placeholder="6 أحرف على الأقل" required></div>
      <button type="submit" class="btn btn-gold">إنشاء الحساب</button>
      <div class="err" id="suErr"></div>
      <p class="terms">بإنشاء الحساب أنت توافق على شروط الاستخدام وسياسة الخصوصية لمنصة سومها</p>
    </form>
    <div class="skip" onclick="closeOv('ovAuth')">متابعة كزائر ←</div>
  </div>
</div>

<div class="ov" id="ovSell" onclick="if(event.target===this)closeOv('ovSell')">
  <div class="sheet">
    <button class="sheet-close" onclick="closeOv('ovSell')">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
    <h2>اعرض منتجك في المزاد</h2>
    <form id="formSell">
      <div class="upload"><div class="u-ico">📷</div><b>أضف صور المنتج</b><span>حتى 6 صور — JPG أو PNG</span></div>
      <div class="field"><label>اسم المنتج</label><input id="pTitle" required placeholder="مثال: ساعة رولكس أصلية 2020"></div>
      <div class="field"><label>وصف المنتج</label><textarea id="pDesc" rows="3" required placeholder="اكتب وصفًا كاملًا للمنتج..."></textarea></div>
      <div class="field"><label>التصنيف</label><select id="pCat" required><option value="">اختر تصنيف</option></select></div>
      <div class="row2">
        <div class="field"><label>السعر الابتدائي (ر.س)</label><input type="number" id="pStart" min="1" required placeholder="0"></div>
        <div class="field"><label>أقل زيادة (ر.س)</label><input type="number" id="pInc" min="1" required placeholder="50"></div>
      </div>
      <div class="row2">
        <div class="field"><label>بداية المزاد</label><input type="datetime-local" id="pFrom" required></div>
        <div class="field"><label>نهاية المزاد</label><input type="datetime-local" id="pTo" required></div>
      </div>
      <div class="row2">
        <div class="field"><label>موقع التسليم</label><input id="pLoc" required placeholder="مثال: الرياض"></div>
        <div class="field"><label>حالة المنتج</label><select id="pCond" required><option>جديد</option><option>مستعمل — ممتاز</option><option>مستعمل — جيد</option></select></div>
      </div>
      <button type="submit" class="btn btn-primary" style="margin-top:8px">إرسال للمراجعة</button>
      <p class="terms">سيتم مراجعة منتجك قبل نشره خلال 24 ساعة</p>
    </form>
  </div>
</div>

<div id="toast"></div>

function initData(){
  if(!DB.get(K.users)) DB.set(K.users, []);
  if(!DB.get(K.notifs)) DB.set(K.notifs, []);
  if(!DB.get(K.favs)) DB.set(K.favs, []);
  let auctions = DB.get(K.auctions);
  if(!auctions || !auctions.length){
    const now = Date.now();
    auctions = SEED.map((s, i) => ({
      id: 'a' + i + now.toString(36),
      sellerId: 'seed_seller_' + i,
      sellerName: s.sn, sellerRating: s.sr, sellerSales: s.ss,
      title: s.t, desc: s.d, cat: s.c, icon: PROD_ICON[s.t] || CAT_ICON[s.c],
      startPrice: s.s, price: s.p, minInc: s.i,
      bids: (s.bids||[]).map((b, bi) => ({ userId:'seed_'+i+'_'+bi, userName:b[0], amount:b[1], time: now - (bi+1)*7*60000 })),
      endTime: now + s.h*3600000, duration: s.h*3600000,
      location: s.loc, condition: s.cd,
      featured: !!s.f, status: 'approved',
      createdAt: now - 86400000, views: Math.floor(Math.random()*800)+200
    }));
    DB.set(K.auctions, auctions);
  } else {
    let changed = false;
    auctions.forEach(a => {
      if(a.endTime < Date.now() && a.sellerId?.startsWith('seed_')){
        a.endTime = Date.now() + (a.duration || 6*3600000);
        changed = true;
      }
    });
    if(changed) DB.set(K.auctions, auctions);
  }
}

const fmt = n => Number(n || 0).toLocaleString('en-US');
function ago(ts){ const d = Math.floor((Date.now() - ts)/1000); if(d < 60) return 'الآن'; if(d < 3600) return 'قبل ' + Math.floor(d/60) + ' د'; if(d < 86400) return 'قبل ' + Math.floor(d/3600) + ' س'; return 'قبل ' + Math.floor(d/86400) + ' يوم'; }
function leftTime(ms){ if(ms <= 0) return 'انتهى'; const s = Math.floor(ms/1000); const d = Math.floor(s/86400), h = Math.floor((s%86400)/3600), m = Math.floor((s%3600)/60), sec = s%60; if(d > 0) return `${d}ي ${h}س`; if(h > 0) return `${h}س ${m}د`; if(m > 0) return `${m}د ${sec}ث`; return `${sec}ث`; }
const highestBid = a => (a.bids && a.bids.length) ? Math.max(...a.bids.map(b => b.amount)) : a.price;

function toggleFav(aid, ev){
  if(ev) ev.stopPropagation();

  const favs = DB.get(K.favs, []);
  const idx = favs.findIndex(f => f.userId === S.user.id && f.aid === aid);

  else { favs.splice(idx, 1); toast('أُزيل من المفضلة'); }
  DB.set(K.favs, favs);
  document.querySelectorAll(`.fav-btn[onclick*="'${aid}'"]`).forEach(el => { el.textContent = nowFav ? '❤️' : '🤍'; });

function cardHTML(a){

  return `
    <div class="pcard" onclick="go('product',{id:'${a.id}'})">

function renderProduct(id){
  const a = DB.get(K.auctions, []).find(x => x.id === id);
  if(!a) return emptyState('المنتج غير موجود', '');
  const highest = highestBid(a);
  const ms = a.endTime - Date.now();
  const ended = ms <= 0;
  const isMine = S.user && a.sellerId === S.user.id;
  const minNext = highest + a.minInc;
  const fav = isFav(a.id);
  const topBid = a.bids?.length ? a.bids.reduce((m,b) => b.amount > m.amount ? b : m, a.bids[0]) : null;
  const winner = ended && topBid ? topBid : null;
  let bidUI = '';
  if(!ended && !isMine){
    bidUI = `<div class="bid-row"><input type="number" id="bidInput" value="${minNext}" min="${minNext}"><button onclick="placeBid('${a.id}')">🔨 سوم الآن</button></div><p class="hint">${S.user ? `يجب أن تكون مزايدتك <b>${fmt(a.minInc)} ر.س</b> على الأقل أعلى من السعر الحالي` : `<b>سجّل دخولك</b> للمشاركة في المزاد`}</p>`;
  } else if(!ended && isMine){
    bidUI = `<div class="cd done" style="background:var(--cream2);color:var(--ink2);border:1.5px solid var(--line)"><small>هذا منتجك</small><div class="t" style="font-size:15px">لا يمكنك المزايدة على منتجك</div></div>`;
  }
  return `
    <div class="page-h"><button class="back-btn" onclick="history.length>1?history.back():go('home')"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg></button><h1>تفاصيل المزاد</h1></div>
    <div class="prod-wrap">
      <div class="prod-main">
        <div class="prod-img">${!ended && ms < 6*3600000 ? '<span class="badge live" style="top:14px;right:14px">مباشر</span>' : ''}${a.featured ? '<span class="badge feat" style="top:14px;right:14px">⭐ مميز</span>' : ''}${iconFor(a)}</div>
        <div class="prod-title">${a.title}</div>
        <div class="prod-meta"><span>📂 ${a.cat}</span><span>📍 ${a.location || '—'}</span><span>🏷️ ${a.condition || '—'}</span><span>👥 <b>${(a.bids||[]).length}</b> مزايد</span><span>👁 ${a.views || 0}</span></div>
        <div class="prod-desc">${a.desc}</div>
      </div>
      <div>
        <div class="price-box">
          <div class="pp-row"><span class="lbl">السعر الابتدائي</span><span class="val">${fmt(a.startPrice)} ر.س</span></div>
          <div class="pp-row"><span class="lbl">${ended ? 'السعر النهائي' : 'أعلى مزايدة حالية'}</span><span class="val big" id="livePrice">${fmt(highest)} ر.س</span></div>
          <div class="pp-row"><span class="lbl">أقل زيادة</span><span class="val gld">${fmt(a.minInc)} ر.س</span></div>
          <div class="pp-row"><span class="lbl">عدد المزايدات</span><span class="val" id="liveBidCount">${(a.bids||[]).length}</span></div>
        </div>
        <div class="cd ${ended?'done':''}" id="prodCd" data-end="${a.endTime}"><small>${ended ? '🏆 انتهى المزاد' : (winner ? 'الفائز' : '⏱ الوقت المتبقي')}</small><div class="t">${ended ? (winner ? winner.userName : 'لا يوجد فائز') : leftTime(ms)}</div></div>
        ${bidUI}
        <div class="pactions">
          <button class="${fav?'on':''}" onclick="toggleFav('${a.id}',event)">${fav ? '❤️ في المفضلة' : '🤍 المفضلة'}</button>
          <button onclick="shareProduct('${a.id}')">🔗 مشاركة</button>
          <button onclick="reportProduct('${a.id}')">🚩 إبلاغ</button>
        </div>
        <div class="box"><h3>🏪 البائع</h3><div class="seller-row"><div class="av">${a.sellerName?.[0] || '؟'}</div><div class="info"><b>${a.sellerName || 'بائع'} <span style="color:var(--gold)">✓</span></b><span>بائع موثّق · ${a.sellerSales || 0} عملية ناجحة</span></div><div style="text-align:center"><div class="stars">${'★'.repeat(Math.round(a.sellerRating || 5))}</div><span style="font-size:11px;color:var(--ink2)">${(a.sellerRating||5).toFixed(1)}</span></div></div></div>
        <div class="box"><h3>📜 سجل المزايدات</h3><div class="bids-list" id="bidsList">${renderBidsList(a)}</div></div>
        <div class="box"><h3>📋 شروط المزاد</h3><ul class="rules"><li>المزايدة ملزمة ولا يمكن التراجع عنها</li><li>يجب توثيق رقم الجوال للمشاركة</li><li>يتم تحديد الفائز عند انتهاء الوقت</li><li>التواصل يتم عبر المنصة فقط</li><li>يمنع التلاعب أو المزايدات الوهمية</li></ul></div>
      </div>
    </div>`;
}
function renderBidsList(a){
  if(!a.bids?.length) return '<p style="text-align:center;color:var(--muted);padding:14px;font-size:13px">لا توجد مزايدات بعد — كن الأول!</p>';
  return [...a.bids].sort((x,y) => y.amount - x.amount).map((b, i) => `<div class="bid-item ${i===0?'top':''}"><div class="u"><div class="av2">${(b.userName||'?')[0]}</div><div><b>${b.userName}</b><span>${ago(b.time)}</span></div></div><div class="amt">${fmt(b.amount)} ر.س</div></div>`).join('');
}

function placeBid(aid){
  if(!S.user){ openAuth(() => placeBid(aid)); return; }
  const auctions = DB.get(K.auctions, []);
  const a = auctions.find(x => x.id === aid);
  if(!a) return;
  if(a.endTime <= Date.now()){ toast('انتهى هذا المزاد'); return; }
  if(a.sellerId === S.user.id){ toast('لا يمكنك المزايدة على منتجك'); return; }
  const input = document.getElementById('bidInput');
  const amount = Number(input.value);
  const current = highestBid(a);
  const minNext = current + a.minInc;
  if(!amount || amount < minNext){ toast(`يجب أن تكون المزايدة ${fmt(minNext)} ر.س على الأقل`); return; }
  const prevTop = a.bids?.length ? a.bids.reduce((m,b) => b.amount > m.amount ? b : m, a.bids[0]) : null;
  a.bids.push({ userId: S.user.id, userName: S.user.name, amount, time: Date.now() });
  a.price = amount;
  DB.set(K.auctions, auctions);
  if(prevTop && prevTop.userId !== S.user.id && !prevTop.userId.startsWith('seed_')){
    addNotif(prevTop.userId, '⚠️', 'تم تجاوز مزايدتك', `على "${a.title}" — السعر الآن ${fmt(amount)} ر.س`);
  }
  if(a.sellerId && !a.sellerId.startsWith('seed_') && a.sellerId !== S.user.id){
    addNotif(a.sellerId, '⚡', 'مزايدة جديدة على منتجك', `"${a.title}" — ${fmt(amount)} ر.س من ${S.user.name}`);
  }
  addNotif(S.user.id, '✅', 'تم تسجيل مزايدتك', `"${a.title}" بمبلغ ${fmt(amount)} ر.س`);
  toast('تم تسجيل مزايدتك ✅ أعلى سوم يفوز');
  const lp = document.getElementById('livePrice'); if(lp) lp.textContent = fmt(amount) + ' ر.س';
  const lc = document.getElementById('liveBidCount'); if(lc) lc.textContent = a.bids.length;
  const list = document.getElementById('bidsList'); if(list) list.innerHTML = renderBidsList(a);
  const inp = document.getElementById('bidInput'); if(inp) inp.value = amount + a.minInc;
}
function shareProduct(aid){ const a = DB.get(K.auctions, []).find(x => x.id === aid); if(!a) return; const text = `شاهد مزاد "${a.title}" على سومها — أعلى سوم يفوز!`; if(navigator.share) navigator.share({title:'سومها', text}).catch(()=>{}); else { navigator.clipboard?.writeText(text); toast('تم نسخ رابط المزاد 🔗'); } }
function reportProduct(){ if(!S.user){ openAuth(); return; } addNotif(S.user.id, '✅', 'تم استلام بلاغك', 'سيراجع فريق سومها البلاغ خلال 24 ساعة'); toast('تم استلام البلاغ ✅ شكرًا لك'); }

function renderAccount(){
  const u = S.user; if(!u) return '';
  const myBids = myBidsAuctions(), myWinsList = myWins(), myProducts = myAuctions(), favs = myFavs(), notifs = getMyNotifs();
  return `
    <div class="acc-hdr"><div class="av">${u.name[0]}</div><div><h2>${u.name}</h2><p>${u.phone} · عضو منذ ${new Date(u.joinedAt).toLocaleDateString('ar-SA')}</p></div></div>
    <div class="acc-stats"><div class="acc-stat"><b>${myBids.length}</b><span>مزايدة</span></div><div class="acc-stat"><b>${myWinsList.length}</b><span>فوز</span></div><div class="acc-stat"><b>${(u.rating || 5).toFixed(1)}★</b><span>تقييمي</span></div></div>
    <div class="menu">
      <div class="mi" onclick="go('my-bids')"><div class="ico">📊</div><div class="txt"><b>المزادات التي شاركت فيها</b><span>${myBids.length} مزاد</span></div><div class="arr">‹</div></div>
      <div class="mi" onclick="go('my-wins')"><div class="ico">🏆</div><div class="txt"><b>المزادات التي فزت بها</b><span>${myWinsList.length} عملية</span></div><div class="arr">‹</div></div>
      <div class="mi" onclick="go('my-products')"><div class="ico">📦</div><div class="txt"><b>منتجاتي المعروضة</b><span>${myProducts.length} منتج</span></div><div class="arr">‹</div></div>
      <div class="mi" onclick="go('favorites')"><div class="ico">❤️</div><div class="txt"><b>المحفوظات</b><span>${favs.length} منتج</span></div><div class="arr">‹</div></div>
      <div class="mi" onclick="go('notifs')"><div class="ico">🔔</div><div class="txt"><b>التنبيهات</b><span>${notifs.length} إشعار</span></div><div class="arr">‹</div></div>
      <div class="mi danger" onclick="logout()"><div class="ico">🚪</div><div class="txt"><b>تسجيل الخروج</b><span>الخروج من الحساب</span></div><div class="arr">‹</div></div>
    </div>`;
}
function renderNotifs(){
  const items = getMyNotifs();
  return `<div class="page-h"><button class="back-btn" onclick="go('account')"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg></button><h1>🔔 التنبيهات</h1></div>${items.length ? `<div class="box" style="padding:6px 14px">${items.map(n => `<div class="bid-item"><div class="u"><div class="av2">${n.icon}</div><div><b>${n.title}</b><span>${n.body}</span></div></div><div style="font-size:11px;color:var(--muted);flex-shrink:0">${ago(n.time)}</div></div>`).join('')}</div>` : emptyState('لا توجد تنبيهات', 'ستظهر هنا إشعارات مزايداتك ومبيعاتك')}`;
}

function openSell(){
  if(!S.user){ openAuth(() => openSell()); return; }
  document.getElementById('pCat').innerHTML = '<option value="">اختر تصنيف</option>' + CATEGORIES.map(c => `<option value="${c.n}">${c.n}</option>`).join('');
  const now = new Date(); const to = new Date(now.getTime() + 24*3600000);
  const fmtDT = d => { const p = n => String(n).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`; };
  document.getElementById('pFrom').value = fmtDT(now);
  document.getElementById('pTo').value = fmtDT(to);
  document.getElementById('ovSell').classList.add('on');
}
function closeOv(id){ document.getElementById(id).classList.remove('on'); }

document.getElementById('formSell').addEventListener('submit', e => {
  e.preventDefault();
  if(!S.user){ openAuth(() => openSell()); return; }
  const title = document.getElementById('pTitle').value.trim();
  const desc = document.getElementById('pDesc').value.trim();
  const cat = document.getElementById('pCat').value;
  const startPrice = Number(document.getElementById('pStart').value);
  const minInc = Number(document.getElementById('pInc').value);
  const from = new Date(document.getElementById('pFrom').value).getTime();
  const to = new Date(document.getElementById('pTo').value).getTime();
  const location = document.getElementById('pLoc').value.trim();
  const condition = document.getElementById('pCond').value;
  if(to <= from){ toast('تاريخ النهاية يجب أن يكون بعد البداية'); return; }
  if(to <= Date.now()){ toast('تاريخ النهاية يجب أن يكون في المستقبل'); return; }
  if(minInc <= 0 || startPrice <= 0){ toast('السعر والزيادة يجب أن تكون أكبر من صفر'); return; }
  const auctions = DB.get(K.auctions, []);
  auctions.push({
    id: 'a' + Date.now().toString(36),
    sellerId: S.user.id, sellerName: S.user.name,
    sellerRating: S.user.rating || 5.0, sellerSales: S.user.sales || 0,
    title, desc, cat, icon: CAT_ICON[cat],
    startPrice, price: startPrice, minInc, bids: [],
    endTime: to, duration: to - Date.now(), startTime: from,
    location, condition, featured: false, status: 'approved',
    createdAt: Date.now(), views: 0
  });
  DB.set(K.auctions, auctions);
  addNotif(S.user.id, '✅', 'تم نشر منتجك', `"${title}" أصبح متاحًا للمزايدة الآن`);
  closeOv('ovSell'); document.getElementById('formSell').reset();
  toast('تم نشر منتجك في المزاد 🎉');
  go('my-products');
});

document.getElementById('searchInput').addEventListener('input', e => {
  const q = e.target.value.trim();
  if(!q){ if(S.page === 'search') go('home'); return; }
  const results = auctionsLive().filter(a => a.title.includes(q) || a.cat.includes(q) || (a.desc && a.desc.includes(q)));
  S.page = 'search'; S.pageData = {results, q};
  document.querySelectorAll('.ni').forEach(n => n.classList.remove('on'));
  document.getElementById('main').innerHTML = renderList(`نتائج البحث: "${q}"`, results);
  initCountdowns();
});

function initCountdowns(){
  document.querySelectorAll('.tmr[data-end]').forEach(el => { const ms = Number(el.dataset.end) - Date.now(); el.textContent = '⏱ ' + leftTime(ms); el.classList.toggle('warn', ms < 3600000); });
  const pc = document.getElementById('prodCd');
  if(pc && pc.dataset.end){ const ms = Number(pc.dataset.end) - Date.now(); const t = pc.querySelector('.t'); if(t && ms > 0) t.textContent = leftTime(ms); }
}
setInterval(initCountdowns, 1000);

function boot(){
  document.getElementById('logoImg').src = LOGO_URI;
  document.getElementById('logoImgSm').src = LOGO_URI;
  initData();
  const u = loadUser(); if(u) S.user = u;
  renderHeader(); go('home');
  document.addEventListener('keydown', e => { if(e.key === 'Escape') document.querySelectorAll('.ov.on').forEach(o => o.classList.remove('on')); });
}
boot();
</script>
</body>
</html>
