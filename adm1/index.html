<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>لوحة إدارة — MEN Store Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="icon" type="image/png" href="https://www.socialcreator.com/srv/imgs/ti_imgs/200176_309202.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{font-family:'Cairo',sans-serif;background:#060812;color:#fff;min-height:100vh;overflow-x:hidden}
body{position:relative}
.ma-bg{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse at 15% 20%,rgba(2,28,164,.35) 0%,transparent 55%),radial-gradient(ellipse at 85% 80%,rgba(74,122,255,.25) 0%,transparent 50%),radial-gradient(ellipse at 50% 50%,#060812 0%,#030510 100%)}
.ma-bg::after{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(74,122,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(74,122,255,.04) 1px,transparent 1px);background-size:60px 60px;mask-image:radial-gradient(ellipse at center,black 20%,transparent 75%)}

/* LOGIN */
.ma-gate{position:relative;z-index:10;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
.ma-gate-card{background:linear-gradient(145deg,rgba(14,20,38,.85),rgba(8,12,24,.95));border:1px solid rgba(74,122,255,.14);border-radius:28px;padding:44px 40px;max-width:440px;width:100%;text-align:center;box-shadow:0 40px 100px -30px rgba(2,28,164,.8)}
.ma-gate-icon{width:80px;height:80px;margin:0 auto 20px;border-radius:24px;background:linear-gradient(135deg,#021ca4,#4a7aff);display:flex;align-items:center;justify-content:center;font-size:2rem;box-shadow:0 20px 50px -12px rgba(74,122,255,.8)}
.ma-gate-card h1{font-size:1.7rem;font-weight:900;margin-bottom:10px;letter-spacing:-.5px}
.ma-gate-card p{color:#8a92b0;font-weight:600;margin-bottom:26px;line-height:1.7}
.ma-field{margin-bottom:14px;text-align:right}
.ma-field label{display:block;font-size:.72rem;color:#8a92b0;font-weight:800;text-transform:uppercase;letter-spacing:1.2px;margin-bottom:8px}
.ma-field input{width:100%;height:52px;padding:0 18px;border-radius:14px;background:rgba(0,0,0,.35);border:1.5px solid rgba(74,122,255,.14);color:#fff;font-family:'Cairo',sans-serif;font-size:.94rem;font-weight:600;outline:none;transition:all .3s;direction:ltr;text-align:right;box-sizing:border-box}
.ma-field input:focus{border-color:#4a7aff;box-shadow:0 0 0 4px rgba(74,122,255,.15)}
.ma-gate-btn{width:100%;height:54px;border:none;border-radius:14px;margin-top:8px;background:linear-gradient(135deg,#021ca4,#4a7aff);color:#fff;font-family:'Cairo',sans-serif;font-weight:800;font-size:1rem;cursor:pointer;transition:all .3s;box-shadow:0 14px 34px -12px rgba(74,122,255,.8);display:flex;align-items:center;justify-content:center;gap:10px}
.ma-gate-btn:hover:not(:disabled){transform:translateY(-2px)}
.ma-gate-btn:disabled{opacity:.7;cursor:not-allowed}
.ma-gate-err{display:none;margin-top:14px;padding:12px;border-radius:12px;background:rgba(217,4,41,.1);border:1px solid rgba(217,4,41,.3);color:#ff8a8a;font-size:.85rem;font-weight:700}
.ma-gate-err.show{display:block}

/* APP */
.ma-app{position:relative;z-index:10;display:none;min-height:100vh}
.ma-app.active{display:block}
.ma-nav{position:sticky;top:0;z-index:100;background:linear-gradient(180deg,rgba(6,8,18,.99),rgba(6,8,18,.92));backdrop-filter:blur(20px);border-bottom:1px solid rgba(74,122,255,.14)}
.ma-nav-inner{max-width:1600px;margin:0 auto;padding:0 28px;height:68px;display:flex;align-items:center;gap:16px}
.ma-nav-brand{display:flex;align-items:center;gap:12px;flex-shrink:0;margin-left:20px}
.ma-nav-brand img{height:40px;filter:brightness(0) invert(1) drop-shadow(0 4px 12px rgba(74,122,255,.4))}
.ma-nav-brand .name{font-size:.95rem;font-weight:900;line-height:1.15}
.ma-nav-brand .sub{font-size:.64rem;color:#8a92b0;font-weight:700;letter-spacing:1px;text-transform:uppercase}
.ma-nav-menu{display:flex;align-items:center;gap:2px;flex:1}
.ma-nav-item{position:relative}
.ma-nav-link{display:inline-flex;align-items:center;gap:7px;padding:10px 15px;border-radius:10px;background:transparent;border:none;color:#a8b0cc;font-family:'Cairo',sans-serif;font-weight:800;font-size:.84rem;cursor:pointer;transition:all .2s;white-space:nowrap}
.ma-nav-link .caret{font-size:.6rem;margin-right:3px;transition:transform .2s;opacity:.6}
.ma-nav-item.open .ma-nav-link .caret{transform:rotate(180deg)}
.ma-nav-link:hover{background:rgba(74,122,255,.1);color:#fff}
.ma-nav-item.open>.ma-nav-link,.ma-nav-link.active{background:linear-gradient(135deg,rgba(2,28,164,.5),rgba(74,122,255,.35));color:#fff;box-shadow:0 4px 14px -4px rgba(74,122,255,.6)}
.ma-nav-dropdown{position:absolute;top:calc(100% + 8px);right:0;min-width:230px;background:linear-gradient(145deg,rgba(14,20,38,.99),rgba(8,12,24,1));border:1px solid rgba(74,122,255,.25);border-radius:14px;padding:8px;box-shadow:0 20px 50px -12px rgba(2,28,164,.9);opacity:0;visibility:hidden;transform:translateY(-8px);transition:all .2s;z-index:101}
.ma-nav-item.open .ma-nav-dropdown{opacity:1;visibility:visible;transform:translateY(0)}
.ma-nav-dropdown a{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:10px;color:#a8b0cc;text-decoration:none;font-weight:800;font-size:.85rem;transition:all .2s;cursor:pointer}
.ma-nav-dropdown a:hover{background:rgba(74,122,255,.15);color:#fff}
.ma-nav-dropdown a.active{background:linear-gradient(135deg,#021ca4,#4a7aff);color:#fff}
.ma-nav-dropdown a i{width:18px;font-size:.8rem;opacity:.85}
.ma-nav-user{display:flex;align-items:center;gap:10px;flex-shrink:0}
.ma-nav-user-info{text-align:left}
.ma-nav-user-info .n{font-size:.82rem;font-weight:900}
.ma-nav-user-info .e{font-size:.68rem;color:#8a92b0;font-weight:600}
.ma-btn-ghost{display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:10px;background:rgba(217,4,41,.12);border:1px solid rgba(217,4,41,.3);color:#ff6b6b;font-family:'Cairo',sans-serif;font-weight:800;font-size:.8rem;cursor:pointer;transition:all .2s}
.ma-btn-ghost:hover{background:rgba(217,4,41,.22);transform:translateY(-1px)}

/* CONTENT */
.ma-content{max-width:1600px;margin:0 auto;padding:32px 28px 80px;position:relative;z-index:5}
.ma-view{display:none;contain:layout style paint}
.ma-view.active{display:block;animation:maFade .25s}
@keyframes maFade{from{opacity:0}to{opacity:1}}
.ma-page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.ma-page-title{font-size:1.55rem;font-weight:900;letter-spacing:-.5px;display:flex;align-items:center;gap:12px}
.ma-page-title i{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#021ca4,#4a7aff);display:flex;align-items:center;justify-content:center;font-size:1.1rem;box-shadow:0 12px 26px -10px rgba(74,122,255,.8)}
.ma-page-sub{color:#8a92b0;font-size:.82rem;font-weight:600;margin-top:6px}

/* STATS */
.ma-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}
.ma-stat{background:linear-gradient(145deg,rgba(14,20,38,.75),rgba(8,12,24,.9));border:1px solid rgba(74,122,255,.14);border-radius:20px;padding:22px;position:relative;overflow:hidden;transition:transform .25s,border-color .25s,box-shadow .25s;min-height:120px}
.ma-stat::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--accent,#4a7aff)}
.ma-stat:hover{transform:translateY(-4px);border-color:rgba(74,122,255,.35);box-shadow:0 20px 45px -15px rgba(2,28,164,.6)}
.ma-stat-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.15rem;margin-bottom:12px;background:var(--icon-bg);color:var(--accent)}
.ma-stat-val{font-size:1.9rem;font-weight:900;line-height:1.1;margin-bottom:3px;letter-spacing:-1px}
.ma-stat-lbl{font-size:.76rem;color:#8a92b0;font-weight:700}

/* CARDS */
.ma-card{background:linear-gradient(145deg,rgba(14,20,38,.7),rgba(8,12,24,.85));border:1px solid rgba(74,122,255,.14);border-radius:18px;padding:22px;margin-bottom:16px}
.ma-card-title{font-size:.95rem;font-weight:900;color:#6a9aff;margin-bottom:16px;display:flex;align-items:center;gap:10px;text-transform:uppercase;letter-spacing:.5px}

/* TOOLBAR */
.ma-toolbar{background:linear-gradient(145deg,rgba(14,20,38,.75),rgba(8,12,24,.9));border:1px solid rgba(74,122,255,.14);border-radius:16px;padding:16px 20px;margin-bottom:18px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.ma-search{flex:1;min-width:220px;position:relative}
.ma-search input{width:100%;height:44px;padding:0 42px 0 14px;border-radius:11px;background:rgba(0,0,0,.35);border:1.5px solid rgba(74,122,255,.14);color:#fff;font-family:'Cairo',sans-serif;font-weight:600;font-size:.88rem;outline:none;transition:border-color .3s,box-shadow .3s;box-sizing:border-box}
.ma-search input:focus{border-color:#4a7aff;box-shadow:0 0 0 3px rgba(74,122,255,.15)}
.ma-search i{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:#4a7aff;pointer-events:none;font-size:.85rem}
.ma-toolbar select{height:44px;padding:0 16px;border-radius:11px;background:rgba(0,0,0,.35);border:1.5px solid rgba(74,122,255,.14);color:#fff;font-family:'Cairo',sans-serif;font-weight:700;font-size:.85rem;outline:none;cursor:pointer;min-width:150px}
.ma-toolbar select:focus{border-color:#4a7aff}
.ma-btn{height:44px;padding:0 18px;border-radius:11px;border:none;font-family:'Cairo',sans-serif;font-weight:800;font-size:.84rem;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:transform .25s,box-shadow .25s;white-space:nowrap}
.ma-btn-primary{background:linear-gradient(135deg,#021ca4,#4a7aff);color:#fff;box-shadow:0 8px 22px -8px rgba(74,122,255,.8)}
.ma-btn-primary:hover{transform:translateY(-2px)}
.ma-btn-success{background:linear-gradient(135deg,#4caf50,#2e7d32);color:#fff;box-shadow:0 8px 22px -8px rgba(76,175,80,.8)}
.ma-btn-success:hover{transform:translateY(-2px)}
.ma-btn-gold{background:linear-gradient(135deg,#f5b342,#c98a1e);color:#000;box-shadow:0 8px 22px -8px rgba(245,179,66,.8)}
.ma-btn-gold:hover{transform:translateY(-2px)}
.ma-btn-danger{background:linear-gradient(135deg,#8b0018,#5a0010);color:#fff;box-shadow:0 8px 22px -8px rgba(139,0,24,.9)}
.ma-btn-danger:hover{transform:translateY(-2px)}
.ma-btn-soft{background:rgba(74,122,255,.1);border:1px solid rgba(74,122,255,.25);color:#6a9aff}
.ma-btn-soft:hover{background:rgba(74,122,255,.2)}

/* TABLE */
.ma-table-wrap{background:linear-gradient(145deg,rgba(14,20,38,.7),rgba(8,12,24,.85));border:1px solid rgba(74,122,255,.14);border-radius:16px;overflow:hidden}
.ma-table{width:100%;border-collapse:collapse;font-size:.85rem}
.ma-table thead{background:rgba(74,122,255,.06)}
.ma-table thead th{padding:14px 14px;text-align:right;font-size:.72rem;text-transform:uppercase;letter-spacing:.8px;color:#8a92b0;font-weight:800;border-bottom:1px solid rgba(74,122,255,.15);white-space:nowrap}
.ma-table tbody td{padding:13px 14px;border-bottom:1px solid rgba(74,122,255,.06);color:#e0e6f4;font-weight:600;vertical-align:middle}
.ma-table tbody tr{transition:background .2s;will-change:background}
.ma-table tbody tr:hover{background:rgba(74,122,255,.05)}
.ma-table tbody tr:last-child td{border-bottom:none}
.ma-table .mono{font-family:'Courier New',monospace;direction:ltr;text-align:left;font-weight:800}
.ma-table .price{color:#6a9aff;font-weight:900}
.ma-table .actions-cell{display:flex;gap:6px;flex-wrap:wrap}
.ma-mini-btn{padding:7px 12px;border-radius:8px;border:none;font-family:'Cairo',sans-serif;font-weight:800;font-size:.72rem;cursor:pointer;display:inline-flex;align-items:center;gap:5px;transition:transform .2s}
.ma-mini-btn:hover{transform:translateY(-1px)}
.ma-mini-detail{background:linear-gradient(135deg,#00c9a7,#008f77);color:#fff}
.ma-mini-cb{background:linear-gradient(135deg,#f5b342,#c98a1e);color:#000}
.ma-mini-delete{background:rgba(217,4,41,.15);border:1px solid rgba(217,4,41,.35);color:#ff6b6b}
.ma-mini-chat{background:rgba(74,122,255,.15);border:1px solid rgba(74,122,255,.35);color:#6a9aff}
.ma-mini-note{background:rgba(147,51,234,.15);border:1px solid rgba(147,51,234,.35);color:#c084fc}

/* STATUS SELECT IN TABLE */
.ma-status-select{height:32px;padding:0 8px;border-radius:8px;background:rgba(74,122,255,.12);border:1px solid rgba(74,122,255,.3);color:#6a9aff;font-family:'Cairo',sans-serif;font-weight:800;font-size:.72rem;cursor:pointer;outline:none;transition:background .2s,border-color .2s}
.ma-status-select:hover{background:rgba(74,122,255,.22);border-color:#4a7aff}
.ma-status-select:focus{border-color:#4a7aff;box-shadow:0 0 0 2px rgba(74,122,255,.15)}
.ma-status-select option{background:#0a0e1a;color:#fff}

/* BADGE */
.ma-badge{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:20px;font-size:.7rem;font-weight:800;white-space:nowrap}

/* CHART */
.ma-chart-bar{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.ma-chart-label{min-width:100px;font-size:.78rem;color:#a8b0cc;font-weight:700;text-align:right}
.ma-chart-track{flex:1;height:26px;background:rgba(74,122,255,.08);border-radius:10px;overflow:hidden;position:relative}
.ma-chart-fill{height:100%;background:linear-gradient(90deg,#4a7aff,#021ca4);border-radius:10px;transition:width .6s ease;display:flex;align-items:center;justify-content:flex-end;padding:0 10px;color:#fff;font-size:.72rem;font-weight:800}
.ma-chart-fill.gold{background:linear-gradient(90deg,#f5b342,#c98a1e);color:#000}
.ma-chart-fill.green{background:linear-gradient(90deg,#4caf50,#2e7d32)}
.ma-chart-value{min-width:80px;text-align:left;font-weight:800;font-size:.85rem;font-family:'Courier New',monospace;direction:ltr}

/* RATE */
.ma-rate-card{background:linear-gradient(145deg,rgba(245,179,66,.08),rgba(201,138,30,.03));border:2px solid rgba(245,179,66,.3);border-radius:20px;padding:26px;margin-bottom:20px}
.ma-rate-title{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.ma-rate-title i{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#f5b342,#c98a1e);color:#000;display:flex;align-items:center;justify-content:center;font-size:1.1rem}
.ma-rate-title .t{font-size:1.1rem;font-weight:900}
.ma-rate-title .s{font-size:.78rem;color:#8a92b0;font-weight:700;margin-top:3px}
.ma-rate-display{font-size:3rem;font-weight:900;background:linear-gradient(135deg,#f5b342,#c98a1e);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:-2px;line-height:1;margin:18px 0 8px}
.ma-rate-form{display:flex;gap:10px;align-items:center;margin-top:16px;flex-wrap:wrap}
.ma-rate-form input{height:52px;width:160px;padding:0 18px;border-radius:12px;background:rgba(0,0,0,.4);border:2px solid rgba(245,179,66,.3);color:#f5b342;font-family:'Cairo',sans-serif;font-weight:900;font-size:1.3rem;text-align:center;outline:none;direction:ltr}
.ma-rate-form input:focus{border-color:#f5b342;box-shadow:0 0 0 4px rgba(245,179,66,.15)}
.ma-rate-hint{font-size:.8rem;color:#8a92b0;font-weight:700;line-height:1.7;margin-top:12px}

/* EMPTY */
.ma-empty{text-align:center;padding:60px 24px}
.ma-empty i{font-size:2.8rem;color:#4a7aff;margin-bottom:14px;opacity:.6;display:block}
.ma-empty h3{font-size:1.05rem;font-weight:900;margin-bottom:6px}
.ma-empty p{color:#8a92b0;font-weight:600;font-size:.88rem}

/* MODALS */
.ma-modal-back{display:none;position:fixed;inset:0;z-index:100000;background:rgba(0,0,0,.78);backdrop-filter:blur(8px);align-items:center;justify-content:center;padding:20px}
.ma-modal-back.show{display:flex}
.ma-modal{background:linear-gradient(145deg,rgba(14,20,38,.98),rgba(8,12,24,1));border:1px solid rgba(74,122,255,.18);border-radius:20px;max-width:460px;width:100%;padding:28px;box-shadow:0 40px 100px -30px rgba(2,28,164,.9)}
.ma-modal.ma-modal-lg{max-width:600px;display:flex;flex-direction:column;max-height:90vh;padding:0;overflow:hidden}
.ma-modal.ma-modal-xl{max-width:980px;width:100%;max-height:92vh;padding:0;display:flex;flex-direction:column;overflow:hidden}
.ma-modal-title{display:flex;align-items:center;gap:12px;font-size:1.05rem;font-weight:900;margin-bottom:8px}
.ma-modal-title i{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#f5b342,#c98a1e);color:#000;display:flex;align-items:center;justify-content:center;font-size:1rem;flex-shrink:0}
.ma-modal-sub{color:#8a92b0;font-size:.85rem;font-weight:600;margin-bottom:20px;line-height:1.8}
.ma-modal-field{margin-bottom:14px}
.ma-modal-field label{display:block;font-size:.72rem;color:#8a92b0;font-weight:800;text-transform:uppercase;letter-spacing:1.2px;margin-bottom:8px}
.ma-modal-field input,.ma-modal-field textarea{width:100%;padding:13px 16px;border-radius:12px;background:rgba(0,0,0,.35);border:1.5px solid rgba(74,122,255,.14);color:#fff;font-family:'Cairo',sans-serif;font-weight:600;font-size:.92rem;outline:none;transition:border-color .3s,box-shadow .3s;box-sizing:border-box}
.ma-modal-field textarea{min-height:110px;line-height:1.7;resize:none}
.ma-modal-field input:focus,.ma-modal-field textarea:focus{border-color:#4a7aff;box-shadow:0 0 0 3px rgba(74,122,255,.15)}
.ma-modal-field input[type=number]{direction:ltr;text-align:right;font-size:1.05rem;font-weight:800}
.ma-quick{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.ma-quick button{padding:7px 14px;border-radius:18px;border:1.5px solid rgba(74,122,255,.14);background:rgba(74,122,255,.08);color:#6a9aff;font-family:'Cairo',sans-serif;font-weight:800;font-size:.78rem;cursor:pointer;transition:background .3s,border-color .3s}
.ma-quick button:hover{background:rgba(74,122,255,.2);border-color:#4a7aff}
.ma-modal-actions{display:flex;gap:10px;margin-top:20px}
.ma-modal-actions button{flex:1;height:48px;border-radius:12px;border:none;font-family:'Cairo',sans-serif;font-weight:800;font-size:.88rem;cursor:pointer;transition:transform .3s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.ma-modal-actions .cancel{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);color:#e0e6f4}
.ma-modal-actions .cancel:hover{background:rgba(255,255,255,.12)}
.ma-modal-actions .confirm{background:linear-gradient(135deg,#f5b342,#c98a1e);color:#000;box-shadow:0 12px 30px -10px rgba(245,179,66,.9)}
.ma-modal-actions .confirm:hover:not(:disabled){transform:translateY(-2px)}
.ma-modal-actions .confirm.deduct{background:linear-gradient(135deg,#d90429,#8b0018);color:#fff}
.ma-modal-actions .confirm.danger{background:linear-gradient(135deg,#8b0018,#5a0010);color:#fff}
.ma-modal-actions .confirm.purple{background:linear-gradient(135deg,#9333ea,#6b21a8);color:#fff}
.ma-modal-actions .confirm:disabled{opacity:.6;cursor:not-allowed}
.ma-warn-box{margin-top:14px;padding:13px 15px;border-radius:12px;background:rgba(217,4,41,.08);border:1px solid rgba(217,4,41,.28);color:#ff9a9a;font-size:.8rem;font-weight:700;line-height:1.8;display:flex;gap:10px;align-items:flex-start}
.ma-warn-box i{color:#d90429;font-size:1rem;flex-shrink:0;margin-top:2px}

/* DETAIL */
.ma-detail-head{padding:20px 26px;border-bottom:1px solid rgba(74,122,255,.14);display:flex;align-items:center;justify-content:space-between;gap:14px;background:linear-gradient(180deg,rgba(74,122,255,.06),transparent);flex-shrink:0}
.ma-detail-head-left{display:flex;align-items:center;gap:14px;min-width:0}
.ma-detail-icon{width:48px;height:48px;border-radius:12px;background:linear-gradient(135deg,#021ca4,#4a7aff);display:flex;align-items:center;justify-content:center;font-size:1.2rem;color:#fff;flex-shrink:0;box-shadow:0 12px 26px -10px rgba(74,122,255,.8)}
.ma-detail-title{font-size:1.05rem;font-weight:900}

      return `<div class="ma-nav-item"><button class="ma-nav-link" data-view="${item.id}"><i class="fas ${item.icon}"></i><span>${item.label}</span></button></div>`;
    }
    const subs = item.sub.map(s => `<a data-view="${s.id}"><i class="fas ${s.icon}"></i>${s.label}</a>`).join('');
    return `<div class="ma-nav-item has-dropdown"><button class="ma-nav-link"><i class="fas ${item.icon}"></i><span>${item.label}</span><i class="fas fa-chevron-down caret"></i></button><div class="ma-nav-dropdown">${subs}</div></div>`;
  }).join('');

  menu.querySelectorAll('.ma-nav-item.has-dropdown > .ma-nav-link').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const item = btn.parentElement;
      const wasOpen = item.classList.contains('open');
      document.querySelectorAll('.ma-nav-item.open').forEach(i => i.classList.remove('open'));
      if(!wasOpen) item.classList.add('open');
    });
  });
  menu.querySelectorAll('[data-view]').forEach(el => {
    el.addEventListener('click', e => {
      e.preventDefault(); e.stopPropagation();
      switchView(el.dataset.view);
      document.querySelectorAll('.ma-nav-item.open').forEach(i => i.classList.remove('open'));
    });
  });
  document.addEventListener('click', () => document.querySelectorAll('.ma-nav-item.open').forEach(i => i.classList.remove('open')));
}

async function loadSettings(){
  try {
    const ls = localStorage.getItem('men_admin_settings');
    if(ls) Object.assign(settings, JSON.parse(ls));
  } catch {}
  try {
    const { data } = await sb.from('men_settings').select('*');
    if(data) data.forEach(r => {
      if(r.key === 'cashback_rate') settings.cashback_rate = Number(r.value);
      if(r.key === 'store_name') settings.store_name = r.value;
    });
  } catch(e){}
}
async function saveSetting(key, value){
  settings[key] = value;
  try { localStorage.setItem('men_admin_settings', JSON.stringify(settings)); } catch {}
  try { await sb.from('men_settings').upsert({ key, value: String(value) }); } catch(e){}
}

const auditQueue = [];
let auditTimer = null;
function logAudit(action, details = {}){
  auditQueue.push({
    admin_email: currentUser?.email || 'unknown',
    admin_name: currentUser?.user_metadata?.name || currentUser?.email?.split('@')[0] || 'مشرف',
    action, details: JSON.stringify(details), created_at: new Date().toISOString()
  });
  clearTimeout(auditTimer);
  auditTimer = setTimeout(flushAudit, 900);
}
async function flushAudit(){
  if(!auditQueue.length) return;
  const batch = auditQueue.splice(0, auditQueue.length);
  try { await sb.from('men_audit_log').insert(batch); allAuditLog = []; auditLogLoaded = false; }
  catch(e){ console.warn('audit failed', e); }
}

async function checkAuth(){
  const { data:{ session } } = await sb.auth.getSession();
  if(session?.user && ADMIN_EMAILS.includes((session.user.email||'').toLowerCase())){
    currentUser = session.user;
    showLoading(true);
    await Promise.all([loadSettings(), loadAllData()]);
    showLoading(false);
    showApp();
  } else {
    $('maGate').style.display = 'flex';
  }
}
async function doLogin(){
  const email = $('maGateEmail').value.trim().toLowerCase();
  const pass = $('maGatePass').value;
  const err = $('maGateErr');
  err.classList.remove('show');
  if(!email || !pass){ err.textContent='أدخل البريد وكلمة المرور'; err.classList.add('show'); return; }
  if(!ADMIN_EMAILS.includes(email)){ err.textContent='ليس حساب مشرف'; err.classList.add('show'); return; }
  const btn = $('maGateBtn');
  btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>...';
  try {
    const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
    if(error) throw error;
    currentUser = data.user;
    showLoading(true);
    await Promise.all([loadSettings(), loadAllData()]);
    showLoading(false);
    toast('مرحباً بك 👋', 'success');
    showApp();
  } catch(e){
    err.textContent = e.message; err.classList.add('show');
  } finally {
    btn.disabled = false; btn.innerHTML = '<i class="fas fa-right-to-bracket"></i> دخول';
  }
}
function showApp(){
  $('maGate').style.display = 'none';
  $('maApp').classList.add('active');
  $('maUserName').textContent = currentUser.user_metadata?.name || currentUser.email.split('@')[0];
  $('maUserEmail').textContent = currentUser.email;
  switchView('reports');
}

async function loadAllData(force = false){
  if(loadingPromise) return loadingPromise;
  if(dataLoaded && !force && lastRefresh && (Date.now() - lastRefresh.getTime() < CACHE_MS)) return;
  loadingPromise = (async () => {
    try {
      const [o,u,cl] = await Promise.all([
        sb.from('men_orders').select('*').order('created_at',{ascending:false}).limit(500),
        sb.from('men_users').select('*').order('created_at',{ascending:false}).limit(500),
        sb.from('men_cashback_log').select('*').order('created_at',{ascending:false}).limit(500).then(r=>r).catch(()=>({data:[]}))
      ]);
      allOrders = o.data || [];
      allUsers = u.data || [];
      allCashbackLog = cl.data || [];
      dataLoaded = true;
      dataVersion++;
      lastRefresh = new Date();
    } catch(e){ console.error(e); }
    finally { loadingPromise = null; }
  })();
  return loadingPromise;
}

async function loadAuditLog(force = false){
  if(auditLogLoaded && !force) return;
  try {
    const a = await sb.from('men_audit_log').select('*').order('created_at',{ascending:false}).limit(300);
    allAuditLog = a.data || [];
    auditLogLoaded = true;
  } catch { allAuditLog = []; }
}

function switchView(viewId){
  const sameView = currentView === viewId;
  currentView = viewId;
  document.querySelectorAll('.ma-view').forEach(v => v.classList.remove('active'));
  const view = $('view-' + viewId);
  if(view) view.classList.add('active');
  document.querySelectorAll('.ma-nav-link, .ma-nav-dropdown a').forEach(el => el.classList.remove('active'));
  const activeNav = document.querySelector(`[data-view="${viewId}"]`);
  if(activeNav) activeNav.classList.add('active');

  if(viewId === 'audit' && !auditLogLoaded){
    showLoading(true);
    loadAuditLog().then(() => { showLoading(false); renderView(viewId); });
    return;
  }
  renderView(viewId);
}

function renderView(viewId){
  const el = $('view-' + viewId);
  if(!el) return;
  switch(viewId){
    case 'reports': return renderReportsOverview(el);
    case 'reports-sales': return renderReportsSales(el);
    case 'reports-customers': return renderReportsCustomers(el);
    case 'reports-cashback': return renderReportsCashback(el);
    case 'orders': return renderOrdersView(el);
    case 'customers': return renderCustomersView(el);
    case 'finance': return renderFinanceView(el);
    case 'rewards': return renderRewardsView(el);
    case 'rewards-rate': return renderRateView(el);
    case 'rewards-log': return renderRewardsLogView(el);
    case 'audit': return renderAuditView(el);
    case 'data': return renderDataView(el);
  }
}

function renderSalesChart(){
  const days = [];
  const now = new Date();
  for(let i=6; i>=0; i--){
    const d = new Date(now); d.setDate(d.getDate() - i); d.setHours(0,0,0,0);
    const next = new Date(d); next.setDate(next.getDate() + 1);
    const label = d.toLocaleDateString('ar-SA',{weekday:'short',day:'numeric'});
    const val = allOrders.filter(o => { const t = new Date(o.created_at).getTime(); return t >= d.getTime() && t < next.getTime(); }).reduce((s,o) => s + Number(o.total||0), 0);
    days.push({label, value: val});
  }
  const max = Math.max(...days.map(d => d.value), 1);
  if(days.every(d => d.value === 0)) return `<div class="ma-empty"><i class="fas fa-chart-line"></i><h3>لا توجد بيانات</h3></div>`;
  return days.map(d => `
    <div class="ma-chart-bar">
      <div class="ma-chart-label">${d.label}</div>
      <div class="ma-chart-track"><div class="ma-chart-fill" style="width:${(d.value/max*100)}%"></div></div>
      <div class="ma-chart-value">${fmtInt(d.value)}</div>
    </div>`).join('');
}

    return `<div class="ma-chart-bar"><div class="ma-chart-label">${v.label}</div><div class="ma-chart-track"><div class="ma-chart-fill" style="width:${pct}%;background:${v.bg}">${count}</div></div><div class="ma-chart-value">${pct.toFixed(0)}%</div></div>`;

async function applyStatus(orderId, newStatus){
  if(!ORDER_STATUS[newStatus]) return;
  const order = allOrders.find(o => String(o.id) === String(orderId));
  if(!order) return;
  if(order.status === newStatus){ toast('الحالة نفسها','info'); return; }

  const oldStatus = order.status;
  const oldLabel = ORDER_STATUS[oldStatus]?.label || oldStatus;
  const newLabel = ORDER_STATUS[newStatus].label;
  let confirmMsg = `تغيير الحالة من "${oldLabel}" إلى "${newLabel}"؟`;

  if(newStatus === 'delivered' && !order.cashback_applied){
    const earned = Math.round(Number(order.total||0) * settings.cashback_rate * 100) / 100;
    confirmMsg += `\n\nسيتم إضافة ${earned.toFixed(2)} ر.س كاش باك لرصيد العميل.`;
  } else if((oldStatus === 'delivered' && newStatus !== 'delivered') && order.cashback_applied && order.cashback > 0){
    const refund = Number(order.cashback||0);
    confirmMsg += `\n\nسيتم خصم ${refund.toFixed(2)} ر.س كاش باك من رصيد العميل.`;
  } else if(newStatus === 'cancelled' && order.cashback_applied && order.cashback > 0){
    const refund = Number(order.cashback||0);
    confirmMsg += `\n\nسيتم خصم ${refund.toFixed(2)} ر.س كاش باك من رصيد العميل.`;
  }

  const ok = await askConfirm(confirmMsg, { title: 'تغيير حالة الطلب', danger: newStatus === 'cancelled' });
  if(!ok) return;

  showLoading(true);
  const updates = {status: newStatus, updated_at: new Date().toISOString()};
  let cbMsg = '';

  if(newStatus === 'delivered' && !order.cashback_applied){
    const earned = Math.round(Number(order.total||0) * settings.cashback_rate * 100) / 100;
    updates.cashback = earned;
    updates.cashback_applied = true;
    updates.cashback_applied_at = new Date().toISOString();
    updates.cashback_paid = false;
    cbMsg = ` + ${earned.toFixed(2)} ر.س كاش باك`;
    try {
      await sb.from('men_cashback_log').insert({
        user_id: order.user_id, user_email: order.user_email, amount: earned,
        reason: `كاش باك تلقائي من الطلب #${orderId}`, order_id: orderId,
        type: 'order', created_by: currentUser.email
      });
      const { data: u } = await sb.from('men_users').select('cashback').eq('id', order.user_id).maybeSingle();
      const newCb = Math.round((Number(u?.cashback||0) + earned) * 100) / 100;
      await sb.from('men_users').update({cashback: newCb, updated_at: new Date().toISOString()}).eq('id', order.user_id);
      const lu = allUsers.find(x => String(x.id) === String(order.user_id));
      if(lu) lu.cashback = newCb;
    } catch(e){ console.warn(e); }
  }

  if((oldStatus === 'delivered' && newStatus !== 'delivered') || newStatus === 'cancelled'){
    if(order.cashback_applied && order.cashback > 0){
      const refund = Number(order.cashback||0);
      updates.cashback = 0;
      updates.cashback_applied = false;
      updates.cashback_paid = false;
      cbMsg = ` − خصم ${refund.toFixed(2)} ر.س`;
      try {
        await sb.from('men_cashback_log').insert({
          user_id: order.user_id, user_email: order.user_email, amount: -refund,
          reason: `إلغاء كاش باك الطلب #${orderId}`, order_id: orderId,
          type: 'refund', created_by: currentUser.email
        });
        const { data: u } = await sb.from('men_users').select('cashback').eq('id', order.user_id).maybeSingle();
        const newCb = Math.max(0, Math.round((Number(u?.cashback||0) - refund) * 100) / 100);
        await sb.from('men_users').update({cashback: newCb, updated_at: new Date().toISOString()}).eq('id', order.user_id);
        const lu = allUsers.find(x => String(x.id) === String(order.user_id));
        if(lu) lu.cashback = newCb;
      } catch(e){ console.warn(e); }
    }
  }

  try {
    const { error } = await sb.from('men_orders').update(updates).eq('id', orderId);
    if(error) throw error;
    Object.assign(order, updates);
    dataVersion++;
    logAudit('status_change', {order_id: orderId, from: oldStatus, to: newStatus});
    renderView(currentView);
    toast(`✅ ${newLabel}${cbMsg}`, 'success');
    if(currentDetailOrder && String(currentDetailOrder.id) === String(orderId)){
      openDetailModal(orderId);
    }
  } catch(e){
    toast('فشل: ' + e.message, 'error');
  } finally {
    showLoading(false);
  }
}

function downloadFile(content, filename, mime){
  const blob = new Blob([content], {type: mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
}
function toCSV(rows, headers){
  const q = v => `"${String(v == null ? '' : v).replace(/"/g,'""')}"`;
  const lines = [headers.map(h => q(h.label)).join(',')];
  rows.forEach(r => lines.push(headers.map(h => q(typeof h.get === 'function' ? h.get(r) : r[h.key])).join(',')));
  return '\ufeff' + lines.join('\n');
}
function exportOrders(){
  downloadFile(toCSV(allOrders, [
    {label:'رقم', get:o => o.id},{label:'العميل',key:'user_name'},{label:'البريد',key:'user_email'},
    {label:'الجوال',key:'user_phone'},{label:'المبلغ', get:o => Number(o.total||0).toFixed(2)},
    {label:'الحالة', get:o => ORDER_STATUS[o.status]?.label || o.status},

async function toggleCashbackPaid(orderId, paid){

async function confirmCashback(){
  const amount = Number($('maCbAmount').value);
  const reasonInput = $('maCbReason').value.trim();
  if(!amount || amount <= 0){ toast('مبلغ غير صحيح', 'error'); return; }
  if(!selectedOrderForCashback) return;
  const order = selectedOrderForCashback;
  const isD = cbMode === 'deduct';
  const signed = isD ? -amount : amount;
  const btn = $('maCbConfirm');
  btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>...';
  showLoading(true);
  try {
    const { data: u, error: uE } = await sb.from('men_users').select('cashback, name').eq('id', order.user_id).maybeSingle();
    if(uE) throw uE;
    const cur = Number(u?.cashback||0);
    if(isD && amount > cur){ toast(`الرصيد ${fmtNum(cur)} فقط`, 'error'); btn.disabled = false; updateCbModalUI(); return; }
    const reason = reasonInput || (isD ? 'خصم' : 'إضافة');
    await sb.from('men_cashback_log').insert({user_id:order.user_id, user_email:order.user_email, amount:signed, reason, order_id: order.id !== '—' ? order.id : null, type: isD ? 'deduct' : 'manual', created_by: currentUser.email});
    const newCb = Math.round((cur + signed) * 100) / 100;
    await sb.from('men_users').update({cashback: newCb, updated_at: new Date().toISOString()}).eq('id', order.user_id);
    const lu = allUsers.find(x => String(x.id) === String(order.user_id));
    if(lu) lu.cashback = newCb;
    const lbl = u?.name || order.user_name || order.user_email;
    logAudit(isD ? 'cashback_deduct' : 'cashback_add', {user:lbl, amount, reason});
    toast(isD ? `✅ خصم ${fmtNum(amount)}` : `✅ إضافة ${fmtNum(amount)}`, 'success');
    closeCbModal();
    renderView(currentView);
  } catch(e){ toast('فشل: ' + e.message, 'error'); btn.disabled = false; updateCbModalUI(); }
  finally { showLoading(false); }
}

async function confirmDelete(){
  if(!selectedOrderForDelete) return;
  const order = selectedOrderForDelete;
  const btn = $('maDelConfirm');
  btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>...';
  showLoading(true);
  try {
    if(order.cashback_applied && Number(order.cashback||0) > 0){
      const refund = Number(order.cashback||0);
      try {
        await sb.from('men_cashback_log').insert({user_id:order.user_id, user_email:order.user_email, amount:-refund, reason:`حذف الطلب`, order_id:order.id, type:'refund', created_by:currentUser.email});
        const { data:u } = await sb.from('men_users').select('cashback').eq('id', order.user_id).maybeSingle();
        const newCb = Math.max(0, Math.round((Number(u?.cashback||0) - refund) * 100) / 100);
        await sb.from('men_users').update({cashback: newCb}).eq('id', order.user_id);
        const lu = allUsers.find(x => String(x.id) === String(order.user_id));
        if(lu) lu.cashback = newCb;
      } catch(e){ console.warn(e); }
    }
    await sb.from('men_orders').delete().eq('id', order.id);
    allOrders = allOrders.filter(o => String(o.id) !== String(order.id));
    dataVersion++;
    logAudit('order_deleted', {order_id:order.id, total:order.total});
    toast('🗑️ تم الحذف', 'success');
    closeDelModal();
    renderView(currentView);
  } catch(e){ toast('فشل: ' + e.message, 'error'); btn.disabled = false; btn.innerHTML = '<i class="fas fa-trash"></i> حذف'; }
  finally { showLoading(false); }
}

/* Confirm dialog promise-based */
function askConfirm(message, opts = {}){
  return new Promise(resolve => {
    const modal = $('maConfirmModal');
    $('maConfirmTitle').textContent = opts.title || 'تأكيد';
    $('maConfirmSub').textContent = message;
    const icon = $('maConfirmIcon');
    icon.style.background = opts.danger ? 'linear-gradient(135deg,#d90429,#8b0018)' : 'linear-gradient(135deg,#f5b342,#c98a1e)';
    icon.style.color = opts.danger ? '#fff' : '#000';
    const ok = $('maConfirmOk');
    ok.className = 'confirm' + (opts.danger ? ' danger' : '');
    const cleanup = (val) => {
      modal.classList.remove('show');
      ok.onclick = null; $('maConfirmCancel').onclick = null; modal.onclick = null;
      resolve(val);
    };
    ok.onclick = () => cleanup(true);
    $('maConfirmCancel').onclick = () => cleanup(false);
    modal.onclick = e => { if(e.target.id === 'maConfirmModal') cleanup(false); };
    modal.classList.add('show');
  });
}

  $('maChatInput').addEventListener('keydown', e => { if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); sendChatMessage(); } });
  $('maDetailClose').addEventListener('click', closeDetailModal);
  $('maDetailModal').addEventListener('click', e => { if(e.target.id === 'maDetailModal') closeDetailModal(); });
  $('maDetailPrint').addEventListener('click', printCurrentOrder);
}

function toast(msg, type='info'){
  const t = document.createElement('div');
  t.className = 'ma-toast ' + type;
  const icons = {success:'fa-circle-check', error:'fa-circle-exclamation', info:'fa-circle-info'};
  t.innerHTML = `<i class="fas ${icons[type] || 'fa-circle-info'}"></i><span>${esc(msg)}</span>`;
  document.body.appendChild(t);
  requestAnimationFrame(() => t.classList.add('show'));
  setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 400); }, 3000);
}

if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();
})();
</script>
