<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <link rel="icon" type="image/png" href="logo1.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEN Ai – وكيل ذكي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        /* ============================================================
           جميع الأنماط كما هي (نفس الكود السابق) – تم حذفها للاختصار
           لكنها موجودة في المرفق النهائي
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Cairo', sans-serif;
            background: #000000;
            color: #f0f4ff;
            min-height: 100vh;
            overflow-x: hidden;
        }
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #000000;
        }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #021ca4, #1a3a9e);
            border-radius: 12px;
        }
        .bg-ambient {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            background: radial-gradient(ellipse at 20% 30%, rgba(2, 28, 164, 0.15) 0%, transparent 55%), radial-gradient(ellipse at 80% 70%, rgba(26, 58, 158, 0.10) 0%, transparent 50%), radial-gradient(ellipse at 50% 50%, #000000 0%, #000000 100%);
            animation: ambientFloat 20s ease-in-out infinite alternate;
        }
        @keyframes ambientFloat {
            0% {
                transform: scale(1) rotate(0deg);
            }
            100% {
                transform: scale(1.05) rotate(2deg);
            }
        }
        .container {
            width: 92%;
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 18px;
        }
        :root {
            --blue-deep: #021ca4;
            --blue-mid: #1a3a9e;
            --blue-light: #4a7aff;
            --blue-glow: rgba(74, 122, 255, 0.2);
            --card-bg: rgba(10, 16, 32, 0.85);
            --card-border: rgba(2, 28, 164, 0.25);
            --radius-xl: 24px;
            --radius-2xl: 40px;
            --glow-neon: 0 0 30px rgba(74, 122, 255, 0.15);
        }
        header {
            background: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(24px);
            border-bottom: 1px solid rgba(2, 28, 164, 0.10);
            padding: 12px 0;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.8);
        }
        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 14px;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .btn-back,
        .btn-memory,
        .btn-settings {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(74, 122, 255, 0.15);
            border-radius: 40px;
            padding: 0 20px;
            height: 44px;
            color: #b0c4e8;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            text-decoration: none;
            font-family: 'Cairo', sans-serif;
            backdrop-filter: blur(8px);
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
        }
        .btn-back::before,
        .btn-memory::before,
        .btn-settings::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 40px;
            padding: 2px;
            background: linear-gradient(135deg, rgba(74, 122, 255, 0.2), transparent, rgba(74, 122, 255, 0.2));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0;
            transition: 0.6s;
        }
        .btn-back:hover::before,
        .btn-memory:hover::before,
        .btn-settings:hover::before {
            opacity: 1;
        }
        .btn-back i,
        .btn-memory i,
        .btn-settings i {
            font-size: 1.2rem;
            transition: 0.3s;
        }
        .btn-back .back-text,
        .btn-memory .memory-text,
        .btn-settings .settings-text {
            font-weight: 600;
            font-size: 0.95rem;
            white-space: nowrap;
        }
        .btn-back:hover,
        .btn-memory:hover,
        .btn-settings:hover {
            background: rgba(74, 122, 255, 0.08);
            border-color: var(--blue-light);
            color: #fff;
            transform: translateY(-2px) scale(1.03);
            box-shadow: 0 8px 30px rgba(74, 122, 255, 0.15);
        }
        .btn-back:active,
        .btn-memory:active,
        .btn-settings:active {
            transform: scale(0.95);
        }
        .btn-memory i {
            color: var(--blue-light);
        }
        .btn-memory:hover i {
            animation: pulseBrain 1.2s ease-in-out infinite;
        }
        .btn-settings i {
            color: #a0b0d4;
        }
        .btn-settings:hover i {
            animation: spinSettings 2s linear infinite;
        }
        @keyframes spinSettings {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }
        @keyframes pulseBrain {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.2) rotate(-5deg);
            }
        }
        .logo img {
            height: 48px;
            filter: brightness(0) invert(1) drop-shadow(0 0 10px rgba(74, 122, 255, 0.3));
        }
        .logo h1 {
            font-size: 2rem;
            font-weight: 900;
            background: linear-gradient(135deg, #ffffff 40%, var(--blue-light));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 40px rgba(74, 122, 255, 0.2);
        }
        .logo h1 i {
            color: var(--blue-light);
            margin-left: 8px;
            font-size: 1.6rem;
            filter: drop-shadow(0 0 20px rgba(74, 122, 255, 0.3));
            animation: sparkle 2s ease-in-out infinite alternate;
        }
        @keyframes sparkle {
            0% {
                filter: drop-shadow(0 0 10px rgba(74, 122, 255, 0.2));
                transform: scale(1) rotate(0deg);
            }
            100% {
                filter: drop-shadow(0 0 30px rgba(74, 122, 255, 0.6));
                transform: scale(1.1) rotate(10deg);
            }
        }
        .chat-wrapper {
            margin: 0 0 20px;
            background: var(--card-bg);
            backdrop-filter: blur(24px);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-2xl);
            overflow: hidden;
            box-shadow: var(--glow-neon);
            display: flex;
            flex-direction: column;
            height: calc(100vh - 200px);
            min-height: 500px;
        }
        .chat-header {
            padding: 18px 24px;
            border-bottom: 1px solid rgba(2, 28, 164, 0.1);
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            background: rgba(0, 0, 0, 0.4);
        }
        .chat-header .bot-info {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .chat-header .bot-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--blue-deep), var(--blue-light));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            color: #fff;
            box-shadow: 0 0 30px rgba(74, 122, 255, 0.2);
        }
        .chat-header .bot-name {
            font-weight: 700;
            font-size: 1.2rem;
            color: #fff;
        }
        .messages-area {
            flex: 1;
            padding: 20px 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: rgba(0, 0, 0, 0.3);
        }
        .messages-area::-webkit-scrollbar {
            width: 4px;
        }
        .messages-area::-webkit-scrollbar-thumb {
            background: var(--blue-deep);
            border-radius: 12px;
        }
        .message {
            max-width: 85%;
            padding: 14px 20px;
            border-radius: var(--radius-xl);
            animation: fadeUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            word-wrap: break-word;
            line-height: 1.7;
            position: relative;
            transition: 0.2s;
        }
        .message:hover {
            box-shadow: 0 0 20px rgba(74, 122, 255, 0.05);
        }
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.96);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        .message.user {
            align-self: flex-end;
            background: rgba(74, 122, 255, 0.2);
            border: 1px solid rgba(74, 122, 255, 0.15);
            border-bottom-left-radius: 6px;
            box-shadow: 0 4px 20px rgba(74, 122, 255, 0.08);
        }
        .message.bot {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(2, 28, 164, 0.08);
            border-bottom-right-radius: 6px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }
        .message .msg-time {
            font-size: 0.65rem;
            color: #6a708a;
            margin-top: 6px;
            display: block;
            text-align: left;
        }
        .message.user .msg-time {
            text-align: right;
        }
        .message.bot .bot-actions {
            display: flex;
            gap: 8px;
            margin-top: 8px;
            justify-content: flex-start;
            opacity: 0;
            transition: 0.3s;
        }
        .message.bot:hover .bot-actions {
            opacity: 1;
        }
        .message.bot .bot-actions button {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(74, 122, 255, 0.15);
            border-radius: 30px;
            padding: 4px 14px;
            color: #b0c4e8;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Cairo', sans-serif;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .message.bot .bot-actions button i {
            font-size: 0.9rem;
        }
        .message.bot .bot-actions button:hover {
            background: rgba(74, 122, 255, 0.12);
            border-color: var(--blue-light);
            color: #fff;
            transform: scale(1.05);
        }
        .message.bot .bot-actions button:active {
            transform: scale(0.95);
        }
        .typing-indicator {
            align-self: flex-start;
            display: none;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: var(--radius-xl);
            border-bottom-right-radius: 6px;
            border: 1px solid rgba(2, 28, 164, 0.08);
            gap: 10px;
            align-items: center;
            color: #a0b0d4;
            font-size: 0.95rem;
        }
        .typing-indicator .dots {
            display: flex;
            gap: 5px;
        }
        .typing-indicator .dots span {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--blue-light);
            display: inline-block;
            animation: typingBounce 1.4s ease-in-out infinite;
        }
        .typing-indicator .dots span:nth-child(2) {
            animation-delay: 0.2s;
        }
        .typing-indicator .dots span:nth-child(3) {
            animation-delay: 0.4s;
        }
        @keyframes typingBounce {
            0%,
            60%,
            100% {
                transform: translateY(0);
                opacity: 0.4;
            }
            30% {
                transform: translateY(-10px);
                opacity: 1;
            }
        }
        .typing-indicator i {
            color: var(--blue-light);
            animation: spin 1s linear infinite;
            font-size: 1.1rem;
        }
        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }
        .suggested-questions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 10px 20px 4px 20px;
            background: rgba(0, 0, 0, 0.25);
            border-top: 1px solid rgba(2, 28, 164, 0.08);
            transition: all 0.3s ease;
        }
        .suggested-questions.hidden {
            display: none;
        }
        .suggested-questions .sq-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(74, 122, 255, 0.15);
            border-radius: 30px;
            padding: 8px 18px;
            font-family: 'Cairo', sans-serif;
            font-size: 0.85rem;
            color: #b0c4e8;
            cursor: pointer;
            transition: 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            white-space: nowrap;
            backdrop-filter: blur(4px);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .suggested-questions .sq-btn i {
            font-size: 0.8rem;
            opacity: 0.6;
        }
        .suggested-questions .sq-btn:hover {
            background: rgba(74, 122, 255, 0.08);
            border-color: var(--blue-light);
            color: #fff;
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 4px 20px rgba(74, 122, 255, 0.05);
        }
        .suggested-questions .sq-btn:active {
            transform: scale(0.95);
        }
        .input-area {
            padding: 12px 20px 16px;
            border-top: 1px solid rgba(2, 28, 164, 0.08);
            display: flex;
            align-items: flex-end;
            gap: 8px;
            background: rgba(0, 0, 0, 0.4);
            flex-wrap: wrap;
            position: relative;
        }
        .input-area .input-wrapper {
            flex: 1;
            min-width: 150px;
            display: flex;
            align-items: flex-end;
            background: rgba(255, 255, 255, 0.03);
            border-radius: var(--radius-xl);
            border: 1.5px solid rgba(2, 28, 164, 0.1);
            transition: 0.3s;
            padding: 4px 16px 4px 8px;
            min-height: 52px;
        }
        .input-area .input-wrapper:focus-within {
            border-color: var(--blue-light);
            box-shadow: 0 0 30px rgba(74, 122, 255, 0.05);
        }
        .input-area .input-wrapper textarea {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #f0f4ff;
            font-size: 1rem;
            font-family: 'Cairo', sans-serif;
            resize: none;
            padding: 12px 4px;
            min-height: 44px;
            max-height: 150px;
            line-height: 1.6;
        }
        .input-area .input-wrapper textarea::placeholder {
            color: #5a607a;
        }
        .input-area .input-wrapper .char-count {
            font-size: 0.7rem;
            color: #4a5070;
            padding: 8px 4px;
            white-space: nowrap;
            direction: ltr;
        }
        .input-area .btn-send {
            width: 52px;
            height: 52px;
            min-width: 52px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, var(--blue-deep), var(--blue-mid));
            color: #fff;
            font-size: 1.4rem;
            cursor: pointer;
            transition: 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 4px 30px rgba(2, 28, 164, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        .input-area .btn-send::after {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(74, 122, 255, 0.4), transparent);
            opacity: 0;
            transition: 0.6s;
        }
        .input-area .btn-send:hover::after {
            opacity: 1;
        }
        .input-area .btn-send:hover {
            transform: scale(1.08);
            box-shadow: 0 8px 40px rgba(2, 28, 164, 0.4);
        }
        .input-area .btn-send:active {
            transform: scale(0.92);
        }
        .input-area .btn-send:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: scale(1);
        }
        .btn-plus {
            width: 52px;
            height: 52px;
            min-width: 52px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(2, 28, 164, 0.2);
            color: #a0b0d4;
            font-size: 1.8rem;
            cursor: pointer;
            transition: 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-plus:hover {
            background: rgba(74, 122, 255, 0.08);
            border-color: var(--blue-light);
            color: #fff;
            transform: scale(1.05) rotate(90deg);
        }
        .btn-plus:active {
            transform: scale(0.92);
        }
        .plus-dropdown {
            display: none;
            position: absolute;
            bottom: calc(100% + 12px);
            right: 0;
            background: rgba(10, 16, 32, 0.98);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(74, 122, 255, 0.2);
            border-radius: 20px;
            padding: 8px 0;
            min-width: 190px;
            box-shadow: 0 10px 50px rgba(0, 0, 0, 0.8), 0 0 30px rgba(74, 122, 255, 0.05);
            z-index: 100;
            animation: dropFade 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            transform-origin: top right;
        }
        .plus-dropdown.show {
            display: block;
        }
        @keyframes dropFade {
            from {
                opacity: 0;
                transform: translateY(10px) scale(0.96);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        .plus-dropdown .dropdown-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 20px;
            color: #c0ccf0;
            font-size: 0.95rem;
            cursor: pointer;
            transition: 0.3s;
            border: none;
            background: transparent;
            width: 100%;
            text-align: right;
            font-family: 'Cairo', sans-serif;
        }
        .plus-dropdown .dropdown-item i {
            font-size: 1.2rem;
            width: 24px;
            text-align: center;
            color: var(--blue-light);
            opacity: 0.7;
        }
        .plus-dropdown .dropdown-item:hover {
            background: rgba(74, 122, 255, 0.08);
            color: #fff;
        }
        .plus-dropdown .dropdown-item:hover i {
            opacity: 1;
        }
        .plus-dropdown .dropdown-item:active {
            transform: scale(0.97);
        }
        footer {
            background: #000000;
            border-top: 1px solid rgba(2, 28, 164, 0.03);
            padding: 50px 0 30px;
            margin-top: 30px;
        }
        .footer-flex {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 40px;
        }
        .footer-col h4 {
            color: var(--blue-light);
            margin-bottom: 18px;
            font-size: 1.2rem;
            text-shadow: 0 0 20px rgba(74, 122, 255, 0.1);
        }
        .footer-col p {
            color: #6a708a;
            margin: 10px 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .footer-col p i {
            color: #a0b0d4;
            opacity: 0.7;
            width: 20px;
            transition: 0.3s;
        }
        .footer-col p:hover i {
            color: var(--blue-light);
            transform: scale(1.2);
        }
        .social-icons {
            display: flex;
            gap: 14px;
            margin-top: 12px;
        }
        .social-icons a {
            font-size: 1.4rem;
            color: #6a708a;
            transition: 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            display: inline-block;
        }
        .social-icons a:hover {
            color: var(--blue-light);
            transform: translateY(-6px) scale(1.2);
            filter: drop-shadow(0 0 20px rgba(74, 122, 255, 0.2));
        }
        .copyright {
            text-align: center;
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid rgba(2, 28, 164, 0.03);
            color: #4a5070;
            font-size: 0.9rem;
            width: 100%;
        }
        .copyright span {
            color: var(--blue-light);
        }
        /* ============================================================
           أنماط إضافية للتوافق مع الجوال
           ============================================================ */
        @media (max-width: 768px) {
            .chat-wrapper {
                height: calc(100vh - 160px);
                min-height: 400px;
                border-radius: var(--radius-xl);
            }
            .message {
                max-width: 90%;
                padding: 12px 16px;
                font-size: 0.95rem;
            }
            .input-area {
                padding: 10px 14px 14px;
                gap: 6px;
            }
            .input-area .input-wrapper {
                padding: 2px 12px 2px 6px;
                min-height: 44px;
            }
            .input-area .input-wrapper textarea {
                padding: 8px 2px;
                font-size: 0.95rem;
                min-height: 36px;
            }
            .input-area .btn-send,
            .btn-plus {
                width: 44px;
                height: 44px;
                min-width: 44px;
                font-size: 1.2rem;
            }
            .btn-plus {
                font-size: 1.6rem;
            }
            .plus-dropdown {
                min-width: 170px;
                right: 0;
                left: auto;
                bottom: calc(100% + 8px);
            }
            .chat-header {
                padding: 12px 16px;
            }
            .chat-header .bot-avatar {
                width: 36px;
                height: 36px;
                font-size: 1.2rem;
            }
            .messages-area {
                padding: 14px 16px;
                gap: 10px;
            }
            .logo h1 {
                font-size: 1.4rem;
            }
            .logo h1 i {
                font-size: 1rem;
            }
            .logo img {
                height: 36px;
            }
            .btn-back,
            .btn-memory,
            .btn-settings {
                height: 38px;
                padding: 0 14px;
                font-size: 0.9rem;
            }
            .btn-back i,
            .btn-memory i,
            .btn-settings i {
                font-size: 1rem;
            }
            .btn-back .back-text,
            .btn-memory .memory-text,
            .btn-settings .settings-text {
                font-size: 0.85rem;
            }
            .suggested-questions {
                padding: 8px 14px 4px 14px;
                gap: 6px;
            }

            }
            .plus-dropdown {
                min-width: 150px;
                right: 0;
                left: auto;
                bottom: calc(100% + 6px);
            }
            .chat-wrapper {
                height: calc(100vh - 140px);
                min-height: 350px;
                border-radius: 18px;
            }
            .messages-area {
                padding: 10px 12px;
                gap: 8px;
            }
            .container {
                width: 96%;
                padding: 0 10px;
            }
            .logo h1 {
                font-size: 1.1rem;
            }
            .logo h1 i {
                font-size: 0.9rem;
            }
            .logo img {
                height: 30px;
            }
            .btn-back,
            .btn-memory,
            .btn-settings {
                height: 34px;
                padding: 0 10px;
                font-size: 0.8rem;
            }
            .btn-back i,
            .btn-memory i,
            .btn-settings i {
                font-size: 0.9rem;
            }
            .btn-back .back-text,
            .btn-memory .memory-text,
            .btn-settings .settings-text {
                font-size: 0.75rem;
            }
            .suggested-questions {
                padding: 6px 10px 2px 10px;
                gap: 4px;
            }
            .suggested-questions .sq-btn {
                font-size: 0.65rem;
                padding: 4px 10px;
            }
        }
        @media (max-width: 360px) {
            .logo h1 {
                font-size: 0.9rem;
            }
            .logo h1 i {
                font-size: 0.8rem;
            }
            .logo img {
                height: 26px;
            }
            .btn-back,
            .btn-memory,
            .btn-settings {
                height: 30px;
                padding: 0 8px;
                font-size: 0.7rem;
            }
            .btn-back i,
            .btn-memory i,
            .btn-settings i {
                font-size: 0.8rem;
            }
            .btn-back .back-text,
            .btn-memory .memory-text,
            .btn-settings .settings-text {
                font-size: 0.7rem;
            }
            .chat-header .bot-name {
                font-size: 0.9rem;
            }
            .chat-header .bot-avatar {
                width: 30px;
                height: 30px;
                font-size: 1rem;
            }
            .input-area .btn-send,
            .btn-plus {
                width: 32px;
                height: 32px;
                min-width: 32px;
                font-size: 0.8rem;
            }
            .btn-plus {
                font-size: 1.2rem;
            }
            .plus-dropdown {
                min-width: 130px;
                right: 0;
                left: auto;
                bottom: calc(100% + 6px);
            }
        }
    </style>
</head>
<body>
    <div class="bg-ambient"></div>
    <header>
        <div class="container header-content">
            <div class="header-left">
                <a href="#" class="btn-back" id="backBtn" title="رجوع">
                    <i class="fas fa-arrow-right"></i>
                    <span class="back-text">رجوع</span>
                </a>
            </div>
            <div class="logo">
                <h1><i class="fas fa-wand-magic-sparkles"></i> MEN Ai</h1>
            </div>
        </div>
    </header>
    <main>
        <div class="container">
            <div class="chat-wrapper">
                <div class="chat-header">
                    <div class="bot-info">
                        <div class="bot-avatar"><i class="fas fa-robot"></i></div>
                        <div>
                            <div class="bot-name">MEN Ai (وكيل تلغرام)</div>
                        </div>
                    </div>
                </div>
                <div class="messages-area" id="messagesArea">
                    <!-- رسالة الترحيب تظهر تلقائياً -->
                </div>
                <div class="typing-indicator" id="typingIndicator">
                    <i class="fas fa-circle-notch"></i>
                    <span>البوت يكتب</span>
                    <span class="dots"><span></span><span></span><span></span></span>
                </div>
                <div class="suggested-questions" id="suggestedQuestions">
                    <button class="sq-btn" data-question="متى تأسس الفريق؟"><i class="fas fa-calendar-alt"></i> متى تأسس الفريق؟</button>
                    <button class="sq-btn" data-question="عرض المنتجات"><i class="fas fa-boxes"></i> عرض المنتجات</button>
                    <button class="sq-btn" data-question="كيف يمكنني التواصل مع الدعم؟"><i class="fas fa-headset"></i> التواصل مع الدعم</button>
                </div>
                <div class="input-area">
                    <button class="btn-plus" id="plusBtn" title="خيارات إضافية">
                        <i class="fas fa-plus"></i>
                    </button>
                    <div class="plus-dropdown" id="plusDropdown">
                        <button class="dropdown-item" id="attachOption">
                            <i class="fas fa-paperclip"></i> إرفاق ملف
                        </button>
                        <input type="file" id="fileInput" accept="image/*,.pdf,.doc,.docx,.txt,.csv,.xlsx,.xls" style="display:none;">
                    </div>
                    <div class="input-wrapper">
                        <textarea id="messageInput" rows="1" placeholder="اسألني عن أي شيء..."></textarea>
                        <span class="char-count" id="charCount">0</span>
                    </div>
                    <button class="btn-send" id="sendBtn" title="إرسال">
                        <i class="fas fa-arrow-up"></i>
                    </button>
                </div>
            </div>
        </div>
    </main>
    <footer>
        <div class="container">
            <div class="footer-flex">
                <div class="footer-col">
                    <h4><i class="fas fa-compass" style="margin-left:8px; color:var(--blue-deep);"></i>تواصل معنا</h4>
                    <p><i class="fas fa-envelope"></i> clan.men.ts@gmail.com</p>
                    <p><i class="fas fa-phone"></i> 0540367546</p>
                    <div class="social-icons">
                        <a href="https://x.com/men_vi5" target="_blank"><i class="fab fa-x-twitter"></i></a>
                        <a href="https://youtube.com/@clan_men" target="_blank"><i class="fab fa-youtube"></i></a>
                        <a href="https://discord.gg/UJTZfvGew" target="_blank"><i class="fab fa-discord"></i></a>
                        <a href="https://www.tiktok.com/@team_men2020" target="_blank"><i class="fab fa-tiktok"></i></a>
                    </div>
                </div>
                <div class="copyright">جميع الحقوق محفوظة © 2020 MEN <span></span></div>
            </div>
        </div>
    </footer>

    <script>
        // ============================================================
        //  إعدادات البوت
        // ============================================================
        const BOT_TOKEN = '7793517714:AAG4OVh7_Ba_u6o7tRVzz0f_s5CyvwAVLb4';
        const TELEGRAM_API = `https://api.telegram.org/bot${BOT_TOKEN}`;
        let chatId = null; // سيتم إنشاؤه تلقائياً

        // ============================================================
        //  عناصر DOM
        // ============================================================
        const messagesArea = document.getElementById('messagesArea');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const charCount = document.getElementById('charCount');
        const typingIndicator = document.getElementById('typingIndicator');
        const suggestedQuestions = document.getElementById('suggestedQuestions');
        const plusBtn = document.getElementById('plusBtn');
        const plusDropdown = document.getElementById('plusDropdown');
        const attachOption = document.getElementById('attachOption');
        const fileInput = document.getElementById('fileInput');

        let isProcessing = false;
        let messageOffset = 0; // لمزامنة الرسائل

        // ============================================================
        //  دوال مساعدة
        // ============================================================
        function scrollToBottom() {
            messagesArea.scrollTop = messagesArea.scrollHeight;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function getCurrentTime() {
            return new Date().toLocaleString('ar-SA', { timeZone: 'Asia/Riyadh' });
        }

        // ============================================================
        //  الحصول على معرف الدردشة (chatId) فريد لكل مستخدم
        // ============================================================
        async function getChatId() {
            if (chatId) return chatId;
            // نستخدم معرف فريد من localStorage أو نولّد معرفاً عشوائياً
            let storedId = localStorage.getItem('telegram_chat_id');
            if (storedId) {
                chatId = storedId;
                return chatId;
            }
            // توليد معرف عشوائي (محاكاة)
            const randomId = 'user_' + Math.random().toString(36).substr(2, 9);
            chatId = randomId;
            localStorage.setItem('telegram_chat_id', chatId);
            return chatId;
        }

        // ============================================================
        //  إرسال رسالة إلى البوت عبر API
        // ============================================================
        async function sendToBot(text) {
            const chatId = await getChatId();
            try {
                const response = await fetch(`${TELEGRAM_API}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: chatId,
                        text: text,
                        parse_mode: 'HTML'
                    })
                });
                const data = await response.json();
                if (data.ok) {
                    return data.result;
                } else {
                    console.error('خطأ من Telegram:', data);
                    return null;
                }
            } catch (err) {
                console.error('فشل الاتصال بالبوت:', err);
                return null;
            }
        }

        // ============================================================
        //  جلب الردود الجديدة من البوت (Polling)
        // ============================================================
        async function fetchBotReplies() {
            const chatId = await getChatId();
            try {
                const url = `${TELEGRAM_API}/getUpdates?offset=${messageOffset}&timeout=30`;
                const response = await fetch(url);
                const data = await response.json();
                if (!data.ok) return;

                for (const update of data.result) {
                    messageOffset = update.update_id + 1;
                    const msg = update.message;
                    if (msg && msg.chat.id == chatId && msg.text) {
                        // تجاهل الرسائل التي أرسلها المستخدم (نحن من أرسلها)
                        // البوت يرد على رسائلنا، لذلك نعرض الردود فقط
                        if (msg.from && msg.from.is_bot) {
                            addBotMessage(msg.text);
                        }
                    }
                }
            } catch (err) {
                console.warn('خطأ في جلب الردود:', err);
            }
        }

        // ============================================================
        //  إضافة رسالة إلى الواجهة
        // ============================================================
        function addUserMessage(text) {
            const div = document.createElement('div');
            div.className = 'message user';
            div.innerHTML = escapeHtml(text) + `<span class="msg-time">${getCurrentTime()}</span>`;
            messagesArea.appendChild(div);
            scrollToBottom();
        }

        function addBotMessage(text) {
            const div = document.createElement('div');
            div.className = 'message bot';
            div.innerHTML = text + `<span class="msg-time">${getCurrentTime()}</span>`;
            // إضافة أزرار النسخ
            const actions = document.createElement('div');
            actions.className = 'bot-actions';
            actions.innerHTML = `
                <button class="copy-btn" data-content="${escapeHtml(text)}"><i class="fas fa-copy"></i> نسخ</button>
            `;
            div.appendChild(actions);
            messagesArea.appendChild(div);
            scrollToBottom();

            // تفعيل زر النسخ
            div.querySelector('.copy-btn').addEventListener('click', function(e) {
                e.stopPropagation();
                const content = this.dataset.content;
                navigator.clipboard.writeText(content).then(() => {
                    const orig = this.innerHTML;
                    this.innerHTML = '<i class="fas fa-check"></i> تم';
                    setTimeout(() => { this.innerHTML = orig; }, 1500);
                }).catch(() => {
                    alert('تعذر نسخ النص');
                });
            });
        }

        // ============================================================
        //  عرض رسالة ترحيب
        // ============================================================
        function showWelcome() {
            const welcomeText = `👋 مرحباً بك في **MEN Ai** – وكيل ذكي متصل ببوت تلغرام!\n\n` +
                `📌 **ما يمكنني فعله:**\n` +
                `• الإجابة عن أسئلتك العامة.\n` +
                `• إجراء العمليات الحسابية.\n` +
                `• عرض الوقت والتاريخ.\n` +
                `• عرض قائمة المنتجات (أرسل "المنتجات").\n` +
                `• البحث عن منتج معين (اكتب اسمه).\n` +
                `• طلب شراء (أرسل "شراء" أو "طلب").\n\n` +
                `🛠️ اكتب ما تريد وسأحاول مساعدتك!`;
            addBotMessage(welcomeText);
        }

        // ============================================================
        //  إرسال رسالة المستخدم ومعالجتها
        // ============================================================
        async function sendMessage() {
            const text = messageInput.value.trim();
            if (!text) return;
            if (isProcessing) return;

            isProcessing = true;
            sendBtn.disabled = true;
            suggestedQuestions.classList.add('hidden');

            // عرض رسالة المستخدم
            addUserMessage(text);

            // مسح حقل الإدخال
            messageInput.value = '';
            messageInput.style.height = 'auto';
            charCount.textContent = '0';

            // إظهار مؤشر الكتابة
            typingIndicator.style.display = 'flex';
            scrollToBottom();

            try {
                // إرسال إلى البوت
                const result = await sendToBot(text);
                if (result) {
                    // البوت سيرد، وسنستقبل الرد عبر polling
                    // ننتظر قليلاً ثم نجلب الردود
                    await new Promise(resolve => setTimeout(resolve, 1500));
                    await fetchBotReplies();
                } else {
                    addBotMessage('⚠️ عذراً، البوت لا يستجيب حالياً. حاول مرة أخرى.');
                }
            } catch (err) {
                addBotMessage('❌ حدث خطأ في الاتصال. يرجى المحاولة لاحقاً.');
            } finally {
                typingIndicator.style.display = 'none';
                isProcessing = false;
                sendBtn.disabled = false;
                messageInput.focus();
                scrollToBottom();
            }
        }

        // ============================================================
        //  التعامل مع الأحداث
        // ============================================================
        messageInput.addEventListener('input', function() {
            const len = this.value.length;
            charCount.textContent = len > 0 ? len : '0';
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 150) + 'px';
        });

        messageInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        sendBtn.addEventListener('click', sendMessage);

        // الأسئلة المقترحة
        document.querySelectorAll('.sq-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const question = this.dataset.question;
                if (question) {
                    messageInput.value = question;
                    charCount.textContent = question.length;
                    sendMessage();
                }
            });
        });

        // زر الرجوع
        document.getElementById('backBtn').addEventListener('click', function(e) {
            e.preventDefault();
            if (document.referrer) window.history.back();
            else window.location.href = '/';
        });

        // زر الزائد (رفع ملف)
        plusBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            plusDropdown.classList.toggle('show');
        });

        attachOption.addEventListener('click', function(e) {
            e.stopPropagation();
            fileInput.click();
            plusDropdown.classList.remove('show');
        });

        fileInput.addEventListener('change', function(e) {
            if (this.files && this.files.length > 0) {
                const file = this.files[0];
                // إرسال رسالة تفيد برفع الملف
                const text = `📎 تم رفع ملف: ${file.name}`;
                messageInput.value = text;
                charCount.textContent = text.length;
                // اختيارياً: يمكن إرسال الملف عبر Telegram API (نتركه للمستقبل)
                sendMessage();
                this.value = '';
            }
        });

        // إغلاق القائمة المنسدلة عند النقر خارجها
        document.addEventListener('click', function(e) {
            if (!e.target.closest('.input-area')) {
                plusDropdown.classList.remove('show');
            }
        });

        // ============================================================
        //  بدء التشغيل
        // ============================================================
        async function init() {
            // عرض الترحيب
            showWelcome();

            // جلب الردود بشكل دوري (كل 3 ثوان)
            setInterval(async () => {
                await fetchBotReplies();
            }, 3000);

            // جلب أولي
            await fetchBotReplies();

            // تمكين الإدخال
            messageInput.disabled = false;
            messageInput.focus();
            sendBtn.disabled = false;

            console.log('✅ الموقع جاهز ومتصل ببوت تلغرام.');
        }

        init();
    </script>
</body>
</html>
