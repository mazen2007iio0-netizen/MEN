<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <link rel="icon" type="image/png" href="logo1.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEN AI تجريبي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        /* جميع الأنماط كما هي (تم حذفها للاختصار، لكنها موجودة في الكود الكامل) */
        /* ... (نفس الأنماط السابقة) ... */
    </style>
</head>
<body>
    <!-- نفس الهيكل السابق مع بعض التعديلات في النصوص والإعدادات -->

    <script>
        // ============================================================
        //  المتغيرات العامة
        // ============================================================
        let responses = {};
        let keywordsMap = {};
        let products = [];
        let customReplies = {};

        const CUSTOM_REPLIES_KEY = 'menCustomReplies';

        let attachedFile = null;
        let extractedText = '';

        // متغيرات وكيل الشراء
        let purchaseStep = null; // null | 'ask_name' | 'ask_phone' | 'ask_product' | 'done'
        let purchaseProductData = null;
        let purchaseName = '';
        let purchasePhone = '';
        let purchaseAgentActive = false; // يتم تفعيله من الزر

        // ============================================================
        //  إدارة الذاكرة والإعدادات
        // ============================================================
        const MEMORY_KEY = 'menChatMemory';
        const SETTINGS_KEY = 'menChatSettings';

        let maxMessagesPerSession = 6;
        let autoBoostEnabled = false;
        let autoAgentEnabled = false; // تفعيل الوكيل التلقائي

        function loadSettings() {
            try {
                const saved = localStorage.getItem(SETTINGS_KEY);
                if (saved) {
                    const settings = JSON.parse(saved);
                    maxMessagesPerSession = settings.limit || 6;
                    autoBoostEnabled = settings.autoBoost || false;
                    autoAgentEnabled = settings.autoAgent || false;
                    return settings;
                }
            } catch (e) {}
            return { limit: 6, autoBoost: false, autoAgent: false };
        }

        function saveSettings(limit, autoBoost, autoAgent) {
            try {
                const settings = { limit, autoBoost, autoAgent };
                localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
                maxMessagesPerSession = limit;
                autoBoostEnabled = autoBoost;
                autoAgentEnabled = autoAgent;
            } catch (e) {}
        }

        // ... (باقي دوال الذاكرة كما هي) ...

        // ============================================================
        //  دوال المنتجات وعرضها
        // ============================================================
        function buildAllProductsRow() {
            if (!products || products.length === 0)
                return '<p style="color: #8a9abb; padding: 10px 0;">لا توجد منتجات متاحة حالياً.</p>';
            let html = '<div class="products-row-wrapper"><div class="products-row">';
            products.forEach(p => { html += buildProductCard(p); });
            html += '</div></div>';
            return html;
        }

        function buildProductCard(product) {
            const image = product.image || 'images/default.png';
            const name = product.name || 'منتج';
            const description = product.description || 'لا يوجد وصف';
            const price = product.price || '0';
            const currency = product.currency || 'ر.س';
            const badge = product.badge || ' منتج';
            const link = product.link || '#';
            return `
                <div class="men-product-card">
                    <img src="${image}" class="product-image" alt="${name}" onerror="this.src='images/default.png'">
                    <div class="product-content">
                        <span class="badge">${badge}</span>
                        <h2>${name}</h2>
                        <p>${description}</p>
                        <div class="bottom">
                            <div class="price">${price} <small>${currency}</small></div>
                            <button class="btn-product" onclick="window.location.href='${link}'">
                                <i class="fas fa-arrow-left"></i> عرض
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function findProduct(text) {
            const lower = text.trim().toLowerCase();
            for (const product of products) {
                if (product.keywords && product.keywords.some(k => lower.includes(k.toLowerCase()))) return product;
                const name = (product.name || '').toLowerCase();
                const desc = (product.description || '').toLowerCase();
                if (name.includes(lower) || lower.includes(name) || desc.includes(lower) || lower.includes(desc))
                    return product;
            }
            return null;
        }

        // ============================================================
        //  دوال وكيل الشراء (يُفعّل من الزر)
        // ============================================================
        function startPurchaseAgent() {
            purchaseAgentActive = true;
            purchaseStep = 'ask_name';
            purchaseProductData = null;
            purchaseName = '';
            purchasePhone = '';
            return '🛒 **قول لي اسمك ورقم جوالك عشان أقدر أدخل المتجر وأطلب لك.**\n\n👤 أولاً: أرسل لي اسمك الرباعي.';
        }

        function handlePurchaseStep(text) {
            if (!purchaseAgentActive) return null;

            const lower = text.trim();

            if (purchaseStep === 'ask_name') {
                if (lower.length < 3) {
                    return '❌ الاسم قصير جداً. من فضلك أرسل اسمك الرباعي (مثل: أحمد محمد).';
                }
                purchaseName = lower;
                purchaseStep = 'ask_phone';
                return '📱 **شكراً! الآن أرسل لي رقم جوالك.**';
            }

            if (purchaseStep === 'ask_phone') {
                const phoneClean = lower.replace(/\s/g, '');
                if (!phoneClean.match(/^[0-9]{8,15}$/)) {
                    return '❌ رقم الجوال غير صحيح. يرجى إدخال رقم صحيح (مثال: 0540367546).';
                }
                purchasePhone = phoneClean;
                purchaseStep = 'ask_product';
                return '🛍️ **الآن أخبرني ما هو المنتج الذي ترغب في شرائه؟**\n(يمكنك كتابة اسم المنتج أو كلمة مفتاحية)';
            }

            if (purchaseStep === 'ask_product') {
                const product = findProduct(lower);
                if (!product) {
                    return '❌ **لم أجد المنتج المطلوب.** يرجى كتابة اسم المنتج بشكل صحيح، أو اكتب "إلغاء" لإلغاء الطلب.';
                }
                purchaseProductData = product;

                // تطبيق الخصم 10%
                const priceNum = parseFloat(product.price);
                let finalPrice = priceNum;
                if (!isNaN(priceNum)) {
                    finalPrice = priceNum * 0.9;
                }
                const finalPriceStr = finalPrice.toFixed(2);

                // إرسال الطلب إلى Discord
                sendPurchaseToDiscord(product, purchaseName, purchasePhone, finalPriceStr);

                // رسالة التأكيد
                const msg = `✅ **تم طلب المنتج بنجاح!**\n` +
                    `**المنتج:** ${product.name}\n` +
                    `**السعر بعد الخصم 10%:** ${finalPriceStr} ${product.currency || 'ر.س'}\n` +
                    `**الاسم:** ${purchaseName}\n` +
                    `**الجوال:** ${purchasePhone}\n\n` +
                    `🛡️ **ترا طلبت لك ولاهمك انا معك اول بأول.**`;

                // إعادة تعيين الوكيل
                purchaseAgentActive = false;
                purchaseStep = null;
                purchaseProductData = null;
                purchaseName = '';
                purchasePhone = '';

                return msg;
            }

            return null;
        }

        async function sendPurchaseToDiscord(product, name, phone, priceAfterDiscount) {
            try {
                const payload = {
                    content: `**🛒 طلب شراء جديد من MEN Ai**\n\n` +
                        `**المنتج:** ${product.name}\n` +
                        `**السعر الأصلي:** ${product.price} ${product.currency || 'ر.س'}\n` +
                        `**الخصم 10%:** ${priceAfterDiscount} ${product.currency || 'ر.س'}\n` +
                        `**الاسم:** ${name}\n` +
                        `**رقم الجوال:** ${phone}\n` +
                        `**الوقت:** ${new Date().toLocaleString('ar-SA', { timeZone: 'Asia/Riyadh' })}`
                };
                await fetch(
                    'https://discord.com/api/webhooks/1502708241518432399/oYuBXcUAPEskuKUqHLAewfXb5E2Xxxj7EUiqUS7RIPL7NMKXO3ZRla4-Vw8XDWBwDWDj', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                console.log('✅ تم إرسال الطلب إلى Discord');
            } catch (err) {
                console.warn('فشل إرسال الطلب إلى Discord:', err);
            }
        }

        // ============================================================
        //  دوال إنشاء الرد الذكي
        // ============================================================
        async function generateSmartReply(text) {
            const lower = text.trim().toLowerCase();

            // 1. عرض المنتجات إذا طلبها المستخدم
            if (lower.includes('عرض المنتجات') || lower.includes('المنتجات') || lower.includes('قائمة المنتجات') || lower.includes('اشتري')) {
                return { type: 'products', content: buildAllProductsRow() };
            }

            // 2. إذا كان الوكيل مفعلاً، نتعامل مع خطواته
            if (purchaseAgentActive) {
                const reply = handlePurchaseStep(text);
                if (reply) {
                    return { type: 'text', content: reply };
                }
            }

            // 3. العمليات الحسابية
            const mathResult = evaluateMath(text);
            if (mathResult !== null) {
                return { type: 'text', content: ` النتيجة هي: **${mathResult}**\nهل تريد حل مسألة أخرى؟` };
            }

            // 4. الوقت والتاريخ
            if (keywordsMap['time'] && keywordsMap['time'].some(p => lower.includes(p))) {
                const now = new Date();
                const timeStr = now.toLocaleString('ar-SA', { timeZone: 'Asia/Riyadh', hour12: true });
                const dateStr = now.toLocaleDateString('ar-SA', { timeZone: 'Asia/Riyadh' });
                const template = getReply('time');
                return { type: 'text', content: template.replace(/\{time\}/g, timeStr).replace(/\{date\}/g, dateStr) };
            }

            // 5. البحث عن منتج محدد (دون تفعيل الوكيل)
            const product = findProduct(text);
            if (product) {
                return { type: 'product', content: `<div class="products-row-wrapper"><div class="products-row">${buildProductCard(product)}</div></div>` };
            }

            // 6. الردود العامة
            let category = getCategoryForText(text);
            if (category !== 'default') {
                return { type: 'text', content: getReply(category) };
            }

            return { type: 'text', content: getReply('default') };
        }

        // ... (باقي الدوال: getReply, getCategoryForText, evaluateMath, loadResponses, loadProducts, إلخ) ...

        // ============================================================
        //  ربط زر "وكيل MEN Ai" في القائمة الفرعية
        // ============================================================
        document.getElementById('aiAgentOption').addEventListener('click', function(e) {
            e.stopPropagation();
            // نبدأ الوكيل
            const startMsg = startPurchaseAgent();
            // نضيف رسالة البوت مباشرة
            const botMsg = document.createElement('div');
            botMsg.className = 'message bot';
            botMsg.innerHTML = startMsg + `<span class="msg-time">الآن</span>`;
            document.getElementById('messagesArea').appendChild(botMsg);
            scrollToBottom();
            saveToMemory('bot', startMsg);
            closeAllDropdowns();
        });

        // ============================================================
        //  ربط زر "البحث في المعزز" (اختياري)
        // ============================================================
        document.getElementById('searchBoostOption').addEventListener('click', function(e) {
            e.stopPropagation();
            alert('🔍 البحث في المعزز سيمكنك من الوصول إلى قاعدة بيانات ضخمة جداً.');
            closeAllDropdowns();
        });

        // ============================================================
        //  تحديث مودال الإعدادات
        // ============================================================
        // إضافة خيار "تفعيل الوكيل التلقائي"
        // نضيفه في settings-modal في الـ HTML (تم تعديله)
        // وفي الجافاسكريبت نربطه مع toggle

        // ============================================================
        //  التهيئة الرئيسية
        // ============================================================
        async function init() {
            messageInput.disabled = true;
            sendBtn.disabled = true;

            await loadExternalLibraries();
            await Promise.all([loadResponses(), loadProducts()]);

            loadCustomReplies();
            rebuildKeywordsMap();

            const settings = loadSettings();
            maxMessagesPerSession = settings.limit || 6;
            autoBoostEnabled = settings.autoBoost || false;
            autoAgentEnabled = settings.autoAgent || false;

            loadCurrentSession();
            loadMemory();

            messageInput.disabled = false;
            messageInput.focus();
            sendBtn.disabled = false;

            console.log('✅ MEN Ai جاهز مع وكيل الشراء (من الزر) وعرض المنتجات.');
        }

        init();
    </script>
</body>
</html>
