<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>🏔️ سباق التلال</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#0b0f14;
  font-family:"Segoe UI",Tahoma,"Noto Kufi Arabic",sans-serif;user-select:none;touch-action:none}
canvas{position:absolute;inset:0;display:block}

/* ====== HUD ====== */
#hud{position:absolute;inset:0;pointer-events:none;z-index:10}
#hud.hide{display:none}
.hud-top{position:absolute;top:0;left:0;right:0;display:flex;gap:10px;padding:12px;align-items:center;justify-content:center;flex-wrap:wrap}
.hud-item{display:flex;align-items:center;gap:6px;background:rgba(8,14,22,.55);backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,.15);border-radius:999px;padding:7px 14px;color:#fff;font-size:15px;font-weight:700;
  box-shadow:0 4px 18px rgba(0,0,0,.3)}
.hud-item .ico{font-size:16px}
.hud-item small{opacity:.7;font-weight:500;font-size:11px}
.bar{width:110px;height:10px;background:rgba(255,255,255,.18);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:100%;border-radius:99px;
  background:linear-gradient(90deg,#22e07a,#a8e063);transition:width .12s linear}
.bar i.low{background:linear-gradient(90deg,#ff3b3b,#ff8a3b)}

.pedal{position:absolute;bottom:22px;width:96px;height:96px;border-radius:50%;border:2px solid rgba(255,255,255,.25);
  background:rgba(255,255,255,.12);backdrop-filter:blur(10px);color:#fff;font-size:34px;pointer-events:auto;
  display:flex;align-items:center;justify-content:center;transition:transform .07s,background .12s;
  box-shadow:0 6px 24px rgba(0,0,0,.35)}
.pedal:active,.pedal.active{transform:scale(.93);background:rgba(255,255,255,.3)}
.pedal.brake{left:22px;background:rgba(255,70,70,.22);border-color:rgba(255,120,120,.4)}
.pedal.gas{right:22px;background:rgba(60,220,130,.22);border-color:rgba(120,255,180,.4)}
.pause-btn{position:absolute;top:12px;left:12px;width:42px;height:42px;border-radius:12px;
  border:1px solid rgba(255,255,255,.2);background:rgba(8,14,22,.55);color:#fff;font-size:17px;
  pointer-events:auto;backdrop-filter:blur(8px);cursor:pointer}

/* ====== Screens ====== */
.screen{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 0%,rgba(20,40,70,.55),rgba(4,8,14,.88));backdrop-filter:blur(6px);padding:16px;overflow-y:auto}
.screen.hide{display:none}
.panel{width:100%;max-width:420px;background:rgba(14,22,34,.9);border:1px solid rgba(120,180,255,.18);
  border-radius:24px;padding:26px 22px;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.6)}
.panel h1{font-size:28px;color:#fff;margin-bottom:6px;letter-spacing:.5px}
.panel h2{font-size:22px;color:#fff;margin-bottom:14px}
.sub{color:#8fa6c0;font-size:13px;margin-bottom:16px;line-height:1.6}
.coins-big{background:linear-gradient(135deg,#ffd54a,#ff9f1c);-webkit-background-clip:text;background-clip:text;
  color:transparent;font-size:26px;font-weight:900;margin:8px 0 18px}
.big-btn{display:block;width:100%;padding:15px;margin:9px 0;border:none;border-radius:16px;font-size:17px;font-weight:800;
  color:#04121f;cursor:pointer;background:linear-gradient(135deg,#3ddc84,#12b76a);
  box-shadow:0 8px 24px rgba(18,183,106,.35);transition:transform .1s;font-family:inherit}
.big-btn:active{transform:scale(.97)}
.big-btn.alt{background:linear-gradient(135deg,#4a6fa5,#2d4568);color:#eaf2ff;
  box-shadow:0 8px 24px rgba(45,69,104,.4)}
.big-btn:disabled{opacity:.45;filter:grayscale(.6);cursor:not-allowed}
.back-btn{margin-top:10px;background:transparent;border:1px solid rgba(255,255,255,.2);color:#b9cbe0;
  padding:11px;width:100%;border-radius:14px;font-size:14px;cursor:pointer;font-family:inherit;font-weight:600}

/* upgrade list */
.upg{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);
  border-radius:16px;padding:12px;margin-bottom:10px;text-align:right}
.upg-icon{font-size:24px;width:38px;text-align:center;flex-shrink:0}
.upg-info{flex:1;min-width:0}
.upg-name{color:#fff;font-size:14px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px}
.upg-name .lvl{font-size:11px;color:#7fd1a8;background:rgba(60,220,130,.13);padding:2px 8px;border-radius:99px;font-weight:600;flex-shrink:0}
.bars{display:flex;gap:3px;margin-top:7px}
.bars span{flex:1;height:6px;border-radius:99px;background:rgba(255,255,255,.13)}
.bars span.on{background:linear-gradient(90deg,#3ddc84,#8ce99a)}
.buy{background:linear-gradient(135deg,#ffd54a,#ff9f1c);border:none;color:#3a2400;font-weight:900;font-size:12px;
  padding:9px 12px;border-radius:12px;cursor:pointer;white-space:nowrap;font-family:inherit;flex-shrink:0}
.buy:disabled{background:rgba(255,255,255,.1);color:#7c8ea3;cursor:not-allowed}
.buy:active:not(:disabled){transform:scale(.95)}

/* stage cards */
.stage-card{display:flex;align-items:center;gap:12px;border-radius:18px;padding:14px;margin-bottom:11px;
  border:2px solid transparent;background:rgba(255,255,255,.05);cursor:pointer;transition:.15s;text-align:right}
.stage-card.sel{border-color:#3ddc84;background:rgba(61,220,132,.12)}
.stage-card.locked{opacity:.6}
.stage-emoji{font-size:30px}
.stage-info{flex:1;min-width:0}
.stage-name{color:#fff;font-weight:800;font-size:15px}
.stage-best{color:#8fa6c0;font-size:11px;margin-top:3px}
.tag{font-size:11px;padding:4px 9px;border-radius:99px;font-weight:700}
.tag.free{background:rgba(61,220,132,.18);color:#6ee7a5}
.tag.cost{background:rgba(255,213,74,.15);color:#ffd54a}
.tag.lock{background:rgba(255,255,255,.1);color:#93a7bd}

/* game over */
.res-row{display:flex;justify-content:space-between;padding:11px 14px;background:rgba(255,255,255,.05);
  border-radius:13px;margin-bottom:9px;color:#c8d8ea;font-size:14px}
.res-row b{color:#fff;font-weight:800}
</style>
</head>
<body>

<canvas id="game"></canvas>

<!-- ======= HUD ======= -->
<div id="hud" class="hide">
  <div class="hud-top">
    <div class="hud-item fuel">
      <span class="ico">⛽</span>
      <div class="bar"><i id="fuelFill"></i></div>
    </div>
    <div class="hud-item"><span class="ico">🪙</span><b id="coinNum">0</b></div>
    <div class="hud-item"><span class="ico">📏</span><b id="distNum">0</b><small>م</small></div>
  </div>
  <button class="pause-btn" id="btnPause">⏸</button>
  <button class="pedal brake" id="pedalBrake">◀</button>
  <button class="pedal gas" id="pedalGas">▶</button>
</div>

<!-- ======= MENU ======= -->
<div id="scr-menu" class="screen">
  <div class="panel">
    <h1>🏔️ سباق التلال</h1>
    <p class="sub">قُد سيارتك فوق التلال، اجمع العملات والوقود،<br>وطوّر مركبتك لتصل إلى أبعد مدى!</p>
    <div class="coins-big">🪙 <b id="menuCoins">0</b></div>
    <button class="big-btn" id="btnPlay">▶ ابدأ اللعب</button>
    <button class="big-btn alt" id="btnGarage">🔧 الجراج</button>
    <button class="big-btn alt" id="btnStages">🗺️ المراحل</button>
  </div>
</div>

<!-- ======= GARAGE ======= -->
<div id="scr-garage" class="screen hide">
  <div class="panel">
    <h2>🔧 الجراج</h2>
    <div class="coins-big" style="margin:4px 0 16px">🪙 <b id="garageCoins">0</b></div>
    <div id="upgList"></div>
    <button class="back-btn" data-back="menu">رجوع</button>
  </div>
</div>

<!-- ======= STAGES ======= -->
<div id="scr-stages" class="screen hide">
  <div class="panel">
    <h2>🗺️ المراحل</h2>
    <div class="coins-big" style="margin:4px 0 16px">🪙 <b id="stageCoins">0</b></div>
    <div id="stageList"></div>
    <button class="back-btn" data-back="menu">رجوع</button>
  </div>
</div>

<!-- ======= PAUSE ======= -->
<div id="scr-pause" class="screen hide">
  <div class="panel">
    <h2>⏸ إيقاف مؤقت</h2>
    <button class="big-btn" id="btnResume">▶ متابعة</button>
    <button class="big-btn alt" id="btnQuit">↩ إنهاء الجولة</button>
  </div>
</div>

<!-- ======= GAME OVER ======= -->
<div id="scr-over" class="screen hide">
  <div class="panel">
    <h2 id="overTitle">انتهت الجولة</h2>
    <div class="res-row"><span>المسافة</span><b id="overDist">0 م</b></div>
    <div class="res-row"><span>العملات</span><b id="overCoins">0 🪙</b></div>
    <div class="res-row"><span>أفضل مسافة</span><b id="overBest">0 م</b></div>
    <button class="big-btn" id="btnRetry">🔄 حاول مجدداً</button>
    <button class="big-btn alt" id="btnHome">🏠 القائمة</button>
  </div>
</div>

<script>
"use strict";
/* ============================================================
   أدوات مساعدة
============================================================ */
const clamp = (v,a,b)=> v<a?a:(v>b?b:v);
const lerp  = (a,b,t)=> a+(b-a)*t;
const rnd   = (a,b)=> a+Math.random()*(b-a);

/* ============================================================
   الحفظ
============================================================ */
const SAVE_KEY = 'hillclimb_save_v2';
const save = {
  coins: 0,
  upg: { engine:1, tires:1, susp:1, tank:1 },
  stage: 0,
  unlocked: [true,false,false],
  best: [0,0,0]
};
function loadSave(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(raw){
      const s = JSON.parse(raw);
      if(typeof s.coins === 'number') save.coins = s.coins;
      if(s.upg) Object.assign(save.upg, s.upg);
      if(typeof s.stage === 'number') save.stage = s.stage;
      if(Array.isArray(s.unlocked)) save.unlocked = s.unlocked;
      if(Array.isArray(s.best)) save.best = s.best;
    }
  }catch(e){}
}
function persist(){
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify(save)); }catch(e){}
}
loadSave();

/* ============================================================
   المراحل
============================================================ */
const STAGES = [
  { name:'الصحراء', emoji:'🏜️', seed:7, baseY:420, hill:1.00, rough:1.00, mu:1.05, unlockCost:0,
    sky1:'#ffe9a8', sky2:'#ff9147', far1:'#f2bb72', far2:'#dd9a4e',
    ground1:'#efcc94', ground2:'#b8894f', edge:'#a5763f', cloud:'#fff3d0' },
  { name:'الجبال', emoji:'🏔️', seed:23, baseY:420, hill:1.35, rough:1.45, mu:1.00, unlockCost:400,
    sky1:'#cbe9ff', sky2:'#4f92cf', far1:'#84ab6d', far2:'#4d7743',
    ground1:'#7ea85d', ground2:'#3d5a30', edge:'#2f4a25', cloud:'#ffffff' },
  { name:'الثلوج', emoji:'❄️', seed:51, baseY:420, hill:1.20, rough:1.15, mu:0.40, unlockCost:1200,
    sky1:'#eef8ff', sky2:'#89bce4', far1:'#c6dcee', far2:'#9dbdd8',
    ground1:'#ffffff', ground2:'#bdd4e6', edge:'#a3c0d6', cloud:'#ffffff' }
];

/* ============================================================
   التضاريس
============================================================ */
let T = { seed:7, baseY:420, hill:1, rough:1 };

function hash1(n){
  const s = Math.sin(n*12.9898 + T.seed*78.233) * 43758.5453123;
  return s - Math.floor(s);
}
function noise1(x){
  const i = Math.floor(x), f = x - i;
  const u = f*f*(3-2*f);
  return hash1(i)*(1-u) + hash1(i+1)*u;
}
function terrainY(x){
  const ramp = clamp((x-60)/430, 0, 1);
  const diff = 1 + clamp(x/12000, 0, 0.5);
  let h = 0;
  h += (noise1(x*0.0009) - 0.5) * 390 * T.hill * diff;
  h += (noise1(x*0.0036) - 0.5) * 132 * T.rough;
  h += (noise1(x*0.0145) - 0.5) * 30  * T.rough;
  h += (noise1(x*0.0620) - 0.5) * 8;
  return T.baseY - h*ramp;
}
function terrainSlope(x){
  return (terrainY(x+3) - terrainY(x-3)) / 6;
}

/* ============================================================
   المحرك الفيزيائي
============================================================ */
const GRAVITY = 900;
const FIXED_DT = 1/240;

let car = null;
let camX = 0, camY = 260;
let items = [], genX = 0, nextFuelX = 0;
let gameState = 'menu';
let acc = 0, frameCount = 0;
let playStats = { coins:0, maxX:0 };
let flipTimer = 0, fuelOutTimer = 0;
const input = { gas:false, brake:false };

function carParams(){
  const u = save.upg;
  const st = STAGES[save.stage];
  return {
    enginePower : 5200 + (u.engine-1)*1250,
    maxSpeed    : 560  + (u.engine-1)*22,
    mu          : st.mu * (1 + (u.tires-1)*0.075),
    suspK       : 2600 + (u.susp-1)*230,
    suspC       : 112  + (u.susp-1)*20,
    fuelMax     : 100  + (u.tank-1)*24
  };
}

function makeCar(){
  const P = carParams();
  return {
    x:220, y: terrainY(220) - 70,
    vx:0, vy:0, angle:0, angVel:0,
    mass:12, inertia:9500,
    fuel:P.fuelMax, params:P,
    wheels:[
      { lx:-30, ly:16, r:15, drive:0.62, wx:0, wy:0, spin:0, grounded:false },
      { lx: 32, ly:16, r:15, drive:0.38, wx:0, wy:0, spin:0, grounded:false }
    ]
  };
}

function physicsStep(c, dt, inp){
  const P = c.params;
  const cosA = Math.cos(c.angle), sinA = Math.sin(c.angle);

  let fx = 0, fy = c.mass * GRAVITY, torque = 0;

  // مقاومة الهواء
  fx -= c.vx * 0.35;
  fy -= c.vy * 0.35;

  let anyGround = false;
  const hasFuel = c.fuel > 0;

  for(const w of c.wheels){
    const wx = c.x + cosA*w.lx - sinA*w.ly;
    const wy = c.y + sinA*w.lx + cosA*w.ly;
    w.wx = wx; w.wy = wy;

    const gy = terrainY(wx);
    const s  = terrainSlope(wx);
    const nl = Math.sqrt(1 + s*s);
    const nx = -s/nl, ny = 1/nl;        // العمودي (للأعلى)
    const tx =  1/nl, ty = s/nl;        // المماسي (للأمام)

    const perpDist = (gy - wy) / nl;
    const pen = w.r - perpDist;
    w.grounded = pen > 0;

    if(pen > 0){
      anyGround = true;

      const rx = wx - c.x, ry = wy - c.y;
      const cvx = c.vx - c.angVel*ry;
      const cvy = c.vy + c.angVel*rx;
      const vn = cvx*nx + cvy*ny;
      const vt = cvx*tx + cvy*ty;

      let Fn = P.suspK*pen - P.suspC*vn;
      if(Fn < 0) Fn = 0;
      if(Fn > 70000) Fn = 70000;

      const gripMax = P.mu * Fn;
      let Ft = 0;

      if(inp.gas && hasFuel){
        Ft = P.enginePower * w.drive * clamp(1 - vt/P.maxSpeed, 0, 1);
      } else if(inp.brake && hasFuel){
        Ft = -vt * 26;
        if(Math.abs(vt) < 55) Ft = -P.enginePower * 0.42 * w.drive;
      } else {
        Ft = -vt * 1.4;
      }
      Ft = clamp(Ft, -gripMax, gripMax);

      const Fx = nx*Fn + tx*Ft;
      const Fy = ny*Fn + ty*Ft;

      fx += Fx; fy += Fy;
      torque += rx*Fy - ry*Fx;

      // دوران العجلة (بصري فقط)
      w.spin += (vt / w.r) * dt;
    }
  }

  // تحكم هوائي أثناء القفز
  if(!anyGround && hasFuel){
    if(inp.gas)   torque -= 44000;
    if(inp.brake) torque += 44000;
  }

  c.vx += (fx / c.mass) * dt;
  c.vy += (fy / c.mass) * dt;
  c.angVel += (torque / c.inertia) * dt;
  c.angVel *= 0.9985;

  c.vx = clamp(c.vx, -2600, 2600);
  c.vy = clamp(c.vy, -2600, 2600);
  c.angVel = clamp(c.angVel, -15, 15);

  c.x += c.vx * dt;
  c.y += c.vy * dt;
  c.angle += c.angVel * dt;

  // جدار وهمي خلف نقطة البداية
  if(c.x < 40){ c.x = 40; if(c.vx < 0) c.vx *= -0.3; }
}

/* ============================================================
   توليد العناصر
============================================================ */
function generateItems(untilX){
  let guard = 0;
  while(genX < untilX && guard++ < 60){
    genX += rnd(130, 290);
    const y = terrainY(genX) - rnd(48, 95);
    items.push({ type:'coin', x:genX, y, taken:false });

    if(genX > nextFuelX){
      nextFuelX = genX + rnd(1500, 2300);
      const fx = genX + 55;
      items.push({ type:'fuel', x:fx, y: terrainY(fx) - 48, taken:false });
    }
  }
}

/* ============================================================
   منطق اللعب
============================================================ */
function updateGame(dt){
  if(!car) return;
  const P = car.params;

  // استهلاك الوقود
  if(car.fuel > 0){
    const drain = 2.2 + (input.gas ? 1.9 : 0);
    car.fuel = Math.max(0, car.fuel - drain*dt);
  }

  if(car.x > playStats.maxX) playStats.maxX = car.x;

  // جمع العناصر
  generateItems(car.x + 2600);
  for(const it of items){
    if(it.taken) continue;
    const dx = it.x - car.x, dy = it.y - car.y;
    if(dx*dx + dy*dy < 44*44){
      it.taken = true;
      if(it.type === 'coin') playStats.coins++;
      else car.fuel = Math.min(P.fuelMax, car.fuel + P.fuelMax*0.42);
    }
  }

  // تنظيف العناصر القديمة
  if(frameCount % 90 === 0){
    items = items.filter(it => !it.taken && it.x > car.x - 1600);
  }

  // كشف الانقلاب
  const norm = Math.atan2(Math.sin(car.angle), Math.cos(car.angle));
  if(Math.abs(norm) > 2.0){
    flipTimer += dt;
    if(flipTimer > 0.85){ endGame('💥 تحطمت السيارة!'); return; }
  } else flipTimer = 0;

  // نفاد الوقود
  if(car.fuel <= 0){
    fuelOutTimer += dt;
    if(fuelOutTimer > 3 && Math.abs(car.vx) < 45){ endGame('⛽ نفد الوقود!'); return; }
    if(fuelOutTimer > 14){ endGame('⛽ نفد الوقود!'); return; }
  } else fuelOutTimer = 0;
}

function updateCamera(dt){
  if(!car) return;
  const k = 1 - Math.pow(0.0015, dt);
  camX = lerp(camX, car.x - W*0.32, k*0.85);
  camY = lerp(camY, car.y - H*0.56, k*0.85);
}

/* ============================================================
   بدء / إنهاء اللعبة
============================================================ */
function startGame(idx){
  const st = STAGES[idx];
  T = { seed:st.seed, baseY:st.baseY, hill:st.hill, rough:st.rough };
  save.stage = idx;

  car = makeCar();
  items = []; genX = 0; nextFuelX = 900;
  playStats = { coins:0, maxX:0 };
  flipTimer = 0; fuelOutTimer = 0;
  acc = 0;
  input.gas = false; input.brake = false;

  camX = car.x - W*0.32;
  camY = car.y - H*0.56;

  gameState = 'play';
  showScreen('hud');
  persist();
}

function endGame(reason){
  if(gameState !== 'play') return;
  gameState = 'over';
  input.gas = false; input.brake = false;

  const dist = Math.floor(playStats.maxX / 30);
  save.coins += playStats.coins;
  if(dist > save.best[save.stage]) save.best[save.stage] = dist;
  persist();

  document.getElementById('overTitle').textContent = reason;
  document.getElementById('overDist').textContent  = dist + ' م';
  document.getElementById('overCoins').textContent = playStats.coins + ' 🪙';
  document.getElementById('overBest').textContent  = save.best[save.stage] + ' م';

  refreshCoins();
  showScreen('over');
}

/* ============================================================
   الرسم
============================================================ */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1;

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width  = Math.floor(W*DPR);
  canvas.height = Math.floor(H*DPR);
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', ()=> setTimeout(resize, 120));
resize();

function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function drawParallax(st){
  const baseCam = st.baseY - H*0.56;
  for(let layer=0; layer<2; layer++){
    const sp = 0.22 + layer*0.22;
    const offX = camX * sp;
    const offY = (camY - baseCam) * sp * 0.6;
    ctx.beginPath();
    ctx.moveTo(-10, H+10);
    for(let sx=-10; sx<=W+10; sx+=18){
      const wx = sx + offX;
      let y = H*0.62 - offY;
      y += Math.sin(wx*0.0016 + layer*2.1) * 55;
      y += Math.sin(wx*0.00065 + layer*1.3) * 95;
      ctx.lineTo(sx, y);
    }
    ctx.lineTo(W+10, H+10);
    ctx.closePath();
    ctx.fillStyle = layer===0 ? st.far1 : st.far2;
    ctx.fill();
  }
  // غيوم
  ctx.fillStyle = st.cloud;
  ctx.globalAlpha = 0.55;
  for(let i=0;i<5;i++){
    const cx = ((i*340 - camX*0.12) % (W+420)) - 210;
    const cy = 60 + (i%3)*54 - (camY - baseCam)*0.15;
    ctx.beginPath();
    ctx.ellipse(cx, cy, 62, 22, 0, 0, Math.PI*2);
    ctx.ellipse(cx+40, cy-10, 46, 20, 0, 0, Math.PI*2);
    ctx.ellipse(cx-38, cy+4, 40, 16, 0, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

let terrainCache = [];
function drawTerrain(st){
  terrainCache.length = 0;
  const x0 = camX - 80, x1 = camX + W + 80;
  for(let x=x0; x<=x1; x+=8){
    terrainCache.push(x, terrainY(x));
  }

  // الجسم
  ctx.beginPath();
  ctx.moveTo(x0, camY + H + 400);
  for(let i=0;i<terrainCache.length;i+=2){
    ctx.lineTo(terrainCache[i], terrainCache[i+1]);
  }
  ctx.lineTo(x1, camY + H + 400);
  ctx.closePath();
  const g = ctx.createLinearGradient(0, camY, 0, camY + H*1.1);
  g.addColorStop(0, st.ground1);
  g.addColorStop(1, st.ground2);
  ctx.fillStyle = g;
  ctx.fill();

  // الحافة
  ctx.beginPath();
  for(let i=0;i<terrainCache.length;i+=2){
    const x = terrainCache[i], y = terrainCache[i+1];
    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  }
  ctx.strokeStyle = st.edge;
  ctx.lineWidth = 5;
  ctx.lineJoin = 'round';
  ctx.stroke();
}

function drawItems(){
  const t = performance.now()*0.004;
  for(const it of items){
    if(it.taken) continue;
    if(it.x < camX - 120 || it.x > camX + W + 120) continue;

    if(it.type === 'coin'){
      const sx = Math.abs(Math.cos(t + it.x*0.012))*0.62 + 0.38;
      ctx.save();
      ctx.translate(it.x, it.y + Math.sin(t*2 + it.x*0.01)*4);
      ctx.scale(sx, 1);
      ctx.beginPath(); ctx.arc(0,0,13,0,Math.PI*2);
      ctx.fillStyle = '#ffd54a'; ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = '#d99a00'; ctx.stroke();
      ctx.beginPath(); ctx.arc(0,0,6,0,Math.PI*2);
      ctx.fillStyle = '#ffe999'; ctx.fill();
      ctx.restore();
    } else {
      ctx.save();
      ctx.translate(it.x, it.y + Math.sin(t*2.4)*4);
      // علبة وقود
      roundRect(-12,-15,24,30,5);
      ctx.fillStyle = '#e63946'; ctx.fill();
      ctx.lineWidth = 2.5; ctx.strokeStyle = '#7d1622'; ctx.stroke();
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 15px sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('⛽', 0, 1);
      ctx.restore();
    }
  }
}

function drawCar(){
  const c = car;
  ctx.save();
  ctx.translate(c.x, c.y);
  ctx.rotate(c.angle);

  // ظل
  ctx.globalAlpha = 0.18;
  ctx.beginPath();
  ctx.ellipse(0, 26, 50, 9, 0, 0, Math.PI*2);
  ctx.fillStyle = '#000'; ctx.fill();
  ctx.globalAlpha = 1;

  // العجلات
  for(const w of c.wheels){
    ctx.save();
    ctx.translate(w.lx, w.ly);
    // الإطار
    ctx.beginPath(); ctx.arc(0,0,w.r,0,Math.PI*2);
    ctx.fillStyle = '#1c1f24'; ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = '#0c0e11'; ctx.stroke();
    // الجنط
    ctx.save();
    ctx.rotate(w.spin);
    ctx.beginPath(); ctx.arc(0,0,w.r*0.56,0,Math.PI*2);
    ctx.fillStyle = '#b9c2cc'; ctx.fill();
    ctx.strokeStyle = '#7d8794'; ctx.lineWidth = 2;
    for(let i=0;i<4;i++){
      const a = i*Math.PI/2;
      ctx.beginPath();
      ctx.moveTo(0,0);
      ctx.lineTo(Math.cos(a)*w.r*0.5, Math.sin(a)*w.r*0.5);
      ctx.stroke();
    }
    ctx.beginPath(); ctx.arc(0,0,w.r*0.17,0,Math.PI*2);
    ctx.fillStyle = '#59636f'; ctx.fill();
    ctx.restore();
    ctx.restore();
  }

  // الهيكل
  const bodyG = ctx.createLinearGradient(0,-20,0,16);
  bodyG.addColorStop(0,'#ff5a6a');
  bodyG.addColorStop(1,'#c22333');
  roundRect(-44,-16,88,31,9);
  ctx.fillStyle = bodyG; ctx.fill();
  ctx.lineWidth = 2; ctx.strokeStyle = '#7d1622'; ctx.stroke();

  // الكابينة
  ctx.beginPath();
  ctx.moveTo(-24,-15);
  ctx.lineTo(-14,-40);
  ctx.lineTo(15,-40);
  ctx.lineTo(26,-15);
  ctx.closePath();
  ctx.fillStyle = '#d63242'; ctx.fill();
  ctx.strokeStyle = '#7d1622'; ctx.lineWidth = 2; ctx.stroke();

  // الزجاج
  ctx.beginPath();
  ctx.moveTo(-19,-19);
  ctx.lineTo(-11,-35);
  ctx.lineTo(12,-35);
  ctx.lineTo(21,-19);
  ctx.closePath();
  ctx.fillStyle = '#8fd3ff'; ctx.fill();
  ctx.strokeStyle = '#4a90b8'; ctx.lineWidth = 1.6; ctx.stroke();

  // السائق
  ctx.beginPath(); ctx.arc(0,-27,6.5,0,Math.PI*2);
  ctx.fillStyle = '#ffd7a8'; ctx.fill();
  ctx.beginPath(); ctx.arc(0,-30,6.5,Math.PI,Math.PI*2);
  ctx.fillStyle = '#2b6fd6'; ctx.fill();

  // مصباح أمامي
  ctx.beginPath(); ctx.arc(41,-2,5,0,Math.PI*2);
  ctx.fillStyle = '#fff3a8'; ctx.fill();

  // عادم
  roundRect(-50,-6,7,10,3);
  ctx.fillStyle = '#5b6470'; ctx.fill();

  ctx.restore();
}

function draw(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const st = STAGES[save.stage];

  // السماء
  const sky = ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0, st.sky1);
  sky.addColorStop(1, st.sky2);
  ctx.fillStyle = sky;
  ctx.fillRect(0,0,W,H);

  drawParallax(st);

  ctx.save();
  ctx.translate(-camX, -camY);
  drawTerrain(st);
  drawItems();
  if(car) drawCar();
  ctx.restore();
}

/* ============================================================
   HUD
============================================================ */
let hudFuel = -1, hudCoins = -1, hudDist = -1;
function updateHUD(){
  if(gameState !== 'play' || !car) return;
  const pct = clamp(car.fuel / car.params.fuelMax, 0, 1);
  const pi = Math.round(pct*100);
  if(pi !== hudFuel){
    hudFuel = pi;
    const fill = document.getElementById('fuelFill');
    fill.style.width = pi + '%';
    fill.classList.toggle('low', pct < 0.25);
  }
  if(playStats.coins !== hudCoins){
    hudCoins = playStats.coins;
    document.getElementById('coinNum').textContent = hudCoins;
  }
  const d = Math.floor(playStats.maxX/30);
  if(d !== hudDist){
    hudDist = d;
    document.getElementById('distNum').textContent = d;
  }
}

/* ============================================================
   الحلقة الرئيسية
============================================================ */
let lastT = performance.now();
function loop(now){
  requestAnimationFrame(loop);
  let dt = (now - lastT)/1000;
  lastT = now;
  if(dt > 0.1) dt = 0.1;
  frameCount++;

  if(gameState === 'play' && car){
    acc += dt;
    let guard = 0;
    while(acc >= FIXED_DT && guard < 40){
      physicsStep(car, FIXED_DT, input);
      acc -= FIXED_DT;
      guard++;
    }
    updateGame(dt);
    updateCamera(dt);
    updateHUD();
  }

  draw();
}
requestAnimationFrame(loop);

/* ============================================================
   واجهة المستخدم
============================================================ */
function showScreen(name){
  document.querySelectorAll('.screen').forEach(el=>el.classList.add('hide'));
  const hud = document.getElementById('hud');
  if(name === 'hud'){ hud.classList.remove('hide'); }
  else {
    hud.classList.add('hide');
    if(name){
      const el = document.getElementById('scr-' + name);
      if(el) el.classList.remove('hide');
    }
  }
}

function refreshCoins(){
  const v = save.coins;
  ['menuCoins','garageCoins','stageCoins'].forEach(id=>{
    const el = document.getElementById(id);
    if(el) el.textContent = v;
  });
}

/* ---------- التطويرات ---------- */
const UPG_DEFS = [
  { key:'engine', name:'المحرك',      icon:'⚙️' },
  { key:'tires',  name:'الإطارات',    icon:'🛞' },
  { key:'susp',   name:'نظام التعليق', icon:'🪛' },
  { key:'tank',   name:'خزان الوقود', icon:'⛽' }
];
const MAX_LVL = 10;
function upgCost(level){ return Math.floor(120 * Math.pow(1.55, level-1)); }

function renderGarage(){
  const list = document.getElementById('upgList');
  list.innerHTML = '';
  for(const d of UPG_DEFS){
    const lvl = save.upg[d.key];
    const maxed = lvl >= MAX_LVL;
    const cost = upgCost(lvl);

    const row = document.createElement('div');
    row.className = 'upg';

    let bars = '';
    for(let i=1;i<=MAX_LVL;i++) bars += `<span class="${i<=lvl?'on':''}"></span>`;

    row.innerHTML = `
      <div class="upg-icon">${d.icon}</div>
      <div class="upg-info">
        <div class="upg-name"><span>${d.name}</span><span class="lvl">مستوى ${lvl}</span></div>
        <div class="bars">${bars}</div>
      </div>
      <button class="buy">${maxed ? 'مكتمل' : cost + ' 🪙'}</button>
    `;
    const btn = row.querySelector('.buy');
    if(maxed || save.coins < cost) btn.disabled = true;
    if(!maxed){
      btn.onclick = ()=>{
        if(save.coins >= cost && save.upg[d.key] < MAX_LVL){
          save.coins -= cost;
          save.upg[d.key]++;
          persist();
          refreshCoins();
          renderGarage();
        }
      };
    }
    list.appendChild(row);
  }
  refreshCoins();
}

/* ---------- المراحل ---------- */
function renderStages(){
  const list = document.getElementById('stageList');
  list.innerHTML = '';
  STAGES.forEach((st, i)=>{
    const unlocked = save.unlocked[i];
    const card = document.createElement('div');
    card.className = 'stage-card' + (unlocked ? (save.stage===i?' sel':'') : ' locked');
    const best = save.best[i] || 0;

    let tag;
    if(!unlocked) tag = `<span class="tag cost">${st.unlockCost} 🪙</span>`;
    else if(save.stage === i) tag = `<span class="tag free">مختارة</span>`;
    else tag = `<span class="tag lock">متاحة</span>`;

    card.innerHTML = `
      <div class="stage-emoji">${st.emoji}</div>
      <div class="stage-info">
        <div class="stage-name">${st.name}</div>
        <div class="stage-best">أفضل مسافة: ${best} م</div>
      </div>
      ${tag}
    `;

    card.onclick = ()=>{
      if(unlocked){
        save.stage = i;
        persist();
        renderStages();
      } else if(save.coins >= st.unlockCost){
        save.coins -= st.unlockCost;
        save.unlocked[i] = true;
        save.stage = i;
        persist();
        refreshCoins();
        renderStages();
      }
    };
    list.appendChild(card);
  });
  refreshCoins();
}

/* ---------- أزرار ---------- */
document.getElementById('btnPlay').onclick = ()=>{
  if(!save.unlocked[save.stage]) save.stage = 0;
  startGame(save.stage);
};
document.getElementById('btnGarage').onclick = ()=>{ renderGarage(); showScreen('garage'); };
document.getElementById('btnStages').onclick = ()=>{ renderStages(); showScreen('stages'); };
document.querySelectorAll('[data-back]').forEach(b=>{
  b.onclick = ()=> showScreen(b.dataset.back);
});

document.getElementById('btnPause').onclick = ()=>{
  if(gameState === 'play'){ gameState = 'paused'; showScreen('pause'); }
};
document.getElementById('btnResume').onclick = ()=>{
  if(gameState === 'paused'){ gameState = 'play'; lastT = performance.now(); showScreen('hud'); }
};
document.getElementById('btnQuit').onclick = ()=>{
  gameState = 'menu';
  car = null;
  showScreen('menu');
  refreshCoins();
};
document.getElementById('btnRetry').onclick = ()=> startGame(save.stage);
document.getElementById('btnHome').onclick = ()=>{
  gameState = 'menu';
  car = null;
  showScreen('menu');
  refreshCoins();
};

/* ---------- التحكم ---------- */
function bindPedal(id, key){
  const el = document.getElementById(id);
  const on = e=>{ e.preventDefault(); input[key] = true; el.classList.add('active'); };
  const off = e=>{ e.preventDefault(); input[key] = false; el.classList.remove('active'); };
  el.addEventListener('pointerdown', on);
  el.addEventListener('pointerup', off);
  el.addEventListener('pointercancel', off);
  el.addEventListener('pointerleave', off);
  el.addEventListener('contextmenu', e=>e.preventDefault());
}
bindPedal('pedalGas','gas');
bindPedal('pedalBrake','brake');

window.addEventListener('keydown', e=>{
  if(e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D' || e.key === ' '){
    input.gas = true; e.preventDefault();
  }
  if(e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A'){
    input.brake = true; e.preventDefault();
  }
});
window.addEventListener('keyup', e=>{
  if(e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D' || e.key === ' '){
    input.gas = false; e.preventDefault();
  }
  if(e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A'){
    input.brake = false; e.preventDefault();
  }
});

/* ---------- تهيئة أولية ---------- */
(function init(){
  const st = STAGES[save.stage] || STAGES[0];
  T = { seed:st.seed, baseY:st.baseY, hill:st.hill, rough:st.rough };
  camX = 120;
  camY = st.baseY - H*0.56;
  genX = 0; nextFuelX = 900;
  refreshCoins();
  showScreen('menu');
})();

// منع التكبير باللمس المزدوج
document.addEventListener('gesturestart', e=>e.preventDefault());
</script>
