<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CEVAN</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap">
<style>
:root{color-scheme:dark;--bg:#070b09;--side:#0d1311cc;--card:#141c18;--card2:#1b2620;--text:#ebf4ef;--muted:#8a9b92;--brand:#10b981;--brand2:#34d399;--bd:var(--bd);--border:#22302a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:Cairo,system-ui,Tahoma,sans-serif;overflow:hidden}
body::before,body::after{content:"";position:fixed;width:60vmax;height:60vmax;border-radius:50%;filter:blur(90px);opacity:.16;z-index:0;pointer-events:none;animation:float 18s ease-in-out infinite alternate}
body::before{background:var(--brand);top:-30vmax;inset-inline-end:-20vmax}
body::after{background:var(--bd);bottom:-35vmax;inset-inline-start:-25vmax;animation-delay:-9s}
@keyframes float{to{transform:translate(6vmax,5vmax) scale(1.15)}}
button,textarea,input,select{font:inherit;color:inherit}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
#app{display:flex;height:100%;position:relative;z-index:1}
#side{width:285px;background:var(--side);backdrop-filter:blur(16px);border-inline-end:1px solid var(--border);display:flex;flex-direction:column;padding:14px;gap:12px;z-index:6}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:4px;font-size:20px;background:linear-gradient(90deg,var(--brand2),#fff);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand svg.lg{filter:drop-shadow(0 0 8px #10b98166)}
.btn{display:flex;align-items:center;gap:10px;border:1px solid var(--border);background:var(--card);border-radius:14px;padding:11px 14px;cursor:pointer;transition:.2s}
.btn:hover{border-color:var(--brand);transform:translateY(-1px)}
.btn.p{background:linear-gradient(135deg,var(--brand),var(--bd));border:0;color:#03130c;font-weight:700;box-shadow:0 6px 20px #10b98133}
.btn.p:hover{box-shadow:0 8px 26px #10b98155}
#hist{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:4px}
.h{display:flex;align-items:center;gap:8px;border-radius:12px;padding:9px 10px;cursor:pointer;font-size:14px;color:var(--muted);transition:.2s;animation:in .35s both}
.h span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.h.on,.h:hover{background:var(--card2);color:var(--text)}
.h .x{opacity:0;transition:.2s;border:0;background:none;cursor:pointer;color:var(--muted);padding:2px}
.h:hover .x{opacity:1}.h .x:hover{color:#f87171}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#top{display:none;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--border);background:var(--side);backdrop-filter:blur(16px)}
#msgs{flex:1;overflow-y:auto;padding:20px 16px;display:flex;flex-direction:column;gap:16px;scroll-behavior:smooth}
.row{display:flex;gap:10px;max-width:820px;width:100%;margin:0 auto;animation:in .4s both}
.row.u{justify-content:flex-start}
.av{width:34px;height:34px;border-radius:12px;background:var(--card2);border:1px solid var(--border);display:grid;place-items:center;flex:none}
.m{padding:11px 15px;border-radius:18px;line-height:1.85;max-width:calc(100% - 46px);word-wrap:break-word;min-width:0}
.u .m{background:linear-gradient(135deg,var(--brand),var(--bd));color:#03130c;border-end-start-radius:6px}
.b .m{background:var(--card);border:1px solid var(--border);border-end-end-radius:6px}
.m p{margin:0;white-space:pre-wrap}
.m img{max-width:200px;max-height:160px;border-radius:12px;display:block;margin-bottom:6px}
pre{direction:ltr;text-align:left;background:#050807;border:1px solid var(--border);border-radius:12px;padding:12px;overflow-x:auto;margin:8px 0;font-size:13px;position:relative}
pre button{position:absolute;top:6px;right:6px;display:flex;background:var(--card2);border:1px solid var(--border);border-radius:8px;cursor:pointer;padding:4px;color:var(--muted)}
.act button{background:none;border:0;cursor:pointer;color:var(--muted);padding:4px;margin-top:4px;transition:.2s}.act button:hover{color:var(--brand2)}
.dots{display:inline-flex;gap:5px;padding:6px 0}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--brand2);animation:bl 1.2s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,80%,100%{transform:scale(.5);opacity:.4}40%{transform:scale(1);opacity:1}}
.hero{margin:auto;text-align:center;color:var(--muted);padding:20px;animation:in .6s both}
.hero .lgw{display:inline-block;animation:spin 40s linear infinite;filter:drop-shadow(0 0 24px #10b98155)}
@keyframes spin{to{transform:rotate(360deg)}}
.hero h2{font-size:34px;letter-spacing:9px;margin:10px 0 0;background:linear-gradient(90deg,var(--brand2),#fff,var(--brand2));background-size:200%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 5s linear infinite}
@keyframes sh{to{background-position:200%}}
.hero h3{color:var(--text);font-weight:600;margin:14px 0 4px}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:22px;max-width:480px;margin-inline:auto}
.cards button{display:flex;align-items:center;gap:10px;text-align:start;border:1px solid var(--border);background:var(--card);border-radius:14px;padding:12px;cursor:pointer;font-size:14px;transition:.25s;animation:in .5s both}
.cards button:hover{border-color:var(--brand);transform:translateY(-3px);background:var(--card2)}
.cards svg{color:var(--brand2)}
.pop{animation:pop 1s ease-out both}
@keyframes pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
.tabs{display:flex;gap:6px;overflow-x:auto;justify-content:center;padding:6px 16px 0}
.tabs button{display:flex;align-items:center;gap:6px;white-space:nowrap;border:1px solid var(--border);background:none;border-radius:20px;padding:5px 13px;cursor:pointer;font-size:13px;color:var(--muted);transition:.25s}
.tabs button svg{width:16px;height:16px}
.tabs button:hover{color:var(--text)}
.tabs button.on{background:var(--brand);border-color:var(--brand);color:#03130c;font-weight:700}
#bar{padding:8px 16px 16px;position:relative}
#att{max-width:820px;margin:0 auto 8px;display:flex;gap:8px;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:6px;background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:4px 8px;font-size:13px;animation:pop .3s both}
.chip img{width:34px;height:34px;object-fit:cover;border-radius:8px}
.chip button{border:0;background:none;cursor:pointer;color:var(--muted);display:flex}
#box{max-width:820px;margin:0 auto;display:flex;align-items:flex-end;gap:4px;background:var(--card);border:1px solid var(--border);border-radius:24px;padding:6px 8px;transition:.25s;position:relative}
#box:focus-within{border-color:var(--brand);box-shadow:0 0 0 4px #10b98122}
textarea{flex:1;resize:none;background:none;border:0;outline:0;padding:9px 6px;max-height:140px}
.ic{width:40px;height:40px;border-radius:50%;border:0;background:none;cursor:pointer;display:grid;place-items:center;color:var(--muted);transition:.2s;flex:none}
.ic:hover{background:var(--card2);color:var(--text)}
.ic.on{background:#7f1d1d;color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px #ef444422}}
#send{background:linear-gradient(135deg,var(--brand),var(--bd));color:#03130c}
#send:hover{transform:scale(1.08)}#send:disabled{opacity:.35;transform:none}
#menuA{position:absolute;bottom:62px;inset-inline-start:8px;background:var(--card2);border:1px solid var(--border);border-radius:16px;padding:6px;display:none;min-width:190px;box-shadow:0 12px 40px #000a;z-index:4}
#menuA.open{display:block;animation:pop .2s both}
#menuA button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:10px 12px;border-radius:10px;cursor:pointer;text-align:start}
#menuA button:hover{background:var(--card)}#menuA svg{color:var(--brand2)}
dialog{background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:20px;width:min(380px,92vw);padding:20px}
dialog[open]{animation:pop .25s both}
dialog::backdrop{background:#000a;backdrop-filter:blur(4px)}
dialog h3{margin:0 0 6px;display:flex;align-items:center;gap:8px}
dialog label.l{display:block;margin:14px 0 5px;color:var(--muted);font-size:14px}
dialog input[type=text],dialog select{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:10px;outline:0}
dialog input:focus,dialog select:focus{border-color:var(--brand)}
.sw{display:flex;align-items:center;gap:8px;margin:14px 0 18px;cursor:pointer}
.sw input{accent-color:var(--brand);width:18px;height:18px}
#gate{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:radial-gradient(circle at 50% 25%,#10382a,#050806 70%);transition:opacity .7s,visibility .7s,transform .7s;padding:20px}
#gate.out{opacity:0;visibility:hidden;transform:scale(1.06)}
#gate::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,transparent 0 60px,#10b98108 60px 61px);animation:slide 20s linear infinite}
@keyframes slide{to{background-position:600px 0}}
.gc{position:relative;width:min(390px,100%);text-align:center;padding:32px 24px 24px;border:1px solid var(--border);border-radius:30px;background:#0d1311bb;backdrop-filter:blur(20px);box-shadow:0 30px 80px #000a,0 0 0 1px #10b9811a;animation:in .9s both}
.gc h1{margin:8px 0 0;font-size:36px;letter-spacing:11px;background:linear-gradient(90deg,var(--brand2),#fff,var(--brand2));background-size:200%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 5s linear infinite}
.gc .tg{min-height:1.7em;color:var(--muted);margin:6px 0 20px}
.gc .tg::after{content:"|";animation:bl2 .8s steps(1) infinite;color:var(--brand2)}
@keyframes bl2{50%{opacity:0}}
.gc input{width:100%;background:#050807;border:1px solid var(--border);border-radius:14px;padding:13px 14px;outline:0;text-align:center;transition:.2s}
.gc input:focus{border-color:var(--brand);box-shadow:0 0 0 4px #10b98122}
.gc .btn{width:100%;justify-content:center;margin-top:12px}
.link{background:none;border:0;color:var(--muted);cursor:pointer;margin:12px 6px 0;font-size:13px}.link:hover{color:var(--brand2)}
.gl{display:inline-block;animation:spin 40s linear infinite;filter:drop-shadow(0 0 28px #10b98166)}
.sws{display:flex;gap:10px}.sws button{width:30px;height:30px;border-radius:50%;border:2px solid transparent;cursor:pointer;transition:.2s}.sws button.on{border-color:#fff;transform:scale(1.15)}
.row2{display:flex;gap:8px;margin-bottom:14px}.row2 .btn{flex:1;justify-content:center;font-size:14px;padding:9px}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:var(--border);border-radius:6px}
@media(max-width:800px){
#side{position:fixed;inset-block:0;inset-inline-start:0;transition:transform .3s;background:#0d1311}
[dir=rtl] #side{transform:translateX(100%)}[dir=ltr] #side{transform:translateX(-100%)}
#side.open{transform:none!important;box-shadow:0 0 0 100vmax rgba(0,0,0,.6)}
#top{display:flex}.cards{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

document.documentElement.lang=S.lang;document.documentElement.dir=S.lang==='ar'?'rtl':'ltr';
const x=tr();$('new').innerHTML=ic('plus')+'<span>'+x.nw+'</span>';$('setb').innerHTML=ic('set')+'<span>'+x.set+'</span>';$('t').placeholder=x.ph;
$('dt').innerHTML=ic('set')+x.set;$('l1').textContent=x.nm;$('l2').textContent=x.lg;$('l3').textContent=x.sp;$('ok').textContent=x.ok;$('l4').textContent=x.ac;$('ex').innerHTML=ic('file')+'<span>'+x.ex+'</span>';$('out').innerHTML=ic('x')+'<span>'+x.out+'</span>';
$('pf').lastChild.textContent=x.file;$('pi').lastChild.textContent=x.studio;$('pi').hidden=!canImg;
$('tabs').innerHTML='';x.modes.forEach((m,i)=>{const b=document.createElement('button');b.innerHTML=ic(MN[i])+'<span>'+m+'</span>';b.className=i===mode?'on':'';b.onclick=()=>{mode=i;ui()};$('tabs').appendChild(b)});
hist();
}
function hist(){
$('hist').innerHTML='';
chats.slice().reverse().forEach(c=>{
const d=document.createElement('div');d.className='h'+(c===cur?' on':'');
d.innerHTML=ic('chat');const s=document.createElement('span');s.textContent=c.title;d.appendChild(s);
const x=document.createElement('button');x.className='x';x.innerHTML=ic('x');x.onclick=e=>{e.stopPropagation();chats=chats.filter(k=>k!==c);if(cur===c)cur=null;sv('cevan:c',chats);ui();show()};
d.appendChild(x);d.onclick=()=>{cur=c;side.classList.remove('open');ui();show()};$('hist').appendChild(d)});
}
function rich(el,text){
el.textContent='';
text.split('```').forEach((p,i)=>{
if(i%2){const nl=p.indexOf('\n');const code=nl>-1?p.slice(nl+1):p;const pre=document.createElement('pre');pre.textContent=code.replace(/\n$/,'');
const b=document.createElement('button');b.innerHTML=ic('copy');b.onclick=()=>{try{navigator.clipboard.writeText(code)}catch(e){}};pre.appendChild(b);el.appendChild(pre)}
else if(p.trim()){const q=document.createElement('p');q.textContent=p.trim();el.appendChild(q)}});
}
function bubble(role,text,imgs){
const r=document.createElement('div');r.className='row '+(role==='user'?'u':'b');
if(role!=='user')r.innerHTML='<div class="av">'+logo(20)+'</div>';
const m=document.createElement('div');m.className='m';const body=document.createElement('div');m.appendChild(body);
if(role==='user'){(imgs||[]).forEach(u=>{const im=document.createElement('img');im.src=u;body.appendChild(im)});const p=document.createElement('p');p.textContent=text;body.appendChild(p)}
else{if(text==='...')body.innerHTML='<span class="dots"><i></i><i></i><i></i></span>';else rich(body,text);
const a=document.createElement('div');a.className='act';const s=document.createElement('button');s.innerHTML=ic('spk');s.onclick=()=>speak(body.innerText);a.appendChild(s);m.appendChild(a)}
r.appendChild(m);$('msgs').appendChild(r);$('msgs').scrollTop=$('msgs').scrollHeight;return body;
}
function show(){
const m=$('msgs');m.innerHTML='';
if(!cur||!cur.msgs.length){
m.innerHTML='<div class="hero"><span class="lgw">'+logo(96,1)+'</span><h2>CEVAN</h2><h3></h3><div></div><div class="cards"></div></div>';
m.querySelector('h3').textContent=(S.name?tr().hello+S.name+' — ':'')+tr().hi;m.querySelector('.hero>div').textContent=tr().tag;
tr().sug.map((s,i)=>[s,i]).sort(()=>Math.random()-.5).slice(0,4).forEach(([s,k],i)=>{const b=document.createElement('button');b.style.animationDelay=(.3+i*.1)+'s';b.innerHTML=ic(SN[k])+'<span></span>';b.lastChild.textContent=s;b.onclick=()=>{$('t').value=s;go()};m.querySelector('.cards').appendChild(b)});return}
cur.msgs.forEach(x=>bubble(x.role,x.shown||x.content));
}
function speak(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang=S.lang==='ar'?'ar-SA':'en-US';speechSynthesis.speak(u)}catch(e){}}
function chips(){
$('att').innerHTML='';
const add=(h,fn)=>{const c=document.createElement('div');c.className='chip';c.innerHTML=h;const b=document.createElement('button');b.innerHTML=ic('x');b.onclick=fn;c.appendChild(b);$('att').appendChild(c)};
if(attF)add(ic('file')+'<span>'+attF.name.replace(/</g,'')+'</span>',()=>{attF=null;chips()});
attI.forEach((f,i)=>add('<img src="'+URL.createObjectURL(f)+'">',()=>{attI.splice(i,1);chips()}));
}
async function go(){
const v=$('t').value.trim();if((!v&&!attF&&!attI.length)||busy)return;
busy=true;$('send').disabled=true;
let content=v;if(attF)content='['+attF.name+']\n'+attF.text+'\n\n'+v;
const imgs=attI.slice(),urls=imgs.map(f=>URL.createObjectURL(f));
const shown=(attF?'['+attF.name+'] ':'')+(imgs.length?'['+imgs.length+' image] ':'')+v;
attF=null;attI=[];chips();$('t').value='';
if(!cur){cur={id:Date.now(),title:(v||shown).slice(0,32),msgs:[]};chats.push(cur)}
if(!cur.msgs.length)$('msgs').innerHTML='';
cur.msgs.push({role:'user',content:content||'(image)',shown:shown});bubble('user',attF?shown:(v||shown),urls);
const out=bubble('assistant','...');
try{
if(!sample)sample=await window.claude?.use('sample');
if(!sample)throw{code:'none'};
const sys=MI[mode]+' Reply in the same language as the user (default '+(S.lang==='ar'?'Arabic':'English')+'). Your name is CEVAN.\n\n';
const input=cur.msgs.map((x,i)=>({role:x.role,content:i===0?sys+x.content:x.content}));
const o={cache:false,onText:({text})=>{rich(out,text);$('msgs').scrollTop=$('msgs').scrollHeight}};
if(imgs.length)o.images=imgs;
const r=await sample(input,o);
rich(out,r.text);cur.msgs.push({role:'assistant',content:r.text});sv('cevan:c',chats.map(c=>({id:c.id,title:c.title,msgs:c.msgs.map(m=>({role:m.role,content:m.content.slice(0,6000),shown:m.shown&&m.shown.slice(0,300)}))})));hist();
if(S.spk)speak(r.text);
}catch(e){out.textContent=e&&e.code==='none'?tr().na:tr().err;cur.msgs.pop()}
busy=false;$('send').disabled=false;
}
$('send').onclick=go;
$('t').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();go()}};
$('new').onclick=()=>{cur=null;side.classList.remove('open');ui();show()};
$('menu').onclick=()=>side.classList.toggle('open');
$('clip').onclick=e=>{e.stopPropagation();$('menuA').classList.toggle('open')};
document.addEventListener('click',()=>$('menuA').classList.remove('open'));
$('pf').onclick=()=>$('file').click();$('pi').onclick=()=>$('img').click();
$('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;attF={name:f.name,text:(await f.text()).slice(0,20000)};chips();e.target.value=''};
$('img').onchange=e=>{attI.push(...[...e.target.files].slice(0,4));chips();e.target.value=''};
$('setb').onclick=()=>{$('nm').value=S.name;$('lang').value=S.lang;$('spk').checked=S.spk;side.classList.remove('open');$('dlg').showModal()};
$('gb').onclick=()=>enter($('gn').value.trim());$('gn').onkeydown=e=>{if(e.key==='Enter')enter($('gn').value.trim())};$('gg').onclick=()=>enter('');
$('gx').onclick=()=>{S.lang=S.lang==='ar'?'en':'ar';sv('cevan:s',S);ui();gate()};
$('out').onclick=()=>{S.in=false;S.name='';sv('cevan:s',S);$('dlg').close();cur=null;$('gn').value='';ui();show();$('gate').classList.remove('out');gate()};
$('ex').onclick=async()=>{if(!cur||!cur.msgs.length)return;try{const d=await window.claude?.use('downloads');if(d)await d.save({filename:'cevan-chat.txt',data:cur.msgs.map(m=>(m.role==='user'?'> ':'CEVAN: ')+(m.shown||m.content)).join('\n\n')})}catch(e){}};
$('ok').onclick=()=>{Object.assign(S,{lang:$('lang').value,name:$('nm').value.trim(),spk:$('spk').checked});sv('cevan:s',S);$('dlg').close();ui();if(!cur)show()};
(async()=>{try{dict=await window.claude?.use('dictation')}catch(e){}
if(dict){$('mic').hidden=false;
dict.onFinal(({text})=>{$('t').value+=(($('t').value?' ':'')+text)});
dict.onState(({state})=>$('mic').classList.toggle('on',state==='listening'));
$('mic').onclick=()=>{try{dict.start().catch(()=>{})}catch(e){}}}
try{const s=await window.claude?.use('sample');if(s){canImg=!!(await s.limits()).images;ui()}}catch(e){}})();
ui();show();if(S.in)$('gate').classList.add('out');else gate();
</script>
</body>
</html>
