<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <link rel="icon" type="image/png" href="logo1.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEN AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Cairo', sans-serif; background: #000000; color: #f0f4ff; min-height: 100vh; overflow-x: hidden; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #000000; }
        ::-webkit-scrollbar-thumb { background: linear-gradient(180deg, #021ca4, #1a3a9e); border-radius: 12px; }
        .bg-ambient {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2;
            background: radial-gradient(ellipse at 20% 30%, rgba(2, 28, 164, 0.15) 0%, transparent 55%),
                        radial-gradient(ellipse at 80% 70%, rgba(26, 58, 158, 0.10) 0%, transparent 50%),
                        radial-gradient(ellipse at 50% 50%, #000000 0%, #000000 100%);
            animation: ambientFloat 20s ease-in-out infinite alternate;
        }
        @keyframes ambientFloat { 0% { transform: scale(1) rotate(0deg); } 100% { transform: scale(1.05) rotate(2deg); } }
        .container { width: 92%; max-width: 1100px; margin: 0 auto; padding: 0 18px; }
        :root {
            --blue-deep: #021ca4; --blue-mid: #1a3a9e; --blue-light: #4a7aff;
            --card-bg: rgba(10, 16, 32, 0.85); --card-border: rgba(2, 28, 164, 0.25);
            --radius-xl: 24px; --radius-2xl: 40px;
        }
        header {
            background: rgba(0, 0, 0, 0.92); backdrop-filter: blur(24px);
            border-bottom: 1px solid rgba(2, 28, 164, 0.10);
            padding: 12px 0; position: sticky; top: 0; z-index: 1000;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.8);
        }
        .header-content { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 14px; }

        /* ═══ Logo ═══ */
        .logo { display: flex; align-items: center; gap: 12px; }
        .logo img { height: 44px; filter: brightness(0) invert(1) drop-shadow(0 0 10px rgba(74,122,255,.3)); }
        .logo h1 {
            font-size: 1.6rem; font-weight: 900;
            background: linear-gradient(135deg, #ffffff 40%, var(--blue-light));
            -webkit-background-clip: text; background-clip: text; color: transparent;
        }
        .logo h1 i { color: var(--blue-light); margin-left: 6px; font-size: 1.3rem; }

        /* ═══ زر الدخول / صورة البروفايل ═══ */
        .header-right { display: flex; align-items: center; gap: 10px; }
        .btn-login {
            display: inline-flex; align-items: center; gap: 8px;
            background: linear-gradient(135deg, var(--blue-deep), var(--blue-mid));
            border: 1px solid rgba(74, 122, 255, 0.25);
            border-radius: 40px; padding: 0 22px; height: 44px;
            color: #fff; font-family: 'Cairo', sans-serif;
            font-weight: 700; font-size: 0.95rem; cursor: pointer;
            transition: 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 6px 24px -8px rgba(2, 28, 164, 0.6);
        }
        .btn-login:hover {
            transform: translateY(-2px) scale(1.03);
            box-shadow: 0 10px 32px -8px rgba(74, 122, 255, 0.7);
        }
        .btn-login i { font-size: 1.05rem; }

        .btn-profile {
            display: flex; align-items: center; gap: 10px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(74, 122, 255, 0.2);
            border-radius: 40px; padding: 4px 16px 4px 4px; height: 44px;
            cursor: pointer; transition: 0.3s;
            font-family: 'Cairo', sans-serif;
        }
        .btn-profile:hover {
            background: rgba(74, 122, 255, 0.1);
            border-color: var(--blue-light);
            transform: translateY(-1px);
        }
        .btn-profile img {
            width: 36px; height: 36px; border-radius: 50%;
            border: 2px solid rgba(74, 122, 255, 0.5);
            object-fit: cover;
        }
        .btn-profile .p-name {
            color: #d0dcf5; font-weight: 700; font-size: 0.88rem;
            max-width: 110px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .btn-profile .p-dot {
            width: 8px; height: 8px; border-radius: 50%; background: #4ade80;
            box-shadow: 0 0 8px #4ade80;
        }
        @media (max-width: 600px) {
            .btn-profile .p-name { display: none; }
            .btn-profile { padding: 4px; }
        }

        /* ═══ Sidebar ═══ */
        .side-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,.6);
            backdrop-filter: blur(4px); z-index: 1400;
            opacity: 0; pointer-events: none; transition: opacity .3s;
        }
        .side-overlay.show { opacity: 1; pointer-events: auto; }
        .side-menu {
            position: fixed; top: 0; right: -360px; width: 340px; height: 100vh;
            background: linear-gradient(180deg, rgba(6,10,24,.98), rgba(4,6,15,.99));
            border-left: 1px solid rgba(74,122,255,.15);
            z-index: 1500; transition: right .4s cubic-bezier(.16,1,.3,1);
            display: flex; flex-direction: column;
            backdrop-filter: blur(20px);
            box-shadow: -30px 0 80px -20px rgba(0,0,0,.9);
        }
        .side-menu.open { right: 0; }
        .side-head {
            padding: 26px 22px 20px;
            border-bottom: 1px solid rgba(74,122,255,.1);
            display: flex; flex-direction: column; align-items: center;
            text-align: center; gap: 12px;
            background: linear-gradient(180deg, rgba(37,99,235,.1), transparent);
        }
        .side-head img {
            width: 80px; height: 80px; border-radius: 50%;
            border: 3px solid #4a7aff;
            box-shadow: 0 0 0 6px rgba(74,122,255,.15), 0 12px 36px -10px rgba(74,122,255,.8);
            object-fit: cover;
        }
        .side-head .s-name { color: #fff; font-weight: 800; font-size: 1.1rem; }
        .side-head .s-email { color: #8a92b0; font-size: .78rem; font-weight: 600; word-break: break-all; }
        .side-head .s-badge {
            display: inline-flex; align-items: center; gap: 6px;
            background: rgba(74,122,255,.12); border: 1px solid rgba(74,122,255,.25);
            color: #60a5fa; font-size: .7rem; font-weight: 800;
            padding: 4px 12px; border-radius: 20px;
        }
        .side-close {
            position: absolute; top: 14px; left: 14px;
            width: 34px; height: 34px; border-radius: 50%;
            background: rgba(74,122,255,.1); border: 1px solid rgba(74,122,255,.2);
            color: #8a92b0; cursor: pointer; transition: all .3s;
            display: flex; align-items: center; justify-content: center; font-size: .8rem;
        }
        .side-close:hover { background: rgba(220,38,38,.15); color: #f87171; transform: rotate(180deg); }
        .side-body { flex: 1; overflow-y: auto; padding: 16px 12px; }
        .side-body::-webkit-scrollbar { width: 4px; }
        .side-body::-webkit-scrollbar-thumb { background: rgba(74,122,255,.3); border-radius: 4px; }
        .side-item {
            display: flex; align-items: center; gap: 14px;
            padding: 14px 18px; border-radius: 14px;
            color: #c0ccf0; font-family: 'Cairo', sans-serif;
            font-weight: 700; font-size: .92rem;
            cursor: pointer; transition: all .3s; border: none;
            background: transparent; width: 100%; text-align: right;
            margin-bottom: 4px;
        }
        .side-item i {
            font-size: 1.1rem; width: 40px; height: 40px;
            border-radius: 12px; background: rgba(74,122,255,.1);
            color: #4a7aff; display: flex; align-items: center;
            justify-content: center; flex-shrink: 0;
            transition: all .3s;
        }
        .side-item:hover { background: rgba(74,122,255,.08); color: #fff; }
        .side-item:hover i { background: rgba(74,122,255,.2); color: #60a5fa; transform: scale(1.08); }
        .side-item.danger { color: #f87171; }
        .side-item.danger i { background: rgba(220,38,38,.1); color: #f87171; }
        .side-item.danger:hover { background: rgba(220,38,38,.08); }
        .side-item.danger:hover i { background: rgba(220,38,38,.2); }
        .side-divider { height: 1px; background: rgba(74,122,255,.1); margin: 8px 14px; }
        .side-foot {
            padding: 14px 20px; border-top: 1px solid rgba(74,122,255,.1);
            color: #4a5070; font-size: .72rem; text-align: center; font-weight: 600;
        }
        @media (max-width: 480px) {
            .side-menu { width: 88vw; right: -88vw; }
        }

        /* ═══ Chat ═══ */
        .chat-wrapper {
            margin: 20px 0;
            background: var(--card-bg); backdrop-filter: blur(24px);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-2xl); overflow: hidden;
            display: flex; flex-direction: column;
            height: calc(100vh - 160px); min-height: 500px;
        }
        .chat-header {
            padding: 18px 24px;
            border-bottom: 1px solid rgba(2, 28, 164, 0.1);
            display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
            background: rgba(0, 0, 0, 0.4);
        }
        .chat-header .bot-info { display: flex; align-items: center; gap: 14px; }
        .chat-header .bot-avatar {
            width: 44px; height: 44px; border-radius: 50%;
            background: linear-gradient(135deg, var(--blue-deep), var(--blue-light));
            display: flex; align-items: center; justify-content: center;
            font-size: 1.6rem; color: #fff;
            box-shadow: 0 0 30px rgba(74, 122, 255, 0.2);
        }
        .chat-header .bot-name { font-weight: 700; font-size: 1.2rem; color: #fff; }
        .messages-area {
            flex: 1; padding: 20px 24px; overflow-y: auto;
            display: flex; flex-direction: column; gap: 12px;
            background: rgba(0, 0, 0, 0.3);
        }
        .messages-area::-webkit-scrollbar { width: 4px; }
        .messages-area::-webkit-scrollbar-thumb { background: var(--blue-deep); border-radius: 12px; }
        .message {
            max-width: 85%; padding: 14px 20px;
            border-radius: var(--radius-xl);
            animation: fadeUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            word-wrap: break-word; line-height: 1.7;
            position: relative; transition: 0.2s;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .message.user {
            align-self: flex-end;
            background: rgba(74, 122, 255, 0.2);
            border: 1px solid rgba(74, 122, 255, 0.15);
            border-bottom-left-radius: 6px;
        }
        .message.bot {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(2, 28, 164, 0.08);
            border-bottom-right-radius: 6px;
        }
        .message .msg-time { font-size: 0.65rem; color: #6a708a; margin-top: 6px; display: block; text-align: left; }
        .message.user .msg-time { text-align: right; }
        .message.bot .bot-actions {
            display: flex; gap: 8px; margin-top: 8px;
            justify-content: flex-start; opacity: 0; transition: 0.3s;
        }
        .message.bot:hover .bot-actions { opacity: 1; }
        .message.bot .bot-actions button {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(74, 122, 255, 0.15);
            border-radius: 30px; padding: 4px 14px;
            color: #b0c4e8; font-size: 0.8rem; cursor: pointer;
            font-family: 'Cairo', sans-serif;
            display: inline-flex; align-items: center; gap: 6px;
        }
        .message.bot .bot-actions button:hover { background: rgba(74, 122, 255, 0.12); color: #fff; }
        .products-row-wrapper { width: 100%; overflow-x: auto; padding: 6px 0 12px 0; margin: 4px 0; }
        .products-row { display: flex; flex-wrap: nowrap; gap: 18px; width: max-content; min-width: 100%; }
        .products-row .men-product-card { min-width: 260px; max-width: 280px; flex: 0 0 auto; margin: 0; }
        .products-row .men-product-card .product-image { height: 160px; }
        .products-row .men-product-card .product-content { padding: 14px 16px 16px; }
        .products-row .men-product-card .product-content h2 { font-size: 1.2rem; margin: 8px 0 4px; }
        .products-row .men-product-card .price { font-size: 1.2rem; }
        .products-row .men-product-card .btn-product { padding: 6px 14px; font-size: 0.75rem; }
        .welcome-animation { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; width: 100%; }
        .welcome-main { display: flex; flex-wrap: wrap; gap: 4px; font-size: 2.4rem; font-weight: 900; margin-bottom: 4px; }
        .welcome-main .letter {
            display: inline-block;
            background: linear-gradient(135deg, #ffffff 20%, var(--blue-light));
            -webkit-background-clip: text; background-clip: text; color: transparent;
            animation: bounceGlow 1.8s ease-in-out infinite alternate;
        }
        @keyframes bounceGlow {
            0% { transform: translateY(0px) scale(1); }
            100% { transform: translateY(-12px) scale(1.08); }
        }
        .typewriter-container { font-size: 1.4rem; font-weight: 700; display: flex; align-items: center; gap: 2px; min-height: 2.8rem; direction: rtl; }
        .typewriter-text { display: inline; color: #c0ccf0; }
        .typewriter-text .highlight { background: linear-gradient(135deg, var(--blue-light), #a0c0ff); -webkit-background-clip: text; background-clip: text; color: transparent; font-weight: 900; }
        .typewriter-cursor { display: inline-block; width: 3px; height: 1.8rem; background: var(--blue-light); margin-right: 4px; animation: blinkCursor 0.7s step-end infinite; vertical-align: middle; }
        @keyframes blinkCursor { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
        .welcome-desc { font-size: 0.95rem; color: #8a9abb; margin-top: 6px; display: flex; align-items: center; gap: 8px; opacity: 0; animation: fadeInUp 1s ease-out 1.8s forwards; }
        .welcome-desc i { color: var(--blue-light); animation: spinSlow 4s linear infinite; }
        @keyframes spinSlow { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .typing-indicator {
            align-self: flex-start; display: none;
            padding: 10px 20px; background: rgba(255, 255, 255, 0.05);
            border-radius: var(--radius-xl); border-bottom-right-radius: 6px;
            border: 1px solid rgba(2, 28, 164, 0.08);
            gap: 10px; align-items: center; color: #a0b0d4; font-size: 0.95rem;
        }
        .typing-indicator .dots { display: flex; gap: 5px; }
        .typing-indicator .dots span {
            width: 8px; height: 8px; border-radius: 50%;
            background: var(--blue-light); display: inline-block;
            animation: typingBounce 1.4s ease-in-out infinite;
        }
        .typing-indicator .dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator .dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typingBounce { 0%, 60%, 100% { transform: translateY(0); opacity: 0.4; } 30% { transform: translateY(-10px); opacity: 1; } }
        .suggested-questions { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 20px 4px 20px; background: rgba(0, 0, 0, 0.25); border-top: 1px solid rgba(2, 28, 164, 0.08); }
        .suggested-questions.hidden { display: none; }
        .suggested-questions .sq-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(74, 122, 255, 0.15);
            border-radius: 30px; padding: 8px 18px;
            font-family: 'Cairo', sans-serif; font-size: 0.85rem;
            color: #b0c4e8; cursor: pointer; white-space: nowrap;
            display: inline-flex; align-items: center; gap: 6px;
        }
        .suggested-questions .sq-btn:hover { background: rgba(74, 122, 255, 0.08); color: #fff; }
        .input-area {
            padding: 12px 20px 16px;
            border-top: 1px solid rgba(2, 28, 164, 0.08);
            display: flex; align-items: flex-end; gap: 8px;
            background: rgba(0, 0, 0, 0.4); flex-wrap: wrap; position: relative;
        }
        .input-area .input-wrapper {
            flex: 1; min-width: 150px; display: flex; align-items: flex-end;
            background: rgba(255, 255, 255, 0.03);
            border-radius: var(--radius-xl);
            border: 1.5px solid rgba(2, 28, 164, 0.1);
            padding: 4px 16px 4px 8px; min-height: 52px;
        }
        .input-area .input-wrapper:focus-within { border-color: var(--blue-light); }
        .input-area .input-wrapper textarea {
            flex: 1; background: transparent; border: none; outline: none;
            color: #f0f4ff; font-size: 1rem; font-family: 'Cairo', sans-serif;
            resize: none; padding: 12px 4px; min-height: 44px; max-height: 150px; line-height: 1.6;
        }
        .input-area .input-wrapper textarea::placeholder { color: #5a607a; }
        .input-area .input-wrapper .char-count { font-size: 0.7rem; color: #4a5070; padding: 8px 4px; }
        .input-area .btn-send {
            width: 52px; height: 52px; min-width: 52px; border-radius: 50%;
            border: none; background: linear-gradient(135deg, var(--blue-deep), var(--blue-mid));
            color: #fff; font-size: 1.4rem; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        .input-area .btn-send:hover { transform: scale(1.08); }
        .input-area .btn-send:disabled { opacity: 0.4; cursor: not-allowed; }
        .input-area .btn-plus {
            width: 52px; height: 52px; min-width: 52px; border-radius: 50%;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(2, 28, 164, 0.2);
            color: #a0b0d4; font-size: 1.8rem; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        .input-area .btn-plus.active { transform: rotate(45deg); color: var(--blue-light); }
        .plus-dropdown {
            position: absolute; bottom: calc(100% + 12px); right: 0;
            background: rgba(10, 16, 32, 0.98);
            border: 1px solid rgba(74, 122, 255, 0.2);
            border-radius: 20px; padding: 8px 0; min-width: 190px;
            display: none; z-index: 100;
        }
        .plus-dropdown.show { display: block; }
        .plus-dropdown .dropdown-item {
            display: flex; align-items: center; gap: 12px;
            padding: 12px 20px; color: #c0ccf0; font-size: 0.95rem;
            cursor: pointer; border: none; background: transparent;
            width: 100%; text-align: right; font-family: 'Cairo', sans-serif;
        }
        .plus-dropdown .dropdown-item i { color: var(--blue-light); width: 24px; text-align: center; }
        .plus-dropdown .dropdown-item:hover { background: rgba(74, 122, 255, 0.08); color: #fff; }
        .sub-dropdown { display: none; margin-top: 4px; margin-right: 10px; border-right: 2px solid rgba(74, 122, 255, 0.25); padding-right: 6px; background: rgba(0, 0, 0, 0.2); border-radius: 12px; }
        .sub-dropdown.show { display: block; }
        .sub-dropdown .dropdown-item { font-size: 0.85rem; padding: 10px 16px 10px 12px; }
        .plus-dropdown .dropdown-divider { height: 1px; background: rgba(74, 122, 255, 0.1); margin: 6px 12px; }
        .coming-soon-badge { background: rgba(255, 180, 0, 0.15); color: #ffb800; font-size: 0.7rem; padding: 2px 10px; border-radius: 30px; margin-right: 6px; font-weight: 600; }
        .dropdown-item.disabled-item { opacity: 0.6; cursor: not-allowed; }
        .file-preview {
            display: none; padding: 6px 16px 6px 12px;
            background: rgba(74, 122, 255, 0.08);
            border-radius: 20px; border: 1px solid rgba(74, 122, 255, 0.15);
            font-size: 0.8rem; color: #a0b0d4; align-items: center; gap: 8px;
            max-width: 200px;
        }
        .file-preview.visible { display: inline-flex; }
        .file-preview.hidden-preview { display: none !important; }
        .file-preview .remove-file { cursor: pointer; color: #ff6b6b; }
        .file-preview i { color: var(--blue-light); }
        .modal-overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(16px);
            z-index: 9999; justify-content: center; align-items: center; padding: 20px;
        }
        .modal-overlay.active { display: flex; }
        .modal-box {
            background: radial-gradient(ellipse at 50% 0%, rgba(10, 16, 32, 0.98), #0a0f1f);
            border: 1px solid rgba(74, 122, 255, 0.2);
            border-radius: 32px; max-width: 700px; width: 100%;
            max-height: 85vh; padding: 30px 28px;
            overflow-y: auto; position: relative;
        }
        .modal-box h3 { color: #fff; font-size: 1.6rem; margin-bottom: 18px; display: flex; align-items: center; gap: 12px; }
        .modal-box h3 i { color: var(--blue-light); }
        .modal-box .modal-close {
            margin-top: 20px; padding: 10px 32px;
            background: linear-gradient(135deg, var(--blue-deep), var(--blue-mid));
            border: none; border-radius: 40px; color: #fff;
            font-family: 'Cairo', sans-serif; font-size: 1rem;
            cursor: pointer; font-weight: 600;
        }
        .modal-text {
            background: rgba(0, 0, 0, 0.4); border-radius: 16px;
            padding: 18px 20px; color: #c0ccf0; font-size: 0.95rem;
            line-height: 1.8; max-height: 50vh; overflow-y: auto;
            white-space: pre-wrap; word-break: break-word;
        }
        .memory-list { display: flex; flex-direction: column; gap: 14px; margin: 12px 0 22px; max-height: 55vh; overflow-y: auto; }
        .memory-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(74, 122, 255, 0.08);
            border-radius: 20px; padding: 16px 20px;
            display: flex; justify-content: space-between; align-items: center; gap: 14px; cursor: pointer;
        }
        .memory-item:hover { background: rgba(74, 122, 255, 0.05); border-color: rgba(74, 122, 255, 0.2); }
        .memory-item .memory-content { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 10px; }
        .memory-item .memory-title { color: #d0dcf5; font-size: 1rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }
        .memory-item .memory-count { color: #6a708a; font-size: 0.8rem; }
        .memory-item .memory-time { color: #6a708a; font-size: 0.7rem; margin-right: auto; }

    <script>
        // ============================================================
        //  MEN Ai - Main Chat Logic
        // ============================================================
        const TYPING_SPEED = 70;
        const CODE_TEXT_SPEED = 60;
        const CODE_BLOCK_SPEED = 8;
        const WELCOME_SPEED = 70;

        let responses = {}, mdrResponses = {}, codResponses = {}, keywordsMap = {}, products = [], customReplies = {};
        const CUSTOM_REPLIES_KEY = 'menCustomReplies';
        let attachedFile = null;
        let extractedText = '';
        const MEMORY_KEY = 'menChatMemory';
        const SETTINGS_KEY = 'menChatSettings';
        let maxMessagesPerSession = 6;
        let autoBoostEnabled = false;

        function loadSettings() {
            try {
                const saved = localStorage.getItem(SETTINGS_KEY);
                if (saved) {
                    const s = JSON.parse(saved);
                    maxMessagesPerSession = s.limit || 6;
                    autoBoostEnabled = s.autoBoost || false;
                    return s;
                }
            } catch(e) {}
            return { limit: 6, autoBoost: false };
        }
        function saveSettings(limit, autoBoost) {
            try { localStorage.setItem(SETTINGS_KEY, JSON.stringify({limit, autoBoost})); maxMessagesPerSession = limit; autoBoostEnabled = autoBoost; } catch(e){}
        }

        function getMemory() {
            try {
                const data = localStorage.getItem(MEMORY_KEY);
                if (data) {
                    const p = JSON.parse(data);
                    if (p.sessions && Array.isArray(p.sessions)) return p;
                }
            } catch(e){}
            return { sessions: [], currentSessionId: null };
        }
        function saveMemory(m) { try { localStorage.setItem(MEMORY_KEY, JSON.stringify(m)); } catch(e){} }
        function createNewSession(title) {
            const memory = getMemory();
            const id = Date.now().toString(36) + '_' + Math.random().toString(36).substr(2, 5);
            const session = { id, title: title || 'محادثة جديدة', messages: [], lastUpdated: new Date().toLocaleString('ar-SA', { timeZone: 'Asia/Riyadh' }) };
            memory.sessions.unshift(session);
            memory.currentSessionId = id;
            saveMemory(memory);
            return id;
        }
        function getCurrentSession() {
            const memory = getMemory();
            if (!memory.currentSessionId || !memory.sessions.some(s => s.id === memory.currentSessionId)) {
                const id = createNewSession('محادثة جديدة');
                memory.currentSessionId = id;
                saveMemory(memory);
            }
            return memory.sessions.find(s => s.id === memory.currentSessionId);
        }
        function setCurrentSession(sessionId) {
            const memory = getMemory();
            if (memory.sessions.some(s => s.id === sessionId)) {
                memory.currentSessionId = sessionId;
                saveMemory(memory);
                return true;
            }
            return false;
        }
        function saveToMemory(role, content, type = 'text', meta = null) {
            try {
                const memory = getMemory();
                let session = memory.sessions.find(s => s.id === memory.currentSessionId);
                if (!session) {
                    const id = createNewSession('محادثة جديدة');
                    memory.currentSessionId = id;
                    session = memory.sessions.find(s => s.id === id);
                }
                const timestamp = new Date().toLocaleString('ar-SA', { timeZone: 'Asia/Riyadh' });
                session.messages.push({ role, content, type, meta, timestamp });
                session.lastUpdated = timestamp;
                if (role === 'user' && session.messages.length === 1) {
                    session.title = content.substring(0, 30) + (content.length > 30 ? '...' : '');
                }
                if (session.messages.length > maxMessagesPerSession) {
                    const index = memory.sessions.findIndex(s => s.id === session.id);
                    if (index !== -1) {
                        memory.sessions.splice(index, 1);
                        if (memory.currentSessionId === session.id) {
                            memory.currentSessionId = null;
                            const newId = createNewSession('محادثة جديدة');
                            memory.currentSessionId = newId;
                        }
                        saveMemory(memory);
                        loadCurrentSession();
                        return;
                    }
                }
                saveMemory(memory);
            } catch(e){}
        }
        function loadMemory() {
            const memory = getMemory();
            renderMemoryList(memory.sessions);
        }
        function renderMemoryList(sessions) {
            const container = document.getElementById('memoryList');
            if (!sessions || !sessions.length) {
                container.innerHTML = '<div class="memory-empty">لا توجد محادثات محفوظة بعد.</div>';
                return;
            }
            container.innerHTML = sessions.map(s => `
                <div class="memory-item" data-session-id="${s.id}">
                    <div class="memory-content">
                        <span class="memory-title">${escapeHtml(s.title || 'محادثة')}</span>
                        <span class="memory-count">(${s.messages.length} رسالة)</span>
                        <span class="memory-time">${s.lastUpdated || ''}</span>
                    </div>
                    <button class="memory-delete" data-session-id="${s.id}"><i class="fas fa-times"></i></button>
                </div>
            `).join('');
            container.querySelectorAll('.memory-item').forEach(el => {
                el.addEventListener('click', function(e) {
                    if (e.target.closest('.memory-delete')) return;
                    restoreSession(this.dataset.sessionId);
                });
                el.querySelector('.memory-delete').addEventListener('click', function(e) {
                    e.stopPropagation();
                    deleteSession(this.dataset.sessionId);
                });
            });
        }
        function deleteSession(sessionId) {
            if (!confirm('هل تريد حذف هذه المحادثة؟')) return;
            const memory = getMemory();
            const i = memory.sessions.findIndex(s => s.id === sessionId);
            if (i !== -1) {
                memory.sessions.splice(i, 1);

        function mergeReplies() {
            let merged = JSON.parse(JSON.stringify(responses));
            for (const [cat, obj] of Object.entries(mdrResponses)) {
                if (!merged[cat]) merged[cat] = { keywords: [], responses: [] };
                if (obj.keywords) merged[cat].keywords = [...new Set([...merged[cat].keywords, ...obj.keywords])];
                if (obj.responses) merged[cat].responses = [...new Set([...merged[cat].responses, ...obj.responses])];
            }
            for (const [cat, obj] of Object.entries(customReplies)) {
                if (!merged[cat]) merged[cat] = { keywords: [], responses: [] };
                if (obj.keywords) merged[cat].keywords = [...new Set([...merged[cat].keywords, ...obj.keywords])];
                if (obj.responses) merged[cat].responses = [...new Set([...merged[cat].responses, ...obj.responses])];
            }
            return merged;
        }
        function rebuildKeywordsMap() {
            const m = mergeReplies();
            keywordsMap = {};

        function getReply(category) {
            const m = mergeReplies();

            if (!c || !c.responses || !c.responses.length) c = m['default'] || { responses: ['عذراً، لا يوجد رد.'] };

        function getCategoryForText(text) {

            for (const [cat, obj] of Object.entries(m)) {
                if (obj.keywords) for (const p of obj.keywords.map(k => k.toLowerCase())) if (lower.includes(p)) return cat;
            }
            return 'default';
        }
        function evaluateMath(text) {
            const match = text.match(/(\d+)\s*([+\-*/])\s*(\d+)/);
            if (!match) return null;
            const a = parseFloat(match[1]), op = match[2], b = parseFloat(match[3]);
            if (isNaN(a) || isNaN(b)) return null;
            let r;
            switch(op){ case '+': r=a+b; break; case '-': r=a-b; break; case '*': r=a*b; break; case '/': if (b===0) return 'لا يمكن القسمة على صفر'; r=a/b; break; default: return null; }
            return Number.isInteger(r) ? r : r.toFixed(2);
        }

        const CODE_KEYWORDS = {
            python: ['def','class','if','elif','else','for','while','return','import','from','as','try','except','finally','with','lambda','yield','pass','break','continue','raise','in','is','not','and','or','None','True','False','async','await','self','print','input','len','range','str','int','float','list','dict','set','tuple','bool'],
            javascript: ['function','const','let','var','if','else','for','while','return','class','extends','new','this','try','catch','finally','throw','async','await','import','export','from','default','switch','case','break','continue','typeof','instanceof','null','undefined','true','false','in','of','do','console','document'],
            html: ['DOCTYPE','html','head','body','title','meta','link','script','style','div','span','p','a','img','ul','ol','li','h1','h2','h3','form','input','button','table','header','footer','nav','main','section','class','id','href','src'],
            css: ['body','html','div','span','p','a','color','background','margin','padding','border','font','display','flex','grid','width','height','position','transition','transform','opacity']
        };
        function highlightCode(code, language) {
            if (!code) return '';
            const lang = (language || 'javascript').toLowerCase();
            let text = code.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
            const stash = [];
            const stashIt = (html) => { const id = '\uE000q' + stash.length + 'q\uE001'; stash.push(html); return id; };
            text = text.replace(/("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*'|`(?:[^`\\]|\\.)*`)/g, m => stashIt('<span class="tok-string">'+m+'</span>'));
            if (lang === 'python') text = text.replace(/(#[^\n]*)/g, m => stashIt('<span class="tok-comment">'+m+'</span>'));
            else text = text.replace(/(\/\/[^\n]*)/g, m => stashIt('<span class="tok-comment">'+m+'</span>'));
            text = text.replace(/\b(\d+(?:\.\d+)?)\b/g, '<span class="tok-number">$1</span>');
            const kw = CODE_KEYWORDS[lang] || CODE_KEYWORDS.javascript;
            if (kw && kw.length) {
                const esc = kw.map(k => k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).sort((a,b)=>b.length-a.length);
                text = text.replace(new RegExp('\\b('+esc.join('|')+')\\b','g'), '<span class="tok-keyword">$1</span>');
            }
            text = text.replace(/\b([a-zA-Z_][a-zA-Z0-9_]*)\s*\(/g, (m,n) => '<span class="tok-function">'+n+'</span>(');
            text = text.replace(/\uE000q(\d+)q\uE001/g, (_, i) => stash[parseInt(i)] || '');
            return text;
        }

        async function extractTextFromFile(file) {
            const ft = file.type, fn = file.name.toLowerCase();
            if (ft.startsWith('image/')) {
                try { const u = URL.createObjectURL(file); const r = await Tesseract.recognize(u, 'ara'); URL.revokeObjectURL(u); return r.data.text || 'لا يوجد نص.'; }
                catch(e){ return 'خطأ في الصورة.'; }
            }
            if (ft === 'text/plain' || fn.endsWith('.txt') || ft === 'text/csv' || fn.endsWith('.csv')) {
                try { return await file.text() || 'فارغ.'; } catch(e){ return 'خطأ.'; }
            }
            if (ft === 'application/pdf' || fn.endsWith('.pdf')) {
                try {
                    const b = await file.arrayBuffer();
                    const pdf = await pdfjsLib.getDocument({ data: b }).promise;
                    let t = '';
                    for (let i = 1; i <= pdf.numPages; i++) {
                        const pg = await pdf.getPage(i);
                        const tc = await pg.getTextContent();
                        t += tc.items.map(it => it.str).join(' ') + '\n';
                    }
                    return t || 'لا يوجد نص.';
                } catch(e){ return 'خطأ PDF.'; }
            }
            if (fn.endsWith('.docx')) {
                try { const b = await file.arrayBuffer(); const r = await mammoth.extractRawText({ arrayBuffer: b }); return r.value || 'فارغ.'; }
                catch(e){ return 'خطأ Word.'; }
            }
            if (fn.endsWith('.xlsx') || fn.endsWith('.xls')) {
                try {
                    const b = await file.arrayBuffer();
                    const wb = XLSX.read(b, { type: 'array' });
                    let t = '';
                    wb.SheetNames.forEach(n => {
                        const j = XLSX.utils.sheet_to_json(wb.Sheets[n]);
                        if (j.length) { t += `\n--- ${n} ---\n`; j.forEach(r => t += Object.values(r).join(' | ') + '\n'); }
                    });
                    return t || 'لا بيانات.';
                } catch(e){ return 'خطأ Excel.'; }
            }
            return 'نوع غير مدعوم.';
        }

        async function generateSmartReply(text) {
            const lower = text.trim().toLowerCase();
            const codeObj = findCodeCategory(text);
            if (codeObj) {
                const r = getCodeResponse(codeObj);
                if (r) return { type: 'code', content: r };
            }
            if (lower.includes('عرض المنتجات') || lower.includes('المنتجات') || lower.includes('اشتري')) {
                return { type: 'products', content: buildAllProductsRow() };
            }
            if (lower.includes('وكيل') || lower.includes('معزز') || lower.includes('boost')) {
                return { type: 'text', content: '⏳ هذه الميزة ستكون متاحة قريباً.' };
            }
            const math = evaluateMath(text);
            if (math !== null) return { type: 'text', content: `النتيجة: **${math}**` };
            if (keywordsMap['time'] && keywordsMap['time'].some(p => lower.includes(p))) {
                const now = new Date();
                return { type: 'text', content: `الوقت: ${now.toLocaleString('ar-SA', { timeZone: 'Asia/Riyadh', hour12: true })}\nالتاريخ: ${now.toLocaleDateString('ar-SA', { timeZone: 'Asia/Riyadh' })}` };
            }
            const p = findProduct(text);
            if (p) return { type: 'product', content: `<div class="products-row-wrapper"><div class="products-row">${buildProductCard(p)}</div></div>`, product: p };
            const cat = getCategoryForText(text);
            if (cat !== 'default') return { type: 'text', content: getReply(cat) };
            return { type: 'text', content: getReply('default') };
        }

        async function sendMessage() {
            // ═══ حماية: لا يرسل بدون تسجيل ═══
            if (!window.MEN_AUTH?.isLoggedIn()) {
                window.MEN_AUTH?.open('login');
                return;
            }
            const text = messageInput.value.trim();
            if (!text && !attachedFile) return;
            if (isProcessing) return;
            if (suggestedQuestions) suggestedQuestions.classList.add('hidden');
            isProcessing = true;
            sendBtn.disabled = true;

            try {
                let fileText = '';
                if (attachedFile) { fileText = await extractTextFromFile(attachedFile); showExtractedText(fileText); }
                let userContent = text;
                if (attachedFile) userContent += `\n[ملف: ${attachedFile.name}]\n${fileText}`;

                const userMsg = document.createElement('div');
                userMsg.className = 'message user';
                let display = text || 'أرسل ملفاً';
                if (attachedFile) display += ` <span style="color:#4a7aff;font-size:.8rem">${attachedFile.name}</span>`;
                userMsg.innerHTML = escapeHtml(display) + `<span class="msg-time">الآن</span>`;
                messagesArea.appendChild(userMsg);
                scrollToBottom();
                saveToMemory('user', userContent, 'text');

                messageInput.value = '';
                messageInput.style.height = 'auto';
                charCount.textContent = '0';
                typingIndicator.style.display = 'flex';
                scrollToBottom();
                await delay(700 + Math.random() * 900);
                typingIndicator.style.display = 'none';

                let reply = await generateSmartReply(text || fileText || 'ملف');
                if (attachedFile && fileText && reply.type === 'text') {
                    reply.content = `📎 استخرجت:\n"${fileText.substring(0, 200)}${fileText.length > 200 ? '...' : ''}"\n\n${reply.content}`;
                }

                const botMsg = document.createElement('div');
                botMsg.className = 'message bot';
                messagesArea.appendChild(botMsg);
                scrollToBottom();

                let replyContent = '';
                if (reply.type === 'products' || reply.type === 'product') {
                    botMsg.innerHTML = reply.content + `<span class="msg-time">الآن</span>`;
                    replyContent = reply.type === 'products' ? 'المنتجات' : 'المنتج';
                    const a = document.createElement('div');
                    a.className = 'bot-actions';
                    a.innerHTML = `<button class="copy-btn" data-content="${escapeHtml(replyContent)}"><i class="fas fa-copy"></i> نسخ</button>`;
                    botMsg.appendChild(a);
                } else if (reply.type === 'code') {
                    const cr = reply.content;
                    botMsg.innerHTML = buildCodeHtml('', '', cr.language);
                    const container = botMsg.querySelector('.code-response');
                    if (cr.text) {
                        const t = document.createElement('p');
                        t.className = 'code-text';
                        container.insertBefore(t, container.firstChild);
                        await typeTextInto(t, cr.text, CODE_TEXT_SPEED);
                    }
                    if (cr.code) {
                        container.insertAdjacentHTML('beforeend', `
                            <div class="code-block">
                                <div class="code-header">
                                    <span class="code-lang"><i class="fas fa-code"></i> ${escapeHtml(cr.language || 'code')}</span>
                                    <button class="code-copy-btn" type="button"><i class="fas fa-copy"></i> نسخ الكود</button>
                                </div>
                                <pre class="code-content"></pre>
                            </div>
                        `);
                        const pre = container.querySelector('.code-content');
                        await typeTextInto(pre, cr.code, CODE_BLOCK_SPEED);
                        try { pre.innerHTML = highlightCode(cr.code, cr.language); } catch(e){}
                        const cb = container.querySelector('.code-copy-btn');
                        cb.addEventListener('click', function() {
                            const c = this.closest('.code-block').querySelector('.code-content').textContent;
                            navigator.clipboard.writeText(c).then(() => {
                                this.innerHTML = '<i class="fas fa-check"></i> تم';
                                setTimeout(() => this.innerHTML = '<i class="fas fa-copy"></i> نسخ الكود', 1500);
                            });
                        });
                    }
                    const ts = document.createElement('span');
                    ts.className = 'msg-time'; ts.textContent = 'الآن';
                    botMsg.appendChild(ts);
                    replyContent = `${cr.text || ''}\n\n\`\`\`${cr.language}\n${cr.code}\n\`\`\``;
                } else {
                    await typeText(botMsg, reply.content, TYPING_SPEED);
                    const ts = document.createElement('span');
                    ts.className = 'msg-time'; ts.textContent = 'الآن';
                    botMsg.appendChild(ts);
                    replyContent = reply.content;
                    const a = document.createElement('div');
                    a.className = 'bot-actions';
                    a.innerHTML = `<button class="copy-btn" data-content="${escapeHtml(replyContent)}"><i class="fas fa-copy"></i> نسخ</button>`;
                    botMsg.appendChild(a);
                }
                botMsg.querySelectorAll('.copy-btn').forEach(b => {
                    b.addEventListener('click', function(e) {
                        e.stopPropagation();
                        navigator.clipboard.writeText(this.dataset.content).then(() => {
                            const orig = this.innerHTML;
                            this.innerHTML = '<i class="fas fa-check"></i> تم';
                            setTimeout(() => this.innerHTML = orig, 1500);
                        });
                    });
                });

                if (reply.type === 'products') saveToMemory('bot', 'المنتجات', 'products');
                else if (reply.type === 'product') saveToMemory('bot', 'المنتج', 'product', reply.product);
                else if (reply.type === 'code') saveToMemory('bot', replyContent, 'code', reply.content);
                else saveToMemory('bot', replyContent, 'text');

                if (autoBoostEnabled) {
                    await delay(600);
                    const bm = document.createElement('div');
                    bm.className = 'message bot';
                    bm.innerHTML = 'هل تريد مساعدة إضافية؟' + `<span class="msg-time">الآن</span>`;
                    messagesArea.appendChild(bm);
                    scrollToBottom();
                    saveToMemory('bot', 'هل تريد مساعدة إضافية؟', 'text');
                }

                if (attachedFile) hideAttachedFile();
            } catch(err) {
                console.error(err);
                const em = document.createElement('div');
                em.className = 'message bot';
                em.innerHTML = 'عذراً، حدث خطأ.' + `<span class="msg-time">الآن</span>`;
                messagesArea.appendChild(em);
            } finally {
                isProcessing = false;
                sendBtn.disabled = false;
                messageInput.focus();
                scrollToBottom();
            }
        }

        async function loadResponses() {
            try { const r = await fetch('responses.json'); if (r.ok) responses = await r.json(); else throw new Error(); }
            catch(e) {
                responses = {
                    default: { keywords: ['مرحبا','السلام','اهلا'], responses: ['مرحباً! كيف يمكنني مساعدتك؟'] },
                    time: { keywords: ['وقت','ساعة'], responses: ['الوقت الآن {time}'] },
                    founding: { keywords: ['تأسس','الفريق'], responses: ['تأسس فريق MEN عام 2020.'] },
                    support: { keywords: ['دعم','تواصل'], responses: ['الدعم: clan.men.ts@gmail.com'] }
                };
            }
        }
        async function loadMdr() { try { const r = await fetch('mdr.json'); if (r.ok) mdrResponses = await r.json(); } catch(e){ mdrResponses = {}; } }
        async function loadCod() { try { const r = await fetch('cod.json'); if (r.ok) codResponses = await r.json(); } catch(e){ codResponses = {}; } }
        async function loadProducts() { try { const r = await fetch('products.json'); if (r.ok) products = await r.json(); } catch(e){ products = []; } }
        function loadExternalLibraries() {
            return new Promise(resolve => {
                let n = 0; const total = 4;
                const check = () => { if (++n >= total) resolve(); };
                ['https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js',
                 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js',
                 'https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js',
                 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'].forEach(src => {
                    const s = document.createElement('script');
                    s.src = src; s.onload = check; s.onerror = check;
                    document.head.appendChild(s);
                });
                setTimeout(resolve, 8000);
            });
        }

        // ═══ Sidebar Logic ═══
        const sideMenu = document.getElementById('sideMenu');
        const sideOverlay = document.getElementById('sideOverlay');
        function openSide() { sideMenu.classList.add('open'); sideOverlay.classList.add('show'); }
        function closeSide() { sideMenu.classList.remove('open'); sideOverlay.classList.remove('show'); }

        sideOverlay.addEventListener('click', closeSide);
        document.getElementById('sideClose').addEventListener('click', closeSide);

        document.getElementById('sideBackBtn').addEventListener('click', () => {
            closeSide();
            if (document.referrer) window.history.back();
            else window.location.href = '/';
        });
        document.getElementById('sideMemoryBtn').addEventListener('click', () => {
            closeSide();
            loadMemory();
            document.getElementById('memoryModal').classList.add('active');
        });
        document.getElementById('sideSettingsBtn').addEventListener('click', () => {
            closeSide();
            const s = loadSettings();
            document.getElementById('memoryLimitSelect').value = s.limit || 6;
            document.getElementById('autoBoostToggle').checked = s.autoBoost || false;
            document.getElementById('settingsModal').classList.add('active');
        });
        document.getElementById('sideLogoutBtn').addEventListener('click', () => {
            closeSide();
            if (confirm('تسجيل الخروج؟')) window.MEN_AUTH?.logout();
        });

        document.getElementById('menLoginBtn').addEventListener('click', () => window.MEN_AUTH?.open('login'));
        document.getElementById('menProfileBtn').addEventListener('click', openSide);

        // ═══ ربط الـ Auth بالـ UI ═══
        window.addEventListener('load', () => {
            if (window.MEN_AUTH) {
                window.MEN_AUTH.onAuthChange((user) => {
                    const loginBtn = document.getElementById('menLoginBtn');
                    const profileBtn = document.getElementById('menProfileBtn');
                    if (user) {
                        const name = user.user_metadata?.name || user.email.split('@')[0];
                        loginBtn.style.display = 'none';
                        profileBtn.style.display = 'flex';
                        document.getElementById('menProfileBtnAvatar').src = window.MEN_AUTH.makeAvatar(name, 100);
                        document.getElementById('menProfileBtnName').textContent = name;
                        document.getElementById('sideAvatar').src = window.MEN_AUTH.makeAvatar(name, 200);
                        document.getElementById('sideName').textContent = name;
                        document.getElementById('sideEmail').textContent = user.email;
                    } else {
                        loginBtn.style.display = 'inline-flex';
                        profileBtn.style.display = 'none';
                    }
                });
            }
        });

        // ═══ Init ═══
        async function init() {
            messageInput.disabled = true;
            sendBtn.disabled = true;
            await loadExternalLibraries();
            await Promise.all([loadResponses(), loadMdr(), loadCod(), loadProducts()]);
            loadCustomReplies();
            rebuildKeywordsMap();
            loadSettings();
            loadCurrentSession();
            loadMemory();
            messageInput.disabled = false;
            sendBtn.disabled = false;
            console.log('%c MEN Ai Ready ', 'background:linear-gradient(135deg,#021ca4,#4a7aff);color:#fff;padding:6px 14px;border-radius:8px;font-weight:900');
        }
        init();
    </script>
</body>
</html>
