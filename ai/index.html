<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <link rel="icon" type="image/png" href="logo1.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#04060f">
    <title>MEN AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body {
            height: 100%;
            overflow: hidden;
            font-family: 'Cairo', sans-serif;
            background: #04060f;
            color: #f0f4ff;
            overscroll-behavior: none;
        }
        :root {
            --blue-deep: #021ca4;
            --blue-mid: #1a3a9e;
            --blue-light: #4a7aff;
            --blue-glow: rgba(74, 122, 255, 0.2);
            --bg-1: #060a16;
            --bg-2: #04060f;
            --bg-3: #02040a;
            --card: rgba(12, 18, 38, 0.75);
            --border: rgba(74, 122, 255, 0.15);
            --text: #f0f4ff;
            --text-dim: #8a92b0;
            --text-dimmer: #5a607a;
            --success: #4ade80;
            --warn: #f5b342;
            --danger: #f87171;
            --radius: 22px;
            --radius-sm: 14px;
            --header-h: 64px;
            --input-min-h: 62px;
        }

        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(74, 122, 255, 0.3); border-radius: 5px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(74, 122, 255, 0.5); }

        /* ═══ Background ═══ */
        .bg-ambient {
            position: fixed; inset: 0; z-index: 0; pointer-events: none;
            background:
                radial-gradient(ellipse 60% 50% at 15% 10%, rgba(10, 26, 92, 0.35) 0%, transparent 55%),
                radial-gradient(ellipse 55% 45% at 90% 90%, rgba(30, 64, 175, 0.22) 0%, transparent 55%),
                radial-gradient(ellipse at 50% 50%, #04060f 0%, #02040a 100%);
        }
        .bg-ambient::after {
            content: '';
            position: absolute; inset: 0;
            background-image:
                linear-gradient(rgba(74, 122, 255, 0.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(74, 122, 255, 0.025) 1px, transparent 1px);
            background-size: 56px 56px;
            mask-image: radial-gradient(ellipse at center, black 15%, transparent 70%);
            -webkit-mask-image: radial-gradient(ellipse at center, black 15%, transparent 70%);
        }
        .bg-orb {
            position: fixed; border-radius: 50%; filter: blur(120px);
            pointer-events: none; z-index: 0; opacity: 0.5;
        }
        .bg-orb.o1 { width: 480px; height: 480px; background: radial-gradient(circle, #1e3a8a, transparent 70%); top: -180px; left: -180px; animation: orb1 18s ease-in-out infinite; }
        .bg-orb.o2 { width: 420px; height: 420px; background: radial-gradient(circle, #2563eb, transparent 70%); bottom: -180px; right: -180px; animation: orb2 22s ease-in-out infinite; }
        @keyframes orb1 { 0%, 100% { transform: translate(0,0) scale(1); } 50% { transform: translate(90px,70px) scale(1.15); } }
        @keyframes orb2 { 0%, 100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-70px,-60px) scale(1.1); } }

        /* ═══ App Container ═══ */
        .app {
            position: relative;
            z-index: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
        }

        /* ═══ Header ═══ */
        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 18px;
            height: var(--header-h);
            background: rgba(6, 10, 22, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            position: relative;
            z-index: 100;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }
        .brand-logo {
            width: 40px; height: 40px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--blue-deep), var(--blue-light));
            display: flex; align-items: center; justify-content: center;
            color: #fff; font-size: 1.15rem;
            box-shadow: 0 6px 20px -6px rgba(74, 122, 255, 0.7);
            flex-shrink: 0;
            position: relative;
        }
        .brand-logo::after {
            content: '';
            position: absolute; inset: -2px;
            border-radius: 14px;
            background: linear-gradient(135deg, rgba(74, 122, 255, 0.5), transparent, rgba(74, 122, 255, 0.3));
            z-index: -1;
            filter: blur(6px);
        }
        .brand-name {
            font-size: 1.15rem;
            font-weight: 900;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #fff 40%, var(--blue-light));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            white-space: nowrap;
        }
        .brand-sub {
            display: flex;
            align-items: center;
            gap: 5px;
            color: var(--success);
            font-size: 0.68rem;
            font-weight: 700;
            margin-top: 1px;
        }
        .brand-sub .dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: var(--success);
            box-shadow: 0 0 8px var(--success);
            animation: pulseDot 2s ease-in-out infinite;
        }
        @keyframes pulseDot { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .btn-login {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, var(--blue-deep), var(--blue-mid));
            border: 1px solid rgba(74, 122, 255, 0.3);
            border-radius: 40px;
            padding: 0 20px;
            height: 42px;
            color: #fff;
            font-family: 'Cairo', sans-serif;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 6px 20px -8px rgba(2, 28, 164, 0.8);
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 28px -8px rgba(74, 122, 255, 0.8);
        }
        .btn-login i { font-size: 1rem; }

        .btn-profile {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            border-radius: 40px;
            padding: 3px 12px 3px 3px;
            height: 42px;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Cairo', sans-serif;
        }
        .btn-profile:hover {
            background: rgba(74, 122, 255, 0.1);
            border-color: var(--blue-light);
            transform: translateY(-1px);
        }
        .btn-profile img {
            width: 34px; height: 34px;
            border-radius: 50%;
            border: 2px solid rgba(74, 122, 255, 0.6);
            object-fit: cover;
            flex-shrink: 0;
        }
        .btn-profile .p-name {
            color: #d0dcf5;
            font-weight: 700;
            font-size: 0.85rem;
            max-width: 90px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ═══ Chat Container ═══ */
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            overflow: hidden;
            position: relative;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 22px 18px 12px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }
        .messages::-webkit-scrollbar { width: 5px; }
        .messages::-webkit-scrollbar-thumb { background: rgba(74, 122, 255, 0.25); border-radius: 5px; }

        /* ═══ Welcome ═══ */
        .welcome {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px 30px;
            gap: 20px;
            margin: auto 0;
        }
        .welcome-logo {
            width: 90px; height: 90px;
            border-radius: 26px;
            background: linear-gradient(135deg, var(--blue-deep), var(--blue-light));
            display: flex; align-items: center; justify-content: center;
            color: #fff; font-size: 2.4rem;
            box-shadow: 0 20px 60px -15px rgba(74, 122, 255, 0.7), 0 0 0 1px rgba(74, 122, 255, 0.15) inset;
            animation: floatLogo 4s ease-in-out infinite;
            position: relative;
        }
        .welcome-logo::after {
            content: '';
            position: absolute; inset: -10px;
            border-radius: 36px;
            background: linear-gradient(135deg, rgba(74, 122, 255, 0.3), transparent, rgba(74, 122, 255, 0.2));
            z-index: -1;
            filter: blur(20px);
            opacity: 0.6;
        }
        @keyframes floatLogo {
            0%, 100% { transform: translateY(0) rotate(0); }
            50% { transform: translateY(-10px) rotate(-3deg); }
        }
        .welcome-title {
            font-size: clamp(1.6rem, 5vw, 2.2rem);
            font-weight: 900;
            letter-spacing: -1px;
            background: linear-gradient(135deg, #fff 30%, var(--blue-light));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            line-height: 1.2;
        }
        .welcome-title span {
            background: linear-gradient(135deg, var(--blue-light), #a0c0ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .welcome-desc {
            color: var(--text-dim);
            font-size: 0.95rem;
            font-weight: 600;
            max-width: 400px;
            line-height: 1.7;
        }
        .welcome-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-top: 8px;
            max-width: 500px;
        }
        .chip {
            background: rgba(74, 122, 255, 0.08);
            border: 1px solid rgba(74, 122, 255, 0.2);
            border-radius: 24px;
            padding: 10px 16px;
            font-family: 'Cairo', sans-serif;
            font-size: 0.82rem;
            font-weight: 700;
            color: #b0c4e8;
            cursor: pointer;
            transition: 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            display: inline-flex;
            align-items: center;
            gap: 7px;
            white-space: nowrap;
        }
        .chip:hover {
            background: rgba(74, 122, 255, 0.15);
            border-color: var(--blue-light);
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 8px 24px -8px rgba(74, 122, 255, 0.5);
        }
        .chip i { font-size: 0.8rem; color: var(--blue-light); }

        /* ═══ Messages ═══ */
        .msg {
            max-width: 82%;
            padding: 13px 18px;
            border-radius: 20px;
            font-size: 0.95rem;
            line-height: 1.75;
            word-wrap: break-word;
            animation: msgIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            font-weight: 500;
        }
        @keyframes msgIn {
            from { opacity: 0; transform: translateY(14px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .msg.user {
            align-self: flex-end;
            background: linear-gradient(135deg, #0a1a5c, #1e40af);
            color: #fff;
            border: 1px solid rgba(74, 122, 255, 0.25);
            border-bottom-left-radius: 6px;
            box-shadow: 0 8px 24px -10px rgba(10, 26, 92, 0.8);
        }
        .msg.bot {
            align-self: flex-start;
            background: linear-gradient(135deg, rgba(16, 24, 48, 0.85), rgba(10, 16, 32, 0.85));
            color: #e0e8ff;
            border: 1px solid var(--border);
            border-bottom-right-radius: 6px;
            box-shadow: 0 8px 24px -12px rgba(0, 0, 0, 0.6);
        }
        .msg-time {
            display: block;
            font-size: 0.62rem;
            color: rgba(160, 176, 212, 0.55);
            margin-top: 5px;
            text-align: left;
            font-weight: 600;
            letter-spacing: 0.3px;
            direction: ltr;
        }
        .msg.user .msg-time { text-align: right; color: rgba(255, 255, 255, 0.5); }

        .bot-actions {
            display: flex;
            gap: 6px;
            margin-top: 8px;
            opacity: 0.5;
            transition: opacity 0.3s;
        }
        .msg:hover .bot-actions { opacity: 1; }
        .bot-actions button {
            background: rgba(74, 122, 255, 0.1);
            border: 1px solid rgba(74, 122, 255, 0.2);
            border-radius: 20px;
            padding: 4px 12px;
            color: #b0c4e8;
            font-size: 0.72rem;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: 0.25s;
        }
        .bot-actions button:hover {
            background: rgba(74, 122, 255, 0.2);
            border-color: var(--blue-light);
            color: #fff;
        }

        /* ═══ Typing ═══ */
        .typing {
            align-self: flex-start;
            display: none;
            padding: 14px 20px;
            background: linear-gradient(135deg, rgba(16, 24, 48, 0.85), rgba(10, 16, 32, 0.85));
            border: 1px solid var(--border);
            border-radius: 20px;
            border-bottom-right-radius: 6px;
            gap: 5px;
            align-items: center;
        }
        .typing.active { display: inline-flex; }
        .typing span {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: var(--blue-light);
            display: inline-block;
            animation: bounce 1.4s ease-in-out infinite;
        }
        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
            30% { transform: translateY(-8px); opacity: 1; }
        }

        /* ═══ Input Area ═══ */
        .input-area {
            padding: 12px 14px max(14px, env(safe-area-inset-bottom));
            border-top: 1px solid var(--border);
            background: rgba(6, 10, 22, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            flex-shrink: 0;
            position: relative;
        }
        .input-row {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            max-width: 900px;
            margin: 0 auto;
        }
        .input-box {
            flex: 1;
            display: flex;
            align-items: flex-end;
            background: rgba(12, 18, 38, 0.9);
            border: 1.5px solid rgba(74, 122, 255, 0.2);
            border-radius: 26px;
            padding: 6px 6px 6px 16px;
            transition: 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            min-height: 52px;
            position: relative;
        }
        .input-box:focus-within {
            border-color: var(--blue-light);
            background: rgba(12, 18, 38, 1);
            box-shadow: 0 0 0 4px rgba(74, 122, 255, 0.12), 0 8px 32px -12px rgba(74, 122, 255, 0.4);
        }
        .input-box textarea {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text);
            font-size: 0.95rem;
            font-family: 'Cairo', sans-serif;
            font-weight: 500;
            resize: none;
            padding: 10px 4px 10px 0;
            min-height: 40px;
            max-height: 140px;
            line-height: 1.5;
            scrollbar-width: thin;
        }
        .input-box textarea::placeholder { color: var(--text-dimmer); font-weight: 500; }

        .btn-icon {
            width: 44px;
            height: 44px;
            min-width: 44px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.05rem;
            transition: 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            flex-shrink: 0;
            font-family: 'Cairo', sans-serif;
        }
        .btn-plus {
            background: rgba(74, 122, 255, 0.1);
            border: 1px solid rgba(74, 122, 255, 0.2);
            color: var(--blue-light);
        }
        .btn-plus:hover { background: rgba(74, 122, 255, 0.2); transform: scale(1.05); }
        .btn-plus.active { transform: rotate(45deg); background: rgba(74, 122, 255, 0.25); }

        .btn-send {
            background: linear-gradient(135deg, var(--blue-deep), var(--blue-mid));
            color: #fff;
            box-shadow: 0 8px 24px -8px rgba(2, 28, 164, 0.8);
            border: 1px solid rgba(74, 122, 255, 0.3);
        }
        .btn-send:hover:not(:disabled) {
            transform: scale(1.08) rotate(-5deg);
            box-shadow: 0 12px 32px -8px rgba(74, 122, 255, 0.9);
        }
        .btn-send:active:not(:disabled) { transform: scale(0.95); }
        .btn-send:disabled { opacity: 0.5; cursor: not-allowed; }

        /* ═══ Plus Dropdown ═══ */
        .plus-menu {
            position: absolute;
            bottom: calc(100% + 10px);
            right: 14px;
            background: rgba(10, 16, 32, 0.98);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(74, 122, 255, 0.25);
            border-radius: 20px;
            padding: 8px;
            min-width: 220px;
            box-shadow: 0 -10px 50px rgba(0, 0, 0, 0.8), 0 0 30px rgba(74, 122, 255, 0.08);
            display: none;
            z-index: 200;
            animation: menuIn 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .plus-menu.show { display: block; }
        @keyframes menuIn {
            from { opacity: 0; transform: translateY(10px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .menu-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            color: #c0ccf0;
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            background: transparent;
            width: 100%;
            text-align: right;
            font-family: 'Cairo', sans-serif;
            border-radius: 12px;
            transition: 0.25s;
        }
        .menu-item i {
            font-size: 1rem;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            background: rgba(74, 122, 255, 0.1);
            color: var(--blue-light);
            flex-shrink: 0;
        }
        .menu-item:hover { background: rgba(74, 122, 255, 0.1); color: #fff; }
        .menu-item:hover i { background: rgba(74, 122, 255, 0.2); }
        .menu-item.disabled { opacity: 0.55; cursor: not-allowed; }
        .menu-divider { height: 1px; background: rgba(74, 122, 255, 0.12); margin: 6px 10px; }
        .menu-badge {
            background: rgba(255, 180, 0, 0.15);
            color: #ffb800;
            font-size: 0.65rem;
            padding: 2px 8px;
            border-radius: 12px;
            margin-right: auto;
            font-weight: 800;
            border: 1px solid rgba(255, 180, 0, 0.25);
        }

        /* ═══ File Preview ═══ */
        .file-preview {
            display: none;
            padding: 8px 14px;
            background: rgba(74, 122, 255, 0.1);
            border: 1px solid rgba(74, 122, 255, 0.25);
            border-radius: 20px;
            font-size: 0.78rem;
            color: #b0c4e8;
            align-items: center;
            gap: 8px;
            max-width: 100%;
            margin-bottom: 8px;
            animation: msgIn 0.3s;
        }
        .file-preview.show { display: inline-flex; }
        .file-preview i { color: var(--blue-light); }
        .file-preview .fname {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 180px;
        }
        .file-preview .rm {
            cursor: pointer;
            color: var(--danger);
            padding: 2px 6px;
            border-radius: 50%;
            transition: 0.25s;
        }
        .file-preview .rm:hover { background: rgba(248, 113, 113, 0.15); }

        /* ═══ Sidebar ═══ */
        .side-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(6px);
            z-index: 1400;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        .side-overlay.show { opacity: 1; pointer-events: auto; }

        .side-menu {
            position: fixed;
            top: 0;
            right: -360px;
            width: 340px;
            max-width: 88vw;
            height: 100%;
            background: linear-gradient(180deg, rgba(10, 16, 32, 0.98), rgba(4, 6, 15, 0.99));
            border-left: 1px solid var(--border);
            z-index: 1500;
            transition: right 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(24px);
            box-shadow: -30px 0 80px -20px rgba(0, 0, 0, 0.9);
        }
        .side-menu.open { right: 0; }

        .side-header {
            padding: 26px 20px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 12px;
            border-bottom: 1px solid var(--border);
            position: relative;
            background: linear-gradient(180deg, rgba(37, 99, 235, 0.12), transparent);
        }
        .side-close {
            position: absolute;
            top: 14px;
            left: 14px;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: rgba(74, 122, 255, 0.1);
            border: 1px solid rgba(74, 122, 255, 0.2);
            color: var(--text-dim);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.3s;
            font-size: 0.85rem;
        }
        .side-close:hover { background: rgba(248, 113, 113, 0.15); color: var(--danger); transform: rotate(180deg); }

        .side-avatar {
            width: 84px;
            height: 84px;
            border-radius: 50%;
            border: 3px solid var(--blue-light);
            box-shadow: 0 0 0 6px rgba(74, 122, 255, 0.15), 0 16px 40px -12px rgba(74, 122, 255, 0.8);
            object-fit: cover;
        }
        .side-name { color: #fff; font-weight: 800; font-size: 1.15rem; }
        .side-email {
            color: var(--text-dim);
            font-size: 0.78rem;
            font-weight: 600;
            word-break: break-all;
            max-width: 100%;
            padding: 0 10px;
        }
        .side-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(74, 122, 255, 0.15);
            border: 1px solid rgba(74, 122, 255, 0.3);
            color: #60a5fa;
            font-size: 0.7rem;
            font-weight: 800;
            padding: 5px 14px;
            border-radius: 20px;
        }

        .side-body {
            flex: 1;
            overflow-y: auto;
            padding: 16px 12px;
        }
        .side-body::-webkit-scrollbar { width: 4px; }
        .side-body::-webkit-scrollbar-thumb { background: rgba(74, 122, 255, 0.3); border-radius: 4px; }

        .side-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 16px;
            border-radius: 14px;
            color: #c0ccf0;
            font-family: 'Cairo', sans-serif;
            font-weight: 700;
            font-size: 0.92rem;
            cursor: pointer;
            transition: 0.3s;
            border: none;
            background: transparent;
            width: 100%;
            text-align: right;
            margin-bottom: 4px;
        }
        .side-item i {
            width: 38px;
            height: 38px;
            border-radius: 12px;
            background: rgba(74, 122, 255, 0.1);
            color: var(--blue-light);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            flex-shrink: 0;
            transition: 0.3s;
        }
        .side-item:hover { background: rgba(74, 122, 255, 0.08); color: #fff; }
        .side-item:hover i { background: rgba(74, 122, 255, 0.2); transform: scale(1.08); }
        .side-item.danger { color: var(--danger); }
        .side-item.danger i { background: rgba(248, 113, 113, 0.1); color: var(--danger); }
        .side-item.danger:hover { background: rgba(248, 113, 113, 0.08); }
        .side-item.danger:hover i { background: rgba(248, 113, 113, 0.2); }
        .side-divider { height: 1px; background: var(--border); margin: 8px 12px; }
        .side-foot {
            padding: 14px 20px;
            border-top: 1px solid var(--border);
            color: var(--text-dimmer);
            font-size: 0.7rem;
            text-align: center;
            font-weight: 600;
        }

        /* ═══ Modal ═══ */
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.88);
            backdrop-filter: blur(20px);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: fadeIn 0.3s;
        }
        .modal.active { display: flex; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .modal-box {
            background: linear-gradient(180deg, rgba(10, 16, 32, 0.98), rgba(4, 6, 15, 0.99));
            border: 1px solid rgba(74, 122, 255, 0.2);
            border-radius: 26px;
            max-width: 640px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            padding: 26px 22px;
            box-shadow: 0 40px 100px -30px rgba(10, 26, 92, 0.9);
            animation: modalIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
        }
        @keyframes modalIn {
            from { opacity: 0; transform: translateY(24px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .modal-box::-webkit-scrollbar { width: 5px; }
        .modal-box::-webkit-scrollbar-thumb { background: rgba(74, 122, 255, 0.3); border-radius: 5px; }

        .modal-head {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }
        .modal-head-icon {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            background: rgba(74, 122, 255, 0.12);
            color: var(--blue-light);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.15rem;
            flex-shrink: 0;
        }
        .modal-head h3 {
            color: #fff;
            font-size: 1.25rem;
            font-weight: 800;
            flex: 1;
        }

        .mem-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(74, 122, 255, 0.1);
            border-radius: 16px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: 0.3s;
        }
        .mem-item:hover {
            background: rgba(74, 122, 255, 0.08);
            border-color: rgba(74, 122, 255, 0.25);
            transform: translateX(-4px);
        }
        .mem-item .mem-info { flex: 1; min-width: 0; }
        .mem-item .mem-title {
            color: #d0dcf5;
            font-weight: 700;
            font-size: 0.92rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .mem-item .mem-meta {
            color: var(--text-dimmer);
            font-size: 0.72rem;
            font-weight: 600;
            margin-top: 3px;
        }
        .mem-item .mem-del {
            background: rgba(248, 113, 113, 0.1);
            border: none;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            color: var(--danger);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            flex-shrink: 0;
            transition: 0.25s;
        }
        .mem-item .mem-del:hover { background: rgba(248, 113, 113, 0.25); transform: scale(1.08); }

        .empty-state {
            color: var(--text-dimmer);
            text-align: center;
            padding: 40px 0;
            font-size: 0.95rem;
            font-weight: 600;
        }
        .empty-state i {
            font-size: 2.5rem;
            color: var(--blue-light);
            opacity: 0.4;
            display: block;
            margin-bottom: 12px;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 18px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 11px 22px;
            border-radius: 40px;
            border: none;
            font-family: 'Cairo', sans-serif;
            font-weight: 700;
            font-size: 0.88rem;
            cursor: pointer;
            transition: 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn.primary {
            background: linear-gradient(135deg, var(--blue-deep), var(--blue-mid));
            color: #fff;
            box-shadow: 0 8px 24px -8px rgba(2, 28, 164, 0.7);
        }
        .btn.primary:hover { transform: translateY(-2px); box-shadow: 0 12px 30px -8px rgba(74, 122, 255, 0.7); }
        .btn.ghost {
            background: rgba(255, 255, 255, 0.05);
            color: #b0c4e8;
            border: 1px solid var(--border);
        }
        .btn.ghost:hover { background: rgba(74, 122, 255, 0.1); color: #fff; }
        .btn.danger {
            background: rgba(248, 113, 113, 0.1);
            color: var(--danger);
            border: 1px solid rgba(248, 113, 113, 0.25);
        }
        .btn.danger:hover { background: rgba(248, 113, 113, 0.2); }

        .setting-row {
            padding: 16px 0;
            border-bottom: 1px solid rgba(74, 122, 255, 0.08);
        }
        .setting-row:last-child { border-bottom: none; }
        .setting-label {
            display: block;
            color: #b0c4e8;
            font-size: 0.92rem;
            font-weight: 700;
            margin-bottom: 10px;
        }
        .setting-hint {
            color: var(--text-dimmer);
            font-size: 0.75rem;
            font-weight: 600;
            margin-top: 6px;
            line-height: 1.6;
        }
        select, .num-input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(74, 122, 255, 0.2);
            border-radius: 12px;
            padding: 10px 14px;
            color: var(--text);
            font-family: 'Cairo', sans-serif;
            font-size: 0.92rem;
            font-weight: 600;
            outline: none;
            transition: 0.3s;
            width: 100%;
            max-width: 240px;
        }
        select:focus, .num-input:focus { border-color: var(--blue-light); box-shadow: 0 0 0 4px rgba(74, 122, 255, 0.12); }
        select option { background: #0a0f1f; }

        .switch {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.88rem;
            color: #b0c4e8;
        }
        .switch input { display: none; }
        .switch .track {
            width: 48px;
            height: 26px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 30px;
            position: relative;
            border: 1px solid rgba(74, 122, 255, 0.15);
            transition: 0.35s;
            flex-shrink: 0;
        }
        .switch .track::before {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            background: #6a708a;
            border-radius: 50%;
            top: 2px;
            right: 3px;
            transition: 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .switch input:checked + .track {
            background: linear-gradient(135deg, var(--blue-deep), var(--blue-mid));
            border-color: transparent;
        }
        .switch input:checked + .track::before {
            transform: translateX(-22px);
            background: #fff;
        }

        .modal-text {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 16px;
            padding: 18px;
            color: #c0ccf0;
            font-size: 0.9rem;
            line-height: 1.8;
            max-height: 55vh;
            overflow-y: auto;
            border: 1px solid rgba(74, 122, 255, 0.1);
            white-space: pre-wrap;
            word-break: break-word;
            font-weight: 500;
        }

        /* ═══ Product Cards ═══ */
        .products-row-wrapper {
            width: 100%;
            overflow-x: auto;
            overflow-y: hidden;
            padding: 4px 0 10px;
            margin: 4px 0;
            scrollbar-width: thin;
        }
        .products-row-wrapper::-webkit-scrollbar { height: 5px; }
        .products-row-wrapper::-webkit-scrollbar-thumb { background: rgba(74, 122, 255, 0.3); border-radius: 5px; }
        .products-row {
            display: flex;
            gap: 14px;
            width: max-content;
            min-width: 100%;
        }
        .men-product-card {
            min-width: 250px;
            max-width: 260px;
            background: linear-gradient(160deg, rgba(12, 18, 38, 0.95), rgba(6, 10, 24, 0.98));
            border: 1px solid rgba(74, 122, 255, 0.2);
            border-radius: 20px;
            overflow: hidden;
            color: var(--text);
            flex-shrink: 0;
        }
        .men-product-card .product-image {
            width: 100%;
            height: 150px;
            object-fit: cover;
            display: block;
        }
        .men-product-card .product-content { padding: 14px 16px 16px; }
        .men-product-card .badge {
            display: inline-block;
            background: rgba(74, 122, 255, 0.12);
            color: var(--blue-light);
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 700;
            border: 1px solid rgba(74, 122, 255, 0.15);
        }
        .men-product-card h2 {
            margin: 10px 0 6px;
            font-size: 1.1rem;
            font-weight: 800;
            color: #fff;
        }
        .men-product-card p {
            color: #a0b0d4;
            line-height: 1.6;
            margin: 6px 0 14px;
            font-size: 0.8rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .men-product-card .bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }
        .men-product-card .price {
            font-size: 1.3rem;
            font-weight: 900;
            color: var(--blue-light);
        }
        .men-product-card .price small { font-size: 0.75rem; color: #6a8ab0; font-weight: 700; margin-right: 2px; }
        .men-product-card .btn-product {
            background: linear-gradient(135deg, var(--blue-deep), var(--blue-mid));
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 30px;
            font-family: 'Cairo', sans-serif;
            font-size: 0.78rem;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: 0.3s;
        }
        .men-product-card .btn-product:hover { transform: scale(1.05); }

        /* ═══ Code Blocks ═══ */
        .code-response { display: flex; flex-direction: column; gap: 10px; width: 100%; }
        .code-response .code-text { line-height: 1.8; color: #e0e8ff; margin: 0; font-size: 0.92rem; min-height: 1.5rem; }
        .code-block {
            background: #05080f;
            border: 1px solid rgba(74, 122, 255, 0.25);
            border-radius: 14px;
            margin: 4px 0;
            overflow: hidden;
            direction: ltr;
            text-align: left;
        }
        .code-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 9px 14px;
            background: linear-gradient(135deg, rgba(2, 28, 164, 0.25), rgba(74, 122, 255, 0.08));
            border-bottom: 1px solid rgba(74, 122, 255, 0.15);
            gap: 8px;
        }
        .code-lang {
            color: var(--blue-light);
            font-size: 0.72rem;
            font-weight: 800;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 6px;
            letter-spacing: 0.6px;
        }
        .code-copy-btn {
            background: rgba(74, 122, 255, 0.1);
            border: 1px solid rgba(74, 122, 255, 0.25);
            border-radius: 20px;
            padding: 4px 12px;
            color: #b0c4e8;
            font-size: 0.7rem;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: 0.25s;
        }
        .code-copy-btn:hover { background: rgba(74, 122, 255, 0.25); color: #fff; }
        .code-content {
            padding: 14px 16px;
            color: #d0dcf5;
            font-family: 'Courier New', 'Consolas', monospace;
            font-size: 0.8rem;
            line-height: 1.65;
            overflow-x: auto;
            white-space: pre;
            margin: 0;
            tab-size: 4;
        }
        .code-content::-webkit-scrollbar { height: 5px; }
        .code-content::-webkit-scrollbar-thumb { background: rgba(74, 122, 255, 0.3); border-radius: 5px; }
        .tok-keyword { color: #569cd6; font-weight: 700; }
        .tok-string { color: #ce9178; }
        .tok-comment { color: #6a9955; font-style: italic; }
        .tok-number { color: #b5cea8; }
        .tok-function { color: #dcdcaa; }

        /* ═══ Mobile Adjustments ═══ */
        @media (max-width: 640px) {
            :root { --header-h: 60px; }
            .app-header { padding: 10px 14px; }
            .brand-logo { width: 36px; height: 36px; font-size: 1rem; }
            .brand-name { font-size: 1.05rem; }
            .brand-sub { font-size: 0.62rem; }
            .btn-login { height: 38px; padding: 0 16px; font-size: 0.85rem; }
            .btn-profile { height: 38px; padding: 3px 10px 3px 3px; }
            .btn-profile img { width: 30px; height: 30px; }
            .btn-profile .p-name { display: none; }
            .messages { padding: 16px 12px 10px; gap: 11px; }
            .msg { max-width: 88%; padding: 11px 15px; font-size: 0.92rem; border-radius: 18px; }
            .welcome { padding: 30px 14px 20px; gap: 16px; }
            .welcome-logo { width: 76px; height: 76px; font-size: 2rem; border-radius: 22px; }
            .welcome-chips { gap: 6px; }
            .chip { font-size: 0.75rem; padding: 8px 13px; }
            .input-area { padding: 10px 12px max(12px, env(safe-area-inset-bottom)); }
            .input-box { padding: 5px 5px 5px 14px; border-radius: 24px; min-height: 48px; }
            .input-box textarea { font-size: 0.92rem; min-height: 38px; padding: 9px 3px 9px 0; }
            .btn-icon { width: 40px; height: 40px; min-width: 40px; font-size: 0.95rem; }
            .btn-send { width: 44px; height: 44px; min-width: 44px; }
            .side-menu { width: 88vw; }
            .modal-box { padding: 22px 18px; border-radius: 22px; }
            .modal-head h3 { font-size: 1.1rem; }
            .men-product-card { min-width: 210px; max-width: 220px; }
            .men-product-card .product-image { height: 130px; }
            .men-product-card h2 { font-size: 1rem; }
            .men-product-card .price { font-size: 1.1rem; }
            .plus-menu { min-width: 200px; right: 10px; }
            .code-content { font-size: 0.72rem; padding: 12px 14px; }
        }
        @media (max-width: 380px) {
            .brand-name { font-size: 0.95rem; }
            .chip { font-size: 0.7rem; padding: 7px 11px; }
            .msg { font-size: 0.88rem; }
        }

        /* ═══ Landscape Mobile ═══ */
        @media (max-height: 500px) and (orientation: landscape) {
            .messages { padding: 12px 16px 8px; }
            .welcome { padding: 20px 14px; gap: 12px; }
            .welcome-logo { width: 60px; height: 60px; font-size: 1.6rem; }
            .welcome-title { font-size: 1.3rem; }
        }

        /* ═══ iOS Safe Area ═══ */
        @supports (padding: env(safe-area-inset-bottom)) {
            .input-area {
                padding-bottom: max(14px, env(safe-area-inset-bottom));
            }
        }

        /* ═══ Smooth hide for iOS keyboard ═══ */
        @media (max-width: 640px) {
            html, body { height: 100vh; height: 100dvh; }
        }
    </style>
</head>
<body>
    <div class="bg-ambient"></div>
    <div class="bg-orb o1"></div>
    <div class="bg-orb o2"></div>

    <div class="app">
        <!-- ═══ HEADER ═══ -->
        <header class="app-header">
            <div class="brand">
                <div class="brand-logo"><i class="fas fa-wand-sparkles"></i></div>
                <div>
                    <div class="brand-name">MEN Ai</div>
                    <div class="brand-sub"><span class="dot"></span> متصل الآن</div>
                </div>
            </div>
            <div class="header-actions">
                <button class="btn-login" id="menLoginBtn" type="button">
                    <i class="fas fa-user"></i> <span>دخول</span>
                </button>
                <button class="btn-profile" id="menProfileBtn" type="button" style="display:none">
                    <img id="menProfileBtnAvatar" src="" alt="">
                    <span class="p-name" id="menProfileBtnName">—</span>
                </button>
            </div>
        </header>

        <!-- ═══ CHAT ═══ -->
        <div class="chat-container">
            <div class="messages" id="messagesArea"></div>
            <div class="typing" id="typingIndicator">
                <span></span><span></span><span></span>
            </div>
            <div class="input-area">
                <div class="plus-menu" id="plusMenu">
                    <button class="menu-item" id="attachOption" type="button">
                        <i class="fas fa-paperclip"></i> إرفاق ملف
                    </button>
                    <div class="menu-divider"></div>
                    <button class="menu-item disabled" id="aiAgentOption" type="button">
                        <i class="fas fa-hand-sparkles"></i> وكيل MEN Ai
                        <span class="menu-badge">قريباً</span>
                    </button>
                    <button class="menu-item disabled" id="searchBoostOption" type="button">
                        <i class="fas fa-search"></i> البحث المعزز
                        <span class="menu-badge">قريباً</span>
                    </button>
                </div>

                <div class="file-preview" id="filePreview">
                    <i class="fas fa-file"></i>
                    <span class="fname" id="fileName">ملف</span>
                    <span class="rm" id="removeFile"><i class="fas fa-times"></i></span>
                </div>

                <input type="file" id="fileInput" accept="image/*,.pdf,.doc,.docx,.txt,.csv,.xlsx,.xls" style="display:none;">

                <div class="input-row">
                    <button class="btn-icon btn-plus" id="plusBtn" type="button" title="خيارات">
                        <i class="fas fa-plus"></i>
                    </button>
                    <div class="input-box">
                        <textarea id="messageInput" rows="1" placeholder="اكتب رسالتك..."></textarea>
                    </div>
                    <button class="btn-icon btn-send" id="sendBtn" type="button" title="إرسال">
                        <i class="fas fa-arrow-up"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- ═══ SIDEBAR ═══ -->
    <div class="side-overlay" id="sideOverlay"></div>
    <aside class="side-menu" id="sideMenu">
        <div class="side-header">
            <button class="side-close" id="sideClose" type="button"><i class="fas fa-times"></i></button>
            <img class="side-avatar" id="sideAvatar" src="" alt="">
            <div class="side-name" id="sideName">—</div>
            <div class="side-email" id="sideEmail">—</div>
            <span class="side-badge"><i class="fas fa-crown"></i> عضو مميز</span>
        </div>
        <div class="side-body">
            <button class="side-item" id="sideBackBtn" type="button"><i class="fas fa-arrow-right"></i> العودة للمتجر</button>
            <button class="side-item" id="sideMemoryBtn" type="button"><i class="fas fa-brain"></i> ذاكرة الجلسات</button>
            <button class="side-item" id="sideSettingsBtn" type="button"><i class="fas fa-cog"></i> الإعدادات</button>
            <div class="side-divider"></div>
            <button class="side-item danger" id="sideLogoutBtn" type="button"><i class="fas fa-sign-out-alt"></i> تسجيل الخروج</button>
        </div>
        <div class="side-foot">MEN Ai © 2020</div>
    </aside>

    <!-- ═══ MEMORY MODAL ═══ -->
    <div class="modal" id="memoryModal">
        <div class="modal-box">
            <div class="modal-head">
                <div class="modal-head-icon"><i class="fas fa-brain"></i></div>
                <h3>ذاكرة الجلسات</h3>

    <script src="xain.js"></script>

    <script>
        // ============================================================
        //  MEN Ai — Main Chat Logic
        // ============================================================
        const TYPING_SPEED = 40;
        const CODE_TEXT_SPEED = 35;
        const CODE_BLOCK_SPEED = 6;
        const WELCOME_SPEED = 50;

        let responses = {}, mdrResponses = {}, codResponses = {}, keywordsMap = {}, products = [], customReplies = {};
        const CUSTOM_REPLIES_KEY = 'menCustomReplies';
        let attachedFile = null;
        const MEMORY_KEY = 'menChatMemory';
        const SETTINGS_KEY = 'menChatSettings';
        let maxMessagesPerSession = 6;
        let autoBoostEnabled = false;

        function loadSettings() {
            try {
                const saved = localStorage.getItem(SETTINGS_KEY);
                if (saved) {
                    const s = JSON.parse(saved);
                    maxMessagesPerSession = s.limit || 6;
                    autoBoostEnabled = s.autoBoost || false;
                    return s;
                }
            } catch(e) {}
            return { limit: 6, autoBoost: false };
        }
        function saveSettings(limit, autoBoost) {
            try { localStorage.setItem(SETTINGS_KEY, JSON.stringify({limit, autoBoost})); maxMessagesPerSession = limit; autoBoostEnabled = autoBoost; } catch(e){}
        }

        function getMemory() {
            try {
                const data = localStorage.getItem(MEMORY_KEY);
                if (data) {
                    const p = JSON.parse(data);
                    if (p.sessions && Array.isArray(p.sessions)) return p;
                }
            } catch(e){}
            return { sessions: [], currentSessionId: null };
        }
        function saveMemory(m) { try { localStorage.setItem(MEMORY_KEY, JSON.stringify(m)); } catch(e){} }
        function createNewSession(title) {
            const memory = getMemory();
            const id = Date.now().toString(36) + '_' + Math.random().toString(36).substr(2, 5);
            const session = { id, title: title || 'محادثة جديدة', messages: [], lastUpdated: new Date().toLocaleString('ar-SA', { timeZone: 'Asia/Riyadh' }) };
            memory.sessions.unshift(session);
            memory.currentSessionId = id;
            saveMemory(memory);
            return id;
        }
        function getCurrentSession() {
            const memory = getMemory();
            if (!memory.currentSessionId || !memory.sessions.some(s => s.id === memory.currentSessionId)) {
                const id = createNewSession('محادثة جديدة');
                memory.currentSessionId = id;
                saveMemory(memory);
            }
            return memory.sessions.find(s => s.id === memory.currentSessionId);
        }
        function setCurrentSession(sessionId) {
            const memory = getMemory();
            if (memory.sessions.some(s => s.id === sessionId)) {
                memory.currentSessionId = sessionId;
                saveMemory(memory);
                return true;
            }
            return false;
        }
        function saveToMemory(role, content, type = 'text', meta = null) {
            try {
                const memory = getMemory();
                let session = memory.sessions.find(s => s.id === memory.currentSessionId);
                if (!session) {
                    const id = createNewSession('محادثة جديدة');
                    memory.currentSessionId = id;
                    session = memory.sessions.find(s => s.id === id);
                }
                const timestamp = new Date().toLocaleString('ar-SA', { timeZone: 'Asia/Riyadh', hour: '2-digit', minute: '2-digit' });
                session.messages.push({ role, content, type, meta, timestamp });
                session.lastUpdated = timestamp;
                if (role === 'user' && session.messages.length === 1) {
                    session.title = content.substring(0, 30) + (content.length > 30 ? '...' : '');
                }
                if (session.messages.length > maxMessagesPerSession) {
                    const index = memory.sessions.findIndex(s => s.id === session.id);
                    if (index !== -1) {
                        memory.sessions.splice(index, 1);
                        if (memory.currentSessionId === session.id) {
                            memory.currentSessionId = null;
                            const newId = createNewSession('محادثة جديدة');
                            memory.currentSessionId = newId;
                        }
                        saveMemory(memory);
                        loadCurrentSession();
                        return;
                    }
                }
                saveMemory(memory);
            } catch(e){}
        }
        function loadMemory() {
            const memory = getMemory();
            renderMemoryList(memory.sessions);
        }
        function renderMemoryList(sessions) {
            const container = document.getElementById('memoryList');
            if (!sessions || !sessions.length) {
                container.innerHTML = '<div class="empty-state"><i class="fas fa-comments"></i>لا توجد محادثات محفوظة</div>';
                return;
            }
            container.innerHTML = sessions.map(s => `
                <div class="mem-item" data-sid="${s.id}">
                    <div class="mem-info">
                        <div class="mem-title">${escapeHtml(s.title || 'محادثة')}</div>
                        <div class="mem-meta">${s.messages.length} رسالة · ${s.lastUpdated || ''}</div>
                    </div>
                    <button class="mem-del" data-del="${s.id}"><i class="fas fa-trash"></i></button>
                </div>
            `).join('');
            container.querySelectorAll('.mem-item').forEach(el => {
                el.addEventListener('click', e => {
                    if (e.target.closest('.mem-del')) return;
                    restoreSession(el.dataset.sid);
                });
                el.querySelector('.mem-del').addEventListener('click', e => {
                    e.stopPropagation();
                    deleteSession(e.currentTarget.dataset.del);
                });
            });
        }
        function deleteSession(sessionId) {
            if (!confirm('حذف هذه المحادثة؟')) return;
            const memory = getMemory();
            const i = memory.sessions.findIndex(s => s.id === sessionId);
            if (i !== -1) {
                memory.sessions.splice(i, 1);
                if (memory.currentSessionId === sessionId) {
                    memory.currentSessionId = memory.sessions[0]?.id || null;
                    if (!memory.currentSessionId) {
                        const id = createNewSession('محادثة جديدة');
                        memory.currentSessionId = id;
                    }
                }
                saveMemory(memory);
                loadMemory();
                loadCurrentSession();
            }
        }
        function clearAllSessions() {
            if (!confirm('مسح كل المحادثات؟')) return;
            saveMemory({ sessions: [], currentSessionId: null });
            createNewSession('محادثة جديدة');
            loadMemory();
            document.getElementById('memoryModal').classList.remove('active');
            loadCurrentSession();
        }
        function restoreSession(sessionId) {
            const memory = getMemory();
            if (!memory.sessions.some(s => s.id === sessionId)) return;
            setCurrentSession(sessionId);
            document.getElementById('memoryModal').classList.remove('active');
            loadCurrentSession();
        }

        function loadCurrentSession() {
            const session = getCurrentSession();
            if (!session) return;
            const area = document.getElementById('messagesArea');
            area.innerHTML = '';
            if (!session.messages.length) {
                const div = document.createElement('div');
                div.className = 'welcome';
                div.innerHTML = `
                    <div class="welcome-logo"><i class="fas fa-wand-sparkles"></i></div>
                    <h1 class="welcome-title">مرحباً بك في <span>MEN Ai</span></h1>
                    <p class="welcome-desc">مساعدك الذكي جاهز للإجابة على أسئلتك ومساعدتك في أي شيء تحتاجه</p>
                    <div class="welcome-chips">
                        <button class="chip" data-q="متى تأسس الفريق؟"><i class="fas fa-calendar"></i> متى تأسس الفريق؟</button>
                        <button class="chip" data-q="كيف اشترك في MEN pass؟"><i class="fas fa-ticket"></i> كيف اشترك في MEN pass؟</button>
                        <button class="chip" data-q="كيف يمكنني التواصل مع الدعم؟"><i class="fas fa-headset"></i> التواصل مع الدعم</button>
                        <button class="chip" data-q="عرض المنتجات"><i class="fas fa-shopping-bag"></i> عرض المنتجات</button>
                    </div>
                `;
                area.appendChild(div);
                div.querySelectorAll('.chip').forEach(b => {
                    b.addEventListener('click', () => {
                        messageInput.value = b.dataset.q;
                        sendMessage();
                    });
                });
                return;
            }
            session.messages.forEach(msg => {
                const div = document.createElement('div');
                div.className = `msg ${msg.role}`;
                const timeHtml = `<span class="msg-time">${msg.timestamp || ''}</span>`;
                if (msg.role === 'bot' && msg.type === 'products') div.innerHTML = buildAllProductsRow() + timeHtml;
                else if (msg.role === 'bot' && msg.type === 'product' && msg.meta) div.innerHTML = `<div class="products-row-wrapper"><div class="products-row">${buildProductCard(msg.meta)}</div></div>` + timeHtml;
                else if (msg.role === 'bot' && msg.type === 'code' && msg.meta) {
                    const cr = msg.meta;
                    div.innerHTML = buildCodeHtml(cr.text || '', cr.code || '', cr.language || 'code') + timeHtml;
                    const tEl = div.querySelector('.code-text');
                    if (tEl) tEl.textContent = cr.text || '';
                    const pEl = div.querySelector('.code-content');
                    if (pEl && cr.code) { try { pEl.innerHTML = highlightCode(cr.code, cr.language); } catch(e) { pEl.textContent = cr.code; } }
                }
                else div.innerHTML = escapeHtml(msg.content) + timeHtml;
                if (msg.role === 'bot') {
                    const a = document.createElement('div');
                    a.className = 'bot-actions';
                    a.innerHTML = `<button class="copy-btn" data-content="${escapeHtml(msg.content)}"><i class="fas fa-copy"></i> نسخ</button>`;
                    div.appendChild(a);
                }
                area.appendChild(div);
            });
            scrollToBottom();
            document.querySelectorAll('.copy-btn').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    navigator.clipboard.writeText(this.dataset.content).then(() => {
                        const orig = this.innerHTML;
                        this.innerHTML = '<i class="fas fa-check"></i> تم';
                        setTimeout(() => { this.innerHTML = orig; }, 1500);
                    });
                });
            });
        }

        function loadCustomReplies() { try { customReplies = JSON.parse(localStorage.getItem(CUSTOM_REPLIES_KEY) || '{}'); } catch(e){ customReplies = {}; } }
        function mergeReplies() {
            let merged = JSON.parse(JSON.stringify(responses));
            for (const [cat, obj] of Object.entries(mdrResponses)) {
                if (!merged[cat]) merged[cat] = { keywords: [], responses: [] };
                if (obj.keywords) merged[cat].keywords = [...new Set([...merged[cat].keywords, ...obj.keywords])];
                if (obj.responses) merged[cat].responses = [...new Set([...merged[cat].responses, ...obj.responses])];
            }
            for (const [cat, obj] of Object.entries(customReplies)) {
                if (!merged[cat]) merged[cat] = { keywords: [], responses: [] };
                if (obj.keywords) merged[cat].keywords = [...new Set([...merged[cat].keywords, ...obj.keywords])];
                if (obj.responses) merged[cat].responses = [...new Set([...merged[cat].responses, ...obj.responses])];
            }
            return merged;
        }
        function rebuildKeywordsMap() {
            const m = mergeReplies();
            keywordsMap = {};
            for (const [cat, obj] of Object.entries(m)) if (obj.keywords) keywordsMap[cat] = obj.keywords.map(k => k.toLowerCase());
        }
        function getReply(category) {
            const m = mergeReplies();
            let c = m[category] || m['default'];
            if (!c || !c.responses || !c.responses.length) c = m['default'] || { responses: ['عذراً، لا يوجد رد.'] };
            return c.responses[Math.floor(Math.random() * c.responses.length)];
        }
        function getCategoryForText(text) {
            const lower = text.trim().toLowerCase();
            const m = mergeReplies();
            for (const [cat, obj] of Object.entries(m)) {
                if (obj.keywords) for (const p of obj.keywords.map(k => k.toLowerCase())) if (lower.includes(p)) return cat;
            }
            return 'default';
        }
        function evaluateMath(text) {
            const match = text.match(/(\d+)\s*([+\-*/])\s*(\d+)/);
            if (!match) return null;
            const a = parseFloat(match[1]), op = match[2], b = parseFloat(match[3]);
            if (isNaN(a) || isNaN(b)) return null;
            let r;
            switch(op){ case '+': r=a+b; break; case '-': r=a-b; break; case '*': r=a*b; break; case '/': if (b===0) return 'لا يمكن القسمة على صفر'; r=a/b; break; default: return null; }
            return Number.isInteger(r) ? r : r.toFixed(2);
        }
        function findProduct(text) {
            const lower = text.trim().toLowerCase();
            for (const p of products) {
                if (p.keywords && p.keywords.some(k => lower.includes(k.toLowerCase()))) return p;
                const n = (p.name || '').toLowerCase();
                if (n.includes(lower) || lower.includes(n)) return p;
            }
            return null;
        }
        function findCodeCategory(text) {
            const lower = text.trim().toLowerCase();
            for (const [cat, obj] of Object.entries(codResponses)) {
                if (obj.keywords) for (const kw of obj.keywords) if (lower.includes(kw.toLowerCase())) return obj;
            }
            return null;
        }
        function getCodeResponse(obj) {
            if (!obj || !obj.responses || !obj.responses.length) return null;
            return obj.responses[Math.floor(Math.random() * obj.responses.length)];
        }
        function buildCodeHtml(text, code, language) {
            let h = `<div class="code-response">`;
            if (text) h += `<p class="code-text"></p>`;
            if (code) h += `<div class="code-block"><div class="code-header"><span class="code-lang"><i class="fas fa-code"></i> ${escapeHtml(language || 'code')}</span><button class="code-copy-btn" type="button"><i class="fas fa-copy"></i> نسخ</button></div><pre class="code-content"></pre></div>`;
            h += `</div>`;
            return h;
        }

        const CODE_KEYWORDS = {
            python: ['def','class','if','elif','else','for','while','return','import','from','as','try','except','finally','with','lambda','yield','pass','break','continue','raise','in','is','not','and','or','None','True','False','async','await','self','print','input','len','range','str','int','float','list','dict','set','tuple','bool'],
            javascript: ['function','const','let','var','if','else','for','while','return','class','extends','new','this','try','catch','finally','throw','async','await','import','export','from','default','switch','case','break','continue','typeof','instanceof','null','undefined','true','false','in','of','do','console','document'],
            html: ['DOCTYPE','html','head','body','title','meta','link','script','style','div','span','p','a','img','ul','ol','li','h1','h2','h3','form','input','button','table','header','footer','nav','main','section','class','id','href','src'],
            css: ['body','html','div','span','p','a','color','background','margin','padding','border','font','display','flex','grid','width','height','position','transition','transform','opacity']
        };
        function highlightCode(code, language) {
            if (!code) return '';
            const lang = (language || 'javascript').toLowerCase();
            let text = code.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
            const stash = [];
            const stashIt = (html) => { const id = '\uE000q' + stash.length + 'q\uE001'; stash.push(html); return id; };
            text = text.replace(/("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*'|`(?:[^`\\]|\\.)*`)/g, m => stashIt('<span class="tok-string">'+m+'</span>'));
            if (lang === 'python') text = text.replace(/(#[^\n]*)/g, m => stashIt('<span class="tok-comment">'+m+'</span>'));
            else text = text.replace(/(\/\/[^\n]*)/g, m => stashIt('<span class="tok-comment">'+m+'</span>'));
            text = text.replace(/\b(\d+(?:\.\d+)?)\b/g, '<span class="tok-number">$1</span>');
            const kw = CODE_KEYWORDS[lang] || CODE_KEYWORDS.javascript;
            if (kw && kw.length) {
                const esc = kw.map(k => k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).sort((a,b)=>b.length-a.length);
                text = text.replace(new RegExp('\\b('+esc.join('|')+')\\b','g'), '<span class="tok-keyword">$1</span>');
            }
            text = text.replace(/\b([a-zA-Z_][a-zA-Z0-9_]*)\s*\(/g, (m,n) => '<span class="tok-function">'+n+'</span>(');
            text = text.replace(/\uE000q(\d+)q\uE001/g, (_, i) => stash[parseInt(i)] || '');
            return text;
        }

        function buildAllProductsRow() {
            if (!products || !products.length) return '<p style="color:#8a9abb;padding:10px 0">لا توجد منتجات.</p>';
            let h = '<div class="products-row-wrapper"><div class="products-row">';
            products.forEach(p => { h += buildProductCard(p); });
            return h + '</div></div>';
        }
        function buildProductCard(p) {
            const img = p.image || 'images/default.png';
            const name = p.name || 'منتج';
            const desc = p.description || '';
            const price = p.price || '0';
            const cur = p.currency || 'ر.س';
            const badge = p.badge || 'منتج';
            const link = p.link || '#';
            return `<div class="men-product-card">
                <img src="${img}" class="product-image" alt="${name}" onerror="this.src='images/default.png'">
                <div class="product-content">
                    <span class="badge">${badge}</span>
                    <h2>${name}</h2>
                    <p>${desc}</p>
                    <div class="bottom">
                        <div class="price">${price} <small>${cur}</small></div>
                        <button class="btn-product" onclick="window.location.href='${link}'"><i class="fas fa-arrow-left"></i> عرض</button>
                    </div>
                </div>
            </div>`;
        }

        async function extractTextFromFile(file) {
            const ft = file.type, fn = file.name.toLowerCase();
            if (ft.startsWith('image/')) {
                try { const u = URL.createObjectURL(file); const r = await Tesseract.recognize(u, 'ara'); URL.revokeObjectURL(u); return r.data.text || 'لا يوجد نص.'; }
                catch(e){ return 'خطأ في الصورة.'; }
            }
            if (ft === 'text/plain' || fn.endsWith('.txt') || ft === 'text/csv' || fn.endsWith('.csv')) {
                try { return await file.text() || 'فارغ.'; } catch(e){ return 'خطأ.'; }
            }
            if (ft === 'application/pdf' || fn.endsWith('.pdf')) {
                try {
                    const b = await file.arrayBuffer();
                    const pdf = await pdfjsLib.getDocument({ data: b }).promise;
                    let t = '';
                    for (let i = 1; i <= pdf.numPages; i++) {
                        const pg = await pdf.getPage(i);
                        const tc = await pg.getTextContent();
                        t += tc.items.map(it => it.str).join(' ') + '\n';
                    }
                    return t || 'لا يوجد نص.';
                } catch(e){ return 'خطأ PDF.'; }
            }
            if (fn.endsWith('.docx')) {
                try { const b = await file.arrayBuffer(); const r = await mammoth.extractRawText({ arrayBuffer: b }); return r.value || 'فارغ.'; }
                catch(e){ return 'خطأ Word.'; }
            }
            if (fn.endsWith('.xlsx') || fn.endsWith('.xls')) {
                try {
                    const b = await file.arrayBuffer();
                    const wb = XLSX.read(b, { type: 'array' });
                    let t = '';
                    wb.SheetNames.forEach(n => {
                        const j = XLSX.utils.sheet_to_json(wb.Sheets[n]);
                        if (j.length) { t += `\n--- ${n} ---\n`; j.forEach(r => t += Object.values(r).join(' | ') + '\n'); }
                    });
                    return t || 'لا بيانات.';
                } catch(e){ return 'خطأ Excel.'; }
            }
            return 'نوع غير مدعوم.';
        }
        function showExtractedText(text) {
            document.getElementById('extractedText').textContent = text || 'لا نص.';
            document.getElementById('extractModal').classList.add('active');
        }
        document.getElementById('modalClose').addEventListener('click', () => document.getElementById('extractModal').classList.remove('active'));
