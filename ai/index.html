<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <link rel="icon" type="image/png" href="logo1.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#050810">
    <title>MEN AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body {
            height: 100%;
            overflow: hidden;
            font-family: 'Cairo', sans-serif;
            background: #050810;
            color: #e8eefc;
            overscroll-behavior: none;
            font-feature-settings: "ss01", "cv01";
        }
        :root {
            --blue-1: #0a1a5c;
            --blue-2: #1e40af;
            --blue-3: #4a7aff;
            --blue-4: #7ea6ff;
            --gold-1: #d4a548;
            --gold-2: #f5c563;
            --bg-0: #050810;
            --bg-1: #0a0f1f;
            --bg-2: #0e1428;
            --surface-1: rgba(15, 22, 44, 0.65);
            --surface-2: rgba(20, 28, 54, 0.55);
            --border-soft: rgba(122, 158, 255, 0.10);
            --border-mid: rgba(122, 158, 255, 0.18);
            --text-1: #e8eefc;
            --text-2: #a8b6d8;
            --text-3: #6a769a;
            --success: #4ade80;
            --radius-lg: 24px;
            --radius-xl: 28px;
            --header-h: 68px;
        }

        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(74, 122, 255, 0.25); border-radius: 5px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(74, 122, 255, 0.4); }

        /* ════════ BACKGROUND ════════ */
        .bg-wrap {
            position: fixed; inset: 0;
            z-index: 0; pointer-events: none;
            background:
                radial-gradient(ellipse 70% 55% at 20% 5%, rgba(30, 64, 175, 0.20) 0%, transparent 60%),
                radial-gradient(ellipse 60% 50% at 85% 95%, rgba(10, 26, 92, 0.28) 0%, transparent 60%),
                radial-gradient(ellipse at 50% 50%, #050810 0%, #03050c 100%);
        }
        .bg-wrap::after {
            content: '';
            position: absolute; inset: 0;
            background-image:
                linear-gradient(rgba(122, 158, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(122, 158, 255, 0.02) 1px, transparent 1px);
            background-size: 64px 64px;
            mask-image: radial-gradient(ellipse at center, black 20%, transparent 75%);
            -webkit-mask-image: radial-gradient(ellipse at center, black 20%, transparent 75%);
        }
        .bg-glow {
            position: fixed;
            border-radius: 50%;
            filter: blur(140px);
            pointer-events: none;
            z-index: 0;
            opacity: 0.35;
            will-change: transform;
        }
        .bg-glow.g1 {
            width: 520px; height: 520px;
            background: radial-gradient(circle, #1e3a8a 0%, transparent 70%);
            top: -200px; left: -200px;
            animation: glowFloat1 24s ease-in-out infinite;
        }
        .bg-glow.g2 {
            width: 460px; height: 460px;
            background: radial-gradient(circle, #2563eb 0%, transparent 70%);
            bottom: -200px; right: -200px;
            animation: glowFloat2 28s ease-in-out infinite;
            opacity: 0.28;
        }
        .bg-glow.g3 {
            width: 340px; height: 340px;
            background: radial-gradient(circle, #d4a548 0%, transparent 70%);
            top: 40%; right: 15%;
            animation: glowFloat1 32s ease-in-out infinite reverse;
            opacity: 0.12;
        }
        @keyframes glowFloat1 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(80px, 60px) scale(1.15); }
        }
        @keyframes glowFloat2 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(-70px, -50px) scale(1.12); }
        }

        /* ════════ APP SHELL ════════ */
        .app {
            position: relative;
            z-index: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            max-width: 920px;
            margin: 0 auto;
            width: 100%;
        }

        /* ════════ HEADER ════════ */
        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 14px 22px;
            height: var(--header-h);
            background: rgba(5, 8, 16, 0.72);
            backdrop-filter: blur(24px) saturate(150%);
            -webkit-backdrop-filter: blur(24px) saturate(150%);
            border-bottom: 1px solid var(--border-soft);
            flex-shrink: 0;
            position: relative;
            z-index: 100;
        }
        .app-header::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(122, 158, 255, 0.25), transparent);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }
        .brand-logo {
            width: 42px;
            height: 42px;
            border-radius: 13px;
            background: linear-gradient(135deg, #0a1a5c 0%, #1e40af 60%, #4a7aff 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 1.1rem;
            flex-shrink: 0;
            position: relative;
            box-shadow:
                0 8px 24px -8px rgba(74, 122, 255, 0.7),
                inset 0 1px 0 rgba(255, 255, 255, 0.15);
        }
        .brand-logo::before {
            content: '';
            position: absolute;
            inset: -3px;
            border-radius: 16px;
            background: linear-gradient(135deg, rgba(74, 122, 255, 0.35), transparent 60%);
            filter: blur(8px);
            z-index: -1;
        }
        .brand-text {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }
        .brand-name {
            font-size: 1.1rem;
            font-weight: 900;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #ffffff 30%, #a5c0ff 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            line-height: 1.15;
        }
        .brand-status {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.66rem;
            font-weight: 700;
            color: var(--success);
            margin-top: 2px;
        }
        .brand-status .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--success);
            box-shadow: 0 0 10px var(--success);
            animation: pulseDot 2.4s ease-in-out infinite;
        }
        @keyframes pulseDot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.9); }
        }

        .header-actions { display: flex; align-items: center; gap: 8px; }

        .btn-login {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, #0a1a5c, #1e40af);
            border: 1px solid rgba(74, 122, 255, 0.3);
            border-radius: 40px;
            padding: 0 20px;
            height: 42px;
            color: #fff;
            font-family: 'Cairo', sans-serif;
            font-weight: 700;
            font-size: 0.88rem;
            cursor: pointer;
            transition: 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 8px 24px -10px rgba(2, 28, 164, 0.9);
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 34px -10px rgba(74, 122, 255, 0.8);
            border-color: rgba(122, 158, 255, 0.5);
        }
        .btn-login i { font-size: 0.95rem; }

        .btn-profile {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(15, 22, 44, 0.6);
            border: 1px solid var(--border-mid);
            border-radius: 40px;
            padding: 3px 14px 3px 3px;
            height: 42px;
            cursor: pointer;
            transition: 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            font-family: 'Cairo', sans-serif;
        }
        .btn-profile:hover {
            background: rgba(30, 64, 175, 0.15);
            border-color: var(--blue-3);
            transform: translateY(-1px);
        }
        .btn-profile img {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: 2px solid rgba(122, 158, 255, 0.5);
            object-fit: cover;
            flex-shrink: 0;
        }
        .btn-profile .p-name {
            color: #d0dcf5;
            font-weight: 700;
            font-size: 0.85rem;
            max-width: 90px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ════════ CHAT AREA ════════ */
        .chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            overflow: hidden;
            position: relative;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 26px 22px 14px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: thin;
        }
        .messages::-webkit-scrollbar { width: 5px; }
        .messages::-webkit-scrollbar-thumb { background: rgba(122, 158, 255, 0.2); border-radius: 5px; }

        /* ════════ WELCOME SCREEN ════════ */
        .welcome {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 30px 18px;
            gap: 22px;
            margin: auto 0;
            animation: welcomeIn 0.9s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes welcomeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .welcome-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(74, 122, 255, 0.08);
            border: 1px solid rgba(122, 158, 255, 0.2);
            border-radius: 40px;
            padding: 7px 16px;
            font-size: 0.72rem;
            font-weight: 800;
            color: var(--blue-4);
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        .welcome-badge i { font-size: 0.75rem; }

        .welcome-logo {
            width: 96px;
            height: 96px;
            border-radius: 30px;
            background: linear-gradient(135deg, #0a1a5c 0%, #1e40af 55%, #4a7aff 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 2.6rem;
            position: relative;
            box-shadow:
                0 24px 60px -18px rgba(74, 122, 255, 0.75),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
            animation: floatLogo 6s ease-in-out infinite;
        }
        .welcome-logo::before {
            content: '';
            position: absolute;
            inset: -12px;
            border-radius: 40px;
            background: conic-gradient(from 0deg, rgba(74, 122, 255, 0.5), transparent, rgba(122, 158, 255, 0.3), transparent, rgba(74, 122, 255, 0.5));
            filter: blur(20px);
            z-index: -1;
            opacity: 0.6;
            animation: spinRing 12s linear infinite;
        }
        @keyframes spinRing { to { transform: rotate(360deg); } }
        @keyframes floatLogo {
            0%, 100% { transform: translateY(0) rotate(0); }
            50% { transform: translateY(-8px) rotate(-2deg); }
        }

        .welcome-title {
            font-size: clamp(1.7rem, 5.5vw, 2.4rem);
            font-weight: 900;
            letter-spacing: -1.2px;
            line-height: 1.2;
            background: linear-gradient(135deg, #ffffff 0%, #a5c0ff 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin: 0;
        }
        .welcome-title span {
            background: linear-gradient(135deg, #4a7aff 0%, #a5c0ff 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            display: inline-block;
        }

        .welcome-desc {
            color: var(--text-2);
            font-size: 0.94rem;
            font-weight: 500;
            max-width: 460px;
            line-height: 1.8;
            margin: 0;
        }

        /* ════════ FAQ SECTION ════════ */
        .faq-section {
            width: 100%;
            max-width: 620px;
            margin-top: 8px;
        }
        .faq-title {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 0.78rem;
            font-weight: 800;
            color: var(--text-3);
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 14px;
        }
        .faq-title i { color: var(--gold-1); font-size: 0.85rem; }

        .faq-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 10px;
            width: 100%;
        }
        .faq-btn {
            display: flex;
            align-items: center;
            gap: 11px;
            background: linear-gradient(135deg, rgba(15, 22, 44, 0.75), rgba(10, 16, 32, 0.85));
            border: 1px solid var(--border-soft);
            border-radius: 18px;
            padding: 14px 16px;
            font-family: 'Cairo', sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-1);
            text-align: right;
            cursor: pointer;
            transition: 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
            min-height: 56px;
        }
        .faq-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(74, 122, 255, 0.15), transparent 60%);
            opacity: 0;
            transition: 0.4s;
        }
        .faq-btn:hover {
            border-color: rgba(122, 158, 255, 0.35);
            transform: translateY(-3px);
            box-shadow: 0 14px 34px -14px rgba(74, 122, 255, 0.5);
        }
        .faq-btn:hover::before { opacity: 1; }
        .faq-btn:active { transform: translateY(-1px) scale(0.98); }

        .faq-icon {
            width: 36px;
            height: 36px;
            border-radius: 12px;
            background: linear-gradient(135deg, rgba(74, 122, 255, 0.15), rgba(74, 122, 255, 0.05));
            border: 1px solid rgba(122, 158, 255, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--blue-4);
            font-size: 0.9rem;
            flex-shrink: 0;
            transition: 0.4s;
        }
        .faq-btn:hover .faq-icon {
            background: linear-gradient(135deg, rgba(74, 122, 255, 0.3), rgba(74, 122, 255, 0.1));
            color: #fff;
            transform: scale(1.08);
        }
        .faq-text {
            flex: 1;
            line-height: 1.4;
            position: relative;
            z-index: 1;
            font-weight: 700;
        }

        /* ════════ MESSAGES ════════ */
        .msg {
            max-width: 82%;
            padding: 14px 18px;
            border-radius: 22px;
            font-size: 0.94rem;
            line-height: 1.8;
            word-wrap: break-word;
            animation: msgIn 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            font-weight: 500;
        }
        @keyframes msgIn {
            from { opacity: 0; transform: translateY(16px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .msg.user {
            align-self: flex-end;
            background: linear-gradient(135deg, #0a1a5c 0%, #1e40af 100%);
            color: #fff;
            border: 1px solid rgba(122, 158, 255, 0.25);
            border-bottom-left-radius: 8px;
            box-shadow:
                0 12px 30px -14px rgba(10, 26, 92, 0.9),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }
        .msg.bot {
            align-self: flex-start;
            background: linear-gradient(135deg, rgba(20, 28, 54, 0.85), rgba(12, 18, 38, 0.85));
            color: #e0e8ff;
            border: 1px solid var(--border-soft);
            border-bottom-right-radius: 8px;
            box-shadow:
                0 12px 30px -18px rgba(0, 0, 0, 0.7),
                inset 0 1px 0 rgba(122, 158, 255, 0.04);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        .msg-time {
            display: block;
            font-size: 0.62rem;
            color: rgba(168, 182, 216, 0.5);
            margin-top: 6px;
            text-align: left;
            font-weight: 600;
            letter-spacing: 0.3px;
            direction: ltr;
        }
        .msg.user .msg-time { text-align: right; color: rgba(255, 255, 255, 0.55); }

        .bot-actions {
            display: flex;
            gap: 6px;
            margin-top: 9px;
            opacity: 0.4;
            transition: opacity 0.3s;
        }
        .msg:hover .bot-actions { opacity: 1; }
        .bot-actions button {
            background: rgba(74, 122, 255, 0.08);
            border: 1px solid rgba(122, 158, 255, 0.15);
            border-radius: 20px;
            padding: 5px 12px;
            color: #b0c4e8;
            font-size: 0.72rem;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: 0.3s;
        }
        .bot-actions button:hover {
            background: rgba(74, 122, 255, 0.2);
            border-color: var(--blue-3);
            color: #fff;
        }

        /* ════════ SEARCH / THINKING INDICATOR ════════ */
        .search-indicator {
            align-self: flex-start;
            display: none;
            padding: 16px 22px;
            background: linear-gradient(135deg, rgba(20, 28, 54, 0.9), rgba(12, 18, 38, 0.9));
            border: 1px solid var(--border-soft);
            border-radius: 22px;
            border-bottom-right-radius: 8px;
            align-items: center;
            gap: 14px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            animation: msgIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 12px 30px -18px rgba(0, 0, 0, 0.7);
        }
        .search-indicator.active { display: inline-flex; }

        .search-spinner {
            width: 28px;
            height: 28px;
            position: relative;
            flex-shrink: 0;
        }
        .search-spinner .ring {
            position: absolute;
            inset: 0;
            border: 2.5px solid transparent;
            border-radius: 50%;
            border-top-color: var(--blue-3);
            border-right-color: var(--blue-4);
            animation: spinRing 0.9s linear infinite;
        }
        .search-spinner .ring:nth-child(2) {
            inset: 4px;
            border-top-color: var(--blue-4);
            border-right-color: transparent;
            border-left-color: var(--gold-1);
            animation: spinRing 1.4s linear infinite reverse;
        }
        .search-spinner .dot {
            position: absolute;
            width: 6px;
            height: 6px;
            background: var(--blue-4);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 12px var(--blue-3);
            animation: pulseDot 1.2s ease-in-out infinite;
        }

        .search-text {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .search-main {
            color: #d0dcf5;
            font-weight: 700;
            font-size: 0.88rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .search-main .shimmer {
            background: linear-gradient(90deg, #d0dcf5 0%, #7ea6ff 50%, #d0dcf5 100%);
            background-size: 200% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: shimmer 2s linear infinite;
        }
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        .search-sub {
            color: var(--text-3);
            font-size: 0.7rem;
            font-weight: 600;
        }
        .search-dots {
            display: inline-flex;
            gap: 3px;
            margin-right: 2px;
        }
        .search-dots span {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: var(--blue-4);
            animation: dotJump 1.4s ease-in-out infinite;
        }
        .search-dots span:nth-child(2) { animation-delay: 0.2s; }
        .search-dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes dotJump {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
            30% { transform: translateY(-4px); opacity: 1; }
        }

        /* ════════ INPUT AREA ════════ */
        .input-area {
            padding: 14px 18px max(16px, env(safe-area-inset-bottom));
            border-top: 1px solid var(--border-soft);
            background: rgba(5, 8, 16, 0.82);
            backdrop-filter: blur(24px) saturate(150%);
            -webkit-backdrop-filter: blur(24px) saturate(150%);
            flex-shrink: 0;
            position: relative;
        }
        .input-area::before {
            content: '';
            position: absolute;
            top: -1px;
            left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(122, 158, 255, 0.2), transparent);
        }
        .input-row {
            display: flex;
            align-items: flex-end;
            gap: 10px;
            max-width: 920px;
            margin: 0 auto;
        }
        .input-box {
            flex: 1;
            display: flex;
            align-items: flex-end;
            background: linear-gradient(135deg, rgba(15, 22, 44, 0.85), rgba(10, 16, 32, 0.9));
            border: 1.5px solid rgba(122, 158, 255, 0.15);
            border-radius: 28px;
            padding: 6px 6px 6px 18px;
            transition: 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            min-height: 54px;
            position: relative;
        }
        .input-box:focus-within {
            border-color: rgba(122, 158, 255, 0.45);
            background: linear-gradient(135deg, rgba(15, 22, 44, 0.95), rgba(10, 16, 32, 1));
            box-shadow:
                0 0 0 4px rgba(74, 122, 255, 0.1),
                0 12px 36px -16px rgba(74, 122, 255, 0.5);
        }

        .men-product-card .btn-product:hover { transform: scale(1.05); }

        /* ════════ CODE BLOCKS ════════ */
        .code-response { display: flex; flex-direction: column; gap: 10px; width: 100%; }
        .code-response .code-text { line-height: 1.8; color: #e0e8ff; margin: 0; font-size: 0.92rem; min-height: 1.5rem; }
        .code-block {
            background: #04070e;
            border: 1px solid rgba(122, 158, 255, 0.2);
            border-radius: 16px;
            margin: 4px 0;
            overflow: hidden;
            direction: ltr;
            text-align: left;
        }
        .code-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            background: linear-gradient(135deg, rgba(30, 64, 175, 0.22), rgba(74, 122, 255, 0.06));
            border-bottom: 1px solid rgba(122, 158, 255, 0.15);
            gap: 8px;
        }
        .code-lang {
            color: var(--blue-4);
            font-size: 0.72rem;
            font-weight: 800;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 6px;
            letter-spacing: 0.6px;
        }
        .code-copy-btn {
            background: rgba(74, 122, 255, 0.1);
            border: 1px solid rgba(122, 158, 255, 0.22);
            border-radius: 20px;
            padding: 5px 13px;
            color: #b0c4e8;
            font-size: 0.7rem;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: 0.3s;
        }
        .code-copy-btn:hover {
            background: rgba(74, 122, 255, 0.25);
            color: #fff;
        }
        .code-content {
            padding: 15px 17px;
            color: #d0dcf5;
            font-family: 'Courier New', 'Consolas', monospace;
            font-size: 0.8rem;
            line-height: 1.7;
            overflow-x: auto;
            white-space: pre;
            margin: 0;
            tab-size: 4;
        }
        .code-content::-webkit-scrollbar { height: 5px; }
        .code-content::-webkit-scrollbar-thumb { background: rgba(122, 158, 255, 0.25); border-radius: 5px; }
        .tok-keyword { color: #569cd6; font-weight: 700; }
        .tok-string { color: #ce9178; }
        .tok-comment { color: #6a9955; font-style: italic; }
        .tok-number { color: #b5cea8; }
        .tok-function { color: #dcdcaa; }

        /* ════════ RESPONSIVE ════════ */
        @media (max-width: 640px) {
            :root { --header-h: 62px; }
            .app-header { padding: 12px 16px; }
            .brand-logo { width: 38px; height: 38px; font-size: 1rem; border-radius: 12px; }
            .brand-name { font-size: 1rem; }
            .brand-status { font-size: 0.62rem; }
            .btn-login { height: 40px; padding: 0 16px; font-size: 0.82rem; }
            .btn-profile { height: 40px; padding: 3px 10px 3px 3px; }
            .btn-profile img { width: 32px; height: 32px; }
            .btn-profile .p-name { display: none; }
            .messages { padding: 20px 14px 12px; gap: 13px; }
            .msg { max-width: 88%; padding: 12px 16px; font-size: 0.92rem; border-radius: 20px; }
            .welcome { padding: 24px 14px; gap: 18px; }
            .welcome-logo { width: 82px; height: 82px; font-size: 2.2rem; border-radius: 26px; }
            .welcome-title { font-size: 1.6rem; }
            .welcome-desc { font-size: 0.88rem; }
            .faq-grid { grid-template-columns: 1fr; gap: 8px; }
            .faq-btn { padding: 12px 14px; font-size: 0.82rem; }
            .faq-icon { width: 34px; height: 34px; font-size: 0.85rem; }
            .input-area { padding: 12px 14px max(14px, env(safe-area-inset-bottom)); }
            .input-box { padding: 5px 5px 5px 15px; border-radius: 26px; min-height: 50px; }
            .input-box textarea { font-size: 0.92rem; min-height: 38px; padding: 10px 3px 10px 0; }
            .btn-icon { width: 42px; height: 42px; min-width: 42px; font-size: 0.95rem; }
            .btn-send { width: 46px; height: 46px; min-width: 46px; }
            .side-menu { width: 90vw; }
            .modal-box { padding: 22px 18px; border-radius: 24px; }
            .modal-head h3 { font-size: 1.1rem; }
            .men-product-card { min-width: 210px; max-width: 220px; }
            .men-product-card .product-image { height: 130px; }
            .men-product-card h2 { font-size: 1rem; }
            .men-product-card .price { font-size: 1.1rem; }
            .plus-menu { min-width: 220px; right: 14px; }
            .code-content { font-size: 0.72rem; padding: 12px 14px; }
            .search-indicator { padding: 14px 18px; }
            .search-spinner { width: 24px; height: 24px; }
        }
        @media (max-width: 380px) {
            .brand-name { font-size: 0.92rem; }
            .faq-btn { font-size: 0.78rem; padding: 11px 12px; }
            .msg { font-size: 0.88rem; }
        }

        /* ════════ iOS SAFE AREA ════════ */
        @supports (padding: env(safe-area-inset-bottom)) {
            .input-area { padding-bottom: max(14px, env(safe-area-inset-bottom)); }
        }

        /* ════════ KEYBOARD HANDLING ════════ */
        @media (max-width: 640px) {
            html, body { height: 100vh; height: 100dvh; }
        }

        /* ════════ LANDSCAPE MOBILE ════════ */
        @media (max-height: 500px) and (orientation: landscape) {
            .messages { padding: 14px 18px 8px; }
            .welcome { padding: 20px 14px; gap: 12px; }
            .welcome-logo { width: 60px; height: 60px; font-size: 1.6rem; border-radius: 18px; }
            .welcome-title { font-size: 1.3rem; }
            .welcome-desc { font-size: 0.82rem; }
            .faq-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>

    <!-- ✅ ملف المصادقة المستقل -->
    <script src="xain.js"></script>

    <script>
        // ============================================================
        //  MEN Ai — Main Chat Logic
        // ============================================================
        const TYPING_SPEED = 40;
        const CODE_TEXT_SPEED = 35;
        const CODE_BLOCK_SPEED = 6;
        const SEARCH_DELAY_MIN = 1400;
        const SEARCH_DELAY_MAX = 2400;

        let responses = {}, mdrResponses = {}, codResponses = {}, keywordsMap = {}, products = [], customReplies = {};
        const CUSTOM_REPLIES_KEY = 'menCustomReplies';
        let attachedFile = null;
        const MEMORY_KEY = 'menChatMemory';
        const SETTINGS_KEY = 'menChatSettings';
        let maxMessagesPerSession = 6;
        let autoBoostEnabled = false;

        // ═══ FAQ Questions ═══
        const FAQ_QUESTIONS = [
            { icon: 'fa-calendar-alt', q: 'متى تأسس الفريق؟' },
            { icon: 'fa-ticket-alt', q: 'كيف اشترك في MEN pass؟' },
            { icon: 'fa-headset', q: 'كيف يمكنني التواصل مع الدعم؟' },
            { icon: 'fa-shopping-bag', q: 'عرض المنتجات' },
            { icon: 'fa-crown', q: 'ما هي مميزات MEN PRO؟' },
            { icon: 'fa-download', q: 'كيف أحمل التطبيق؟' }
        ];

        function loadSettings() {
            try {
                const saved = localStorage.getItem(SETTINGS_KEY);
                if (saved) {
                    const s = JSON.parse(saved);
                    maxMessagesPerSession = s.limit || 6;
                    autoBoostEnabled = s.autoBoost || false;
                    return s;
                }
            } catch(e) {}
            return { limit: 6, autoBoost: false };
        }
        function saveSettings(limit, autoBoost) {
            try { localStorage.setItem(SETTINGS_KEY, JSON.stringify({limit, autoBoost})); maxMessagesPerSession = limit; autoBoostEnabled = autoBoost; } catch(e){}
        }

        function getMemory() {
            try {
                const data = localStorage.getItem(MEMORY_KEY);
                if (data) {
                    const p = JSON.parse(data);
                    if (p.sessions && Array.isArray(p.sessions)) return p;
                }
            } catch(e){}
            return { sessions: [], currentSessionId: null };
        }
        function saveMemory(m) { try { localStorage.setItem(MEMORY_KEY, JSON.stringify(m)); } catch(e){} }
        function createNewSession(title) {
            const memory = getMemory();
            const id = Date.now().toString(36) + '_' + Math.random().toString(36).substr(2, 5);
            const session = { id, title: title || 'محادثة جديدة', messages: [], lastUpdated: new Date().toLocaleString('ar-SA', { timeZone: 'Asia/Riyadh' }) };
            memory.sessions.unshift(session);
            memory.currentSessionId = id;
            saveMemory(memory);
            return id;
        }
        function getCurrentSession() {
            const memory = getMemory();
            if (!memory.currentSessionId || !memory.sessions.some(s => s.id === memory.currentSessionId)) {
                const id = createNewSession('محادثة جديدة');
                memory.currentSessionId = id;
                saveMemory(memory);
            }
            return memory.sessions.find(s => s.id === memory.currentSessionId);
        }
        function setCurrentSession(sessionId) {
            const memory = getMemory();
            if (memory.sessions.some(s => s.id === sessionId)) {
                memory.currentSessionId = sessionId;
                saveMemory(memory);
                return true;
            }
            return false;
        }
        function saveToMemory(role, content, type = 'text', meta = null) {
            try {
                const memory = getMemory();
                let session = memory.sessions.find(s => s.id === memory.currentSessionId);
                if (!session) {
                    const id = createNewSession('محادثة جديدة');
                    memory.currentSessionId = id;
                    session = memory.sessions.find(s => s.id === id);
                }
                const timestamp = new Date().toLocaleTimeString('ar-SA', { timeZone: 'Asia/Riyadh', hour: '2-digit', minute: '2-digit' });
                session.messages.push({ role, content, type, meta, timestamp });
                session.lastUpdated = new Date().toLocaleString('ar-SA', { timeZone: 'Asia/Riyadh' });
                if (role === 'user' && session.messages.length === 1) {
                    session.title = content.substring(0, 30) + (content.length > 30 ? '...' : '');
                }
                if (session.messages.length > maxMessagesPerSession) {
                    const index = memory.sessions.findIndex(s => s.id === session.id);
                    if (index !== -1) {
                        memory.sessions.splice(index, 1);
                        if (memory.currentSessionId === session.id) {
                            memory.currentSessionId = null;
                            const newId = createNewSession('محادثة جديدة');
                            memory.currentSessionId = newId;
                        }
                        saveMemory(memory);
                        loadCurrentSession();
                        return;
                    }
                }
                saveMemory(memory);
            } catch(e){}
        }
        function loadMemory() {
            const memory = getMemory();
            renderMemoryList(memory.sessions);
        }
        function renderMemoryList(sessions) {
            const container = document.getElementById('memoryList');
            if (!sessions || !sessions.length) {
                container.innerHTML = '<div class="empty-state"><i class="fas fa-comments"></i>لا توجد محادثات محفوظة</div>';
                return;
            }
            container.innerHTML = sessions.map(s => `
                <div class="mem-item" data-sid="${s.id}">
                    <div class="mem-info">
                        <div class="mem-title">${escapeHtml(s.title || 'محادثة')}</div>
                        <div class="mem-meta">${s.messages.length} رسالة · ${s.lastUpdated || ''}</div>
                    </div>
                    <button class="mem-del" data-del="${s.id}"><i class="fas fa-trash"></i></button>
                </div>
            `).join('');
            container.querySelectorAll('.mem-item').forEach(el => {
                el.addEventListener('click', e => {
                    if (e.target.closest('.mem-del')) return;
                    restoreSession(el.dataset.sid);
                });
                el.querySelector('.mem-del').addEventListener('click', e => {
                    e.stopPropagation();
                    deleteSession(e.currentTarget.dataset.del);
                });
            });
        }
        function deleteSession(sessionId) {
            if (!confirm('حذف هذه المحادثة؟')) return;
            const memory = getMemory();
            const i = memory.sessions.findIndex(s => s.id === sessionId);
            if (i !== -1) {
                memory.sessions.splice(i, 1);
                if (memory.currentSessionId === sessionId) {
                    memory.currentSessionId = memory.sessions[0]?.id || null;
                    if (!memory.currentSessionId) {
                        const id = createNewSession('محادثة جديدة');
                        memory.currentSessionId = id;
                    }
                }
                saveMemory(memory);
                loadMemory();
                loadCurrentSession();
            }
        }
        function clearAllSessions() {
            if (!confirm('مسح كل المحادثات؟')) return;
            saveMemory({ sessions: [], currentSessionId: null });
            createNewSession('محادثة جديدة');
            loadMemory();
            document.getElementById('memoryModal').classList.remove('active');
            loadCurrentSession();
        }
        function restoreSession(sessionId) {
            const memory = getMemory();
            if (!memory.sessions.some(s => s.id === sessionId)) return;
            setCurrentSession(sessionId);
            document.getElementById('memoryModal').classList.remove('active');
            loadCurrentSession();
        }

        function buildWelcomeScreen() {
            const faqHtml = FAQ_QUESTIONS.map(f => `
                <button class="faq-btn" data-q="${escapeHtml(f.q)}">
                    <div class="faq-icon"><i class="fas ${f.icon}"></i></div>
                    <span class="faq-text">${escapeHtml(f.q)}</span>
                </button>
            `).join('');
            return `
                <div class="welcome">
                    <span class="welcome-badge"><i class="fas fa-sparkles"></i> مدعوم بالذكاء الاصطناعي</span>
                    <div class="welcome-logo"><i class="fas fa-wand-sparkles"></i></div>
                    <h1 class="welcome-title">مرحباً بك في <span>MEN Ai</span></h1>
                    <p class="welcome-desc">مساعدك الذكي جاهز للإجابة على أسئلتك ومساعدتك في أي شيء تحتاجه — بسرعة ودقة واحترافية</p>
                    <div class="faq-section">
                        <div class="faq-title"><i class="fas fa-fire"></i> أسئلة شائعة</div>
                        <div class="faq-grid">${faqHtml}</div>
                    </div>
                </div>
            `;
        }

        function loadCurrentSession() {
            const session = getCurrentSession();
            if (!session) return;
            const area = document.getElementById('messagesArea');
            area.innerHTML = '';
            if (!session.messages.length) {
                const div = document.createElement('div');
                div.innerHTML = buildWelcomeScreen();
                area.appendChild(div);
                bindFaqButtons(area);
                return;
            }
            session.messages.forEach(msg => {
                const div = document.createElement('div');
                div.className = `msg ${msg.role}`;
                const timeHtml = `<span class="msg-time">${msg.timestamp || ''}</span>`;
                if (msg.role === 'bot' && msg.type === 'products') div.innerHTML = buildAllProductsRow() + timeHtml;
                else if (msg.role === 'bot' && msg.type === 'product' && msg.meta) div.innerHTML = `<div class="products-row-wrapper"><div class="products-row">${buildProductCard(msg.meta)}</div></div>` + timeHtml;
                else if (msg.role === 'bot' && msg.type === 'code' && msg.meta) {
                    const cr = msg.meta;
                    div.innerHTML = buildCodeHtml(cr.text || '', cr.code || '', cr.language || 'code') + timeHtml;
                    const tEl = div.querySelector('.code-text');
                    if (tEl) tEl.textContent = cr.text || '';
                    const pEl = div.querySelector('.code-content');
                    if (pEl && cr.code) { try { pEl.innerHTML = highlightCode(cr.code, cr.language); } catch(e) { pEl.textContent = cr.code; } }
                }
                else div.innerHTML = escapeHtml(msg.content) + timeHtml;
                if (msg.role === 'bot') {
                    const a = document.createElement('div');
                    a.className = 'bot-actions';
                    a.innerHTML = `<button class="copy-btn" data-content="${escapeHtml(msg.content)}"><i class="fas fa-copy"></i> نسخ</button>`;

        function mergeReplies() {
            let merged = JSON.parse(JSON.stringify(responses));
            for (const [cat, obj] of Object.entries(mdrResponses)) {
                if (!merged[cat]) merged[cat] = { keywords: [], responses: [] };
                if (obj.keywords) merged[cat].keywords = [...new Set([...merged[cat].keywords, ...obj.keywords])];
                if (obj.responses) merged[cat].responses = [...new Set([...merged[cat].responses, ...obj.responses])];
            }
            for (const [cat, obj] of Object.entries(customReplies)) {
                if (!merged[cat]) merged[cat] = { keywords: [], responses: [] };
                if (obj.keywords) merged[cat].keywords = [...new Set([...merged[cat].keywords, ...obj.keywords])];
                if (obj.responses) merged[cat].responses = [...new Set([...merged[cat].responses, ...obj.responses])];
            }
            return merged;
        }
        function rebuildKeywordsMap() {
            const m = mergeReplies();
            keywordsMap = {};
            for (const [cat, obj] of Object.entries(m)) if (obj.keywords) keywordsMap[cat] = obj.keywords.map(k => k.toLowerCase());
        }
        function getReply(category) {
            const m = mergeReplies();
            let c = m[category] || m['default'];
            if (!c || !c.responses || !c.responses.length) c = m['default'] || { responses: ['عذراً، لا يوجد رد.'] };
            return c.responses[Math.floor(Math.random() * c.responses.length)];
        }
        function getCategoryForText(text) {
            const lower = text.trim().toLowerCase();
            const m = mergeReplies();
            for (const [cat, obj] of Object.entries(m)) {
                if (obj.keywords) for (const p of obj.keywords.map(k => k.toLowerCase())) if (lower.includes(p)) return cat;
            }
            return 'default';
        }
        function evaluateMath(text) {
            const match = text.match(/(\d+)\s*([+\-*/])\s*(\d+)/);
            if (!match) return null;
            const a = parseFloat(match[1]), op = match[2], b = parseFloat(match[3]);
            if (isNaN(a) || isNaN(b)) return null;
            let r;
            switch(op){ case '+': r=a+b; break; case '-': r=a-b; break; case '*': r=a*b; break; case '/': if (b===0) return 'لا يمكن القسمة على صفر'; r=a/b; break; default: return null; }
            return Number.isInteger(r) ? r : r.toFixed(2);
        }
        function findProduct(text) {
            const lower = text.trim().toLowerCase();
            for (const p of products) {
                if (p.keywords && p.keywords.some(k => lower.includes(k.toLowerCase()))) return p;
                const n = (p.name || '').toLowerCase();
                if (n.includes(lower) || lower.includes(n)) return p;
            }
            return null;
        }
        function findCodeCategory(text) {
            const lower = text.trim().toLowerCase();
            for (const [cat, obj] of Object.entries(codResponses)) {
                if (obj.keywords) for (const kw of obj.keywords) if (lower.includes(kw.toLowerCase())) return obj;
            }

        const CODE_KEYWORDS = {
            python: ['def','class','if','elif','else','for','while','return','import','from','as','try','except','finally','with','lambda','yield','pass','break','continue','raise','in','is','not','and','or','None','True','False','async','await','self','print','input','len','range','str','int','float','list','dict','set','tuple','bool'],
            javascript: ['function','const','let','var','if','else','for','while','return','class','extends','new','this','try','catch','finally','throw','async','await','import','export','from','default','switch','case','break','continue','typeof','instanceof','null','undefined','true','false','in','of','do','console','document'],
            html: ['DOCTYPE','html','head','body','title','meta','link','script','style','div','span','p','a','img','ul','ol','li','h1','h2','h3','form','input','button','table','header','footer','nav','main','section','class','id','href','src'],
            css: ['body','html','div','span','p','a','color','background','margin','padding','border','font','display','flex','grid','width','height','position','transition','transform','opacity']
        };
        function highlightCode(code, language) {
            if (!code) return '';
            const lang = (language || 'javascript').toLowerCase();
            let text = code.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
            const stash = [];
            const stashIt = (html) => { const id = '\uE000q' + stash.length + 'q\uE001'; stash.push(html); return id; };
            text = text.replace(/("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*'|`(?:[^`\\]|\\.)*`)/g, m => stashIt('<span class="tok-string">'+m+'</span>'));
            if (lang === 'python') text = text.replace(/(#[^\n]*)/g, m => stashIt('<span class="tok-comment">'+m+'</span>'));
            else text = text.replace(/(\/\/[^\n]*)/g, m => stashIt('<span class="tok-comment">'+m+'</span>'));
            text = text.replace(/\b(\d+(?:\.\d+)?)\b/g, '<span class="tok-number">$1</span>');
            const kw = CODE_KEYWORDS[lang] || CODE_KEYWORDS.javascript;
            if (kw && kw.length) {
                const esc = kw.map(k => k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).sort((a,b)=>b.length-a.length);
                text = text.replace(new RegExp('\\b('+esc.join('|')+')\\b','g'), '<span class="tok-keyword">$1</span>');
            }
            text = text.replace(/\b([a-zA-Z_][a-zA-Z0-9_]*)\s*\(/g, (m,n) => '<span class="tok-function">'+n+'</span>(');
            text = text.replace(/\uE000q(\d+)q\uE001/g, (_, i) => stash[parseInt(i)] || '');
            return text;
        }

        async function extractTextFromFile(file) {
            const ft = file.type, fn = file.name.toLowerCase();
            if (ft.startsWith('image/')) {
                try { const u = URL.createObjectURL(file); const r = await Tesseract.recognize(u, 'ara'); URL.revokeObjectURL(u); return r.data.text || 'لا يوجد نص.'; }
                catch(e){ return 'خطأ في الصورة.'; }
            }
            if (ft === 'text/plain' || fn.endsWith('.txt') || ft === 'text/csv' || fn.endsWith('.csv')) {
                try { return await file.text() || 'فارغ.'; } catch(e){ return 'خطأ.'; }
            }
            if (ft === 'application/pdf' || fn.endsWith('.pdf')) {
                try {
                    const b = await file.arrayBuffer();
                    const pdf = await pdfjsLib.getDocument({ data: b }).promise;
                    let t = '';
                    for (let i = 1; i <= pdf.numPages; i++) {
                        const pg = await pdf.getPage(i);
                        const tc = await pg.getTextContent();
                        t += tc.items.map(it => it.str).join(' ') + '\n';
                    }
                    return t || 'لا يوجد نص.';
                } catch(e){ return 'خطأ PDF.'; }
            }
            if (fn.endsWith('.docx')) {
                try { const b = await file.arrayBuffer(); const r = await mammoth.extractRawText({ arrayBuffer: b }); return r.value || 'فارغ.'; }
                catch(e){ return 'خطأ Word.'; }
            }
            if (fn.endsWith('.xlsx') || fn.endsWith('.xls')) {
                try {
                    const b = await file.arrayBuffer();
                    const wb = XLSX.read(b, { type: 'array' });
                    let t = '';
                    wb.SheetNames.forEach(n => {
                        const j = XLSX.utils.sheet_to_json(wb.Sheets[n]);
                        if (j.length) { t += `\n--- ${n} ---\n`; j.forEach(r => t += Object.values(r).join(' | ') + '\n'); }
                    });
                    return t || 'لا بيانات.';
                } catch(e){ return 'خطأ Excel.'; }
            }
            return 'نوع غير مدعوم.';
        }

        async function generateSmartReply(text) {
            const lower = text.trim().toLowerCase();
            const codeObj = findCodeCategory(text);
            if (codeObj) {
                const r = getCodeResponse(codeObj);
                if (r) return { type: 'code', content: r };
            }
            if (lower.includes('عرض المنتجات') || lower.includes('المنتجات') || lower.includes('اشتري')) {
                return { type: 'products', content: buildAllProductsRow() };
            }
            if (lower.includes('وكيل') || lower.includes('معزز') || lower.includes('boost')) {
                return { type: 'text', content: '⏳ هذه الميزة ستكون متاحة قريباً.' };
            }
            const math = evaluateMath(text);
            if (math !== null) return { type: 'text', content: `النتيجة: **${math}**` };
            if (keywordsMap['time'] && keywordsMap['time'].some(p => lower.includes(p))) {
                const now = new Date();
                return { type: 'text', content: `الوقت: ${now.toLocaleString('ar-SA', { timeZone: 'Asia/Riyadh', hour12: true })}\nالتاريخ: ${now.toLocaleDateString('ar-SA', { timeZone: 'Asia/Riyadh' })}` };
            }
            const p = findProduct(text);
            if (p) return { type: 'product', content: `<div class="products-row-wrapper"><div class="products-row">${buildProductCard(p)}</div></div>`, product: p };
            const cat = getCategoryForText(text);
            if (cat !== 'default') return { type: 'text', content: getReply(cat) };
            return { type: 'text', content: getReply('default') };
        }

        function typeText(el, text, speed = 20) {
            return new Promise(r => {
                let i = 0; el.innerHTML = '';
                const iv = setInterval(() => {
                    if (i < text.length) {
                        const ch = text.charAt(i);
                        el.innerHTML += ch === '\n' ? '<br>' : ch;
                        i++; scrollToBottom();
                    } else { clearInterval(iv); r(); }
                }, speed);
            });
        }
        function typeTextInto(el, text, speed) {
            return new Promise(r => {
                let i = 0; el.textContent = '';
                const iv = setInterval(() => {
                    if (i < text.length) { el.textContent += text.charAt(i); i++; scrollToBottom(); }
                    else { clearInterval(iv); r(); }
                }, speed);
            });
        }
        function scrollToBottom() { const a = document.getElementById('messagesArea'); a.scrollTop = a.scrollHeight; }
        function escapeHtml(text) { const d = document.createElement('div'); d.textContent = text; return d.innerHTML; }
        function delay(ms) { return new Promise(r => setTimeout(r, ms)); }

        async function sendMessage() {

            }
            const text = messageInput.value.trim();
            if (!text && !attachedFile) return;

            isProcessing = true;
            sendBtn.disabled = true;

            try {
                let fileText = '';

                let userContent = text;
                if (attachedFile) userContent += `\n[ملف: ${attachedFile.name}]\n${fileText}`;

        async function loadMdr() { try { const r = await fetch('mdr.json'); if (r.ok) mdrResponses = await r.json(); } catch(e){ mdrResponses = {}; } }
        async function loadCod() { try { const r = await fetch('cod.json'); if (r.ok) codResponses = await r.json(); } catch(e){ codResponses = {}; } }
        async function loadProducts() { try { const r = await fetch('products.json'); if (r.ok) products = await r.json(); } catch(e){ products = []; } }
        function loadExternalLibraries() {
            return new Promise(resolve => {
                let n = 0; const total = 4;
                const check = () => { if (++n >= total) resolve(); };
                ['https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js',
                 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js',
                 'https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js',
                 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'].forEach(src => {
                    const s = document.createElement('script');
                    s.src = src; s.onload = check; s.onerror = check;
                    document.head.appendChild(s);
                });
                setTimeout(resolve, 8000);
            });
        }

        // ═══ Sidebar Logic ═══
        const sideMenu = document.getElementById('sideMenu');
        const sideOverlay = document.getElementById('sideOverlay');
        function openSide() { sideMenu.classList.add('open'); sideOverlay.classList.add('show'); }
        function closeSide() { sideMenu.classList.remove('open'); sideOverlay.classList.remove('show'); }

        sideOverlay.addEventListener('click', closeSide);
        document.getElementById('sideClose').addEventListener('click', closeSide);

        document.getElementById('sideBackBtn').addEventListener('click', () => {
            closeSide();
            if (document.referrer) window.history.back();
            else window.location.href = '/';
        });
        document.getElementById('sideMemoryBtn').addEventListener('click', () => {
            closeSide();
            loadMemory();
            document.getElementById('memoryModal').classList.add('active');
        });
        document.getElementById('sideSettingsBtn').addEventListener('click', () => {
            closeSide();
            const s = loadSettings();
            document.getElementById('memoryLimitSelect').value = s.limit || 6;
            document.getElementById('autoBoostToggle').checked = s.autoBoost || false;
            document.getElementById('settingsModal').classList.add('active');
        });
        document.getElementById('sideLogoutBtn').addEventListener('click', () => {
            closeSide();
            if (confirm('تسجيل الخروج؟')) window.MEN_AUTH?.logout();
        });

        document.getElementById('menLoginBtn').addEventListener('click', () => window.MEN_AUTH?.open('login'));
        document.getElementById('menProfileBtn').addEventListener('click', openSide);

        // ═══ Auth UI Sync ═══
        window.addEventListener('load', () => {
            if (window.MEN_AUTH) {
                window.MEN_AUTH.onAuthChange((user) => {
                    const loginBtn = document.getElementById('menLoginBtn');
                    const profileBtn = document.getElementById('menProfileBtn');
                    if (user) {
                        const name = user.user_metadata?.name || user.email.split('@')[0];
                        loginBtn.style.display = 'none';
                        profileBtn.style.display = 'flex';
                        document.getElementById('menProfileBtnAvatar').src = window.MEN_AUTH.makeAvatar(name, 100);
                        document.getElementById('menProfileBtnName').textContent = name;
                        document.getElementById('sideAvatar').src = window.MEN_AUTH.makeAvatar(name, 200);
                        document.getElementById('sideName').textContent = name;
                        document.getElementById('sideEmail').textContent = user.email;
                    } else {
                        loginBtn.style.display = 'inline-flex';
                        profileBtn.style.display = 'none';
                    }
                });
            }
        });

        // ═══ iOS zoom prevention ═══
        if (/iPad|iPhone|iPod/.test(navigator.userAgent)) {
            messageInput.style.fontSize = '16px';
        }

        // ═══ Visual viewport (keyboard handling) ═══
        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', () => {
                scrollToBottom();
            });
        }

        // ═══ Init ═══
        async function init() {
            messageInput.disabled = true;
            sendBtn.disabled = true;
            await loadExternalLibraries();
            await Promise.all([loadResponses(), loadMdr(), loadCod(), loadProducts()]);
            loadCustomReplies();
            rebuildKeywordsMap();
            loadSettings();
            loadCurrentSession();
            loadMemory();
            messageInput.disabled = false;
            sendBtn.disabled = false;
            console.log('%c MEN Ai Ready ', 'background:linear-gradient(135deg,#0a1a5c,#4a7aff);color:#fff;padding:8px 16px;border-radius:10px;font-weight:900');
        }
        init();
    </script>
</body>
</html>
