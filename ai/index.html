<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <link rel="icon" type="image/png" href="logo1.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEN Ai</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Cairo', sans-serif;
            background: #000000;
            color: #f0f4ff;
            min-height: 100vh;
            overflow-x: hidden;
        }
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #000000;
        }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #021ca4, #1a3a9e);
            border-radius: 12px;
        }

        .bg-ambient {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            background:
                radial-gradient(ellipse at 20% 30%, rgba(2, 28, 164, 0.15) 0%, transparent 55%),
                radial-gradient(ellipse at 80% 70%, rgba(26, 58, 158, 0.10) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, #000000 0%, #000000 100%);
            animation: ambientFloat 20s ease-in-out infinite alternate;
        }
        @keyframes ambientFloat {
            0% {
                transform: scale(1) rotate(0deg);
            }
            100% {
                transform: scale(1.05) rotate(2deg);
            }
        }

        .container {
            width: 92%;
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 18px;
        }
        :root {
            --blue-deep: #021ca4;
            --blue-mid: #1a3a9e;
            --blue-light: #4a7aff;
            --blue-glow: rgba(74, 122, 255, 0.2);
            --card-bg: rgba(10, 16, 32, 0.85);
            --card-border: rgba(2, 28, 164, 0.25);
            --radius-xl: 24px;
            --radius-2xl: 40px;
            --glow-neon: 0 0 30px rgba(74, 122, 255, 0.15);
        }

        header {
            background: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(24px);
            border-bottom: 1px solid rgba(2, 28, 164, 0.10);
            padding: 12px 0;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.8);
        }
        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 14px;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-back, .btn-memory {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(2, 28, 164, 0.15);
            border-radius: 40px;
            padding: 0 18px;
            height: 44px;
            color: #a0b0d4;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            text-decoration: none;
            font-family: 'Cairo', sans-serif;
        }
        .btn-back i, .btn-memory i {
            font-size: 1.2rem;
        }
        .btn-back .back-text, .btn-memory .memory-text {
            font-weight: 600;
            font-size: 0.95rem;
            white-space: nowrap;
        }
        .btn-back:hover, .btn-memory:hover {
            background: rgba(74, 122, 255, 0.1);
            border-color: var(--blue-light);
            color: #fff;
            transform: scale(1.03);
            box-shadow: 0 0 30px rgba(74, 122, 255, 0.1);
        }
        .btn-back:active, .btn-memory:active {
            transform: scale(0.95);
        }

        .logo img {
            height: 48px;
            filter: brightness(0) invert(1) drop-shadow(0 0 10px rgba(74, 122, 255, 0.3));
        }
        .logo h1 {
            font-size: 2rem;
            font-weight: 900;
            background: linear-gradient(135deg, #ffffff 40%, var(--blue-light));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 40px rgba(74, 122, 255, 0.2);
        }
        .logo h1 i {
            color: var(--blue-light);
            margin-left: 8px;
            font-size: 1.6rem;
            filter: drop-shadow(0 0 20px rgba(74, 122, 255, 0.3));
            animation: sparkle 2s ease-in-out infinite alternate;
        }
        @keyframes sparkle {
            0% {
                filter: drop-shadow(0 0 10px rgba(74, 122, 255, 0.2));
                transform: scale(1) rotate(0deg);
            }
            100% {
                filter: drop-shadow(0 0 30px rgba(74, 122, 255, 0.6));
                transform: scale(1.1) rotate(10deg);
            }
        }

        .chat-wrapper {
            margin: 0 0 20px;
            background: var(--card-bg);
            backdrop-filter: blur(24px);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-2xl);
            overflow: hidden;
            box-shadow: var(--glow-neon);
            display: flex;
            flex-direction: column;
            height: calc(100vh - 200px);
            min-height: 500px;
        }

        .chat-header {
            padding: 18px 24px;
            border-bottom: 1px solid rgba(2, 28, 164, 0.1);
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            background: rgba(0, 0, 0, 0.4);
        }
        .chat-header .bot-info {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .chat-header .bot-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--blue-deep), var(--blue-light));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            color: #fff;
            box-shadow: 0 0 30px rgba(74, 122, 255, 0.2);
        }
        .chat-header .bot-name {
            font-weight: 700;
            font-size: 1.2rem;
            color: #fff;
        }

        .messages-area {
            flex: 1;
            padding: 20px 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: rgba(0, 0, 0, 0.3);
        }
        .messages-area::-webkit-scrollbar {
            width: 4px;
        }
        .messages-area::-webkit-scrollbar-thumb {
            background: var(--blue-deep);
            border-radius: 12px;
        }

        .message {
            max-width: 85%;
            padding: 14px 20px;
            border-radius: var(--radius-xl);
            animation: fadeUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            word-wrap: break-word;
            line-height: 1.7;
        }
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.96);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        .message.user {
            align-self: flex-end;
            background: rgba(74, 122, 255, 0.2); /* أزرق فاتح */
            border: 1px solid rgba(74, 122, 255, 0.15);
            border-bottom-left-radius: 6px;
            box-shadow: 0 4px 20px rgba(74, 122, 255, 0.08);
        }
        .message.bot {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(2, 28, 164, 0.08);
            border-bottom-right-radius: 6px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }
        .message .msg-time {
            font-size: 0.65rem;
            color: #6a708a;
            margin-top: 6px;
            display: block;
            text-align: left;
        }
        .message.user .msg-time {
            text-align: right;
        }

        .products-row-wrapper {
            width: 100%;
            overflow-x: auto;
            overflow-y: hidden;
            padding: 6px 0 12px 0;
            margin: 4px 0;
            scrollbar-width: thin;
            scrollbar-color: var(--blue-deep) transparent;
        }
        .products-row-wrapper::-webkit-scrollbar {
            height: 4px;
        }
        .products-row-wrapper::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
        }
        .products-row-wrapper::-webkit-scrollbar-thumb {
            background: var(--blue-deep);
            border-radius: 12px;
        }

        .products-row {
            display: flex;
            flex-wrap: nowrap;
            gap: 18px;
            width: max-content;
            min-width: 100%;
            padding: 2px 2px 6px 2px;
        }

        .products-row .men-product-card {
            min-width: 260px;
            max-width: 280px;
            flex: 0 0 auto;
            margin: 0;
            transition: 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .products-row .men-product-card:hover {
            transform: translateY(-6px) scale(1.02);
        }
        .products-row .men-product-card .product-image {
            height: 160px;
            object-fit: cover;
        }
        .products-row .men-product-card .product-content {
            padding: 14px 16px 16px;
        }
        .products-row .men-product-card .product-content h2 {
            font-size: 1.2rem;
            margin: 8px 0 4px;
        }
        .products-row .men-product-card .product-content p {
            font-size: 0.8rem;
            margin: 4px 0 12px;
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .products-row .men-product-card .price {
            font-size: 1.2rem;
        }
        .products-row .men-product-card .btn-product {
            padding: 6px 14px;
            font-size: 0.75rem;
        }
        .products-row .men-product-card .badge {
            font-size: 0.7rem;
            padding: 4px 12px;
        }

        .welcome-animation {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 6px;
            width: 100%;
        }
        .welcome-main {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            font-size: 2.4rem;
            font-weight: 900;
            margin-bottom: 4px;
        }
        .welcome-main .letter {
            display: inline-block;
            background: linear-gradient(135deg, #ffffff 20%, var(--blue-light));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: bounceGlow 1.8s ease-in-out infinite alternate;
            text-shadow: 0 0 20px rgba(74, 122, 255, 0.2);
            transform-origin: center bottom;
        }
        @keyframes bounceGlow {
            0% {
                transform: translateY(0px) scale(1);
                filter: drop-shadow(0 0 5px rgba(74, 122, 255, 0.1));
            }
            100% {
                transform: translateY(-12px) scale(1.08);
                filter: drop-shadow(0 0 25px rgba(74, 122, 255, 0.6));
            }
        }

        .typewriter-container {
            font-size: 1.4rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 2px;
            min-height: 2.8rem;
            direction: rtl;
        }
        .typewriter-text {
            display: inline;
            color: #c0ccf0;
        }
        .typewriter-text .highlight {
            background: linear-gradient(135deg, var(--blue-light), #a0c0ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-weight: 900;
        }
        .typewriter-cursor {
            display: inline-block;
            width: 3px;
            height: 1.8rem;
            background: var(--blue-light);
            margin-right: 4px;
            animation: blinkCursor 0.7s step-end infinite;
            vertical-align: middle;
        }
        @keyframes blinkCursor {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .welcome-desc {
            font-size: 0.95rem;
            color: #8a9abb;
            margin-top: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
            opacity: 0;
            animation: fadeInUp 1s ease-out 1.8s forwards;
        }
        .welcome-desc i {
            color: var(--blue-light);
            animation: spinSlow 4s linear infinite;
        }
        @keyframes spinSlow {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .typing-indicator {
            align-self: flex-start;
            display: none;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: var(--radius-xl);
            border-bottom-right-radius: 6px;
            border: 1px solid rgba(2, 28, 164, 0.08);
            gap: 10px;
            align-items: center;
            color: #a0b0d4;
            font-size: 0.95rem;
        }
        .typing-indicator .dots {
            display: flex;
            gap: 5px;
        }
        .typing-indicator .dots span {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--blue-light);
            display: inline-block;
            animation: typingBounce 1.4s ease-in-out infinite;
        }
        .typing-indicator .dots span:nth-child(2) {
            animation-delay: 0.2s;
        }
        .typing-indicator .dots span:nth-child(3) {
            animation-delay: 0.4s;
        }
        @keyframes typingBounce {
            0%, 60%, 100% {
                transform: translateY(0);
                opacity: 0.4;
            }
            30% {
                transform: translateY(-10px);
                opacity: 1;
            }
        }
        .typing-indicator i {
            color: var(--blue-light);
            animation: spin 1s linear infinite;
            font-size: 1.1rem;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .suggested-questions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 10px 20px 4px 20px;
            background: rgba(0, 0, 0, 0.25);
            border-top: 1px solid rgba(2, 28, 164, 0.08);
            transition: all 0.3s ease;
        }
        .suggested-questions.hidden {
            display: none;
        }
        .suggested-questions .sq-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(74, 122, 255, 0.15);
            border-radius: 30px;
            padding: 8px 18px;
            font-family: 'Cairo', sans-serif;
            font-size: 0.85rem;
            color: #b0c4e8;
            cursor: pointer;
            transition: 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            white-space: nowrap;
            backdrop-filter: blur(4px);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .suggested-questions .sq-btn i {
            font-size: 0.8rem;
            opacity: 0.6;
        }
        .suggested-questions .sq-btn:hover {
            background: rgba(74, 122, 255, 0.08);
            border-color: var(--blue-light);
            color: #fff;
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 4px 20px rgba(74, 122, 255, 0.05);
        }
        .suggested-questions .sq-btn:active {
            transform: scale(0.95);
        }

        .input-area {
            padding: 12px 20px 16px;
            border-top: 1px solid rgba(2, 28, 164, 0.08);
            display: flex;
            align-items: flex-end;
            gap: 8px;
            background: rgba(0, 0, 0, 0.4);
            flex-wrap: wrap;
        }
        .input-area .input-wrapper {
            flex: 1;
            min-width: 150px;
            display: flex;
            align-items: flex-end;
            background: rgba(255, 255, 255, 0.03);
            border-radius: var(--radius-xl);
            border: 1.5px solid rgba(2, 28, 164, 0.1);
            transition: 0.3s;
            padding: 4px 16px 4px 8px;
            min-height: 52px;
        }
        .input-area .input-wrapper:focus-within {
            border-color: var(--blue-light);
            box-shadow: 0 0 30px rgba(74, 122, 255, 0.05);
        }
        .input-area .input-wrapper textarea {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #f0f4ff;
            font-size: 1rem;
            font-family: 'Cairo', sans-serif;
            resize: none;
            padding: 12px 4px;
            min-height: 44px;
            max-height: 150px;
            line-height: 1.6;
        }
        .input-area .input-wrapper textarea::placeholder {
            color: #5a607a;
        }
        .input-area .input-wrapper .char-count {
            font-size: 0.7rem;
            color: #4a5070;
            padding: 8px 4px;
            white-space: nowrap;
            direction: ltr;
        }

        .input-area .btn-send {
            width: 52px;
            height: 52px;
            min-width: 52px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, var(--blue-deep), var(--blue-mid));
            color: #fff;
            font-size: 1.4rem;
            cursor: pointer;
            transition: 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 4px 30px rgba(2, 28, 164, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            transform: none;
        }
        .input-area .btn-send::after {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(74, 122, 255, 0.4), transparent);
            opacity: 0;
            transition: 0.6s;
        }
        .input-area .btn-send:hover::after {
            opacity: 1;
        }
        .input-area .btn-send:hover {
            transform: scale(1.08);
            box-shadow: 0 8px 40px rgba(2, 28, 164, 0.4);
        }
        .input-area .btn-send:active {
            transform: scale(0.92);
        }
        .input-area .btn-send:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: scale(1);
        }

        .input-area .btn-voice {
            width: 52px;
            height: 52px;
            min-width: 52px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(2, 28, 164, 0.2);
            color: #a0b0d4;
            font-size: 1.4rem;
            cursor: pointer;
            transition: 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .input-area .btn-voice:hover {
            background: rgba(74, 122, 255, 0.08);
            border-color: var(--blue-light);
            color: #fff;
            transform: scale(1.05);
        }
        .input-area .btn-voice:active {
            transform: scale(0.92);
        }

        .input-area .btn-voice.recording {
            background: rgba(255, 50, 50, 0.2);
            border-color: #ff4444;
            color: #ff4444;
            animation: pulseMic 1s ease-in-out infinite;
            position: relative;
            z-index: 1;
        }
        .input-area .btn-voice.recording::before,
        .input-area .btn-voice.recording::after {
            content: '';
            position: absolute;
            top: -4px;
            left: -4px;
            right: -4px;
            bottom: -4px;
            border-radius: 50%;
            border: 2px solid rgba(255, 68, 68, 0.4);
            animation: ripple 1.5s ease-out infinite;
            pointer-events: none;
            z-index: -1;
        }
        .input-area .btn-voice.recording::after {
            animation-delay: 0.75s;
        }
        @keyframes ripple {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(1.8); opacity: 0; }
        }
        @keyframes pulseMic {
            0%, 100% { transform: scale(1); box-shadow: 0 0 10px rgba(255, 68, 68, 0.2); }
            50% { transform: scale(1.12); box-shadow: 0 0 30px rgba(255, 68, 68, 0.5); }
        }
        .input-area .btn-voice:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        /* زر الإرفاق معطل */
        .input-area .btn-attach {
            width: 52px;
            height: 52px;
            min-width: 52px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(2, 28, 164, 0.2);
            color: #a0b0d4;
            font-size: 1.4rem;
            cursor: not-allowed;
            transition: 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            opacity: 0.5;
            pointer-events: none; /* منع أي تفاعل */
        }
        .input-area .btn-attach.has-file {
            border-color: var(--blue-light);
            color: var(--blue-light);
            background: rgba(74, 122, 255, 0.1);
        }
        .input-area .btn-attach input[type="file"] {
            display: none; /* إخفاء الإدخال لأنه معطل */
        }

        .file-preview {
            display: none;
            padding: 6px 16px 6px 12px;
            background: rgba(74, 122, 255, 0.08);
            border-radius: 20px;
            border: 1px solid rgba(74, 122, 255, 0.15);
            font-size: 0.8rem;
            color: #a0b0d4;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
            max-width: 200px;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: 0.3s ease;
        }
        .file-preview.visible {
            display: inline-flex;
        }
        .file-preview.hidden-preview {
            display: none !important;
        }
        .file-preview .remove-file {
            cursor: pointer;
            color: #ff6b6b;
            font-size: 0.9rem;
            padding: 0 4px;
            transition: 0.3s;
        }
        .file-preview .remove-file:hover {
            transform: scale(1.2);
            color: #ff4444;
        }
        .file-preview i {
            color: var(--blue-light);
        }

        /* === مودال الذاكرة === */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(12px);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal-box {
            background: rgba(10, 16, 32, 0.98);
            border: 1px solid rgba(74, 122, 255, 0.2);
            border-radius: 28px;
            max-width: 700px;
            width: 100%;
            max-height: 85vh;
            padding: 30px 25px;
            box-shadow: 0 0 60px rgba(74, 122, 255, 0.15);

<body>
    <div class="bg-ambient"></div>

    <header>
        <div class="container header-content">
            <div class="header-left">
                <a href="#" class="btn-back" id="backBtn" title="رجوع">
                    <i class="fas fa-arrow-right"></i>
                    <span class="back-text">رجوع</span>
                </a>
                <button class="btn-memory" id="memoryBtn" title="الذاكرة">
                    <i class="fas fa-brain"></i>
                    <span class="memory-text">الذاكرة</span>
                </button>
            </div>
            
        </div>
    </header>

    <main>
        <div class="container">
            <div class="chat-wrapper">
                <div class="chat-header">
                    <div class="bot-info">
                        <div class="bot-avatar"><i class="fas fa-wand-sparkles"></i></div>
                        <div>
                            <div class="bot-name">MEN Ai</div>
                        </div>
                    </div>
                </div>

                <div class="messages-area" id="messagesArea"></div>

                <div class="typing-indicator" id="typingIndicator">
                    <i class="fas fa-circle-notch"></i>
                    <span>جار التفكير</span>
                    <span class="dots"><span></span><span></span><span></span></span>
                </div>

                <div class="suggested-questions" id="suggestedQuestions">
                    <button class="sq-btn" data-question="متى تأسس الفريق؟"><i class="fas fa-calendar-alt"></i> متى تأسس الفريق؟</button>
                    <button class="sq-btn" data-question="كيف اشترك في MEN pass؟"><i class="fas fa-ticket-alt"></i> كيف اشترك في MEN pass؟</button>
                    <button class="sq-btn" data-question="كيف يمكنني التواصل مع الدعم؟"><i class="fas fa-headset"></i> التواصل مع الدعم</button>
                </div>

                <div class="input-area">
                    <!-- زر الإرفاق معطل -->
                    <button class="btn-attach" id="attachBtn" title="الإرفاق معطل" disabled>
                        <i class="fas fa-paperclip"></i>
                        <input type="file" id="fileInput" accept="image/*,.pdf,.doc,.docx,.txt,.csv,.xlsx,.xls" disabled>
                    </button>

                    <div class="file-preview" id="filePreview">
                        <i class="fas fa-file"></i>
                        <span id="fileName">ملف</span>
                        <span class="remove-file" id="removeFile"><i class="fas fa-times"></i></span>
                    </div>

                    <div class="input-wrapper">
                        <textarea id="messageInput" rows="1" placeholder="اسألني عن أي شيء..."></textarea>
                        <span class="char-count" id="charCount">0</span>
                    </div>

                    <button class="btn-voice" id="voiceBtn" title="تسجيل صوتي">
                        <i class="fas fa-microphone"></i>
                    </button>
                    <button class="btn-send" id="sendBtn" title="إرسال">
                        <i class="fas fa-arrow-up"></i>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- مودال الذاكرة -->
    <div class="modal-overlay" id="memoryModal">
        <div class="modal-box">
            <h3><i class="fas fa-brain"></i> الذاكرة المحفوظة</h3>
            <div class="memory-list" id="memoryList">
                <div class="memory-empty">لا توجد محادثات محفوظة بعد.</div>

    <script>
        // ============================================================
        //  المتغيرات العامة
        // ============================================================
        let responses = {};
        let keywordsMap = {};
        let products = [];

        const SUBSCRIPTION_KEYWORDS = [
            'اشتراك', 'اشترك', 'اشتري', 'شراء', 'طلب', 'طلب منتج',
            'MEN', 'pro', 'باقة', 'عرض', 'خصم', 'سعر', 'كم سعر',
            'كيف اشترك', 'اريد اشتراك', 'ابي اشتراك', 'ابغى اشتراك'
        ];

        let attachedFile = null;
        let extractedText = '';

        // ============================================================
        //  دوال الردود والمنتجات (نفس الكود السابق)
        // ============================================================
        function getReply(category) {
            const list = responses[category]?.responses;
            if (!list || list.length === 0) return getReply('default');
            return list[Math.floor(Math.random() * list.length)];
        }

        function buildKeywordsMap(data) {
            const map = {};
            for (const [cat, obj] of Object.entries(data)) {
                if (obj.keywords && Array.isArray(obj.keywords)) {
                    map[cat] = obj.keywords.map(k => k.toLowerCase());
                }
            }
            return map;
        }

        function getCategoryForText(text) {
            const lower = text.trim().toLowerCase();
            for (const [cat, patterns] of Object.entries(keywordsMap)) {
                for (const pattern of patterns) {
                    if (lower.includes(pattern)) return cat;
                }
            }
            return 'default';
        }

        function evaluateMath(text) {
            const match = text.match(/(\d+)\s*([+\-*/])\s*(\d+)/);
            if (!match) return null;
            const a = parseFloat(match[1]),
                op = match[2],
                b = parseFloat(match[3]);
            if (isNaN(a) || isNaN(b)) return null;
            let result;
            switch (op) {
                case '+':
                    result = a + b;
                    break;
                case '-':
                    result = a - b;
                    break;
                case '*':
                    result = a * b;
                    break;
                case '/':
                    if (b === 0) return 'لا يمكن القسمة على صفر';
                    result = a / b;
                    break;
                default:
                    return null;
            }
            return Number.isInteger(result) ? result : result.toFixed(2);
        }

        function findProduct(text) {
            const lower = text.trim().toLowerCase();
            for (const product of products) {
                if (product.keywords && product.keywords.some(k => lower.includes(k.toLowerCase()))) return product;
                const name = (product.name || '').toLowerCase();
                const desc = (product.description || '').toLowerCase();
                if (name.includes(lower) || lower.includes(name) || desc.includes(lower) || lower.includes(desc))
                    return product;
            }
            return null;
        }

        function isSubscriptionRequest(text) {
            const lower = text.trim().toLowerCase();
            return SUBSCRIPTION_KEYWORDS.some(k => lower.includes(k.toLowerCase()));
        }

        function buildAllProductsRow() {
            if (!products || products.length === 0)
                return '<p style="color: #8a9abb; padding: 10px 0;">لا توجد منتجات متاحة حالياً.</p>';

            products.forEach(p => { html += buildProductCard(p); });
            html += '</div></div>';
            return html;
        }

        function buildProductCard(product) {
            const image = product.image || 'images/default.png';
            const name = product.name || 'منتج';
            const description = product.description || 'لا يوجد وصف';
            const price = product.price || '0';
            const currency = product.currency || 'ر.س';
            const badge = product.badge || ' منتج';
            const link = product.link || '#';
            return `
                <div class="men-product-card">
                    <img src="${image}" class="product-image" alt="${name}" onerror="this.src='images/default.png'">
                    <div class="product-content">

        // ============================================================
        //  دوال استخراج النص من الملفات (كما هي)
        // ============================================================
        async function extractTextFromFile(file) {
            const fileType = file.type;
            const fileName = file.name.toLowerCase();

            if (fileType.startsWith('image/')) {
                try {
                    const imageUrl = URL.createObjectURL(file);
                    const result = await Tesseract.recognize(imageUrl, 'ara');
                    URL.revokeObjectURL(imageUrl);
                    return result.data.text || 'لم يتم التعرف على أي نص في الصورة.';
                } catch (e) { return 'حدث خطأ أثناء معالجة الصورة.'; }
            }
            if (fileType === 'text/plain' || fileName.endsWith('.txt')) {
                try { return await file.text() || 'الملف فارغ.'; } catch (e) { return 'حدث خطأ أثناء قراءة الملف النصي.'; }
            }
            if (fileType === 'application/pdf' || fileName.endsWith('.pdf')) {
                try {
                    const arrayBuffer = await file.arrayBuffer();
                    const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                    let fullText = '';
                    for (let i = 1; i <= pdf.numPages; i++) {
                        const page = await pdf.getPage(i);
                        const textContent = await page.getTextContent();
                        fullText += textContent.items.map(item => item.str).join(' ') + '\n';
                    }
                    return fullText || 'لم يتم العثور على نص في ملف PDF.';
                } catch (e) { return 'حدث خطأ أثناء قراءة ملف PDF.'; }
            }
            if (fileType === 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' || fileName.endsWith(
                    '.docx')) {
                try {
                    const arrayBuffer = await file.arrayBuffer();
                    const result = await mammoth.extractRawText({ arrayBuffer });
                    return result.value || 'الملف فارغ أو لا يحتوي على نص.';
                } catch (e) { return 'حدث خطأ أثناء قراءة ملف Word.'; }
            }
            if (fileType === 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' || fileName.endsWith(
                    '.xlsx') || fileName.endsWith('.xls')) {
                try {
                    const arrayBuffer = await file.arrayBuffer();
                    const workbook = XLSX.read(arrayBuffer, { type: 'array' });
                    let allText = '';
                    workbook.SheetNames.forEach(sheetName => {
                        const sheet = workbook.Sheets[sheetName];
                        const json = XLSX.utils.sheet_to_json(sheet);
                        if (json.length) {
                            allText += `\n--- ${sheetName} ---\n`;
                            json.forEach(row => { allText += Object.values(row).join(' | ') + '\n'; });
                        }
                    });
                    return allText || 'لم يتم العثور على بيانات في ملف Excel.';
                } catch (e) { return 'حدث خطأ أثناء قراءة ملف Excel.'; }
            }
            if (fileType === 'text/csv' || fileName.endsWith('.csv')) {
                try { return await file.text() || 'الملف فارغ.'; } catch (e) { return 'حدث خطأ أثناء قراءة ملف CSV.'; }
            }
            return '⚠️ نوع الملف غير مدعوم للاستخراج التلقائي.';
        }

        // ============================================================
        //  دوال المودالات (الذاكرة واستخراج النص)

        // تعطيل أي تفاعل مع الإرفاق
        const fileInput = document.getElementById('fileInput');

        // ============================================================
        //  دوال الذاكرة (مع اختصار عناوين الرسائل)
        // ============================================================
        const MEMORY_KEY = 'menChatMemory';

        /** حفظ رسالة في localStorage */
        function saveToMemory(role, content) {
            try {
                let memory = JSON.parse(localStorage.getItem(MEMORY_KEY)) || [];
                const timestamp = new Date().toLocaleString('ar-SA', { timeZone: 'Asia/Riyadh' });
                memory.push({ role, content, timestamp });
                if (memory.length > 200) memory = memory.slice(-200);
                localStorage.setItem(MEMORY_KEY, JSON.stringify(memory));
            } catch (e) {
                console.warn('فشل حفظ الذاكرة:', e);
            }
        }

        /** تحميل الذاكرة وعرضها في المودال */
        function loadMemory() {
            try {
                const memory = JSON.parse(localStorage.getItem(MEMORY_KEY)) || [];
                renderMemoryList(memory);
            } catch (e) {
                console.warn('فشل تحميل الذاكرة:', e);
                document.getElementById('memoryList').innerHTML =
                    '<div class="memory-empty">حدث خطأ في تحميل الذاكرة.</div>';
            }
        }

        /** عرض قائمة الذاكرة مع اختصار عناوين رسائل المستخدم إلى كلمتين */
        function renderMemoryList(memory) {
            const container = document.getElementById('memoryList');
            if (!memory || memory.length === 0) {
                container.innerHTML = '<div class="memory-empty">لا توجد محادثات محفوظة بعد.</div>';
                return;
            }
            const reversed = [...memory].reverse();
            let html = '';
            reversed.forEach((item, index) => {
                const originalIndex = memory.length - 1 - index;
                const roleClass = item.role === 'user' ? 'user' : 'bot';
                const roleIcon = item.role === 'user' ? '👤' : '🤖';
                let displayText = item.content;
                // اختصار رسائل المستخدم إلى أول كلمتين
                if (item.role === 'user') {
                    const words = item.content.trim().split(/\s+/);
                    if (words.length > 2) {
                        displayText = words.slice(0, 2).join(' ') + '...';
                    } else {
                        displayText = words.join(' ');
                    }
                }
                // للبوت نعرض أول 40 حرفاً
                if (item.role === 'bot' && item.content.length > 40) {
                    displayText = item.content.substring(0, 40) + '...';
                }
                html += `
                    <div class="memory-item" data-index="${originalIndex}">
                        <div class="memory-content" data-full="${escapeHtml(item.content)}">
                            <span class="memory-role ${roleClass}">${roleIcon} ${item.role === 'user' ? 'أنت' : 'MEN Ai'}</span>
                            <span class="memory-text">${escapeHtml(displayText)}</span>
                            <span class="memory-time">${item.timestamp || ''}</span>
                        </div>
                        <button class="memory-delete" data-index="${originalIndex}" title="حذف"><i class="fas fa-times"></i></button>
                    </div>
                `;
            });
            container.innerHTML = html;

            // مستمعات الأحداث
            container.querySelectorAll('.memory-item').forEach(el => {
                el.addEventListener('click', function(e) {
                    if (e.target.closest('.memory-delete')) return;
                    const idx = parseInt(this.dataset.index);
                    restoreConversation(idx);
                });
                const delBtn = el.querySelector('.memory-delete');
                delBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const idx = parseInt(this.dataset.index);
                    deleteMemoryItem(idx);
                });
            });
        }

        /** حذف عنصر واحد من الذاكرة */
        function deleteMemoryItem(index) {
            try {
                let memory = JSON.parse(localStorage.getItem(MEMORY_KEY)) || [];
                if (index >= 0 && index < memory.length) {
                    memory.splice(index, 1);
                    localStorage.setItem(MEMORY_KEY, JSON.stringify(memory));
                    loadMemory();
                }
            } catch (e) {
                console.warn('فشل حذف العنصر:', e);
            }
        }

        /** مسح كل الذاكرة */
        function clearMemory() {
            if (!confirm('هل تريد مسح كل سجل المحادثات؟')) return;
            localStorage.removeItem(MEMORY_KEY);
            loadMemory();
        }

        /** استرجاع النص الكامل للمحادثة إلى حقل الإدخال */
        function restoreConversation(index) {
            try {
                const memory = JSON.parse(localStorage.getItem(MEMORY_KEY)) || [];
                if (index < 0 || index >= memory.length) return;
                const item = memory[index];
                // نأخذ النص الكامل من العنصر المخزن
                const fullText = item.content;
                document.getElementById('messageInput').value = fullText;
                document.getElementById('messageInput').dispatchEvent(new Event('input'));
                document.getElementById('messageInput').focus();
                document.getElementById('memoryModal').classList.remove('active');
            } catch (e) {
                console.warn('فشل استرجاع المحادثة:', e);
            }
        }

        // ربط أزرار الذاكرة
        document.getElementById('memoryBtn').addEventListener('click', function() {
            loadMemory();
            document.getElementById('memoryModal').classList.add('active');
        });
        document.getElementById('memoryModalClose').addEventListener('click', function() {
            document.getElementById('memoryModal').classList.remove('active');
        });
        document.getElementById('memoryModal').addEventListener('click', function(e) {
            if (e.target === this) this.classList.remove('active');
        });
        document.getElementById('clearMemoryBtn').addEventListener('click', clearMemory);

        // ============================================================
        //  دوال إنشاء الرد الذكي (مع دمج الذاكرة)
        // ============================================================
        async function generateSmartReply(text) {
            const lower = text.trim().toLowerCase();

            const mathResult = evaluateMath(text);
            if (mathResult !== null) {
                return { type: 'text', content: ` النتيجة هي: **${mathResult}**\nهل تريد حل مسألة أخرى؟` };
            }

            if (keywordsMap['time'] && keywordsMap['time'].some(p => lower.includes(p))) {
                const now = new Date();
                const timeStr = now.toLocaleString('ar-SA', { timeZone: 'Asia/Riyadh', hour12: true });
                const dateStr = now.toLocaleDateString('ar-SA', { timeZone: 'Asia/Riyadh' });
                const template = getReply('time');
                return { type: 'text', content: template.replace(/\{time\}/g, timeStr).replace(/\{date\}/g, dateStr) };
            }

            if (isSubscriptionRequest(text)) {
                return { type: 'products', content: buildAllProductsRow() };
            }

            const product = findProduct(text);
            if (product) {
                return { type: 'product', content: `<div class="products-row-wrapper"><div class="products-row">${buildProductCard(product)}</div></div>` };
            }

            let category = getCategoryForText(text);
            if (category !== 'default' && responses[category]) {
                return { type: 'text', content: getReply(category) };
            }

            return { type: 'text', content: getReply('default') };
        }

        // ============================================================
        //  دوال واجهة المستخدم
        // ============================================================
        function buildWelcomeMessage() {
            return `
                <div class="welcome-animation">
                    <div class="welcome-main">
                        <span class="letter" style="animation-delay: 0s;"></span>
                        <span class="letter" style="animation-delay: 0.12s;"></span>
                        <span class="letter" style="animation-delay: 0.24s;"></span>
                        <span class="letter" style="animation-delay: 0.36s;"></span>
                        <span class="letter" style="animation-delay: 0.48s;"></span>
                        <span class="letter" style="animation-delay: 0.60s;"></span>
                    </div>
                    <div class="typewriter-container">
                        <span class="typewriter-text" id="typewriterText"></span>
                        <span class="typewriter-cursor" id="typewriterCursor"></span>
                    </div>
                    <div class="welcome-desc">
                        <i class="fas fa-circle-notch"></i> أنا هنا لمساعدتك اسألني عن أي شيء!
                    </div>
                </div>
            `;
        }

        function typeTextEffect(element, text, speed = 60) {
            return new Promise((resolve) => {
                let index = 0;
                element.textContent = '';
                const interval = setInterval(() => {
                    if (index < text.length) {
                        element.textContent += text.charAt(index);
                        index++;
                    } else {
                        clearInterval(interval);
                        resolve();
                    }
                }, speed);
            });
        }

        function typeText(element, text, speed = 20) {
            return new Promise((resolve) => {
                let index = 0;
                element.innerHTML = '';
                const interval = setInterval(() => {
                    if (index < text.length) {
                        element.innerHTML += text.charAt(index);
                        index++;
                        scrollToBottom();
                    } else {
                        clearInterval(interval);
                        resolve();
                    }
                }, speed);
            });
        }

        function scrollToBottom() {
            const area = document.getElementById('messagesArea');
            area.scrollTop = area.scrollHeight;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function delay(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }

        // ============================================================
        //  دوال إرسال الرسائل (مع حفظ الذاكرة)
        // ============================================================
        const messagesArea = document.getElementById('messagesArea');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const charCount = document.getElementById('charCount');
        const typingIndicator = document.getElementById('typingIndicator');
        const backBtn = document.getElementById('backBtn');
        const suggestedQuestions = document.getElementById('suggestedQuestions');
        const voiceBtn = document.getElementById('voiceBtn');

        let isProcessing = false;
        let conversationHistory = [];

        let recognition = null;
        let isRecording = false;

        // ============================================================
        //  التعرف على الصوت
        // ============================================================
        function initSpeechRecognition() {
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                voiceBtn.style.display = 'none';
                return null;
            }
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const rec = new SpeechRecognition();
            rec.lang = 'ar-SA';
            rec.continuous = false;
            rec.interimResults = true;
            rec.maxAlternatives = 1;

            rec.onresult = function(event) {
                let finalText = '';
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    if (event.results[i].isFinal) finalText += event.results[i][0].transcript;
                }
                if (finalText) {
                    messageInput.value = finalText;
                    charCount.textContent = finalText.length;
                    if (finalText.trim()) sendMessage();
                }
            };

            rec.onerror = function(event) {
                stopRecording();
                if (event.error !== 'not-allowed') {
                    const errorMsg = document.createElement('div');
                    errorMsg.className = 'message bot';
                    errorMsg.innerHTML = 'عذراً، لم أتمكن من التعرف على صوتك. حاول مرة أخرى.' +
                        `<span class="msg-time">الآن</span>`;
                    messagesArea.appendChild(errorMsg);
                    scrollToBottom();
                }
            };

            rec.onend = stopRecording;
            return rec;
        }

        function startRecording() {
            if (isRecording) { stopRecording(); return; }
            if (!recognition) {
                recognition = initSpeechRecognition();
                if (!recognition) return;
            }
            try {
                recognition.start();
                isRecording = true;
                voiceBtn.classList.add('recording');
                voiceBtn.innerHTML = '<i class="fas fa-stop"></i>';
            } catch (e) {
                if (e.message && e.message.includes('already started')) {
                    stopRecording();
                    setTimeout(() => startRecording(), 300);
                }
            }
        }

        function stopRecording() {
            if (recognition) try { recognition.stop(); } catch (e) {}
            isRecording = false;
            voiceBtn.classList.remove('recording');
            voiceBtn.innerHTML = '<i class="fas fa-microphone"></i>';
        }

        voiceBtn.addEventListener('click', function(e) {
            e.preventDefault();
            if (isProcessing) return;
            startRecording();
        });

        // ============================================================
        //  الأزرار المساعدة (الأسئلة المقترحة)
        // ============================================================
        document.querySelectorAll('.sq-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const question = this.dataset.question;
                if (question) {
                    messageInput.value = question;
                    charCount.textContent = question.length;
                    sendMessage();
                }
            });
        });

        backBtn.addEventListener('click', function(e) {
            e.preventDefault();
            if (document.referrer) window.history.back();
            else window.location.href = '/';
        });

        // ============================================================
        //  أحداث الإدخال والإرسال
        // ============================================================
        messageInput.addEventListener('input', function() {
            const len = this.value.length;
            charCount.textContent = len > 0 ? len : '0';
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 150) + 'px';
        });

        messageInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        sendBtn.addEventListener('click', sendMessage);

        // ============================================================
        //  دوال الإرسال الأساسية مع حفظ الذاكرة
        // ============================================================
        async function sendMessage() {
            const text = messageInput.value.trim();

            // الإرفاق معطل، لذا نتجاهل أي ملف مرفق
            if (attachedFile) {
                alert('عذراً، خاصية إرفاق الملفات معطلة حالياً.');
                hideAttachedFile();
                return;
            }

            if (!text || isProcessing) return;

            if (suggestedQuestions) suggestedQuestions.classList.add('hidden');

            isProcessing = true;
            sendBtn.disabled = true;
            voiceBtn.disabled = true;

            try {
                // عرض رسالة المستخدم
                const userMsg = document.createElement('div');
                userMsg.className = 'message user';
                userMsg.innerHTML = escapeHtml(text) + `<span class="msg-time">الآن</span>`;
                messagesArea.appendChild(userMsg);
                conversationHistory.push({ role: 'user', content: text });
                if (conversationHistory.length > 10) conversationHistory.shift();

                saveToMemory('user', text);

                messageInput.value = '';
                messageInput.style.height = 'auto';
                charCount.textContent = '0';
                scrollToBottom();

                typingIndicator.style.display = 'flex';
                scrollToBottom();

                await delay(800 + Math.random() * 1200);

                typingIndicator.style.display = 'none';

                const reply = await generateSmartReply(text);

                const botMsg = document.createElement('div');
                botMsg.className = 'message bot';
                messagesArea.appendChild(botMsg);
                scrollToBottom();

                let replyContent = '';
                if (reply.type === 'products' || reply.type === 'product') {
                    botMsg.innerHTML = reply.content + `<span class="msg-time">الآن</span>`;
                    replyContent = reply.type === 'products' ? 'تم عرض المنتجات' : 'تم عرض المنتج';
                    await delay(200);
                } else {
                    await typeText(botMsg, reply.content, 22);
                    const timeSpan = document.createElement('span');
                    timeSpan.className = 'msg-time';
                    timeSpan.textContent = 'الآن';
                    botMsg.appendChild(timeSpan);
                    replyContent = reply.content;
                }

                saveToMemory('bot', replyContent || 'تم عرض المنتج');

                conversationHistory.push({ role: 'bot', content: replyContent || 'تم عرض المنتج' });
                if (conversationHistory.length > 10) conversationHistory.shift();

                await sendToDiscord(text, replyContent);

            } catch (error) {
                console.error('خطأ في sendMessage:', error);
                const errorMsg = document.createElement('div');
                errorMsg.className = 'message bot';
                errorMsg.innerHTML = 'عذراً، حدث خطأ ما. يرجى المحاولة مرة أخرى.' + `<span class="msg-time">الآن</span>`;
                messagesArea.appendChild(errorMsg);
                scrollToBottom();
            } finally {
                isProcessing = false;
                sendBtn.disabled = false;
                voiceBtn.disabled = false;
                messageInput.focus();
                scrollToBottom();
            }
        }

                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },

        function loadExternalLibraries() {
            return new Promise((resolve) => {
                let loaded = 0;
                const total = 4;

                function check() { if (++loaded >= total) resolve(); }

                const tesseract = document.createElement('script');
                tesseract.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
                tesseract.onload = check;
                tesseract.onerror = check;
                document.head.appendChild(tesseract);

                const pdf = document.createElement('script');
                pdf.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
                pdf.onload = check;
                pdf.onerror = check;
                document.head.appendChild(pdf);

                const mammoth = document.createElement('script');
                mammoth.src = 'https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js';
                mammoth.onload = check;
                mammoth.onerror = check;
                document.head.appendChild(mammoth);

                const xlsx = document.createElement('script');
                xlsx.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
                xlsx.onload = check;
                xlsx.onerror = check;
                document.head.appendChild(xlsx);

                setTimeout(resolve, 8000);
            });
        }
