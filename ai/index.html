<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <link rel="icon" type="image/png" href="logo1.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEN AI </title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        /* جميع الأنماط كما هي بدون تغيير */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Cairo', sans-serif;
            background: #000000;
            color: #f0f4ff;
            min-height: 100vh;
            overflow-x: hidden;
        }
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #000000;
        }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #021ca4, #1a3a9e);
            border-radius: 12px;
        }
        .bg-ambient {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            background: radial-gradient(ellipse at 20% 30%, rgba(2, 28, 164, 0.15) 0%, transparent 55%), radial-gradient(ellipse at 80% 70%, rgba(26, 58, 158, 0.10) 0%, transparent 50%), radial-gradient(ellipse at 50% 50%, #000000 0%, #000000 100%);
            animation: ambientFloat 20s ease-in-out infinite alternate;
        }
        @keyframes ambientFloat {
            0% {
                transform: scale(1) rotate(0deg);
            }
            100% {
                transform: scale(1.05) rotate(2deg);
            }
        }
        .container {
            width: 92%;
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 18px;
        }
        :root {
            --blue-deep: #021ca4;
            --blue-mid: #1a3a9e;
            --blue-light: #4a7aff;
            --blue-glow: rgba(74, 122, 255, 0.2);
            --card-bg: rgba(10, 16, 32, 0.85);
            --card-border: rgba(2, 28, 164, 0.25);
            --radius-xl: 24px;
            --radius-2xl: 40px;
            --glow-neon: 0 0 30px rgba(74, 122, 255, 0.15);
        }
        header {
            background: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(24px);
            border-bottom: 1px solid rgba(2, 28, 164, 0.10);
            padding: 12px 0;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.8);
        }
        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 14px;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .btn-back,
        .btn-memory,
        .btn-settings {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(74, 122, 255, 0.15);
            border-radius: 40px;
            padding: 0 20px;
            height: 44px;
            color: #b0c4e8;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            text-decoration: none;
            font-family: 'Cairo', sans-serif;
            backdrop-filter: blur(8px);
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
        }
        .btn-back::before,
        .btn-memory::before,
        .btn-settings::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 40px;
            padding: 2px;
            background: linear-gradient(135deg, rgba(74, 122, 255, 0.2), transparent, rgba(74, 122, 255, 0.2));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0;
            transition: 0.6s;
        }
        .btn-back:hover::before,
        .btn-memory:hover::before,
        .btn-settings:hover::before {
            opacity: 1;
        }
        .btn-back i,
        .btn-memory i,
        .btn-settings i {
            font-size: 1.2rem;
            transition: 0.3s;
        }
        .btn-back .back-text,
        .btn-memory .memory-text,
        .btn-settings .settings-text {
            font-weight: 600;
            font-size: 0.95rem;
            white-space: nowrap;
        }
        .btn-back:hover,
        .btn-memory:hover,
        .btn-settings:hover {
            background: rgba(74, 122, 255, 0.08);
            border-color: var(--blue-light);
            color: #fff;
            transform: translateY(-2px) scale(1.03);
            box-shadow: 0 8px 30px rgba(74, 122, 255, 0.15);
        }
        .btn-back:active,
        .btn-memory:active,
        .btn-settings:active {
            transform: scale(0.95);
        }
        .btn-memory i {
            color: var(--blue-light);
        }
        .btn-memory:hover i {
            animation: pulseBrain 1.2s ease-in-out infinite;
        }
        .btn-settings i {
            color: #a0b0d4;
        }
        .btn-settings:hover i {
            animation: spinSettings 2s linear infinite;
        }
        @keyframes spinSettings {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }
        @keyframes pulseBrain {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.2) rotate(-5deg);
            }
        }
        .logo img {
            height: 48px;
            filter: brightness(0) invert(1) drop-shadow(0 0 10px rgba(74, 122, 255, 0.3));
        }
        .logo h1 {
            font-size: 2rem;
            font-weight: 900;
            background: linear-gradient(135deg, #ffffff 40%, var(--blue-light));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 40px rgba(74, 122, 255, 0.2);
        }
        .logo h1 i {
            color: var(--blue-light);
            margin-left: 8px;
            font-size: 1.6rem;
            filter: drop-shadow(0 0 20px rgba(74, 122, 255, 0.3));
            animation: sparkle 2s ease-in-out infinite alternate;
        }
        @keyframes sparkle {
            0% {
                filter: drop-shadow(0 0 10px rgba(74, 122, 255, 0.2));
                transform: scale(1) rotate(0deg);
            }
            100% {
                filter: drop-shadow(0 0 30px rgba(74, 122, 255, 0.6));
                transform: scale(1.1) rotate(10deg);
            }
        }
        .chat-wrapper {
            margin: 0 0 20px;
            background: var(--card-bg);
            backdrop-filter: blur(24px);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-2xl);
            overflow: hidden;
            box-shadow: var(--glow-neon);
            display: flex;
            flex-direction: column;
            height: calc(100vh - 200px);
            min-height: 500px;
        }
        .chat-header {
            padding: 18px 24px;
            border-bottom: 1px solid rgba(2, 28, 164, 0.1);
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            background: rgba(0, 0, 0, 0.4);
        }
        .chat-header .bot-info {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .chat-header .bot-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--blue-deep), var(--blue-light));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            color: #fff;
            box-shadow: 0 0 30px rgba(74, 122, 255, 0.2);
        }
        .chat-header .bot-name {
            font-weight: 700;
            font-size: 1.2rem;
            color: #fff;
        }
        .messages-area {
            flex: 1;
            padding: 20px 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: rgba(0, 0, 0, 0.3);
        }
        .messages-area::-webkit-scrollbar {
            width: 4px;
        }
        .messages-area::-webkit-scrollbar-thumb {
            background: var(--blue-deep);
            border-radius: 12px;
        }
        .message {
            max-width: 85%;
            padding: 14px 20px;
            border-radius: var(--radius-xl);
            animation: fadeUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            word-wrap: break-word;
            line-height: 1.7;
            position: relative;
            transition: 0.2s;
        }
        .message:hover {
            box-shadow: 0 0 20px rgba(74, 122, 255, 0.05);
        }
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.96);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        .message.user {
            align-self: flex-end;
            background: rgba(74, 122, 255, 0.2);
            border: 1px solid rgba(74, 122, 255, 0.15);
            border-bottom-left-radius: 6px;
            box-shadow: 0 4px 20px rgba(74, 122, 255, 0.08);
        }
        .message.bot {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(2, 28, 164, 0.08);
            border-bottom-right-radius: 6px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }
        .message .msg-time {
            font-size: 0.65rem;
            color: #6a708a;
            margin-top: 6px;
            display: block;
            text-align: left;
        }
        .message.user .msg-time {
            text-align: right;
        }
        .message.bot .bot-actions {
            display: flex;
            gap: 8px;
            margin-top: 8px;
            justify-content: flex-start;
            opacity: 0;
            transition: 0.3s;
        }
        .message.bot:hover .bot-actions {
            opacity: 1;
        }
        .message.bot .bot-actions button {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(74, 122, 255, 0.15);
            border-radius: 30px;
            padding: 4px 14px;
            color: #b0c4e8;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Cairo', sans-serif;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .message.bot .bot-actions button i {
            font-size: 0.9rem;
        }
        .message.bot .bot-actions button:hover {
            background: rgba(74, 122, 255, 0.12);
            border-color: var(--blue-light);
            color: #fff;
            transform: scale(1.05);
        }
        .message.bot .bot-actions button:active {
            transform: scale(0.95);
        }
        .products-row-wrapper {
            width: 100%;
            overflow-x: auto;
            overflow-y: hidden;
            padding: 6px 0 12px 0;
            margin: 4px 0;
            scrollbar-width: thin;
            scrollbar-color: var(--blue-deep) transparent;
        }
        .products-row-wrapper::-webkit-scrollbar {
            height: 4px;
        }
        .products-row-wrapper::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
        }
        .products-row-wrapper::-webkit-scrollbar-thumb {
            background: var(--blue-deep);
            border-radius: 12px;
        }
        .products-row {
            display: flex;
            flex-wrap: nowrap;
            gap: 18px;
            width: max-content;
            min-width: 100%;
            padding: 2px 2px 6px 2px;
        }
        .products-row .men-product-card {
            min-width: 260px;
            max-width: 280px;
            flex: 0 0 auto;
            margin: 0;
            transition: 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .products-row .men-product-card:hover {
            transform: translateY(-6px) scale(1.02);
        }
        .products-row .men-product-card .product-image {
            height: 160px;
            object-fit: cover;
        }
        .products-row .men-product-card .product-content {
            padding: 14px 16px 16px;
        }
        .products-row .men-product-card .product-content h2 {
            font-size: 1.2rem;
            margin: 8px 0 4px;
        }
        .products-row .men-product-card .product-content p {
            font-size: 0.8rem;
            margin: 4px 0 12px;
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .products-row .men-product-card .price {
            font-size: 1.2rem;
        }
        .products-row .men-product-card .btn-product {
            padding:
