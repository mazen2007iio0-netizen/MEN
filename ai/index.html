        document.getElementById('memoryModalClose').addEventListener('click', () => document.getElementById('memoryModal').classList.remove('active'));
        document.getElementById('memoryModal').addEventListener('click', function(e) { if (e.target === this) this.classList.remove('active'); });
        document.getElementById('clearMemoryBtn').addEventListener('click', clearAllSessions);
        document.getElementById('newSessionBtn').addEventListener('click', () => {
            const id = createNewSession('محادثة جديدة');
            setCurrentSession(id);
            document.getElementById('memoryModal').classList.remove('active');
            loadCurrentSession();
        });

        document.getElementById('settingsModalClose').addEventListener('click', () => document.getElementById('settingsModal').classList.remove('active'));
        document.getElementById('settingsModal').addEventListener('click', function(e) { if (e.target === this) this.classList.remove('active'); });
        document.getElementById('applySettingsBtn').addEventListener('click', () => {
            const v = parseInt(document.getElementById('memoryLimitSelect').value);
            const boost = document.getElementById('autoBoostToggle').checked;
            if (isNaN(v) || v < 1) { alert('قيمة غير صحيحة'); return; }
            saveSettings(v, boost);
            document.getElementById('settingsModal').classList.remove('active');
        });

        async function generateSmartReply(text) {
            const lower = text.trim().toLowerCase();
            const codeObj = findCodeCategory(text);
            if (codeObj) {
                const r = getCodeResponse(codeObj);
                if (r) return { type: 'code', content: r };
            }
            if (lower.includes('عرض المنتجات') || lower.includes('المنتجات') || lower.includes('اشتري')) {
                return { type: 'products', content: buildAllProductsRow() };
            }
            if (lower.includes('وكيل') || lower.includes('معزز') || lower.includes('boost')) {
                return { type: 'text', content: '⏳ هذه الميزة ستكون متاحة قريباً.' };
            }
            const math = evaluateMath(text);
            if (math !== null) return { type: 'text', content: `النتيجة: **${math}**` };
            if (keywordsMap['time'] && keywordsMap['time'].some(p => lower.includes(p))) {
                const now = new Date();
                return { type: 'text', content: `الوقت: ${now.toLocaleString('ar-SA', { timeZone: 'Asia/Riyadh', hour12: true })}\nالتاريخ: ${now.toLocaleDateString('ar-SA', { timeZone: 'Asia/Riyadh' })}` };
            }
            const p = findProduct(text);
            if (p) return { type: 'product', content: `<div class="products-row-wrapper"><div class="products-row">${buildProductCard(p)}</div></div>`, product: p };
            const cat = getCategoryForText(text);
            if (cat !== 'default') return { type: 'text', content: getReply(cat) };
            return { type: 'text', content: getReply('default') };
        }

        function typeText(el, text, speed = 20) {
            return new Promise(r => {
                let i = 0; el.innerHTML = '';
                const iv = setInterval(() => {
                    if (i < text.length) {
                        const ch = text.charAt(i);
                        el.innerHTML += ch === '\n' ? '<br>' : ch;
                        i++; scrollToBottom();
                    } else { clearInterval(iv); r(); }
                }, speed);
            });
        }
        function typeTextInto(el, text, speed) {
            return new Promise(r => {
                let i = 0; el.textContent = '';
                const iv = setInterval(() => {
                    if (i < text.length) { el.textContent += text.charAt(i); i++; scrollToBottom(); }
                    else { clearInterval(iv); r(); }
                }, speed);
            });
        }
        function scrollToBottom() { const a = document.getElementById('messagesArea'); a.scrollTop = a.scrollHeight; }
        function escapeHtml(text) { const d = document.createElement('div'); d.textContent = text; return d.innerHTML; }
        function delay(ms) { return new Promise(r => setTimeout(r, ms)); }

        const messagesArea = document.getElementById('messagesArea');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const typingIndicator = document.getElementById('typingIndicator');
        let isProcessing = false;

        // Auto-resize textarea
        messageInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 140) + 'px';
        });
        messageInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
        });
        sendBtn.addEventListener('click', sendMessage);

        async function sendMessage() {
            if (!window.MEN_AUTH?.isLoggedIn()) {
                window.MEN_AUTH?.open('login');
                return;
            }
            const text = messageInput.value.trim();
            if (!text && !attachedFile) return;
            if (isProcessing) return;
            isProcessing = true;
            sendBtn.disabled = true;

            try {
                let fileText = '';
                if (attachedFile) { fileText = await extractTextFromFile(attachedFile); showExtractedText(fileText); }
                let userContent = text;
                if (attachedFile) userContent += `\n[ملف: ${attachedFile.name}]\n${fileText}`;

                // Remove welcome if exists
                const welcome = messagesArea.querySelector('.welcome');
                if (welcome) welcome.remove();

                const userMsg = document.createElement('div');
                userMsg.className = 'msg user';
                let display = text || 'أرسل ملفاً';
                if (attachedFile) display += ` <span style="color:#a0c0ff;font-size:.75rem">📎 ${attachedFile.name}</span>`;
                const nowTime = new Date().toLocaleTimeString('ar-SA', { hour: '2-digit', minute: '2-digit' });
                userMsg.innerHTML = escapeHtml(display) + `<span class="msg-time">${nowTime}</span>`;
                messagesArea.appendChild(userMsg);
                scrollToBottom();
                saveToMemory('user', userContent, 'text');

                messageInput.value = '';
                messageInput.style.height = 'auto';
                typingIndicator.classList.add('active');
                scrollToBottom();
                await delay(600 + Math.random() * 800);
                typingIndicator.classList.remove('active');

                let reply = await generateSmartReply(text || fileText || 'ملف');
                if (attachedFile && fileText && reply.type === 'text') {
                    reply.content = `📎 استخرجت:\n"${fileText.substring(0, 200)}${fileText.length > 200 ? '...' : ''}"\n\n${reply.content}`;
                }

                const botMsg = document.createElement('div');
                botMsg.className = 'msg bot';
                messagesArea.appendChild(botMsg);
                scrollToBottom();

                let replyContent = '';
                if (reply.type === 'products' || reply.type === 'product') {
                    botMsg.innerHTML = reply.content + `<span class="msg-time">${nowTime}</span>`;
                    replyContent = reply.type === 'products' ? 'المنتجات' : 'المنتج';
                    const a = document.createElement('div');
                    a.className = 'bot-actions';
                    a.innerHTML = `<button class="copy-btn" data-content="${escapeHtml(replyContent)}"><i class="fas fa-copy"></i> نسخ</button>`;
                    botMsg.appendChild(a);
                } else if (reply.type === 'code') {
                    const cr = reply.content;
                    botMsg.innerHTML = buildCodeHtml('', '', cr.language);
                    const container = botMsg.querySelector('.code-response');
                    if (cr.text) {
                        const t = document.createElement('p');
                        t.className = 'code-text';
                        container.insertBefore(t, container.firstChild);
                        await typeTextInto(t, cr.text, CODE_TEXT_SPEED);
                    }
                    if (cr.code) {
                        container.insertAdjacentHTML('beforeend', `
                            <div class="code-block">
                                <div class="code-header">
                                    <span class="code-lang"><i class="fas fa-code"></i> ${escapeHtml(cr.language || 'code')}</span>
                                    <button class="code-copy-btn" type="button"><i class="fas fa-copy"></i> نسخ</button>
                                </div>
                                <pre class="code-content"></pre>
                            </div>
                        `);
                        const pre = container.querySelector('.code-content');
                        await typeTextInto(pre, cr.code, CODE_BLOCK_SPEED);
                        try { pre.innerHTML = highlightCode(cr.code, cr.language); } catch(e){}
                        const cb = container.querySelector('.code-copy-btn');
                        cb.addEventListener('click', function() {
                            const c = this.closest('.code-block').querySelector('.code-content').textContent;
                            navigator.clipboard.writeText(c).then(() => {
                                this.innerHTML = '<i class="fas fa-check"></i> تم';
                                setTimeout(() => this.innerHTML = '<i class="fas fa-copy"></i> نسخ', 1500);
                            });
                        });
                    }
                    const ts = document.createElement('span');
                    ts.className = 'msg-time'; ts.textContent = nowTime;
                    botMsg.appendChild(ts);
                    replyContent = `${cr.text || ''}\n\n\`\`\`${cr.language}\n${cr.code}\n\`\`\``;
                } else {
                    await typeText(botMsg, reply.content, TYPING_SPEED);
                    const ts = document.createElement('span');
                    ts.className = 'msg-time'; ts.textContent = nowTime;
                    botMsg.appendChild(ts);
                    replyContent = reply.content;
                    const a = document.createElement('div');
                    a.className = 'bot-actions';
                    a.innerHTML = `<button class="copy-btn" data-content="${escapeHtml(replyContent)}"><i class="fas fa-copy"></i> نسخ</button>`;
                    botMsg.appendChild(a);
                }
                botMsg.querySelectorAll('.copy-btn').forEach(b => {
                    b.addEventListener('click', function(e) {
                        e.stopPropagation();
                        navigator.clipboard.writeText(this.dataset.content).then(() => {
                            const orig = this.innerHTML;
                            this.innerHTML = '<i class="fas fa-check"></i> تم';
                            setTimeout(() => this.innerHTML = orig, 1500);
                        });
                    });
                });

                if (reply.type === 'products') saveToMemory('bot', 'المنتجات', 'products');
                else if (reply.type === 'product') saveToMemory('bot', 'المنتج', 'product', reply.product);
                else if (reply.type === 'code') saveToMemory('bot', replyContent, 'code', reply.content);
                else saveToMemory('bot', replyContent, 'text');

                if (autoBoostEnabled) {
                    await delay(600);
                    const bm = document.createElement('div');
                    bm.className = 'msg bot';
                    bm.innerHTML = 'هل تريد مساعدة إضافية؟' + `<span class="msg-time">${nowTime}</span>`;
                    messagesArea.appendChild(bm);
                    scrollToBottom();
                    saveToMemory('bot', 'هل تريد مساعدة إضافية؟', 'text');
                }

                if (attachedFile) hideAttachedFile();
            } catch(err) {
                console.error(err);
                typingIndicator.classList.remove('active');
                const em = document.createElement('div');
                em.className = 'msg bot';
                em.innerHTML = 'عذراً، حدث خطأ. حاول مرة أخرى.' + `<span class="msg-time">الآن</span>`;
                messagesArea.appendChild(em);
            } finally {
                isProcessing = false;
                sendBtn.disabled = false;
                messageInput.focus();
                scrollToBottom();
            }
        }

        async function loadResponses() {
            try { const r = await fetch('responses.json'); if (r.ok) responses = await r.json(); else throw new Error(); }
            catch(e) {
                responses = {
                    default: { keywords: ['مرحبا','السلام','اهلا'], responses: ['مرحباً! كيف يمكنني مساعدتك؟','أهلاً بك! أنا هنا للإجابة على أسئلتك.'] },
                    time: { keywords: ['وقت','ساعة'], responses: ['الوقت الآن {time}'] },
                    founding: { keywords: ['تأسس','الفريق'], responses: ['تأسس فريق MEN عام 2020.'] },
                    support: { keywords: ['دعم','تواصل'], responses: ['يمكنك التواصل مع الدعم عبر البريد: clan.men.ts@gmail.com'] }
                };
            }
        }
        async function loadMdr() { try { const r = await fetch('mdr.json'); if (r.ok) mdrResponses = await r.json(); } catch(e){ mdrResponses = {}; } }
        async function loadCod() { try { const r = await fetch('cod.json'); if (r.ok) codResponses = await r.json(); } catch(e){ codResponses = {}; } }
        async function loadProducts() { try { const r = await fetch('products.json'); if (r.ok) products = await r.json(); } catch(e){ products = []; } }
        function loadExternalLibraries() {
            return new Promise(resolve => {
                let n = 0; const total = 4;
                const check = () => { if (++n >= total) resolve(); };
                ['https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js',
                 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js',
                 'https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js',
                 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'].forEach(src => {
                    const s = document.createElement('script');
                    s.src = src; s.onload = check; s.onerror = check;
                    document.head.appendChild(s);
                });
                setTimeout(resolve, 8000);
            });
        }

        // ═══ Sidebar Logic ═══
        const sideMenu = document.getElementById('sideMenu');
        const sideOverlay = document.getElementById('sideOverlay');
        function openSide() { sideMenu.classList.add('open'); sideOverlay.classList.add('show'); }
        function closeSide() { sideMenu.classList.remove('open'); sideOverlay.classList.remove('show'); }

        sideOverlay.addEventListener('click', closeSide);
        document.getElementById('sideClose').addEventListener('click', closeSide);

        document.getElementById('sideBackBtn').addEventListener('click', () => {
            closeSide();
            if (document.referrer) window.history.back();
            else window.location.href = '/';
        });
        document.getElementById('sideMemoryBtn').addEventListener('click', () => {
            closeSide();
            loadMemory();
            document.getElementById('memoryModal').classList.add('active');
        });
        document.getElementById('sideSettingsBtn').addEventListener('click', () => {
            closeSide();
            const s = loadSettings();
            document.getElementById('memoryLimitSelect').value = s.limit || 6;
            document.getElementById('autoBoostToggle').checked = s.autoBoost || false;
            document.getElementById('settingsModal').classList.add('active');
        });
        document.getElementById('sideLogoutBtn').addEventListener('click', () => {
            closeSide();
            if (confirm('تسجيل الخروج؟')) window.MEN_AUTH?.logout();
        });

        document.getElementById('menLoginBtn').addEventListener('click', () => window.MEN_AUTH?.open('login'));
        document.getElementById('menProfileBtn').addEventListener('click', openSide);

        // ═══ Auth UI Sync ═══
        window.addEventListener('load', () => {
            if (window.MEN_AUTH) {
                window.MEN_AUTH.onAuthChange((user) => {
                    const loginBtn = document.getElementById('menLoginBtn');
                    const profileBtn = document.getElementById('menProfileBtn');
                    if (user) {
                        const name = user.user_metadata?.name || user.email.split('@')[0];
                        loginBtn.style.display = 'none';
                        profileBtn.style.display = 'flex';
                        document.getElementById('menProfileBtnAvatar').src = window.MEN_AUTH.makeAvatar(name, 100);
                        document.getElementById('menProfileBtnName').textContent = name;
                        document.getElementById('sideAvatar').src = window.MEN_AUTH.makeAvatar(name, 200);
                        document.getElementById('sideName').textContent = name;
                        document.getElementById('sideEmail').textContent = user.email;
                    } else {
                        loginBtn.style.display = 'inline-flex';
                        profileBtn.style.display = 'none';
                    }
                });
            }
        });

        // ═══ Prevent iOS zoom on input focus ═══
        if (/iPad|iPhone|iPod/.test(navigator.userAgent)) {
            messageInput.style.fontSize = '16px';
        }

        // ═══ Visual viewport for mobile keyboard ═══
        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', () => {
                scrollToBottom();
            });
        }

        // ═══ Init ═══
        async function init() {
            messageInput.disabled = true;
            sendBtn.disabled = true;
            await loadExternalLibraries();
            await Promise.all([loadResponses(), loadMdr(), loadCod(), loadProducts()]);
            loadCustomReplies();
            rebuildKeywordsMap();
            loadSettings();
            loadCurrentSession();
            loadMemory();
            messageInput.disabled = false;
            sendBtn.disabled = false;
            console.log('%c MEN Ai Ready ', 'background:linear-gradient(135deg,#021ca4,#4a7aff);color:#fff;padding:6px 14px;border-radius:8px;font-weight:900');
        }
        init();
    </script>
</body>
