#mo-error p{color:#525252;font-size:15px;max-width:500px;line-height:1.7}
#mo-error code{background:#f5f5f5;padding:12px 20px;border-radius:10px;font-family:monospace;font-size:13px;display:block;max-width:90vw;overflow-x:auto}

  function showAuthMsg(msg, ok = false) {
    const el = $('moAuthError');
    if (!el) return;
    if (!msg) { el.textContent = ''; el.classList.remove('show', 'success'); return; }
    el.innerHTML = msg;
    el.classList.add('show');
    el.classList.toggle('success', ok);
  }
  function clearAuthMsg() {
    const el = $('moAuthError');
    if (!el) return;
    el.textContent = ''; el.classList.remove('show', 'success');
  }

  async function handleAuthSubmit() {
    const btn = $('moAuthSubmit'), emailEl = $('moAuthEmail'), passEl = $('moAuthPassword'), nameEl = $('moAuthName');
    if (!btn || !emailEl || !passEl) return;
    const email = emailEl.value.trim().toLowerCase();
    const password = passEl.value;
    const name = (nameEl?.value || '').trim();
    clearAuthMsg();
    if (!email || !password) { showAuthMsg('⚠️ أكمل الحقول'); return; }
    if (!isValidEmail(email)) { showAuthMsg('⚠️ صيغة البريد خاطئة'); return; }
    if (password.length < 6) { showAuthMsg('⚠️ كلمة المرور 6 أحرف'); return; }
    if (authMode === 'signup' && !name) { showAuthMsg('⚠️ أدخل الاسم'); return; }

    const orig = $('moAuthSubmitText')?.textContent || '';
    btn.disabled = true;
    if ($('moAuthSubmitText')) $('moAuthSubmitText').textContent = 'جارٍ...';

    try {
      if (authMode === 'signup') {
        const { data, error } = await sb.auth.signUp({ email, password, options: { data: { name, full_name: name } } });
        if (error) {
          const m = (error.message || '').toLowerCase();
          if (m.includes('already') || m.includes('registered')) showAuthMsg('📧 البريد مسجّل — جرّب الدخول');
          else if (m.includes('password')) showAuthMsg('🔒 كلمة مرور ضعيفة');
          else if (m.includes('rate') || m.includes('many')) showAuthMsg('⏱️ انتظر قليلاً');
          else showAuthMsg('❌ ' + error.message);
          return;
        }
        if (data.user) {
          try { await sb.from('profiles').upsert({ id: data.user.id, name, email, role: 'مدير عام' }, { onConflict: 'id' }); } catch(e) {}
        }
        if (data.user && !data.session) {
          _resendEmail = email;
          showAuthMsg(`<div style="text-align:right;line-height:1.8">✅ <b>تم إنشاء حسابك!</b><br>📧 رابط التفعيل أُرسل إلى:<br><span style="direction:ltr;display:inline-block;color:#000;font-weight:800">${escapeHtml(email)}</span></div>`, true);
          setTimeout(() => { switchAuthMode('login'); if ($('moAuthEmail')) $('moAuthEmail').value = email; showAuthMsg('✅ تحقق من بريدك', true); }, 5000);
          return;
        }
        if (data.session) { toast('🎉 مرحباً بك!'); await handleSession(data.session); }
      } else {
        const { data, error } = await sb.auth.signInWithPassword({ email, password });
        if (error) {
          const m = (error.message || '').toLowerCase();
          if (m.includes('invalid') || m.includes('credentials')) showAuthMsg('❌ البريد أو كلمة المرور خاطئة');
          else if (m.includes('confirm') || m.includes('verified')) showAuthMsg('📧 أكد بريدك أولاً');
          else showAuthMsg('❌ ' + error.message);
          return;
        }
        toast('🎉 مرحباً بعودتك!');
        await handleSession(data.session);
      }
    } catch (err) {
      showAuthMsg('❌ ' + (err.message || 'خطأ اتصال'));
    } finally {
      btn.disabled = false;
      if ($('moAuthSubmitText')) $('moAuthSubmitText').textContent = orig;
    }
  }

  let toastTimer;
  function toast(msg, type = 'success') {
    const t = $('mo-toast');
    if (!t) return;
    t.innerHTML = (type === 'error' ? ICONS.close : ICONS.check) + '<span>' + msg + '</span>';
    t.classList.toggle('error', type === 'error');
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 3000);
  }

  // ═══════════════════════════════════════════════════════════
  async function handleSession(session) {
    if (session?.user) {
      currentUser = session.user;
      $('mo-auth-screen')?.classList.remove('active');
      $('mo-app')?.classList.add('active');
      await loadProfile();
      await loadAllData();
      syncUserUI();
      subscribeRealtime();
      const hash = location.hash.replace('#', '');
      navigate(['dashboard','projects','tasks','email','messages','calendar','employees','files','reports','ai','settings'].includes(hash) ? hash : 'dashboard');
    } else {
      currentUser = null; currentProfile = null;
      unsubscribeRealtime();
      $('mo-auth-screen')?.classList.add('active');
      $('mo-app')?.classList.remove('active');
    }
  }

  async function logout() {
    if (!confirm('تسجيل الخروج؟')) return;
    unsubscribeRealtime();
    try { await sb.auth.signOut(); } catch (e) {}
    currentUser = null; currentProfile = null;
    $('mo-app')?.classList.remove('active');
    $('mo-auth-screen')?.classList.add('active');
    if ($('moAuthEmail')) $('moAuthEmail').value = '';
    if ($('moAuthPassword')) $('moAuthPassword').value = '';
    clearAuthMsg();
    switchAuthMode('login');
    toast('تم تسجيل الخروج');
  }

  async function loadProfile() {
    if (!currentUser) return;
    try {
      const { data } = await sb.from('profiles').select('*').eq('id', currentUser.id).maybeSingle();
      currentProfile = data || {
        id: currentUser.id,
        name: currentUser.user_metadata?.name || currentUser.email?.split('@')[0] || 'مستخدم',
        email: currentUser.email, role: 'مدير عام'
      };
    } catch (e) {}
  }

  function syncUserUI() {
    if (!currentUser) return;
    const name = currentProfile?.name || currentUser.user_metadata?.name || currentUser.email?.split('@')[0] || 'مستخدم';
    if ($('moSbUserName')) $('moSbUserName').textContent = name;
    if ($('moSbUserAv')) $('moSbUserAv').textContent = initials(name);
    if ($('moSbUserRole')) $('moSbUserRole').textContent = currentProfile?.role || 'مدير عام';

  // ═══════════════════════════════════════════════════════════
  // DATA STORE
  // ═══════════════════════════════════════════════════════════
  const store = { projects: [], tasks: [], emails: [], employees: [], files: [], events: [], chats: [], notifications: [], loaded: false };

  async function loadAllData() {
    if (!currentUser) return;
    showLoading();
    try {
      const uid = currentUser.id;
      const [pR, prR, tR, eR, fR, evR, cR] = await Promise.all([
        sb.from('profiles').select('*').limit(100),
        sb.from('projects').select('*').eq('user_id', uid).order('created_at', { ascending: false }).limit(50),
        sb.from('tasks').select('*').eq('user_id', uid).order('created_at', { ascending: false }).limit(100),
        sb.from('emails').select('*').eq('user_id', uid).order('created_at', { ascending: false }).limit(100),
        sb.from('files').select('*').eq('user_id', uid).order('created_at', { ascending: false }).limit(50),
        sb.from('events').select('*').eq('user_id', uid).order('event_time').limit(50),
        sb.from('chats').select('*').eq('user_id', uid).order('created_at', { ascending: false }).limit(50)
      ]);

      if (pR.error) console.warn('⚠️ profiles:', pR.error.message);
      if (prR.error) console.warn('⚠️ projects:', prR.error.message);
      if (tR.error) console.warn('⚠️ tasks:', tR.error.message);
      if (eR.error) console.warn('⚠️ emails:', eR.error.message);
      if (fR.error) console.warn('⚠️ files:', fR.error.message);
      if (evR.error) console.warn('⚠️ events:', evR.error.message);
      if (cR.error) console.warn('⚠️ chats:', cR.error.message);

      store.employees = (pR.data || []).map(p => ({
        id: p.id, name: p.name || 'مستخدم', role: p.role || 'موظف', email: p.email, tasks: 0, projects: 0
      }));

      store.projects = (prR.data || []).map(p => ({
        id: p.id, name: p.name, progress: p.progress || 0,
        team: Array.isArray(p.team) ? p.team : (Array.isArray(p.team_members) ? p.team_members : []),
        description: p.description, deadline: p.deadline,
        tasks: p.tasks_count || 0, done: p.done_count || 0, status: p.status || 'نشط'
      }));

      store.tasks = (tR.data || []).map(t => ({
        id: t.id, title: t.title, project: t.project || 'عام',
        status: t.status || 'todo', priority: t.priority || 'عادي',
        assignee: t.assignee || 'غير محدد', due: t.due_date,
        tags: Array.isArray(t.tags) ? t.tags : []
      }));

      store.emails = (eR.data || []).map(e => ({
        id: e.id, from: e.from_name || e.to_name || 'مستخدم',
        email: e.from_email || e.to_email || '',
        subject: e.subject || '',
        preview: (e.body || '').slice(0, 60),
        body: e.body || '', time: formatTimeAgo(e.created_at),
        unread: !e.is_read,
        attachments: Array.isArray(e.attachments) ? e.attachments : []
      }));

      store.files = (fR.data || []).map(f => ({
        id: f.id, name: f.name, size: f.size || '0 KB',
        url: f.url, mime_type: f.mime_type, user_id: f.user_id,
        date: formatTimeAgo(f.created_at)
      }));

      store.events = (evR.data || []).map(e => ({
        id: e.id, time: (e.event_time || '00:00').toString().slice(0, 5),
        title: e.title, desc: e.description || ''
      }));

      if (cR.data?.length) {
        store.chats = await Promise.all(cR.data.map(async c => {
          const { data: msgs } = await sb.from('messages').select('*').eq('chat_id', c.id).order('created_at').limit(200);
          const messages = (msgs || []).map(m => ({
            from: m.from_user === uid ? 'me' : 'them',
            text: m.text,
            attachment: m.attachment,
            time: new Date(m.created_at).toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' })
          }));
          return {
            id: c.id, name: c.name, av: initials(c.name),
            online: c.online || false,
            is_group: c.is_group || false,
            members: Array.isArray(c.members) ? c.members : [],
            last: messages[messages.length - 1]?.text || (messages[messages.length - 1]?.attachment ? '📎 مرفق' : 'لا توجد رسائل'),
            time: formatTimeAgo(c.created_at), messages
          };
        }));
      } else { store.chats = []; }

      await loadNotifications();

      if ($('moNavProjects')) $('moNavProjects').textContent = store.projects.length;
      if ($('moNavTasks')) $('moNavTasks').textContent = store.tasks.length;
      if ($('moNavEmails')) $('moNavEmails').textContent = store.emails.filter(e => e.unread).length;

      store.loaded = true;
    } catch (e) { console.error('[loadAllData]', e); }
    finally { hideLoading(); }
  }

  // ═══════════════════════════════════════════════════════════
  // NOTIFICATIONS
  // ═══════════════════════════════════════════════════════════
  async function loadNotifications() {
    if (!currentUser) return;
    try {
      const { data, error } = await sb.from('notifications')
        .select('*').eq('user_id', currentUser.id)
        .order('created_at', { ascending: false }).limit(50);
      if (error) throw error;
      store.notifications = data || [];
      updateNotifBadge();
      if ($('moNotifPanel')?.style.display === 'block') renderNotifPanel();
    } catch (e) { console.warn('[Notif]', e.message); }
  }

  function updateNotifBadge() {
    const unread = (store.notifications || []).filter(n => !n.is_read).length;
    const b = $('moNotifBadge');
    if (!b) return;
    if (unread > 0) { b.textContent = unread > 9 ? '9+' : unread; b.style.display = 'block'; }
    else b.style.display = 'none';
  }

  function renderNotifPanel() {
    const list = $('moNotifList');
    if (!list) return;
    const notifs = store.notifications || [];
    if (!notifs.length) {
      list.innerHTML = '<div style="padding:60px 20px;text-align:center;color:#a3a3a3"><div style="font-size:40px;margin-bottom:12px">🔔</div><div style="font-size:13px;font-weight:700">لا توجد إشعارات</div></div>';
      return;
    }
    const icons = { task: '✅', message: '💬', email: '📧', project: '📊', file: '📁', info: '🔔' };
    list.innerHTML = notifs.map(n => `
      <div class="mo-notif-item" data-notif-id="${n.id}" style="padding:14px 20px;border-bottom:1px solid #f4f4f4;cursor:pointer;display:flex;gap:12px;align-items:flex-start;background:${n.is_read ? '#fff' : '#fafafa'};transition:all .2s">
        <div style="width:36px;height:36px;border-radius:10px;background:${n.is_read ? '#f5f5f5' : '#000'};color:${n.is_read ? '#525252' : '#fff'};display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:16px">${icons[n.type] || '🔔'}</div>
        <div style="flex:1;min-width:0">
          <b style="font-size:13px;font-weight:800;display:block;margin-bottom:3px">${escapeHtml(n.title)}</b>
          ${n.body ? `<span style="font-size:11.5px;color:#525252;font-weight:600;display:block;line-height:1.5">${escapeHtml(n.body)}</span>` : ''}
          <span style="font-size:10.5px;color:#a3a3a3;font-weight:700;display:block;margin-top:5px">${formatTimeAgo(n.created_at)}</span>
        </div>
        ${!n.is_read ? `<div style="width:8px;height:8px;background:#000;border-radius:50%;flex-shrink:0;margin-top:6px"></div>` : ''}
      </div>
    `).join('');

    list.querySelectorAll('.mo-notif-item').forEach(el => {
      el.addEventListener('click', async () => {
        const id = el.dataset.notifId;
        const n = notifs.find(x => x.id === id);
        await sb.from('notifications').update({ is_read: true }).eq('id', id);
        if (n?.link) {
          const page = n.link.replace('#', '');
          if (PAGES[page]) navigate(page);
        }
        $('moNotifPanel').style.display = 'none';
        await loadNotifications();
      });
    });
  }

  async function createNotification(userId, title, body, type = 'info', link = null) {
    try {
      await sb.from('notifications').insert({ user_id: userId, title, body, type, link });
    } catch (e) { console.warn('[Notif Create]', e.message); }
  }

  function subscribeRealtime() {
    if (!currentUser) return;

    notifChannel = sb.channel('notif-' + currentUser.id)
      .on('postgres_changes',
        { event: 'INSERT', schema: 'public', table: 'notifications', filter: `user_id=eq.${currentUser.id}` },
        (payload) => {
          console.log('🔔 إشعار:', payload.new.title);
          store.notifications = [payload.new, ...(store.notifications || [])];
          updateNotifBadge();
          toast('🔔 ' + payload.new.title);
          if ($('moNotifPanel')?.style.display === 'block') renderNotifPanel();
        })
      .subscribe();

    msgsChannel = sb.channel('msg-' + currentUser.id)
      .on('postgres_changes',
        { event: 'INSERT', schema: 'public', table: 'messages' },
        async (payload) => {
          if (payload.new.from_user === currentUser.id) return;
          const chat = store.chats.find(c => c.id === payload.new.chat_id);
          if (!chat) return;
          const time = new Date(payload.new.created_at).toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
          chat.messages.push({ from: 'them', text: payload.new.text, attachment: payload.new.attachment, time });
          chat.last = payload.new.text || '📎 مرفق';
          if (currentPage === 'messages' && store.chats[currentChatIdx]?.id === chat.id) {
            renderCurrentPage();
          } else {
            toast('💬 رسالة من ' + chat.name);
          }
        })
      .subscribe();
  }

  function unsubscribeRealtime() {
    if (notifChannel) { try { sb.removeChannel(notifChannel); } catch(e){} notifChannel = null; }
    if (msgsChannel) { try { sb.removeChannel(msgsChannel); } catch(e){} msgsChannel = null; }
  }

  const PAGES = {
    dashboard: { title: 'لوحة التحكم', sub: 'نظرة عامة' },
    projects: { title: 'المشاريع', sub: 'إدارة المشاريع' },
    tasks: { title: 'المهام', sub: 'متابعة المهام' },
    email: { title: 'البريد', sub: 'إرسال واستقبال' },
    messages: { title: 'الرسائل', sub: 'محادثات' },
    calendar: { title: 'التقويم', sub: 'مواعيدك' },
    employees: { title: 'الموظفون', sub: 'الفريق' },
    files: { title: 'الملفات', sub: 'رفع وتحميل' },
    reports: { title: 'التقارير', sub: 'الأداء' },
    ai: { title: 'الذكاء الاصطناعي', sub: 'مساعد' },
    settings: { title: 'الإعدادات', sub: 'المنصة' }
  };

  function navigate(page) {
    if (!PAGES[page]) return;
    currentPage = page;
    $$('.mo-sb-item').forEach(el => el.classList.toggle('active', el.dataset.page === page));
    if ($('moPageTitle')) $('moPageTitle').textContent = PAGES[page].title;
    if ($('moPageSub')) $('moPageSub').textContent = PAGES[page].sub;
    renderCurrentPage();
    closeSidebar();
    history.replaceState(null, '', '#' + page);
  }

  function renderCurrentPage() {
    const c = $('moContent');
    if (!c) return;
    const map = {
      dashboard: renderDashboard, projects: renderProjects, tasks: renderTasks,
      email: renderEmail, messages: renderMessages, calendar: renderCalendar,
      employees: renderEmployees, files: renderFiles, reports: renderReports,
      ai: renderAI, settings: renderSettings
    };
    const fn = map[currentPage] || renderDashboard;
    c.innerHTML = '<div style="animation:moFade .4s">' + fn() + '</div>';
    c.scrollTop = 0;
    bindPageEvents();
  }

  function bindPageEvents() {
    if (currentPage === 'messages') {
      const body = $('moMsgBody');
      if (body) body.scrollTop = body.scrollHeight;
      $('moMsgSend')?.addEventListener('click', sendMsg);
      $('moMsgInput')?.addEventListener('keydown', e => {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); }
      });
    }
    if (currentPage === 'ai') {
      const body = $('moAiBody');
      if (body) body.scrollTop = body.scrollHeight;
      $('moAiSend')?.addEventListener('click', sendAI);
      $('moAiInput')?.addEventListener('keydown', e => {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendAI(); }
      });
      $$('.mo-ai-suggest button').forEach(b => {
        b.addEventListener('click', () => {
          const inp = $('moAiInput');
          if (inp) inp.value = b.dataset.prompt;
          sendAI();
        });
      });
    }
    if (currentPage === 'settings') {
      $$('.mo-switch').forEach(el => el.addEventListener('click', () => el.classList.toggle('on')));
    }
  }

  function renderDashboard() {
    const P = store.projects, T = store.tasks, E = store.emails;
    const stats = [
      { label: 'المشاريع', value: P.length, trend: '+12%', up: true, ico: 'folder' },
      { label: 'المهام', value: T.length, trend: '+8%', up: true, ico: 'check' },
      { label: 'الرسائل', value: E.length, trend: '+3', up: true, ico: 'mail' },
      { label: 'الموظفون', value: store.employees.length, trend: '—', up: true, ico: 'users' }
    ];
    const statCards = stats.map(s => `
      <div class="mo-stat">
        <div class="mo-stat-top">
          <div class="mo-stat-ico">${ICONS[s.ico]}</div>
          <div class="mo-stat-trend ${s.up ? 'up' : 'down'}">${s.up ? ICONS.trendUp : ICONS.trendDown} ${s.trend}</div>
        </div>
        <div class="mo-stat-val">${s.value}</div>
        <div class="mo-stat-lbl">${s.label}</div>
      </div>`).join('');
    const recentTasks = T.slice(0, 5).map(t => `
      <div class="mo-list-item">
        <div class="mo-av">${initials(t.assignee)}</div>
        <div class="mo-list-body"><b>${escapeHtml(t.title)}</b><span>${escapeHtml(t.project)} · ${escapeHtml(t.assignee)}</span></div>
        <span class="mo-badge ${t.priority.includes('عالي') ? 'dark' : ''}">${escapeHtml(t.priority)}</span>
      </div>`).join('') || '<div class="mo-empty" style="padding:30px"><p>لا توجد مهام</p></div>';
    const days = ['السبت','الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة'];
    const bars = days.map((d, i) => {
      const h = [45,68,52,80,62,88,54][i];
      return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:10px;height:100%;justify-content:flex-end">
        <div style="width:100%;max-width:38px;border-radius:8px 8px 3px 3px;background:${i%2?'#d4d4d4':'#000'};height:${h}%"></div>
        <div style="font-size:11px;color:#a3a3a3;font-weight:800">${d}</div></div>`;
    }).join('');
    return `
      <div class="mo-grid mo-g4" style="margin-bottom:20px">${statCards}</div>
      <div class="mo-grid mo-g21" style="margin-bottom:20px">
        <div class="mo-card">
          <div class="mo-card-hd"><div><h3>${ICONS.chart} أداء الأسبوع</h3><p>الإنجاز اليومي</p></div><span class="mo-badge dark">+18%</span></div>
          <div style="display:flex;align-items:flex-end;justify-content:space-around;gap:10px;height:180px;padding:10px 0">${bars}</div>
        </div>
        <div class="mo-card">
          <div class="mo-card-hd"><h3>${ICONS.check} مهام قادمة</h3></div>
          ${recentTasks}
        </div>
      </div>
    `;
  }

      : store.emails;

      </div>`).join('') || '<div style="padding:50px;text-align:center;color:#a3a3a3;font-size:13px">لا توجد رسائل</div>';
    return `
      <div style="margin-bottom:18px">

      </div>

  function selectEmail(idx) {
    currentEmailIdx = idx;
    const filtered = searchTerm
      ? store.emails.filter(e => (e.subject||'').toLowerCase().includes(searchTerm) || (e.from||'').toLowerCase().includes(searchTerm))
      : store.emails;
    $$('.mo-email-item').forEach(el => el.classList.toggle('active', +el.dataset.emailIdx === currentEmailIdx));
    const v = $('moEmailView');
    if (v) v.innerHTML = emailViewContent(filtered[currentEmailIdx]);

  async function sendMsg() {
    const inp = $('moMsgInput');
    if (!inp) return;
    const text = inp.value.trim();
    if (!text && !pendingMsgFile) return;
    if (!currentUser) return;
    const chat = store.chats[currentChatIdx];
    if (!chat) return;

    let attachment = null;
    try {
      if (pendingMsgFile) {
        const file = pendingMsgFile;
        const path = `${currentUser.id}/messages/${Date.now()}_${file.name.replace(/[^\w.-]/g, '_')}`;
        const { error: upErr } = await sb.storage.from('files').upload(path, file, { cacheControl: '3600' });
        if (upErr) throw upErr;
        const { data: { publicUrl } } = sb.storage.from('files').getPublicUrl(path);
        attachment = { name: file.name, size: humanSize(file.size), url: publicUrl, mime: file.type };
      }

      const time = new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
      const msgText = text || '';

      const { error } = await sb.from('messages').insert({
        chat_id: chat.id, from_user: currentUser.id, text: msgText, attachment
      });
      if (error) throw error;

      chat.messages.push({ from: 'me', text: msgText, attachment, time });
      chat.last = msgText || '📎 مرفق';
      inp.value = '';
      inp.placeholder = 'اكتب رسالتك...';
      pendingMsgFile = null;
      renderCurrentPage();
    } catch (e) {
      console.error('❌ [Send Msg]', e);
      toast('فشل الإرسال: ' + e.message, 'error');
    }
  }

  function renderCalendar() {
    const now = new Date();
    const year = now.getFullYear(), month = now.getMonth(), today = now.getDate();
    const months = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
    const dows = ['ح','ن','ث','ر','خ','ج','س'];
    const firstDay = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const prevDays = new Date(year, month, 0).getDate();
    let days = [];
    for (let i = firstDay - 1; i >= 0; i--) days.push({ d: prevDays - i, muted: true });
    for (let i = 1; i <= daysInMonth; i++) days.push({ d: i, muted: false, today: i === today });
    return `
      <div class="mo-cal-wrap">
        <div class="mo-calendar">
          <div class="mo-cal-hd"><b>${months[month]} ${year}</b></div>
          <div class="mo-cal-grid">
            ${dows.map(d => `<div class="mo-cal-dow">${d}</div>`).join('')}
            ${days.map(d => `<div class="mo-cal-day ${d.muted ? 'muted' : ''} ${d.today ? 'today' : ''}">${d.d}</div>`).join('')}

        </div>

  async function uploadFiles(files) {
    const progress = $('moUploadProgress');
    const bar = $('moUploadBar'), pct = $('moUploadPct'), nameEl = $('moUploadName');
    if (progress) progress.style.display = 'block';
    let success = 0, failed = 0;

    for (let i = 0; i < files.length; i++) {
      const file = files[i];
      if (nameEl) nameEl.textContent = `(${i+1}/${files.length}) ${file.name}`;
      const path = `${currentUser.id}/files/${Date.now()}_${file.name.replace(/[^\w.-]/g, '_')}`;
      try {
        const { error: upErr } = await sb.storage.from('files').upload(path, file, { cacheControl: '3600', upsert: false });
        if (upErr) throw upErr;
        const { data: { publicUrl } } = sb.storage.from('files').getPublicUrl(path);
        const { error: dbErr } = await sb.from('files').insert({
          user_id: currentUser.id, name: file.name, size: humanSize(file.size),
          url: publicUrl, mime_type: file.type, size_bytes: file.size
        });
        if (dbErr) throw dbErr;
        success++;
        const p = Math.round(((i+1)/files.length)*100);
        if (bar) bar.style.width = `${p}%`;
        if (pct) pct.textContent = `${p}%`;
      } catch (err) {
        console.error('❌ [Upload]', err);
        failed++;
        toast(`فشل رفع ${file.name}`, 'error');
      }
    }

    if (success > 0) {
      toast(`✅ تم رفع ${success} ملف${failed ? ` (${failed} فشل)` : ''}`);
      await createNotification(currentUser.id, 'تم رفع ملفات', `تم رفع ${success} ملف`, 'file', '#files');
    }
    setTimeout(() => { if (progress) progress.style.display = 'none'; }, 1200);
    await loadAllData();
    renderCurrentPage();
  }

  async function deleteFile(id) {
    if (!confirm('حذف الملف؟')) return;
    try {

      if (f?.url) {
        const path = f.url.split('/storage/v1/object/public/files/')[1];
        if (path) await sb.storage.from('files').remove([decodeURIComponent(path)]);

      await sb.from('files').delete().eq('id', id);
      toast('تم الحذف');
      await loadAllData();

  }

        <div class="mo-field"><label>العنوان *</label><input type="text" id="moMTaskTitle" placeholder="تصميم الصفحة"></div>
        <div class="mo-field"><label>المشروع</label><input type="text" id="moMTaskProject" placeholder="عام"></div>
        <div class="mo-field"><label>المسؤول</label>
          <select id="moMTaskAssignee">${store.employees.map(e => `<option value="${escapeHtml(e.name)}">${escapeHtml(e.name)}</option>`).join('') || '<option>غير محدد</option>'}</select>
        </div>
        <div class="mo-field"><label>الأولوية</label>
          <select id="moMTaskPriority"><option>عالية</option><option>متوسطة</option><option>عادية</option></select>
        </div>
        <button class="mo-btn mo-btn-primary" id="moMSaveTask" type="button" style="width:100%;padding:15px;margin-top:8px">${ICONS.check} حفظ</button>
      `;
      setTimeout(() => {
        $('moMSaveTask')?.addEventListener('click', saveTask);
        $('moModalClose')?.addEventListener('click', closeModal);
      }, 30);
    } else if (type === 'compose') {
      pendingEmailFiles = [];
      m.innerHTML = `
        <button class="mo-modal-close" type="button" id="moModalClose">${ICONS.close}</button>
        <h2>رسالة جديدة</h2>
        <p class="sub">أرسل رسالة مع مرفقات</p>
        <div class="mo-field"><label>إلى *</label><input type="email" id="moMEmailTo" placeholder="name@example.com" dir="ltr" style="text-align:right"></div>
        <div class="mo-field"><label>الاسم</label><input type="text" id="moMEmailName" placeholder="الاسم"></div>
        <div class="mo-field"><label>الموضوع *</label><input type="text" id="moMEmailSubject" placeholder="الموضوع"></div>
        <div class="mo-field"><label>الرسالة *</label><textarea id="moMEmailBody" rows="5" placeholder="اكتب رسالتك..."></textarea></div>
        <div class="mo-field">
          <label>المرفقات</label>
          <input type="file" id="moMEmailFiles" multiple style="display:none">
          <div id="moMEmailAttsList" style="display:flex;flex-direction:column;gap:6px;margin-bottom:8px"></div>
          <button type="button" id="moEmailAttBtn" class="mo-btn mo-btn-ghost" style="width:100%;padding:12px;justify-content:center">${ICONS.attach} إضافة مرفقات</button>
        </div>
        <button class="mo-btn mo-btn-primary" id="moMSendEmail" type="button" style="width:100%;padding:15px;margin-top:8px">${ICONS.send} إرسال</button>
      `;
      setTimeout(() => {
        $('moMEmailFiles')?.addEventListener('change', (e) => {
          const files = Array.from(e.target.files || []);
          pendingEmailFiles = pendingEmailFiles.concat(files);
          renderEmailAttsList();
          e.target.value = '';
        });
        $('moEmailAttBtn')?.addEventListener('click', () => $('moMEmailFiles')?.click());
        $('moMSendEmail')?.addEventListener('click', sendEmail);
        $('moModalClose')?.addEventListener('click', closeModal);
        renderEmailAttsList();
      }, 30);
    }
    $('mo-modal-overlay').classList.add('on');
    document.body.style.overflow = 'hidden';
  }

  function renderEmailAttsList() {
    const list = $('moMEmailAttsList');
    if (!list) return;
    if (!pendingEmailFiles.length) { list.innerHTML = ''; return; }
    list.innerHTML = pendingEmailFiles.map((f, i) => `
      <div style="display:flex;align-items:center;gap:10px;padding:10px 12px;background:#f5f5f5;border-radius:10px;font-size:12.5px">
        <div style="width:28px;height:28px;border-radius:8px;background:#000;color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0">${ICONS.file}</div>
        <span style="flex:1;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${escapeHtml(f.name)}</span>
        <span style="color:#a3a3a3;font-weight:700">${humanSize(f.size)}</span>
        <button type="button" data-att-idx="${i}" style="background:none;border:none;color:#dc2626;cursor:pointer;padding:2px">${ICONS.close}</button>
      </div>
    `).join('');
    list.querySelectorAll('[data-att-idx]').forEach(b => {
      b.addEventListener('click', () => {
        pendingEmailFiles.splice(+b.dataset.attIdx, 1);
        renderEmailAttsList();
      });
    });
  }

  function openProjectModal() {
    const m = $('mo-modal');
    if (!m) return;
    const memberOptions = store.employees.map(e => `<option value="${escapeHtml(e.name)}">${escapeHtml(e.name)} (${escapeHtml(e.role)})</option>`).join('');
    m.innerHTML = `
      <button class="mo-modal-close" type="button" id="moModalClose">${ICONS.close}</button>
      <h2>مشروع جديد</h2>
      <p class="sub">حدّد التفاصيل والفريق</p>
      <div class="mo-field"><label>اسم المشروع *</label><input type="text" id="moProjName" placeholder="تطبيق الجوال"></div>
      <div class="mo-field"><label>الوصف</label><textarea id="moProjDesc" rows="3" placeholder="وصف..." style="min-height:80px"></textarea></div>
      <div class="mo-field"><label>الموعد النهائي</label><input type="date" id="moProjDeadline"></div>
      <div class="mo-field"><label>الفريق (Ctrl للاختيار المتعدد)</label>
        <select id="moProjTeam" multiple style="min-height:100px">${memberOptions || '<option disabled>لا يوجد أعضاء</option>'}</select>
      </div>
      <div class="mo-field"><label>التقدم (%)</label><input type="number" id="moProjProgress" min="0" max="100" value="0"></div>
      <button class="mo-btn mo-btn-primary" id="moSaveProj" type="button" style="width:100%;padding:15px;margin-top:8px">${ICONS.check} إنشاء</button>
    `;
    setTimeout(() => {
      $('moSaveProj')?.addEventListener('click', saveProject);
      $('moModalClose')?.addEventListener('click', closeModal);
    }, 30);
    $('mo-modal-overlay').classList.add('on');
    document.body.style.overflow = 'hidden';
  }

  async function saveProject() {
    const name = $('moProjName').value.trim();
    const description = $('moProjDesc').value.trim();
    const deadline = $('moProjDeadline').value || null;
    const progress = parseInt($('moProjProgress').value) || 0;
    const team = Array.from($('moProjTeam').selectedOptions).map(o => o.value);
    if (!name) { toast('أدخل اسم المشروع', 'error'); return; }
    try {
      const { error } = await sb.from('projects').insert({
        user_id: currentUser.id, name, description, deadline, progress,
        team, team_members: team, status: 'نشط', tasks_count: 0, done_count: 0
      });
      if (error) throw error;
      closeModal();
      toast('✅ تم إنشاء المشروع');
      await createNotification(currentUser.id, 'مشروع جديد', name, 'project', '#projects');
      await loadAllData();
      renderCurrentPage();
    } catch (e) { toast('فشل: ' + e.message, 'error'); }
  }

  function openChatModal() {
    const m = $('mo-modal');
    if (!m) return;
    const memberOptions = store.employees.filter(e => e.id !== currentUser.id)
      .map(e => `<option value="${escapeHtml(e.name)}">${escapeHtml(e.name)} (${escapeHtml(e.role)})</option>`).join('');
    m.innerHTML = `
      <button class="mo-modal-close" type="button" id="moModalClose">${ICONS.close}</button>
      <h2>محادثة جديدة</h2>
      <p class="sub">فردية أو جماعية</p>
      <div class="mo-field"><label>الاسم *</label><input type="text" id="moChatName" placeholder="فريق التطوير"></div>
      <div class="mo-field"><label>الأعضاء (Ctrl للاختيار المتعدد)</label>
        <select id="moChatMembers" multiple style="min-height:120px">${memberOptions || '<option disabled>لا يوجد أعضاء آخرون</option>'}</select>
      </div>
      <button class="mo-btn mo-btn-primary" id="moSaveChat" type="button" style="width:100%;padding:15px;margin-top:8px">${ICONS.check} إنشاء</button>
    `;
    setTimeout(() => {
      $('moSaveChat')?.addEventListener('click', saveChat);
      $('moModalClose')?.addEventListener('click', closeModal);
    }, 30);
    $('mo-modal-overlay').classList.add('on');
    document.body.style.overflow = 'hidden';
  }

  async function saveChat() {
    const name = $('moChatName').value.trim();
    const members = Array.from($('moChatMembers').selectedOptions).map(o => o.value);
    if (!name) { toast('أدخل الاسم', 'error'); return; }
    try {
      const { error } = await sb.from('chats').insert({
        user_id: currentUser.id, created_by: currentUser.id, name,
        is_group: members.length > 0, members, online: false
      });
      if (error) throw error;
      closeModal();
      toast('✅ تم الإنشاء');
      await loadAllData();
      const idx = store.chats.findIndex(c => c.name === name);
      if (idx >= 0) currentChatIdx = idx;
      renderCurrentPage();
    } catch (e) { toast('فشل: ' + e.message, 'error'); }
  }

  function showChatInfo() {
    const chat = store.chats[currentChatIdx];
    if (!chat) return;
    const members = chat.members?.length ? chat.members.join('، ') : 'لا يوجد أعضاء';
    toast(`${chat.name} — ${members}`, 'success');
  }

  function openTaskStatusModal(taskId) {
    const task = store.tasks.find(t => t.id === taskId);
    if (!task) return;
    const m = $('mo-modal');
    if (!m) return;
    m.innerHTML = `
      <button class="mo-modal-close" type="button" id="moModalClose">${ICONS.close}</button>
      <h2>${escapeHtml(task.title)}</h2>
      <p class="sub">${escapeHtml(task.project)} · ${escapeHtml(task.assignee)}</p>
      <div class="mo-field"><label>الحالة</label>
        <select id="moTaskStatus">
          <option value="todo" ${task.status === 'todo' ? 'selected' : ''}>بانتظار البدء</option>
          <option value="progress" ${task.status === 'progress' ? 'selected' : ''}>قيد التنفيذ</option>
          <option value="review" ${task.status === 'review' ? 'selected' : ''}>قيد المراجعة</option>
          <option value="done" ${task.status === 'done' ? 'selected' : ''}>مكتملة</option>
        </select>
      </div>
      <button class="mo-btn mo-btn-primary" id="moSaveTaskStatus" type="button" style="width:100%;padding:15px;margin-top:8px">${ICONS.check} تحديث</button>
      <button class="mo-btn mo-btn-ghost" id="moDeleteTask" type="button" style="width:100%;padding:15px;margin-top:8px;color:#dc2626">${ICONS.trash} حذف</button>
    `;
    setTimeout(() => {
      $('moSaveTaskStatus')?.addEventListener('click', async () => {
        await sb.from('tasks').update({ status: $('moTaskStatus').value }).eq('id', taskId);
        closeModal();
        toast('✅ تم التحديث');
        await loadAllData();
        renderCurrentPage();
      });
      $('moDeleteTask')?.addEventListener('click', async () => {
        if (!confirm('حذف المهمة؟')) return;
        await sb.from('tasks').delete().eq('id', taskId);
        closeModal();
        toast('تم الحذف');
        await loadAllData();
        renderCurrentPage();
      });
      $('moModalClose')?.addEventListener('click', closeModal);
    }, 30);
    $('mo-modal-overlay').classList.add('on');
    document.body.style.overflow = 'hidden';
  }

  function closeModal() {
    $('mo-modal-overlay')?.classList.remove('on');
    document.body.style.overflow = '';
  }

  async function saveTask() {
    const title = $('moMTaskTitle').value.trim();
    const project = $('moMTaskProject').value.trim() || 'عام';
    const assignee = $('moMTaskAssignee').value;
    const priority = $('moMTaskPriority').value;
    if (!title) { toast('أدخل العنوان', 'error'); return; }
    try {
      const { error } = await sb.from('tasks').insert({
        user_id: currentUser.id, title, project, assignee, priority, status: 'todo'
      });
      if (error) throw error;
      closeModal();
      toast('✅ تمت الإضافة');
      await createNotification(currentUser.id, 'مهمة جديدة', title + ' → ' + assignee, 'task', '#tasks');
      await loadAllData();
      navigate('tasks');
    } catch (e) { toast('فشل: ' + e.message, 'error'); }
  }

  async function sendEmail() {
    const to = $('moMEmailTo').value.trim();
    const toName = $('moMEmailName').value.trim();
    const subject = $('moMEmailSubject').value.trim();
    const body = $('moMEmailBody').value.trim();
    if (!to || !subject || !body) { toast('أكمل الحقول', 'error'); return; }
    if (!isValidEmail(to)) { toast('البريد غير صحيح', 'error'); return; }

    const sendBtn = $('moMSendEmail');
    const orig = sendBtn?.innerHTML;
    if (sendBtn) { sendBtn.disabled = true; sendBtn.innerHTML = 'جارٍ الإرسال...'; }

    try {
      const attachments = [];
      for (const file of pendingEmailFiles) {
        const path = `${currentUser.id}/emails/${Date.now()}_${file.name.replace(/[^\w.-]/g, '_')}`;
        const { error: upErr } = await sb.storage.from('files').upload(path, file, { cacheControl: '3600' });
        if (upErr) { console.warn('رفع فشل:', file.name); continue; }
        const { data: { publicUrl } } = sb.storage.from('files').getPublicUrl(path);
        attachments.push({ name: file.name, size: humanSize(file.size), url: publicUrl, mime: file.type });
      }

      const { error } = await sb.from('emails').insert({
        user_id: currentUser.id, to_email: to, to_name: toName,
        from_name: currentProfile?.name || currentUser.email,
        from_email: currentUser.email,
        subject, body, is_read: true, attachments
      });
      if (error) throw error;

      closeModal();
      toast(`✅ تم الإرسال${attachments.length ? ' مع ' + attachments.length + ' مرفق' : ''}`);
      await createNotification(currentUser.id, 'تم إرسال بريد', subject, 'email', '#email');
      await loadAllData();
      navigate('email');
    } catch (e) {
      toast('فشل: ' + e.message, 'error');
    } finally {
      if (sendBtn) { sendBtn.disabled = false; sendBtn.innerHTML = orig; }
    }
  }

  // ═══════════════════════════════════════════════════════════
  // UI
  // ═══════════════════════════════════════════════════════════
  function openSidebar() {
    $('moSidebar')?.classList.add('open');
    $('moSidebarOverlay')?.classList.add('on');
  }
  function closeSidebar() {
    $('moSidebar')?.classList.remove('open');
    $('moSidebarOverlay')?.classList.remove('on');
  }

  // ═══════════════════════════════════════════════════════════
  // BOOTSTRAP
  // ═══════════════════════════════════════════════════════════
  async function bootstrap() {
    window.addEventListener('error', (e) => console.error('💥', e.error || e.message));
    window.addEventListener('unhandledrejection', (e) => console.error('💥 Promise:', e.reason));
    console.log('🚀 [Boot] بدء التشغيل...');

    try {
      injectCSS();
      injectToastAndLoading();
      injectAuthScreen();
      injectAppShell();
      console.log('✅ [Boot] جاهز');
    } catch (err) {
      console.error('❌ [Boot]', err);
      showError('خطأ: ' + err.message);
      return;
    }

    setTimeout(() => {
      const l = document.getElementById('mo-loader');
      if (l) l.classList.add('hide');
      setTimeout(() => l?.remove(), 600);
    }, 400);

    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

    sb.auth.onAuthStateChange((event, session) => {
      console.log('🔐 [Auth]', event);
      if (event === 'SIGNED_OUT') {
        currentUser = null; currentProfile = null;
        unsubscribeRealtime();
        $('mo-auth-screen')?.classList.add('active');
        $('mo-app')?.classList.remove('active');
      } else if (event === 'SIGNED_IN' && session?.user) {
        if (currentUser?.id !== session.user.id) setTimeout(() => handleSession(session), 0);
      } else if (event === 'TOKEN_REFRESHED' && session?.user) {
        currentUser = session.user;
      }
    });

    try {
      const { data: { session } } = await sb.auth.getSession();
      await handleSession(session);
    } catch (e) { await handleSession(null); }
  }

  window.MEN_OFFICE = {
    open: (m) => { $('mo-auth-screen')?.classList.add('active'); switchAuthMode(m || 'login'); },
    openModal, closeModal, navigate, logout,
    getCurrentUser: () => currentUser,
    supabase: sb
  };

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', bootstrap);
  else bootstrap();
})();
</script>

</body>
</html>
